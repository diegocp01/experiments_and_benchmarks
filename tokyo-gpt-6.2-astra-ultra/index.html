<script>
'use strict';

// Architectural paintings and their emission maps share a sixteen-tile atlas.
function makeFacadeAtlas() {
  const size = 512, color = document.createElement('canvas'), emission = document.createElement('canvas');
  color.width = color.height = emission.width = emission.height = size * 4;
  const atlas = color.getContext('2d'), lights = emission.getContext('2d');
  const pane = document.createElement('canvas'), mask = document.createElement('canvas');
  pane.width = pane.height = mask.width = mask.height = size;
  const g = pane.getContext('2d', {willReadFrequently:true}), m = mask.getContext('2d');
  const sans = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif';
  const serif = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif';
  let state = 1;
  function random() {
    state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
    return state / 4294967296;
  }
  function range(a,b) {return a + random()*(b-a);}
  function pick(items) {return items[Math.floor(random()*items.length)];}
  function rect(x,y,w,h,c,ctx=g) {
    ctx.fillStyle=c; ctx.fillRect(x,y,w,h);
  }
  function lit(x,y,w,h,value) {rect(x,y,w,h,'rgb('+value+','+value+','+value+')',m);}
  function line(x,y,xx,yy,c,width=1) {
    g.beginPath(); g.moveTo(x,y); g.lineTo(xx,yy); g.strokeStyle=c; g.lineWidth=width; g.stroke();
  }
  function poly(pts,c) {
    g.beginPath();g.moveTo(pts[0],pts[1]);
    for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]);
    g.closePath(); g.fillStyle=c; g.fill();
  }
  function oval(x,y,rx,ry,c) {
    g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();
  }
  function grad(x,y,w,h,a,b,vertical=true) {
    const f=g.createLinearGradient(x,y,x+(vertical?0:w),y+(vertical?h:0)); f.addColorStop(0,a); f.addColorStop(1,b);
    rect(x,y,w,h,f);
  }
  function glow(x,y,r,col) {
    const v=g.createRadialGradient(x,y,0,x,y,r); v.addColorStop(0,col);v.addColorStop(1,'transparent');rect(x-r,y-r,r*2,r*2,v);
  }
  function type(str,x,y,px,c,opts={}) {
    g.font=(opts.weight||600)+' '+px+'px '+(opts.serif?serif:sans);
    g.textAlign=opts.align||'center';g.textBaseline='middle';g.fillStyle=c;
    g.fillText(str,x,y,opts.max||1000);
  }
  function screw(x,y,s=2) {
    oval(x+.5,y+1,s*1.1,s*1.1,'#101618');oval(x,y,s,s,'#79807c');line(x-s*.6,y+s*.55,x+s*.55,y-s*.65,'#263031',s*.6);
  }
  function weather(x,y,w,h,count,wet=1) {
    for(let i=0;i<count;i++){
      const px=range(x,x+w),py=range(y,y+h); const v=random();
      if(v<.39){const len=range(2,25)*wet;grad(px,py,range(.6,2.4),len,'rgba(8,13,13,.22)','rgba(8,13,13,0)');}
      else if(v<.71)rect(px,py,range(.4,2.8),range(.5,2.1),'rgba(221,207,181,.18)');
      else rect(px,py,range(.7,3.9),range(.6,2.1),'rgba(8,12,14,.32)');
    }
  }
  function steel(x,y,w,h,vert=true) {
    grad(x,y,w,h,'#232a2a','#59615a',vert);
    if(vert){rect(x,y,w,1.2,'#798078');rect(x,y+h-2,w,2,'#171e1e');}
    else {rect(x,y,1.5,h,'#828378');rect(x+w-2,y,2,h,'#151d1d');}
  }
  function timber(x,y,w,h,kind=0) {
    grad(x,y,w,h,kind?'#503e2c':'#392b22',kind?'#2c241f':'#241e1a',false);
    for(let i=0;i<w*.72;i++) {
      let xx=range(x,x+w);line(xx,y+range(0,h*.25),xx+range(-1.3,1.3),y+h-range(0,h*.35),
        pick(['rgba(166,119,77,.19)','rgba(7,9,8,.24)','rgba(213,164,109,.12)']),range(.4,1.4));
    }
    rect(x,y,1.4,h,'#77644a');rect(x+w-2,y,2,h,'#161715');
  }
  function plaster(x,y,w,h,tone) {
    rect(x,y,w,h,tone);
    for(let i=0;i<w*h*.0017;i++) {
      let px=range(x,x+w),py=range(y,y+h);
      if(random()<.48)grad(px,py,range(1,4),range(4,38),'rgba(28,30,24,.18)','rgba(30,32,25,0)');
      else rect(px,py,range(.7,3.5),range(.6,2),'rgba(171,171,143,.22)');
    }
  }
  function bottle(x,base,h,litColor) {
    const w=h*range(.18,.34);
    rect(x+w*.31,base-h,w*.38,h*.3,litColor);
    poly([x+w*.28,base-h*.73,x+w*.70,base-h*.73,x+w,base-h*.61,x+w,base,x,base,x,base-h*.61],litColor);
    rect(x+w*.24,base-h-1.2,w*.54,2.2,'#b2aa8c');
    rect(x+w*.08,base-h*.51,w*.82,h*.28,pick(['#baaa86','#716956','#c8bda0','#736458','#38433d']));
    rect(x+w*.13,base-h*.61,Math.max(.6,w*.08),h*.55,'rgba(255,245,205,.38)');
  }
  function interior(x,y,w,h,variant) {
    // The rear wall, ceiling coves, receding side wall and near counter form several distinct depth planes.
    const cool=variant===3||variant===4;
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    grad(x,y,w,h,cool?'#676756':'#a27a49',cool?'#222927':'#613e26');
    poly([x,y,x+w,y,x+w*.83,y+h*.15,x+w*.17,y+h*.15],cool?'#3b4239':'#64482d');
    poly([x,y,x+w*.17,y+h*.15,x+w*.17,y+h*.68,x,y+h*.91],cool?'#414940':'#6e4b32');
    poly([x+w,y,x+w*.83,y+h*.15,x+w*.83,y+h*.68,x+w,y+h*.91],cool?'#303d38':'#593d2b');
    poly([x,y+h*.91,x+w*.17,y+h*.68,x+w*.83,y+h*.68,x+w,y+h*.91,x+w,y+h,x,y+h],cool?'#383933':'#574633');
    grad(x+w*.17,y+h*.14,w*.66,h*.54,cool?'#626759':'#a38052',cool?'#45483d':'#725237');
    for(let j=0;j<19;j++){
      let xx=x+w*(.17+j*.036);line(xx,y+h*.15,xx,y+h*.67,'rgba(26,24,18,.17)',1.3);
    }
    const by=y+h*.3;
    if(variant===4) {
      rect(x+w*.32,y+h*.21,w*.46,h*.28,'#292e27');
      for(let j=0;j<4;j++)type(['ブレンド    450','トースト    350','COFFEE  ROAST','本日の珈琲'][j],x+w*.55,y+h*(.25+j*.056),Math.max(5,w*.028),'#d4c7aa',{serif:true});
    }else if(variant===1){
      // Stainless pass and extraction hood behind the ramen counter.
      grad(x+w*.18,y+h*.16,w*.55,h*.11,'#958d71','#635f51');
      poly([x+w*.18,y+h*.26,x+w*.73,y+h*.26,x+w*.79,y+h*.32,x+w*.15,y+h*.32],'#424943');
      rect(x+w*.18,y+h*.318,w*.60,2.3,'#cec4a4');
      for(let r=0;r<6;r++)for(let t=0;t<10;t++){
        const xx=x+w*(.18+t*.061), yy=y+h*(.34+r*.048);
        rect(xx,yy,w*.059,h*.044,pick(['#95988b','#a0a091','#8e9488','#a2a395']));
      }
      grad(x+w*.23,y+h*.59,w*.54,h*.047,'#d3c8a8','#545c55');
      for(let j=0;j<3;j++){
        const ax=x+w*(.24+j*.18),ay=y+h*.57,rw=w*.071;
        grad(ax,ay-h*.071,rw,h*.075,'#aaa697','#59605a',false);oval(ax+rw/2,ay-h*.071,rw/2,2.1,'#535d57');
        line(ax+rw,ay-h*.04,ax+rw+4,ay-h*.04,'#92948a',1.5);
      }
      for(let j=0;j<6;j++)oval(x+w*.68,y+h*.48-j*2.1,w*.044,1.9,j%2?'#a5aba1':'#d1d2bf');
    }else{
      const shelves=variant===3?3:2;
      for(let s=0;s<shelves;s++){
        let yy=by+h*.1*s,xx=x+w*.24;
        rect(x+w*.21,yy+3,w*.59,4,'rgba(30,23,16,.5)');
        while(xx<x+w*.77){
          const bh=range(h*.043,h*.097);
          bottle(xx,yy,bh,pick(cool?['#586e5c','#a59b6c','#58615a','#6c7f7a']:['#524e31','#747441','#9e8051','#483b2b','#8b6140']));
          xx+=bh*range(.29,.48)+1;
        }
        steel(x+w*.2,yy,w*.61,3);
      }
    }
    const pos=variant===1?[.13,.84]:[.25,.68];
    for(const p of pos) {
      let ax=x+w*p,ay=y+h*(p<.5?.12:.21); line(ax,y,ax,ay,'#282823',1.6);
      glow(ax,ay+5,w*.20,cool?'rgba(254,226,139,.21)':'rgba(255,183,84,.33)');
      poly([ax-8,ay+2,ax-3,ay-3,ax+3,ay-3,ax+8,ay+2],cool?'#293a38':'#4a3626');oval(ax,ay+2,7,1.7,'#ffe8a9');
    }
    for(let j=0;j<4;j++){
      let yy=y+h*(.45+j*.12),xx=x+w*(j%2?.85:.10);
      rect(xx,yy,w*.072,h*.09,pick(['#d8c49b','#a99370','#e2c7a0']));
      for(let k=0;k<3;k++)line(xx+3+k*(w*.018),yy+2,xx+3+k*(w*.018),yy+h*.062,'#65513f',1);
    }
    // Slender chopstick boxes, sauce bottles, glasses and stools on the foreground counter.
    const cy=y+h*.64; grad(x+w*.025,cy,w*.96,h*.034,'#9a7850','#d2ab6e');
    grad(x+w*.06,cy+h*.035,w*.88,h*.3,cool?'#555246':'#745339',cool?'#2e342f':'#3c3023');
    for(let j=0;j<13;j++)line(x+w*(.066+j*.068),cy+h*.042,x+w*(.066+j*.068),y+h*.96,'rgba(12,17,15,.3)',1.5);
    for(let j=0;j<6;j++){
      let ax=x+w*range(.1,.9);bottle(ax,cy,h*range(.024,.057),pick(['#795536','#43372d','#8d775b']));
    }
    for(let j=0;j<3;j++){
      const xx=x+w*(.14+j*.33); const sy=y+h*range(.76,.80);
      line(xx-8,sy+3,xx-13,y+h*.99,'#252824',3);
      line(xx+9,sy+3,xx+13,y+h*.99,'#282824',3);
      oval(xx,sy,w*.077,h*.025,cool?'#393f35':'#49372b');oval(xx,sy-2,w*.076,h*.021,cool?'#67654d':'#8b6140');
    }
    // Reflected light and condensation on the outer glazing.
    poly([x+w*.59,y,x+w*.81,y,x+w*.44,y+h,x+w*.30,y+h],cool?'rgba(148,199,183,.105)':'rgba(180,188,159,.09)');
    for(let i=0;i<75;i++){
      let ax=range(x,x+w),ay=range(y,y+h);line(ax,ay,ax-.3,ay+range(.9,6),'rgba(196,213,192,.14)',.8);
    }
    grad(x,y,w,h*.12,'rgba(12,17,16,.68)','transparent');
    grad(x,y,h*.09,h,'rgba(13,17,17,.46)','transparent',false);
    g.restore();lit(x,y,w,h,cool?108:154);
  }
  function entryGlass(x,y,w,h,variant) {
    const warm=variant===0||variant===1;
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
    grad(x,y,w,h,warm?'#4c4431':'#37433f',warm?'#7a6650':'#55584a');
    poly([x,y,x+w*.62,y+h*.16,x+w*.62,y+h*.62,x,y+h*.94],warm?'#7b6748':'#5a6152');
    poly([x+w,y,x+w*.87,y+h*.16,x+w*.87,y+h*.62,x+w,y+h*.90],warm?'#55462e':'#39463e');
    grad(x+w*.62,y+h*.16,w*.25,h*.47,warm?'#93774a':'#657061',warm?'#655437':'#4a554a');
    for(let j=0;j<6;j++){
      const q=j/6;
      line(x+w*q*.63,y+h*(.90-.29*q),x+w*q*.63,y+h*(.08+.08*q),'rgba(31,33,24,.23)',1.8);
    }
    const fx=x+w*.68;rect(fx,y+h*.32,w*.11,h*.29,'#333b2f');
    grad(fx+1.5,y+h*.33,w*.08,h*.16,warm?'#a49465':'#7d8970','#414f41');
    for(let j=0;j<6;j++){
      const xx=x+w*(.1+j*.08),yy=y+h*(.27+j*.009),py=h*(.17-j*.013);
      rect(xx,yy,w*(.065-j*.005),py,pick(['#c5ad7c','#a69673','#bbab87']));
      line(xx+1.8,yy+2,xx+1.8,yy+py*.65,'#5e5844',1.2);
    }
    glow(x+w*.64,y+h*.22,w*.45,warm?'rgba(255,181,83,.23)':'rgba(206,219,164,.17)');
    line(x+w*.58,y+h*.20,x+w*.80,y+h*.20,'#d9c794',2);
    for(let j=0;j<7;j++){
      const fy=y+h*(.64+j*j*.009);
      line(x,fy,x+w,fy+2,'rgba(41,43,35,.40)',1);
    }
    grad(x,y,w*.20,h,'rgba(14,22,20,.54)','transparent',false);
    poly([x+w*.78,y,x+w,y,x+w*.34,y+h,x+w*.24,y+h],'rgba(180,187,154,.07)');
    grad(x,y,w,h*.20,'rgba(13,20,18,.48)','transparent');
    g.restore();lit(x,y,w,h,warm?104:62);
  }

// Filter procedural detail against its projected footprint, especially near the vanishing point.
float rdHash(vec2 p) {
    vec3 h = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
    h += dot(h, h.yzx + 33.33);
    return fract((h.x + h.y) * h.z);

// Value and analytic x/z gradient of a smoothly interpolated noise field.
vec3 rdField(vec2 p) {
    vec2 cell = floor(p), f = fract(p);
    vec2 w = f*f*(3.0-2.0*f), dw = 6.0*f*(1.0-f);
    float a = rdHash(cell), b = rdHash(cell + vec2(1.,0.));
    float c = rdHash(cell + vec2(0.,1.)), d = rdHash(cell+1.);

float rdBand(float ticksPerMeter, float footprint) {
    float a = ticksPerMeter * footprint;
    return 1. / (1. + a*a*3.);

float rdLine(float distanceToCenter, float radius, float footprint) {
    return 1. - smoothstep(max(0.,radius-footprint*.5), radius+footprint*.5+.0001, abs(distanceToCenter));

// A raindrop starts at a seeded point and sends several damped wavelets across a puddle.
vec2 rdDrop(vec2 p, float t, float footprint) {
    vec2 id = floor(p);

vec3 shadeRoad(vec3 p, vec3 n, vec3 viewDir) {
    vec2 q = vec2(p.x-laneCenter(p.z),p.z);
    float footprint = max(.00025,max(length(dFdx(q)),length(dFdy(q))));
    vec3 terrain = rdField(q*vec2(.67,.43));
    vec3 roadPatch = rdField(q*1.48 + terrain.yz*.24 + vec2(54.,12.));
    vec3 pebble = rdField(q*7.8 + 4.7);
    vec3 grain = rdField(q*47. + vec2(16.,12.));
    vec3 grit = rdField(q*159.+31.);
    float grainBand = rdBand(47.,footprint);
    float pebbleBand = rdBand(7.8,footprint);
    float gritBand = rdBand(159.,footprint);

    // Depressions collect connected, irregular sheets of water. The crown drains first.
    float shore = terrain.x*.55+roadPatch.x*.32+pebble.x*.13 + .038*min(abs(q.x),2.6);
    float water = smoothstep(.438,.586,shore);
    float flecks = (grain.x-.5)*grainBand + (grit.x-.5)*gritBand*.75;
    float aggregate = .62+.52*pebble.x+.27*roadPatch.x+.56*flecks;

    // A narrow tar seam marks the edge of an old resurfacing patch.
    float repairPath = -1.48 + (rdField(vec2(q.y*.22,17.)).x-.5)*.45
                       + (rdField(vec2(q.y*2.5,31.)).x-.5)*.048;
    float tar = rdLine(q.x-repairPath,.015,footprint)
              * smoothstep(.24,.52,rdField(vec2(q.y*.12,28.)).x)
              * rdBand(9.,footprint);
    float gutter = smoothstep(2.52,2.63,abs(q.x));
    float slab = rdLine(abs(fract((q.y+.14)/.88)-.5)*.88,.006,footprint);
    float channelLip = rdLine(abs(q.x)-2.57,.012,footprint);
    float slit = rdLine(abs(q.x)-2.70,.018,footprint);
    float concrete = gutter*(1.-.77*slab)*(1.-slit);

    // A single, chipped curb stripe is broken where storefronts meet the road.
    float stripe = rdLine(q.x+2.34,.036,footprint);
    float paint = stripe * smoothstep(.36,.56,roadPatch.x*.7+pebble.x*.3)
                  * smoothstep(.23,.53,.5+(grit.x-.5)*gritBand+(grain.x-.5)*grainBand*.5)
                  * .58;

    // Cast-iron inspection cover with a broken concentric tread and a surrounding collar.
    float section = floor((q.y+9.)/18.);
    vec2 cap = vec2(q.x-mix(-.98,.85,rdHash(vec2(section,87.))),
                    mod(q.y+9.,18.)-9.+2.7);
    float r = length(cap);
    float iron = 1.-smoothstep(.314-footprint*.5,.314+footprint*.5,r);
    float coverSeam = rdLine(r-.290,.007,footprint) + .6*rdLine(r-.315,.008,footprint);
    float spoke = atan(cap.y,cap.x)/6.2831853;
    float groove = abs(fract((r+.004)/.041)-.5)*.041;
    float tire = rdLine(groove,.004,footprint) * rdBand(20.,footprint)
               * smoothstep(.1,.29,abs(fract(spoke*12.+floor(r/.041)*.29)-.5))
               * smoothstep(.035,.068,r);
    float sockets = rdLine(length(abs(cap)-vec2(.189,.132)),.012,footprint);

    water = mix(water,max(.36,water*.76),gutter);
    water = mix(water,.61,iron);
    water = max(water,.89*tar);
    float damp = 1.-water;
    // Runoff shears the reflections across shallow puddles, including in the middle distance.
    vec3 runoff = rdField(vec2(q.x*2.8 + terrain.x*.5, q.y*4.9 - uTime*.105));
    vec2 slope = terrain.yz*.005
               + runoff.yz*vec2(.004,.009)*rdBand(4.9,footprint)
               + pebble.yz*mix(.032,.005,water)*pebbleBand
               + grain.yz*mix(.040,.003,water)*grainBand
               + grit.yz*(.015*damp*gritBand);
    vec2 rain = rdDrop(q*1.82+2.31,uTime,footprint*1.82);
    rain += .63*rdDrop(q.yx*2.21+18.74,uTime*1.18,footprint*2.21).yx;
    slope += rain*(.007+.030*water);
    vec3 surfaceNormal = normalize(n+vec3(slope.x,0.,slope.y));
    vec3 ray = reflect(-viewDir,surfaceNormal);
    ray.y = max(.008,ray.y);
    float rough = mix(.265,.064,water) + .053*grain.x*grainBand*damp;
    vec3 neon = roadReflection(p,normalize(ray),rough);
    float cosine = clamp(dot(viewDir,surfaceNormal),0.,1.);
    float f0 = mix(.060,.044,water);
    float fresnel = f0+(1.-f0)*pow(1.-cosine,5.);
    float visible = mix(.45,.97,water);
    visible *= 1.-.73*min(1.,slit+channelLip*.54+coverSeam*.53);
    visible *= 1.-iron*(.45*tire+.84*sockets);

    vec3 fill = vec3(.0120,.0160,.0202) * aggregate * mix(1.15,.63,water);
    fill += concrete*vec3(.007,.0075,.0078);
    fill *= 1.-.55*tar;
    fill = mix(fill,vec3(.041,.044,.042)*aggregate,paint);
    fill = mix(fill,vec3(.014,.018,.020)*(.86+.26*pebble.x)*(1.-.55*tire),iron);
    fill *= 1.-.8*min(1.,coverSeam+sockets*iron+slit);
    float sparkle = clamp(.81+.86*(pebble.x-.35)*pebbleBand+.54*flecks,.44,1.48);
    vec3 lamps = rdLampLight(p,surfaceNormal,viewDir,water,rough,sparkle);
    return fill + lamps + neon*(fresnel*visible*1.16 + .024*aggregate);
}
`;

uniform vec3 vents[28];

  float plume = h*(0.9+0.8*id+0.15*pulse+0.1*strand);
  vec3 pos = source + vec3(
    -sign(source.x)*(plume*(0.19+0.28*id)+0.15*plume*sin(5.0*h-flow+11.0*id)),
    plume,
    plume*(0.19*sin(flow*0.63-h*4.0+id*11.6)+0.25*(id-0.5))

}`,`#version 300 es
precision highp float;
in vec2 local;
flat in vec3 tint;
flat in float ventSeed;
flat in float strength;
uniform float time;
out vec4 color;
float lattice(vec2 p) {

  const vao = gl.createVertexArray();

    const distanceToEye = item => (item[0]-eye[0])**2 + (item[1]-eye[1])**2 + (item[2]-eye[2])**2;
    const visible = item => item[2] < eye[2]+3 && item[2] > eye[2]-34;

    gl.disable(gl.BLEND);

    gl.bindVertexArray(null);
  };
}

// Every sound starts as locally synthesized noise or an oscillator.
const setAmbience = (() => {
  let engine, requested = false, suspendTimer;

    const Audio = window.AudioContext || window.webkitAudioContext;

    master.connect(ctx.destination);
    const filter = (kind, freq, q = 0.707) => {
      const node = ctx.createBiquadFilter();
      node.type = kind;
      node.frequency.value = freq;
      node.Q.value = q;
      return node;
    };

      const node = ctx.createBufferSource();
      node.buffer = buffer;
      node.loop = loop;
      return node;
    };
    const stereo = pan => {
      const node = ctx.createStereoPanner();
      node.pan.value = pan;
      return node;

      washL += washAlpha*(l-washL); washR += washAlpha*(r-washR);
      rainL += rainAlpha*(l-rainL); rainR += rainAlpha*(r-rainR);
      grainL *= grainDecay; grainR *= grainDecay;
      if (random()<145/rate) grainL += 0.17+0.36*random();
      if (random()<129/rate) grainR += 0.15+0.33*random();
      left[i]  = 0.67*washL + (0.25+grainL)*rainL + 0.047*l;
      right[i] = 0.67*washR + (0.25+grainR)*rainR + 0.047*r;

      const ring = filter('bandpass',freq,metal ? 1.6 : 0.83);

      const drop = ctx.createOscillator(), gain = ctx.createGain();
      const pitch = metal ? 510+random()*390 : 850+random()*760;
      drop.frequency.setValueAtTime(pitch,start);
      drop.frequency.exponentialRampToValueAtTime(pitch*(metal ? 0.99 : 1.27),start+0.021);
      const decay = metal ? 0.065+random()*0.08 : 0.025+random()*0.024;
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.exponentialRampToValueAtTime(0.009+random()*0.013,start+0.0014);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+decay);
