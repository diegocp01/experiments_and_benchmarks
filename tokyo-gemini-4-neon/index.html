<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Rainy Neon Tokyo Alley — Midnight Walk</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #020306;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
    user-select: none;
  }
  canvas#gl {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  canvas#gl:active { cursor: grabbing; }
  #hud {
    position: fixed;
    left: 22px; bottom: 18px;
    color: rgba(235, 240, 250, 0.72);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.6s ease;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    line-height: 1.65;
  }
  #hud.hidden { opacity: 0; }
  #hud .jp {
    font-size: 13px;
    letter-spacing: 0.18em;
    color: rgba(255, 198, 152, 0.85);
    margin-bottom: 2px;
  }
  #err {
    display: none;
    position: fixed; inset: 0;
    background: #090b10; color: #ff6b7a;
    padding: 28px; font-family: monospace; font-size: 13px;
    white-space: pre-wrap; overflow: auto; z-index: 99;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div class="jp">新宿・雨夜路地 — SHINJUKU RAIN WALK</div>
  <div>Drag: Look &nbsp;·&nbsp; Space: Pause &nbsp;·&nbsp; M: Rain Audio &nbsp;·&nbsp; R: Reset View &nbsp;·&nbsp; H: HUD</div>
</div>
<pre id="err"></pre>

<script>
(() => {
'use strict';

// ============================================================================
// 0. QUERY PARAMETERS & WEBGL2 BOOTSTRAP
// ============================================================================
const params = new URLSearchParams(location.search);
const FIXED_TIME = params.has('t') ? parseFloat(params.get('t')) : null;
const OVERRIDE_PITCH = params.has('pitch') ? parseFloat(params.get('pitch')) : null;
const OVERRIDE_YAW = params.has('yaw') ? parseFloat(params.get('yaw')) : null;
const OVERRIDE_X = params.has('x') ? parseFloat(params.get('x')) : null;
const OVERRIDE_Y = params.has('y') ? parseFloat(params.get('y')) : null;
const WALK_SPEED = params.has('speed') ? parseFloat(params.get('speed')) : 0.90;
const SHOW_HUD_INIT = params.get('hud') === '1';

const errEl = document.getElementById('err');
function fatal(msg) {
  errEl.style.display = 'block';
  errEl.textContent += msg + '\n';
  console.error(msg);
  throw new Error(msg);
}

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {
  antialias: false,
  alpha: false,
  depth: false,
  stencil: false,
  powerPreference: 'high-performance',
  preserveDrawingBuffer: FIXED_TIME !== null
});
if (!gl) fatal('WebGL2 is required to view this scene.');

const extColorFloat = gl.getExtension('EXT_color_buffer_float');
const extColorHalf = gl.getExtension('EXT_color_buffer_half_float');
const extAniso = gl.getExtension('EXT_texture_filter_anisotropic');
const MAX_ANISO = extAniso ? Math.min(8, gl.getParameter(extAniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 1;
const USE_HDR = !!(extColorFloat || extColorHalf);

// ============================================================================
// 1. DETERMINISTIC PRNG & MATH UTILITIES
// ============================================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261120);
const rand = (a = 0, b = 1) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function valueNoise2D(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm2D(x, y, oct = 4) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < oct; i++) {
    v += amp * valueNoise2D(x * freq, y * freq);
    freq *= 2.02; amp *= 0.5;
  }
  return v;
}

function mat4Create() { return new Float32Array(16); }
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy * 0.5);
  const nf = 1.0 / (near - far);
  out.fill(0);
  out[0] = f / aspect; out[5] = f;
  out[10] = (far + near) * nf; out[11] = -1;
  out[14] = 2 * far * near * nf;
  return out;
}
function mat4LookAt(out, eye, center, up) {
  let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
  let zl = Math.hypot(zx, zy, zz) || 1;
  zx /= zl; zy /= zl; zz /= zl;
  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  let xl = Math.hypot(xx, xy, xz) || 1;
  xx /= xl; xy /= xl; xz /= xl;
  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;
  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
  out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
  out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
  out[15] = 1;
  return out;
}
function mat4Mul(out, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    out[c * 4 + 0] = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
    out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
    out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return out;
}
function mat4ScaleYNeg(out, m) {
  out.set(m);
  out[4] = -out[4]; out[5] = -out[5]; out[6] = -out[6]; out[7] = -out[7];
  return out;
}
function invertMat4(out, m) {
  const a00=m[0],a01=m[1],a02=m[2],a03=m[3],a10=m[4],a11=m[5],a12=m[6],a13=m[7];
  const a20=m[8],a21=m[9],a22=m[10],a23=m[11],a30=m[12],a31=m[13],a32=m[14],a33=m[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10, b03=a01*a12-a02*a11;
  const b04=a01*a13-a03*a11, b05=a02*a13-a03*a12, b06=a20*a31-a21*a30, b07=a20*a32-a22*a30;
  const b08=a20*a33-a23*a30, b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11 - b01*b10 + b02*b09 + b03*b08 - b04*b07 + b05*b06;
  if (!det) return out;
  det = 1.0 / det;
  out[0]=(a11*b11-a12*b10+a13*b09)*det; out[1]=(a02*b10-a01*b11-a03*b09)*det;
  out[2]=(a31*b05-a32*b04+a33*b03)*det; out[3]=(a22*b04-a21*b05-a23*b03)*det;
  out[4]=(a12*b08-a10*b11-a13*b07)*det; out[5]=(a00*b11-a02*b08+a03*b07)*det;
  out[6]=(a32*b02-a30*b05-a33*b01)*det; out[7]=(a20*b05-a22*b02+a23*b01)*det;
  out[8]=(a10*b10-a11*b08+a13*b06)*det; out[9]=(a01*b08-a00*b10-a03*b06)*det;
  out[10]=(a30*b04-a31*b02+a33*b00)*det; out[11]=(a21*b02-a20*b04-a23*b00)*det;
  out[12]=(a11*b07-a10*b09-a12*b06)*det; out[13]=(a00*b09-a01*b07+a02*b06)*det;
  out[14]=(a31*b01-a30*b03-a32*b00)*det; out[15]=(a20*b03-a21*b01+a22*b00)*det;
  return out;
}

// ============================================================================
// 2. WEBGL2 SHADER & FBO UTILITIES
// ============================================================================
function compileShader(type, src, label) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const lines = src.split('\n').map((l, i) => `${i + 1}: ${l}`).join('\n');
    fatal(`Shader compile error (${label}):\n${log}\n---\n${lines}`);
  }
  return s;
}
function createProgram(vsSrc, fsSrc, label) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc, label + ' VS'));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc, label + ' FS'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    fatal(`Program link error (${label}):\n${gl.getProgramInfoLog(p)}`);
  }
  const uniforms = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    uniforms[name] = gl.getUniformLocation(p, name);
  }
  return { prog: p, u: uniforms };
}

function createCanvasTexture(cnv, { srgb = false, wrap = gl.REPEAT, mipmap = true, aniso = true } = {}) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, srgb ? gl.SRGB8_ALPHA8 : gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cnv);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  if (mipmap) {
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  } else {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
  if (aniso && extAniso) {
    gl.texParameterf(gl.TEXTURE_2D, extAniso.TEXTURE_MAX_ANISOTROPY_EXT, MAX_ANISO);
  }
  return tex;
}

function createFBO(w, h, { hdr = true, depthRB = false } = {}) {
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  const color = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, color);
  const intFmt = (hdr && USE_HDR) ? gl.RGBA16F : gl.RGBA8;
  const type = (hdr && USE_HDR) ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
  gl.texImage2D(gl.TEXTURE_2D, 0, intFmt, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, color, 0);

  let depth = null;
  if (depthRB) {
    depth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  }
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (status !== gl.FRAMEBUFFER_COMPLETE) fatal('FBO incomplete: 0x' + status.toString(16));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, color, depth, w, h };
}
function destroyFBO(f) {
  if (!f) return;
  gl.deleteFramebuffer(f.fbo);
  gl.deleteTexture(f.color);
  if (f.depth) gl.deleteRenderbuffer(f.depth);
}

// ============================================================================
// 3. PROCEDURAL PBR & JAPANESE SIGNAGE TEXTURE ATLASES
// ============================================================================
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function heightToNormalCanvas(heights, w, h, strength = 3.2) {
  const c = makeCanvas(w, h);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    const ym = (y - 1 + h) % h, yp = (y + 1) % h;
    for (let x = 0; x < w; x++) {
      const xm = (x - 1 + w) % w, xp = (x + 1) % w;
      let nx = (heights[y * w + xm] - heights[y * w + xp]) * strength;
      let ny = (heights[ym * w + x] - heights[yp * w + x]) * strength;
      let nz = 1.0;
      const inv = 1.0 / Math.hypot(nx, ny, nz);
      nx *= inv; ny *= inv; nz *= inv;
      const i = (y * w + x) * 4;
      d[i]     = Math.round((nx * 0.5 + 0.5) * 255);
      d[i + 1] = Math.round((ny * 0.5 + 0.5) * 255);
      d[i + 2] = Math.round((nz * 0.5 + 0.5) * 255);
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// 3A. Architectural PBR Atlas (1024 x 768 = 4 cols x 3 rows of 256x256 tiles)
function buildArchitectureAtlas() {
  const W = 1024, H = 768, S = 256;
  const alb = makeCanvas(W, H), actx = alb.getContext('2d');
  const rma = makeCanvas(W, H), rctx = rma.getContext('2d');
  const heights = new Float32Array(W * H);

  actx.fillStyle = '#24272d'; actx.fillRect(0, 0, W, H);
  rctx.fillStyle = 'rgb(130,30,235)'; rctx.fillRect(0, 0, W, H);

  const albImg = actx.getImageData(0, 0, W, H);
  const rmaImg = rctx.getImageData(0, 0, W, H);
  const ad = albImg.data, rd = rmaImg.data;

  function putPx(x, y, r, g, b, rough, metal, ao, hv) {
    const i = (y * W + x) * 4;
    ad[i] = clamp(r, 0, 255); ad[i+1] = clamp(g, 0, 255); ad[i+2] = clamp(b, 0, 255); ad[i+3] = 255;
    rd[i] = clamp(rough * 255, 0, 255); rd[i+1] = clamp(metal * 255, 0, 255); rd[i+2] = clamp(ao * 255, 0, 255); rd[i+3] = 255;
    heights[y * W + x] = hv;
  }

  // (0,0) Classic Tokyo Ceramic Mosaic Tile
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const tx = lx % 32, ty = ly % 16;
      const cid = hash2(Math.floor(lx / 32) + 11, Math.floor(ly / 16) + 7);
      const isGrout = tx < 2 || ty < 2;
      const grime = fbm2D(lx * 0.032, ly * 0.018, 4);
      const drip = Math.pow(fbm2D(lx * 0.14, ly * 0.015, 3), 2.0);
      if (isGrout) {
        putPx(lx, ly, 24, 26, 30, 0.80, 0.02, 0.45, 0.14);
      } else {
        const s = 86 + cid * 24 - grime * 30 - drip * 36;
        putPx(lx, ly, s * 1.02, s * 0.99, s * 0.94, 0.22 + grime * 0.22 - drip * 0.08, 0.06, 0.95 - drip * 0.24, 0.78 + (cid - 0.5) * 0.08);
      }
    }
  }

  // (1,0) Weathered Showa Exposed Concrete
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const n1 = fbm2D(lx * 0.038 + 40, ly * 0.038, 5);
      const streak = fbm2D(lx * 0.17 + 12, ly * 0.014, 3);
      const seamX = (lx % 128) < 3, seamY = (ly % 128) < 3;
      const px = (lx % 64) - 32, py = (ly % 64) - 32;
      const hole = (px * px + py * py) < 11;
      let base = 62 + n1 * 34 - streak * 24;
      let rough = 0.48 + n1 * 0.24 - streak * 0.16, ao = 0.92 - streak * 0.22, hv = 0.55 + n1 * 0.25;
      if (seamX || seamY) { base *= 0.42; ao *= 0.48; hv = 0.12; rough = 0.82; }
      if (hole) { base *= 0.28; ao *= 0.3; hv = 0.04; }
      putPx(S + lx, ly, base * 0.95, base * 0.98, base * 1.05, rough, 0.03, ao, hv);
    }
  }

  // (2,0) Corrugated Galvanized Metal Siding
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const wave = Math.sin((lx / S) * Math.PI * 2 * 24) * 0.5 + 0.5;
      const rust = Math.max(0, fbm2D(lx * 0.05 + 80, ly * 0.025, 4) - 0.55) * 2.4;
      const grime = fbm2D(lx * 0.09, ly * 0.02, 3);
      const seamY = (ly % 128) < 2;
      const base = (seamY ? 18 : 38 + wave * 26) - grime * 14;
      putPx(2 * S + lx, ly, base * 0.94 + rust * 72, base * 0.98 + rust * 26, base * 1.08 + rust * 6,
            0.20 + rust * 0.46 + grime * 0.14, clamp(0.84 - rust * 0.65, 0.1, 0.92), 0.60 + wave * 0.40, seamY ? 0.1 : 0.22 + wave * 0.72);
    }
  }

  // (3,0) Dark Charred Cedar Wood Slats
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const slat = Math.floor(lx / 16);
      const gap = (lx % 16) < 2;
      const grain = fbm2D(lx * 0.35 + slat * 7.3, ly * 0.03, 4);
      const vs = hash2(slat, 19) * 16;
      if (gap) {
        putPx(3 * S + lx, ly, 10, 8, 6, 0.85, 0.02, 0.22, 0.08);
      } else {
        const s = 42 + vs + grain * 24;
        putPx(3 * S + lx, ly, s * 1.16, s * 0.78, s * 0.48, 0.32 + grain * 0.22, 0.03, 0.88, 0.65 + grain * 0.2);
      }
    }
  }

  // (0,1) Roll-Down Ribbed Metal Shop Shutter
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const slatY = ly % 16;
      const ridge = Math.sin((slatY / 16) * Math.PI);
      const seam = slatY < 2;
      const grime = fbm2D(lx * 0.045, ly * 0.045 + 22, 4);
      const lowerDirt = Math.pow(ly / S, 2.2) * 30;
      const base = (seam ? 18 : 58 + ridge * 26) - grime * 22 - lowerDirt;
      putPx(lx, S + ly, base * 0.88, base * 0.96, base * 1.08, 0.24 + grime * 0.26 + (seam ? 0.4 : 0), 0.74, seam ? 0.32 : 0.70 + ridge * 0.26, seam ? 0.08 : 0.35 + ridge * 0.56);
    }
  }

  // (1,1) Dark Slate-Charcoal Modern Tokyo Tile
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const row = Math.floor(ly / 16);
      const ox = (row & 1) ? 16 : 0;
      const tx = (lx + ox) % 32, ty = ly % 16;
      const grout = tx < 2 || ty < 2;
      const id = hash2(Math.floor((lx + ox) / 32) + 3, row + 5);
      const n = fbm2D(lx * 0.06, ly * 0.02, 3);
      if (grout) putPx(S + lx, S + ly, 14, 16, 20, 0.84, 0.02, 0.38, 0.12);
      else {
        const s = 38 + id * 18 - n * 12;
        putPx(S + lx, S + ly, s * 0.92, s * 0.96, s * 1.07, 0.22 + n * 0.18, 0.10, 0.90, 0.76 + (id - 0.5) * 0.1);
      }
    }
  }

  // (2,1) AC Outdoor Unit Front Louver Grille & Fan Shroud
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const dx = lx - 102, dy = ly - 132;
      const dist = Math.hypot(dx, dy);
      const n = fbm2D(lx * 0.05 + 15, ly * 0.05, 3);
      let base = 104 - n * 28, rough = 0.40 + n * 0.18, metal = 0.38, ao = 0.92, hv = 0.7;
      if (dist < 76) {
        const ring = (Math.floor(dist) % 9) < 2;
        const spoke = Math.abs(Math.sin(Math.atan2(dy, dx) * 4)) < 0.06;
        const blade = Math.sin(Math.atan2(dy, dx) * 3 + dist * 0.03) > 0.25;
        if (ring || spoke) { base = 40; metal = 0.65; hv = 0.76; ao = 0.75; }
        else { base = blade ? 20 : 10; rough = 0.52; metal = 0.2; hv = 0.08; ao = 0.22; }
      } else if (lx > 192 && ly > 44 && ly < 216) {
        const louver = (ly % 12) < 4;
        base = louver ? 24 : 92 - n * 20;
        hv = louver ? 0.22 : 0.72; ao = louver ? 0.40 : 0.88;
      }
      if (lx < 6 || lx > S - 7 || ly < 6 || ly > S - 7) { base *= 0.70; hv = 0.44; }
      putPx(2 * S + lx, S + ly, base * 0.99, base * 0.97, base * 0.90, rough, metal, ao, hv);
    }
  }

  // (3,1) Metal Drain Grate / Plastic Beer Crate Mesh
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const gx = lx % 16, gy = ly % 32;
      const bar = gx < 4 || gy < 4;
      const n = fbm2D(lx * 0.08, ly * 0.08 + 50, 3);
      if (bar) {
        const s = 62 + n * 22;
        putPx(3 * S + lx, S + ly, s, s * 1.02, s * 1.06, 0.24 + n * 0.16, 0.82, 0.88, 0.82);
      } else {
        putPx(3 * S + lx, S + ly, 7, 8, 11, 0.72, 0.1, 0.16, 0.06);
      }
    }
  }

  // (0,2) Vending Machine / AC Painted Metal Side Panel (clean weathered sheet metal with vents & seam!)
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const n = fbm2D(lx * 0.05 + 3, ly * 0.04, 3);
      const isBase = ly > 228;
      const isTopAccent = ly < 24;
      const isPanelSeam = Math.abs(lx - 20) < 2 || Math.abs(lx - 236) < 2 || Math.abs(ly - 24) < 2;
      const inVent = (ly > 168 && ly < 216 && lx > 44 && lx < 212 && (ly % 7) < 3);
      let r = 104 - n * 22, g = 110 - n * 22, b = 122 - n * 20;
      let rough = 0.24 + n * 0.16, metal = 0.56, ao = 0.92, hv = 0.68;
      if (isTopAccent) { r = 24; g = 60; b = 106; rough = 0.20; }
      if (isBase) { r = 26; g = 28; b = 34; rough = 0.45; hv = 0.4; }
      if (isPanelSeam) { r *= 0.42; g *= 0.42; b *= 0.42; hv = 0.22; ao = 0.45; }
      if (inVent) { r = 14; g = 16; b = 20; hv = 0.14; ao = 0.28; rough = 0.7; }
      putPx(lx, 2 * S + ly, r, g, b, rough, metal, ao, hv);
    }
  }

  // (1,2) Japanese Drink Recycling Bin
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const n = fbm2D(lx * 0.07 + 7, ly * 0.07, 3);
      let r = 46 - n * 10, g = 56 - n * 10, b = 74 - n * 10;
      let rough = 0.34, metal = 0.30, ao = 0.9, hv = 0.65;
      if (ly < 72) { r = 140 - n * 24; g = 144 - n * 24; b = 150 - n * 24; }
      const d1 = Math.hypot(lx - 80, ly - 38), d2 = Math.hypot(lx - 176, ly - 38);
      if (d1 < 22 || d2 < 22) { r = 8; g = 9; b = 12; hv = 0.05; ao = 0.2; rough = 0.8; }
      else if (d1 < 27 || d2 < 27) { r = 26; g = 122; b = 195; hv = 0.78; }
      putPx(S + lx, 2 * S + ly, r, g, b, rough, metal, ao, hv);
    }
  }

  // (2,2) Electrical Utility Junction / Meter Box Front Face (authentic Japanese kWh box with glass readout & steel latch!)
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const n = fbm2D(lx * 0.06 + 31, ly * 0.06, 3);
      let base = 74 - n * 24, rough = 0.34 + n * 0.2, metal = 0.58, ao = 0.9, hv = 0.68;
      if (lx < 14 || lx > 242 || ly < 14 || ly > 242) { base *= 0.50; hv = 0.34; }
      // Rectangular glass inspection window (more authentic than giant circle!)
      const inWin = lx > 66 && lx < 190 && ly > 52 && ly < 126;
      const inFrame = lx > 58 && lx < 198 && ly > 44 && ly < 134 && !inWin;
      let r = base * 0.95, g = base * 0.98, b = base * 1.04;
      if (inFrame) { r = 22; g = 24; b = 28; hv = 0.82; }
      else if (inWin) {
        const isCounter = ly > 72 && ly < 92 && lx > 84 && lx < 172;
        const isWheel = Math.abs(ly - 108) < 3 && lx > 88 && lx < 168;
        r = isCounter ? 20 : (isWheel ? 165 : 92);
        g = isCounter ? 22 : (isWheel ? 162 : 98);
        b = isCounter ? 24 : (isWheel ? 155 : 104);
        rough = 0.08; metal = 0.15; hv = 0.48;
      }
      // Subtle small warning label
      if (ly > 176 && ly < 204 && lx > 56 && lx < 200) {
        const str = ((lx + ly) % 20) < 10;
        r = str ? 155 : 22; g = str ? 118 : 20; b = str ? 20 : 20;
      }
      putPx(2 * S + lx, 2 * S + ly, r, g, b, rough, metal, ao, hv);
    }
  }

  // (3,2) Concrete Utility Pole with Weathered Address Plate & Hazard Band
  for (let ly = 0; ly < S; ly++) {
    for (let lx = 0; lx < S; lx++) {
      const n = fbm2D(lx * 0.08 + 5, ly * 0.03, 4);
      let base = 54 + n * 24;
      let r = base * 0.96, g = base * 0.98, b = base * 1.03;
      let rough = 0.58 - n * 0.14, metal = 0.05, hv = 0.5 + n * 0.2;
      if (ly > 180 && ly < 218) {
        const str = ((lx + ly) % 28) < 14;
        r = str ? 175 : 20; g = str ? 142 : 20; b = str ? 24 : 22; rough = 0.26;
      }
      putPx(3 * S + lx, 2 * S + ly, r, g, b, rough, metal, 0.88, hv);
    }
  }

  actx.putImageData(albImg, 0, 0);
  rctx.putImageData(rmaImg, 0, 0);

  actx.save();
  actx.fillStyle = 'rgba(195, 52, 42, 0.50)'; actx.fillRect(36, S + 112, 26, 18);
  actx.fillStyle = 'rgba(225, 212, 168, 0.55)'; actx.fillRect(156, S + 90, 20, 28);
  actx.fillStyle = 'rgba(42, 138, 188, 0.42)'; actx.fillRect(78, S + 152, 28, 14);
  actx.fillStyle = '#183f78'; actx.fillRect(3 * S + 96, 2 * S + 76, 56, 86);
  actx.strokeStyle = '#d4dce6'; actx.lineWidth = 3; actx.strokeRect(3 * S + 99, 2 * S + 79, 50, 80);
  actx.fillStyle = '#e6ecf2'; actx.font = 'bold 18px sans-serif'; actx.textAlign = 'center';
  actx.fillText('新宿', 3 * S + 124, 2 * S + 108);
  actx.fillText('三丁目', 3 * S + 124, 2 * S + 138);
  actx.restore();

  const normCanvas = heightToNormalCanvas(heights, W, H, 3.3);
  return {
    albedo: createCanvasTexture(alb, { srgb: true }),
    rma: createCanvasTexture(rma, { srgb: false }),
    normal: createCanvasTexture(normCanvas, { srgb: false })
  };
}

// 3B. Ultra-Crisp High-Frequency Wet Asphalt Detail & Puddle Basin Texture (512x512 seamless)
function buildAsphaltTextures() {
  const S = 512;
  const hBuf = new Float32Array(S * S);
  const dataCnv = makeCanvas(S, S);
  const ctx = dataCnv.getContext('2d');
  const img = ctx.createImageData(S, S);
  const d = img.data;

  function pNoise(x, y, period) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const x0 = ((ix % period) + period) % period, x1 = (x0 + 1) % period;
    const y0 = ((iy % period) + period) % period, y1 = (y0 + 1) % period;
    const a = hash2(x0 * 3.17, y0 * 5.23), b = hash2(x1 * 3.17, y0 * 5.23);
    const c = hash2(x0 * 3.17, y1 * 5.23), e = hash2(x1 * 3.17, y1 * 5.23);
    return lerp(lerp(a, b, ux), lerp(c, e, ux), uy);
  }
  function pFbm(u, v, baseFreq, oct) {
    let sum = 0, amp = 0.5, f = baseFreq;
    for (let i = 0; i < oct; i++) {
      sum += amp * pNoise(u * f, v * f, f);
      f *= 2; amp *= 0.5;
    }
    return sum;
  }

  for (let y = 0; y < S; y++) {
    const v = y / S;
    for (let x = 0; x < S; x++) {
      const u = x / S;
      const macro = pFbm(u, v, 4, 3);
      const med = pFbm(u + 0.31, v + 0.17, 16, 3);
      const grit1 = pNoise(u * 64, v * 64, 64);
      const grit2 = pNoise(u * 128, v * 128, 128);
      const grit3 = pNoise(u * 256, v * 256, 256);
      const fine = grit1 * 0.25 + grit2 * 0.40 + grit3 * 0.35;
      const cr = Math.abs(pFbm(u + 0.71, v + 0.23, 8, 3) - 0.5) * 2.0;
      const crack = cr < 0.022 ? (1.0 - cr / 0.022) : 0.0;

      const hVal = clamp(0.62 * fine + 0.25 * med + 0.13 * macro - crack * 0.42, 0, 1);
      hBuf[y * S + x] = hVal;

      const i = (y * S + x) * 4;
      d[i]     = Math.round(clamp(0.12 + fine * 0.58 + med * 0.20 - crack * 0.18, 0, 1) * 255);
      d[i + 1] = Math.round(clamp(macro * 0.72 + med * 0.28, 0, 1) * 255);
      d[i + 2] = Math.round(clamp(0.24 + fine * 0.56 + med * 0.20, 0, 1) * 255);
      d[i + 3] = Math.round(clamp(crack, 0, 1) * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const normCnv = heightToNormalCanvas(hBuf, S, S, 4.4);
  return {
    data: createCanvasTexture(dataCnv, { srgb: false }),
    normal: createCanvasTexture(normCnv, { srgb: false })
  };
}

// 3C. Signage, Photographic Shopfronts, Arch Banners, Vending & Lantern Atlas (2048 x 2048)
function buildSignageAtlas() {
  const W = 2048, H = 2048;
  const colCnv = makeCanvas(W, H), cctx = colCnv.getContext('2d');
  const emiCnv = makeCanvas(W, H), ectx = emiCnv.getContext('2d');

  cctx.fillStyle = '#0e1015'; cctx.fillRect(0, 0, W, H);
  ectx.fillStyle = '#000000'; ectx.fillRect(0, 0, W, H);

  const rects = {};
  const FONT_GOTHIC = '"Hiragino Kaku Gothic ProN", "YuGothic", "Meiryo", sans-serif';
  const FONT_MINCHO = '"Hiragino Mincho ProN", "YuMincho", serif';

  function reg(id, x, y, w, h, meta = {}) {
    rects[id] = {
      u0: (x + 2) / W, v0: (y + 2) / H,
      u1: (x + w - 2) / W, v1: (y + h - 2) / H,
      w, h, ...meta
    };
  }

  function drawVerticalText(ctx, chars, cx, yStart, stepY, font, fill, stroke, shadowCol, shadowBlur) {
    ctx.save();
    ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (shadowCol) { ctx.shadowColor = shadowCol; ctx.shadowBlur = shadowBlur || 16; }
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i], y = yStart + i * stepY;
      if (ch === 'ー' || ch === '〜') {
        ctx.save(); ctx.translate(cx, y); ctx.rotate(Math.PI / 2);
        if (stroke) { ctx.strokeStyle = stroke; ctx.strokeText(ch, 0, 0); }
        ctx.fillStyle = fill; ctx.fillText(ch, 0, 0);
        ctx.restore();
      } else {
        if (stroke) { ctx.strokeStyle = stroke; ctx.strokeText(ch, cx, y); }
        ctx.fillStyle = fill; ctx.fillText(ch, cx, y);
      }
    }
    ctx.restore();
  }

  function fitText(ctx, text, maxW, maxH, weight, family) {
    let sz = Math.round(maxH);
    ctx.font = `${weight} ${sz}px ${family}`;
    const mw = ctx.measureText(text).width;
    if (mw > maxW) sz = Math.max(12, Math.floor(sz * (maxW / mw)));
    return `${weight} ${sz}px ${family}`;
  }

  function drawBladeSign(id, x, y, w, h, cfg) {
    reg(id, x, y, w, h, { lightColor: cfg.lightColor, intensity: cfg.intensity || 1.75 });
    const drawTo = (ctx, isEmissive) => {
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.fillStyle = isEmissive ? '#000' : '#16181e';
      ctx.fillRect(x, y, w, h);

      const pad = 8, ix = x + pad, iy = y + pad, iw = w - pad * 2, ih = h - pad * 2;
      if (cfg.style === 'neon_tube') {
        ctx.fillStyle = isEmissive ? '#030206' : '#0f1117';
        ctx.fillRect(ix, iy, iw, ih);
        if (!isEmissive) {
          ctx.strokeStyle = '#222630'; ctx.lineWidth = 2.5;
          for (let gy = iy + 28; gy < iy + ih; gy += 44) {
            ctx.beginPath(); ctx.moveTo(ix, gy); ctx.lineTo(ix + iw, gy); ctx.stroke();
          }
        }
        ctx.strokeStyle = cfg.borderCol || cfg.glowCol;
        ctx.lineWidth = isEmissive ? 7 : 5;
        ctx.shadowColor = cfg.glowCol; ctx.shadowBlur = isEmissive ? 18 : 8;
        ctx.strokeRect(ix + 8, iy + 8, iw - 16, ih - 16);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.strokeRect(ix + 8, iy + 8, iw - 16, ih - 16);

        const chars = Array.from(cfg.text);
        const step = (ih - 48) / Math.max(chars.length, 1);
        const fSize = Math.min(iw * 0.66, step * 0.84);
        const font = `900 ${Math.round(fSize)}px ${cfg.mincho ? FONT_MINCHO : FONT_GOTHIC}`;
        const y0 = iy + 24 + step * 0.5;
        ctx.lineWidth = isEmissive ? 10 : 6;
        drawVerticalText(ctx, chars, ix + iw / 2, y0, step, font, cfg.glowCol, cfg.glowCol, cfg.glowCol, isEmissive ? 22 : 10);
        drawVerticalText(ctx, chars, ix + iw / 2, y0, step, font, '#fff5f2', null, cfg.glowCol, 6);
      } else {
        const grad = ctx.createRadialGradient(ix + iw * 0.5, iy + ih * 0.48, iw * 0.05, ix + iw * 0.5, iy + ih * 0.5, ih * 0.60);
        grad.addColorStop(0, cfg.bgCenter); grad.addColorStop(0.70, cfg.bgMid || cfg.bgEdge); grad.addColorStop(1, cfg.bgEdge);
        ctx.fillStyle = grad; ctx.fillRect(ix, iy, iw, ih);

        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        for (let ty = iy + 20; ty < iy + ih - 12; ty += 56) ctx.fillRect(ix + 3, ty, iw - 6, 14);

        if (cfg.headerBg) {
          ctx.fillStyle = cfg.headerBg; ctx.fillRect(ix, iy, iw, 44);
          ctx.font = `800 20px ${FONT_GOTHIC}`; ctx.fillStyle = cfg.headerText || '#ffffff';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(cfg.sub || '2F', ix + iw / 2, iy + 23);
        }
        if (cfg.innerBorder) { ctx.strokeStyle = cfg.innerBorder; ctx.lineWidth = 3.5; ctx.strokeRect(ix + 5, iy + 5, iw - 10, ih - 10); }

        const chars = Array.from(cfg.text);
        const topPad = cfg.headerBg ? 54 : 20, botPad = cfg.footer ? 40 : 18;
        const step = (ih - topPad - botPad) / Math.max(chars.length, 1);
        const fSize = Math.min(iw * 0.72, step * 0.86);
        const font = `900 ${Math.round(fSize)}px ${cfg.mincho ? FONT_MINCHO : FONT_GOTHIC}`;
        ctx.lineWidth = cfg.textStroke ? 4.5 : 0;
        drawVerticalText(ctx, chars, ix + iw / 2, iy + topPad + step * 0.5, step, font, cfg.textCol, cfg.textStroke || null, null, 0);

        if (cfg.footer) {
          ctx.font = fitText(ctx, cfg.footer, iw - 12, 18, '800', FONT_GOTHIC);
          ctx.fillStyle = cfg.footerCol || cfg.textCol;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(cfg.footer, ix + iw / 2, iy + ih - 20);
        }

        const vg = ctx.createLinearGradient(ix, iy, ix, iy + ih);
        vg.addColorStop(0, 'rgba(0,0,0,0.48)'); vg.addColorStop(0.09, 'rgba(0,0,0,0)');
        vg.addColorStop(0.91, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.52)');
        ctx.fillStyle = vg; ctx.fillRect(ix, iy, iw, ih);
        const hg = ctx.createLinearGradient(ix, iy, ix + iw, iy);
        hg.addColorStop(0, 'rgba(0,0,0,0.38)'); hg.addColorStop(0.15, 'rgba(0,0,0,0)');
        hg.addColorStop(0.85, 'rgba(0,0,0,0)'); hg.addColorStop(1, 'rgba(0,0,0,0.38)');
        ctx.fillStyle = hg; ctx.fillRect(ix, iy, iw, ih);
        if (isEmissive) { ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(ix, iy, iw, ih); }
      }
      for (let k = 0; k < 36; k++) {
        const sx = ix + hash2(k + x, y) * iw, sy = iy + hash2(y, k + x * 3) * ih;

        ctx.fillRect(sx, sy, 2 + hash2(sy, sx) * 4, 4 + hash2(k, sx) * 14);
      }
      ctx.restore();

  // Row 2 (y=816..1344): PHOTOREALISTIC TOKYO SHOPFRONTS (Natural frosted glass, real bottle/shelf depth, subtle neon!)
  function drawShopfront(id, x, y, w, h, cfg) {
    reg(id, x, y, w, h, { lightColor: cfg.lightColor, intensity: cfg.intensity || 1.60 });
    const drawTo = (ctx, isEmissive) => {
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();

      // Rich interior lighting depth (warm ceiling glow fading softly to shadowed rear walls)
      const g = ctx.createRadialGradient(x + w * 0.5, y + h * 0.30, 24, x + w * 0.5, y + h * 0.52, w * 0.72);
      g.addColorStop(0.0, cfg.innerBright);
      g.addColorStop(0.50, cfg.innerMid);
      g.addColorStop(0.86, cfg.innerDark);
      g.addColorStop(1.0, '#070506');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);

      // Subtle architectural interior depth: dark ceiling beam, back wooden counter, bar shelves
      ctx.fillStyle = 'rgba(14, 7, 5, 0.58)';
      ctx.fillRect(x, y, w, h * 0.14);
      ctx.fillRect(x, y + h * 0.60, w, h * 0.40);

      // Two horizontal shelf ledges with realistic tapered sake/whisky bottle silhouettes!
      for (let shelf = 0; shelf < 2; shelf++) {
        const sy = y + h * (shelf === 0 ? 0.38 : 0.55);
        ctx.fillStyle = 'rgba(16, 8, 5, 0.55)';
        ctx.fillRect(x + 28, sy, w - 56, 6);
        for (let bx = x + 38; bx < x + w - 42; bx += 22) {
          if (hash2(bx, shelf * 17 + x) < 0.26) continue;
          const bh = 22 + hash2(bx + 3, y + shelf) * 20;
          const bw = 9 + hash2(shelf, bx) * 4;
          // Tapered bottle body + neck
          ctx.fillStyle = `rgba(18, 9, 6, ${0.42 + hash2(y, bx) * 0.22})`;
          ctx.fillRect(bx, sy - bh, bw, bh);
          ctx.fillRect(bx + bw * 0.28, sy - bh - 11, bw * 0.44, 11);
          // Warm amber glass edge glint
          ctx.fillStyle = 'rgba(255, 195, 110, 0.14)';
          ctx.fillRect(bx + 1.5, sy - bh + 3, 2, bh * 0.65);
        }
      }

      // Soft warm ceiling light wash (gentle natural diffusion — NO circular polka-dot orbs!)
      const topGlow = ctx.createLinearGradient(x, y + h * 0.12, x, y + h * 0.66);
      topGlow.addColorStop(0.0, cfg.topWash);
      topGlow.addColorStop(0.5, 'rgba(255,180,100,0.06)');
      topGlow.addColorStop(1.0, 'rgba(0,0,0,0.22)');
      ctx.fillStyle = topGlow;
      ctx.fillRect(x, y + h * 0.12, w, h * 0.54);

      // Fine organic frosted-glass mist & subtle vertical rain runoff streaks (NO thick zebra stripes!)
      for (let s = 0; s < 110; s++) {
        const sx = x + hash2(s * 1.3, x + 9) * w, sy = y + hash2(y + 5, s * 2.1) * h * 0.75;
        ctx.fillStyle = (s % 3 === 0) ? 'rgba(255,245,230,0.045)' : 'rgba(8,6,10,0.08)';
        ctx.fillRect(sx, sy, 1.5 + hash2(sx, s) * 2.5, 24 + hash2(s, sx) * 95);
      }

      // Optional crisp small interior neon glass tube mounted cleanly inside dark bar/cafe window!
      if (cfg.innerNeon) {
        ctx.save();
        const nx = x + w * 0.5, ny = y + h * 0.36;
        // Thin dark suspension wires from top frame
        ctx.strokeStyle = '#090a0e'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(nx - 62, y + 24); ctx.lineTo(nx - 62, ny - 28);
        ctx.moveTo(nx + 62, y + 24); ctx.lineTo(nx + 62, ny - 28); ctx.stroke();

        ctx.strokeStyle = cfg.innerNeonCol;
        ctx.lineWidth = isEmissive ? 4.5 : 3.5;
        ctx.shadowColor = cfg.innerNeonCol;
        ctx.shadowBlur = isEmissive ? 20 : 9;
        ctx.strokeRect(nx - 76, ny - 28, 152, 56);
        ctx.font = `900 28px ${FONT_GOTHIC}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = cfg.innerNeonCol; ctx.fillText(cfg.innerNeon, nx, ny);
        ctx.fillStyle = '#fff6f9'; ctx.shadowBlur = 5; ctx.fillText(cfg.innerNeon, nx, ny);
        ctx.restore();
      }

      // Authentic Japanese Wooden Sliding Door Frame (引き戸) & Lower Weathered Timber Kickboard
      ctx.fillStyle = isEmissive ? '#000000' : cfg.woodCol;
      ctx.fillRect(x, y, w, 26);
      ctx.fillRect(x, y + h - 130, w, 130);
      ctx.fillRect(x, y, 24, h);
      ctx.fillRect(x + w - 24, y, 24, h);
      ctx.fillRect(x + w * 0.5 - 12, y, 24, h);

      if (!isEmissive) {
        ctx.fillStyle = 'rgba(0,0,0,0.38)';
        for (let kx = x + 24; kx < x + w - 24; kx += 22) ctx.fillRect(kx, y + h - 128, 2, 126);
        ctx.fillStyle = '#5a5248';
        ctx.fillRect(x + w * 0.5 - 30, y + h - 194, 8, 40);
        ctx.fillRect(x + w * 0.5 + 22, y + h - 194, 8, 40);
      }

      // Fine Kumiko wooden lattice mullions
      ctx.fillStyle = isEmissive ? '#000000' : cfg.woodCol;
      const cols = cfg.cols || 8, rows = cfg.rows || 5;
      for (let c = 1; c < cols; c++) ctx.fillRect(x + (w / cols) * c - 4, y, 8, h - 128);
      for (let r = 1; r < rows; r++) ctx.fillRect(x, y + ((h - 128) / rows) * r - 4, w, 8);

      // Authentic weathered warm-toned calligraphy menu strips pasted inside ramen/izakaya windows

      if (isEmissive && !cfg.innerNeon) {
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(x, y, w, h);
      }
      ctx.restore();
    };
    drawTo(cctx, false);
    drawTo(ectx, true);
  }

    { id: 'stand_izakaya', title: '生ビール',    lines: ['¥390 税込', '焼鳥各種', '歓迎 1名様'],   bg: '#e8c438', accent: '#180e0a', lightColor: [1.0, 0.76, 0.22] }
  ];
  standList.forEach((st, i) => {
    const x = 1214 + i * 274, y = 1350, w = 264, h = 382;
    reg(st.id, x, y, w, h, { lightColor: st.lightColor, intensity: 1.72 });
    const drawS = (ctx, isEmissive) => {
      ctx.save();
      ctx.fillStyle = isEmissive ? '#000' : '#16181e'; ctx.fillRect(x, y, w, h);
      const p = 12;
      ctx.fillStyle = st.bg; ctx.fillRect(x + p, y + p, w - p * 2, h - p * 2);
      ctx.fillStyle = st.accent; ctx.fillRect(x + p, y + p, w - p * 2, 76);

      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(st.title, x + w / 2, y + p + 38);
      ctx.fillStyle = st.textCol || '#1a0e0a';
      st.lines.forEach((ln, li) => {
        ctx.font = fitText(ctx, ln, w - 40, 28, '800', FONT_GOTHIC);
        ctx.fillText(ln, x + w / 2, y + 142 + li * 68);
      });
      if (isEmissive) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x + p, y + p, w - p * 2, h - p * 2); }
      ctx.restore();
    };
    drawS(cctx, false); drawS(ectx, true);
  });

  // Upper Apartment / Office Windows
  const winList = [
    { id: 'win_dark', bg: '#0a0f18', emi: '#010306', blinds: true },
    { id: 'win_warm', bg: '#c48038', emi: '#8f5018', blinds: true },
    { id: 'win_cool', bg: '#4e84a2', emi: '#24526b', blinds: false },
    { id: 'win_dim',  bg: '#2b242c', emi: '#180f14', blinds: true }
  ];
  winList.forEach((wn, i) => {
    const x = 1214 + i * 206, y = 1756, w = 198, h = 280;
    reg(wn.id, x, y, w, h, { intensity: 1.0 });
    const drawW = (ctx, isEmissive) => {
      ctx.save();
      ctx.fillStyle = isEmissive ? '#000' : '#14171e'; ctx.fillRect(x, y, w, h);
      const p = 10;
      ctx.fillStyle = isEmissive ? wn.emi : wn.bg; ctx.fillRect(x + p, y + p, w - p * 2, h - p * 2);
      if (wn.blinds) {
        ctx.fillStyle = 'rgba(0,0,0,0.34)';
        for (let by = y + p + 8; by < y + h - p; by += 12) ctx.fillRect(x + p, by, w - p * 2, 4);
      }
      ctx.fillStyle = isEmissive ? '#000' : '#181c24';
      ctx.fillRect(x + w / 2 - 4, y, 8, h); ctx.fillRect(x, y + h * 0.55, w, 8);
      ctx.restore();
    };
    drawW(cctx, false); drawW(ectx, true);
  });

  return {
    albedo: createCanvasTexture(colCnv, { srgb: true, wrap: gl.CLAMP_TO_EDGE }),
    emissive: createCanvasTexture(emiCnv, { srgb: true, wrap: gl.CLAMP_TO_EDGE }),
    rects
  };
}

// ============================================================================
// 4. PROCEDURAL 3D TOKYO ALLEY GEOMETRY BUILDER
// ============================================================================
class MeshBuilder {
  constructor() { this.verts = []; this.indices = []; this.vCount = 0; }
  pushVert(px, py, pz, nx, ny, nz, u, v, atlasId, emiGain, flicker, sway, tr, tg, tb, roughOvr) {
    this.verts.push(px, py, pz, nx, ny, nz, u, v, atlasId, emiGain, flicker, sway, tr, tg, tb, roughOvr);
    return this.vCount++;
  }
  addQuad(p0, p1, p2, p3, n, u0, v0, u1, v1, mat, tint) {
    const [atlasId, emiGain, flicker, sway] = mat;
    const [tr, tg, tb, roughOvr] = tint;
    const i0 = this.pushVert(p0[0], p0[1], p0[2], n[0], n[1], n[2], u0, v1, atlasId, emiGain, flicker, sway, tr, tg, tb, roughOvr);
    const i1 = this.pushVert(p1[0], p1[1], p1[2], n[0], n[1], n[2], u1, v1, atlasId, emiGain, flicker, sway, tr, tg, tb, roughOvr);
    const i2 = this.pushVert(p2[0], p2[1], p2[2], n[0], n[1], n[2], u1, v0, atlasId, emiGain, flicker, sway, tr, tg, tb, roughOvr);
    const i3 = this.pushVert(p3[0], p3[1], p3[2], n[0], n[1], n[2], u0, v0, atlasId, emiGain, flicker, sway, tr, tg, tb, roughOvr);
    this.indices.push(i0, i1, i2, i0, i2, i3);
  }
  addBox(cx, cy, cz, sx, sy, sz, uvRect, mat, tint = [1, 1, 1, 0], faces = 63) {
    const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
    const x0 = cx - hx, x1 = cx + hx, y0 = cy - hy, y1 = cy + hy, z0 = cz - hz, z1 = cz + hz;
    const { u0, v0, u1, v1 } = uvRect;
    if (faces & 1)  this.addQuad([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1], [1,0,0],  u0,v0,u1,v1, mat, tint);
    if (faces & 2)  this.addQuad([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0], [-1,0,0], u0,v0,u1,v1, mat, tint);
    if (faces & 4)  this.addQuad([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0], [0,1,0],  u0,v0,u1,v1, mat, tint);
    if (faces & 8)  this.addQuad([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1], [0,-1,0], u0,v0,u1,v1, mat, tint);
    if (faces & 16) this.addQuad([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1], [0,0,1],  u0,v0,u1,v1, mat, tint);
    if (faces & 32) this.addQuad([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0], [0,0,-1], u0,v0,u1,v1, mat, tint);
  }
  addCylinder(cx, y0, y1, cz, rBot, rTop, segs, uvRect, mat, tint = [1, 1, 1, 0]) {
    const base = this.vCount;
    const [atlasId, emiGain, flicker, sway] = mat;
    const [tr, tg, tb, ro] = tint;
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const u = lerp(uvRect.u0, uvRect.u1, i / segs);
      this.pushVert(cx + ca * rBot, y0, cz + sa * rBot, ca, 0, sa, u, uvRect.v1, atlasId, emiGain, flicker, sway, tr, tg, tb, ro);
      this.pushVert(cx + ca * rTop, y1, cz + sa * rTop, ca, 0, sa, u, uvRect.v0, atlasId, emiGain, flicker, sway, tr, tg, tb, ro);
    }
    for (let i = 0; i < segs; i++) {
      const a = base + i * 2, b = a + 1, c = a + 2, d = a + 3;
      this.indices.push(a, c, d, a, d, b);
    }
  }
  addLantern(cx, cy, cz, rx, ry, uvRect, emiGain, flicker) {
    const segs = 14, rings = 10, base = this.vCount;
    for (let r = 0; r <= rings; r++) {
      const t = r / rings, phi = t * Math.PI;
      const rib = 1.0 + 0.05 * Math.sin(t * Math.PI * 9);
      const rad = Math.sin(phi) * rx * rib + 0.035 * rx;
      const py = cy + Math.cos(phi) * ry;
      const v = lerp(uvRect.v0, uvRect.v1, t);
      const sway = t * 0.024;
      for (let s = 0; s <= segs; s++) {
        const a = (s / segs) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        const nx = ca * Math.sin(phi), ny = Math.cos(phi) * 0.5, nz = sa * Math.sin(phi);
        const nl = Math.hypot(nx, ny, nz) || 1;
        this.pushVert(cx + ca * rad, py, cz + sa * rad, nx/nl, ny/nl, nz/nl, lerp(uvRect.u0, uvRect.u1, s / segs), v, 1.0, emiGain, flicker, sway, 1, 1, 1, 0);
      }
    }
    const stride = segs + 1;
    for (let r = 0; r < rings; r++) {
      for (let s = 0; s < segs; s++) {
        const a = base + r * stride + s, b = a + 1, c = a + stride, d = c + 1;
        this.indices.push(a, c, d, a, d, b);
      }
    }
  }
  addSphereLamp(cx, cy, cz, rad, emiGain, col) {
    const segs = 10, rings = 7, base = this.vCount;
    for (let r = 0; r <= rings; r++) {
      const phi = (r / rings) * Math.PI, sp = Math.sin(phi), cp = Math.cos(phi);
      for (let s = 0; s <= segs; s++) {
        const a = (s / segs) * Math.PI * 2;
        const nx = Math.cos(a) * sp, ny = cp, nz = Math.sin(a) * sp;
        this.pushVert(cx + nx * rad, cy + ny * rad, cz + nz * rad, nx, ny, nz, 0.5, 0.5, 2.0, emiGain, 0, 0, col[0], col[1], col[2], 0.1);
      }
    }
    const st = segs + 1;
    for (let r = 0; r < rings; r++) {
      for (let s = 0; s < segs; s++) {
        const a = base + r * st + s, b = a + 1, c = a + st, d = c + 1;
        this.indices.push(a, c, d, a, d, b);
      }
    }
  }
  addCable(pA, pB, sag, radius, segs = 12) {
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      pts.push([lerp(pA[0], pB[0], t), lerp(pA[1], pB[1], t) - sag * 4 * t * (1 - t), lerp(pA[2], pB[2], t)]);
    }
    const sides = 5, base = this.vCount;
    for (let i = 0; i <= segs; i++) {
      const p = pts[i], prev = pts[Math.max(0, i - 1)], next = pts[Math.min(segs, i + 1)];
      let tx = next[0] - prev[0], ty = next[1] - prev[1], tz = next[2] - prev[2];
      const tl = Math.hypot(tx, ty, tz) || 1;
      tx /= tl; ty /= tl; tz /= tl;
      let ux = 0, uy = 1, uz = 0;
      if (Math.abs(ty) > 0.9) { ux = 1; uy = 0; }
      let bx = ty * uz - tz * uy, by = tz * ux - tx * uz, bz = tx * uy - ty * ux;
      const bl = Math.hypot(bx, by, bz) || 1;
      bx /= bl; by /= bl; bz /= bl;
      ux = by * tz - bz * ty; uy = bz * tx - bx * tz; uz = bx * ty - by * tx;
      const t = i / segs, sway = 0.010 * 4 * t * (1 - t);
      for (let s = 0; s <= sides; s++) {
        const a = (s / sides) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        const nx = bx * ca + ux * sa, ny = by * ca + uy * sa, nz = bz * ca + uz * sa;
        this.pushVert(p[0] + nx * radius, p[1] + ny * radius, p[2] + nz * radius, nx, ny, nz, 0.5, 0.5, 2.0, 0, 0, sway, 0.06, 0.07, 0.09, 0.22);
      }
    }
    const st = sides + 1;
    for (let i = 0; i < segs; i++) {
      for (let s = 0; s < sides; s++) {
        const a = base + i * st + s, b = a + 1, c = a + st, d = c + 1;
        this.indices.push(a, c, d, a, d, b);
      }
    }
  }
  addAwning(xWall, side, yTop, z0, z1, depth, drop, uvSlot, tint) {
    const dir = -side, xOut = xWall + dir * depth, yOut = yTop - drop, th = 0.06;
    const hyp = Math.hypot(depth, drop), nx = dir * (drop / hyp), ny = depth / hyp;
    const mat = [0, 0, 0, 0];
    if (side < 0) {
      this.addQuad([xWall, yTop, z1], [xOut, yOut, z1], [xOut, yOut, z0], [xWall, yTop, z0], [nx, ny, 0], uvSlot.u0, uvSlot.v0, uvSlot.u1, uvSlot.v1, mat, tint);
      this.addQuad([xWall, yTop - th, z0], [xOut, yOut - th, z0], [xOut, yOut - th, z1], [xWall, yTop - th, z1], [-nx, -ny, 0], uvSlot.u0, uvSlot.v0, uvSlot.u1, uvSlot.v1, mat, [0.32,0.34,0.38,0]);
      this.addQuad([xOut, yOut - th - 0.08, z1], [xOut, yOut - th - 0.08, z0], [xOut, yOut, z0], [xOut, yOut, z1], [dir, 0, 0], uvSlot.u0, uvSlot.v0, uvSlot.u1, uvSlot.v1, mat, [0.42,0.44,0.48,0]);
    } else {
      this.addQuad([xWall, yTop, z0], [xOut, yOut, z0], [xOut, yOut, z1], [xWall, yTop, z1], [nx, ny, 0], uvSlot.u0, uvSlot.v0, uvSlot.u1, uvSlot.v1, mat, tint);
      this.addQuad([xWall, yTop - th, z1], [xOut, yOut - th, z1], [xOut, yOut - th, z0], [xWall, yTop - th, z0], [-nx, -ny, 0], uvSlot.u0, uvSlot.v0, uvSlot.u1, uvSlot.v1, mat, [0.32,0.34,0.38,0]);
      this.addQuad([xOut, yOut - th - 0.08, z0], [xOut, yOut - th - 0.08, z1], [xOut, yOut, z1], [xOut, yOut, z0], [dir, 0, 0], uvSlot.u0, uvSlot.v0, uvSlot.u1, uvSlot.v1, mat, [0.42,0.44,0.48,0]);
    }
    const strutX = xWall + dir * (depth * 0.45);
    this.addBox(strutX, yOut - 0.14, z0 - 0.12, depth * 0.82, 0.04, 0.04, uvSlot, [2,0,0,0], [0.14,0.15,0.18,0.32]);
    this.addBox(strutX, yOut - 0.14, z1 + 0.12, depth * 0.82, 0.04, 0.04, uvSlot, [2,0,0,0], [0.14,0.15,0.18,0.32]);
  }
  upload() {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.verts), gl.STATIC_DRAW);
    const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    const useU32 = this.vCount > 65535;
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, useU32 ? new Uint32Array(this.indices) : new Uint16Array(this.indices), gl.STATIC_DRAW);
    const stride = 16 * 4;
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, 24);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, stride, 32);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, stride, 48);
    gl.bindVertexArray(null);
    return { vao, count: this.indices.length, indexType: useU32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
  }
}

function archSlot(col, row) {
  const px = 0.004, py = 0.004;
  return { u0: col * 0.25 + px, v0: row / 3 + py, u1: (col + 1) * 0.25 - px, v1: (row + 1) / 3 - py };
}
const ARCH = {
  tile:     archSlot(0, 0), concrete: archSlot(1, 0), metal:   archSlot(2, 0), wood:    archSlot(3, 0),
  shutter:  archSlot(0, 1), slate:    archSlot(1, 1), ac:      archSlot(2, 1), grate:   archSlot(3, 1),
  vendSide: archSlot(0, 2), recycle:  archSlot(1, 2), meter:   archSlot(2, 2), pole:    archSlot(3, 2)
};
const SOLID_UV = { u0: 0.5, v0: 0.5, u1: 0.5, v1: 0.5 };
const LOOP_LEN = 72.0;

function buildTokyoAlleyScene(signRects) {
  const mb = new MeshBuilder();
  const lights = [];
  const steamEmitters = [];
  const halos = [];

  const bladeLeft = [
    'blade_ramen', 'blade_karaoke', 'blade_yakitori', 'blade_bar',
    'blade_sake', 'blade_arcade', 'blade_gyoza', 'blade_snack',
    'blade_sushi', 'blade_horumon', 'blade_izakaya', 'blade_coffee',
    'blade_hotel', 'blade_mahjong', 'blade_jazz', 'blade_pub'
  ];
  const bladeRight = [
    'blade_izakaya', 'blade_bar', 'blade_mahjong', 'blade_sushi',
    'blade_horumon', 'blade_coffee', 'blade_hotel', 'blade_ramen',
    'blade_jazz', 'blade_karaoke', 'blade_pub', 'blade_yakitori',
    'blade_snack', 'blade_arcade', 'blade_sake', 'blade_gyoza'
  ];
  const horizIds = ['h_ramen', 'h_izakaya', 'h_bar', 'h_cyber', 'h_sushi', 'h_yakitori'];
  const shopIds = ['shop_ramen', 'shop_izakaya', 'shop_bar', 'shop_cafe'];
  const norenIds = ['noren_red', 'noren_navy', 'noren_cream', 'noren_wine'];
  const lanternIds = ['lantern_red', 'lantern_warm', 'lantern_crimson', 'lantern_amber'];
  const standIds = ['stand_ramen', 'stand_bar', 'stand_izakaya'];
  const winIds = ['win_dark', 'win_warm', 'win_cool', 'win_dim'];
  const wallStyles = [ARCH.tile, ARCH.concrete, ARCH.slate, ARCH.metal, ARCH.tile, ARCH.concrete];

  let horizCursor = 0;

  for (const side of [-1, 1]) {
    const dir = -side;
    const frontFaceBit = side < 0 ? 1 : 2;
    const bList = side < 0 ? bladeLeft : bladeRight;
    let bCursor = 0;
    let z = side < 0 ? 0.0 : -1.4;
    const zEndLimit = side < 0 ? -LOOP_LEN : -(LOOP_LEN + 1.4);
    let bayIdx = 0;

    if (side > 0) {
      mb.addBox(2.26 + 2.75, 8.0, -0.7, 5.5, 16.0, 1.4, ARCH.concrete, [0,0,0,0], [0.76,0.78,0.82,0], 2 | 16 | 32 | 4);
    }

    while (z > zEndLimit + 0.5) {
      let bayLen = rand(4.3, 6.2);
      if (z - bayLen < zEndLimit) bayLen = z - zEndLimit;
      if (bayLen < 2.6) bayLen = z - zEndLimit;
      const z0 = z, z1 = z - bayLen, zMid = (z0 + z1) * 0.5;

      // Narrow dark side-alley alcove
      const isAlleyGap = (bayIdx === 4 && side === -1) || (bayIdx === 9 && side === 1);
      if (isAlleyGap && bayLen >= 3.2) {
        const recessX = side * 8.2, wallX = side * 2.35;
        mb.addBox((wallX + recessX) * 0.5, 7.0, z0 + 0.15, Math.abs(recessX - wallX), 14.0, 0.3, ARCH.concrete, [0,0,0,0], [0.70,0.72,0.78,0]);
        mb.addBox((wallX + recessX) * 0.5, 7.0, z1 - 0.15, Math.abs(recessX - wallX), 14.0, 0.3, ARCH.tile, [0,0,0,0], [0.68,0.70,0.76,0]);
        mb.addBox(recessX, 7.0, zMid, 0.4, 14.0, bayLen + 0.4, ARCH.slate, [0,0,0,0], [0.55,0.58,0.65,0]);
        const rSign = signRects[side < 0 ? 'blade_bar' : 'blade_karaoke'];
        const sx = side * 5.4;
        mb.addBox(sx, 3.8, zMid, 0.22, 2.3, 0.72, rSign, [1, 2.7, 1.3, 0], [1,1,1,0]);
        const lc = rSign.lightColor;
        lights.push({ x: side * 3.8, y: 3.5, z: zMid, r: lc[0], g: lc[1], b: lc[2], radius: 11.0, flicker: 1.3 });
        halos.push({ x: sx, y: 3.8, z: zMid, r: lc[0], g: lc[1], b: lc[2], size: 2.1, flicker: 1.3 });
        for (let k = 0; k < 2; k++) {
          mb.addLantern(side * (3.1 + k * 1.1), 2.85, zMid + (k - 0.5) * 0.85, 0.18, 0.30, signRects[lanternIds[(bayIdx + k) % 4]], 2.4, 0);
        }
        lights.push({ x: side * 3.2, y: 2.6, z: zMid, r: 1.0, g: 0.44, b: 0.14, radius: 8.5, flicker: 0 });
        steamEmitters.push({ x: side * 2.8, y: 0.30, z: zMid, vx: dir * 0.20, vy: 0.52, vz: 0.04, scale: 1.50, r: lc[0], g: lc[1], b: lc[2] });
        z = z1; bayIdx++;
        continue;
      }

      const wallX = side * (2.22 + rand(-0.10, 0.24));
      const bHeight = rand(12.5, 21.0);
      const bDepth = 5.5, bCenterX = wallX + side * (bDepth * 0.5);
      const wallSlot = wallStyles[(bayIdx + (side > 0 ? 3 : 0)) % wallStyles.length];
      const wallTint = [rand(0.74, 0.98), rand(0.76, 1.0), rand(0.80, 1.05), 0];

      mb.addBox(bCenterX, 3.2 + (bHeight - 3.2) * 0.5, zMid, bDepth, bHeight - 3.2, bayLen - 0.10, wallSlot, [0,0,0,0], wallTint, frontFaceBit | 16 | 32 | 4);

      for (let fy = 3.25; fy < bHeight - 1.5; fy += 3.1) {
        mb.addBox(wallX + dir * 0.09, fy, zMid, 0.20, 0.13, bayLen - 0.12, ARCH.concrete, [0,0,0,0], [0.52, 0.55, 0.60, 0]);
      }

      const isClosed = (side < 0 && bayIdx % 4 === 2) || (side > 0 && bayIdx % 4 === 3);
      const recess = isClosed ? 0.18 : 0.44;
      const shopFaceX = wallX + side * recess;
      const pillarW = 0.46;

      mb.addBox(wallX + side * 0.35, 1.6, z0 - pillarW * 0.5, 0.72, 3.2, pillarW, wallSlot, [0,0,0,0], wallTint);
      mb.addBox(wallX + side * 0.35, 1.6, z1 + pillarW * 0.5, 0.72, 3.2, pillarW, wallSlot, [0,0,0,0], wallTint);
      mb.addBox(wallX + side * (recess * 0.5), 3.12, zMid, recess + 0.1, 0.18, bayLen - pillarW * 2, ARCH.concrete, [0,0,0,0], [0.35, 0.37, 0.42, 0]);
      mb.addBox(wallX + side * (recess * 0.5), 0.06, zMid, recess + 0.16, 0.12, bayLen - pillarW * 2, ARCH.concrete, [0,0,0,0], [0.46, 0.48, 0.52, 0]);

      if (isClosed) {
        mb.addBox(shopFaceX + side * 0.1, 1.55, zMid, 0.2, 3.1, bayLen - pillarW * 2 + 0.04, ARCH.shutter, [0,0,0,0], [0.88, 0.92, 0.98, 0]);

        const vmZ = zMid + rand(-0.55, 0.55);
        const vmX = wallX + dir * 0.28, vmFaceX = vmX + dir * 0.36;
        mb.addBox(vmX, 0.96, vmZ, 0.70, 1.92, 1.06, ARCH.vendSide, [0,0,0,0], [0.92, 0.95, 1.0, 0], 63 ^ frontFaceBit);
        const vmRect = signRects['vending'];
        if (side < 0) {
          mb.addQuad([vmFaceX, 0.04, vmZ + 0.50], [vmFaceX, 0.04, vmZ - 0.50], [vmFaceX, 1.88, vmZ - 0.50], [vmFaceX, 1.88, vmZ + 0.50], [dir, 0, 0], vmRect.u0, vmRect.v0, vmRect.u1, vmRect.v1, [1, vmRect.intensity, 0, 0], [1,1,1,0]);
        } else {
          mb.addQuad([vmFaceX, 0.04, vmZ - 0.50], [vmFaceX, 0.04, vmZ + 0.50], [vmFaceX, 1.88, vmZ + 0.50], [vmFaceX, 1.88, vmZ - 0.50], [dir, 0, 0], vmRect.u0, vmRect.v0, vmRect.u1, vmRect.v1, [1, vmRect.intensity, 0, 0], [1,1,1,0]);
        }
        // Recycling bin: drop-holes ONLY on front face, plain metal casing on other faces!
        mb.addBox(vmX + dir * 0.04, 0.44, vmZ + 0.80, 0.46, 0.88, 0.46, ARCH.vendSide, [0,0,0,0], [0.60, 0.68, 0.80, 0], 63 ^ frontFaceBit);
        mb.addBox(vmX + dir * 0.04, 0.44, vmZ + 0.80, 0.46, 0.88, 0.46, ARCH.recycle, [0,0,0,0], [0.92, 0.96, 1.0, 0], frontFaceBit);
        lights.push({ x: vmFaceX + dir * 0.45, y: 1.25, z: vmZ, r: 0.65, g: 0.88, b: 1.0, radius: 7.5, flicker: 0 });
        halos.push({ x: vmFaceX + dir * 0.14, y: 1.32, z: vmZ, r: 0.62, g: 0.86, b: 1.0, size: 1.15, flicker: 0 });
      } else {
        const sId = shopIds[(bayIdx * 3 + (side > 0 ? 2 : 0)) % shopIds.length];
        const sRect = signRects[sId];
        const doorW = Math.min(bayLen - pillarW * 2 - 0.10, 3.6);
        mb.addBox(shopFaceX + side * 0.15, 1.55, zMid, 0.3, 3.1, bayLen - pillarW * 2 + 0.06, ARCH.wood, [0,0,0,0], [0.80,0.78,0.75,0]);
        const dx = shopFaceX + dir * 0.02;
        if (side < 0) {
          mb.addQuad([dx, 0.10, zMid + doorW * 0.5], [dx, 0.10, zMid - doorW * 0.5], [dx, 2.52, zMid - doorW * 0.5], [dx, 2.52, zMid + doorW * 0.5], [dir, 0, 0], sRect.u0, sRect.v0, sRect.u1, sRect.v1, [1, sRect.intensity, 0, 0], [1,1,1,0]);
        } else {
          mb.addQuad([dx, 0.10, zMid - doorW * 0.5], [dx, 0.10, zMid + doorW * 0.5], [dx, 2.52, zMid + doorW * 0.5], [dx, 2.52, zMid - doorW * 0.5], [dir, 0, 0], sRect.u0, sRect.v0, sRect.u1, sRect.v1, [1, sRect.intensity, 0, 0], [1,1,1,0]);
        }
        mb.addSphereLamp(wallX + dir * 0.16, 2.18, z0 - 0.28, 0.082, 2.5, [1.0, 0.78, 0.44]);

        const lc = sRect.lightColor;
        lights.push({ x: wallX + dir * 0.60, y: 1.50, z: zMid, r: lc[0] * 1.08, g: lc[1] * 1.08, b: lc[2] * 1.08, radius: 8.8, flicker: 0 });

        // SPLIT 3D NOREN CURTAIN (4 separate swaying fabric panels sharing one continuous banner UV so crest splits authentically across gaps!)
        if (sId === 'shop_ramen' || sId === 'shop_izakaya') {
          const nRect = signRects[norenIds[(bayIdx + (side > 0 ? 2 : 0)) % norenIds.length]];
          const nx = wallX + dir * 0.04, nW = Math.min(doorW * 0.72, 1.96);
          mb.addBox(nx, 2.38, zMid, 0.036, 0.036, nW + 0.18, ARCH.wood, [2,0,0,0], [0.26, 0.18, 0.12, 0.5]);
          const panels = 4, gap = 0.036;
          const pW = (nW - gap * (panels - 1)) / panels;
          for (let pi = 0; pi < panels; pi++) {
            const pMat = [1, 0.28, 0, 0.020 + (pi % 2) * 0.011];
            const pu0 = lerp(nRect.u0, nRect.u1, pi / panels);
            const pu1 = lerp(nRect.u0, nRect.u1, (pi + 1) / panels);
            if (side < 0) {
              // Left wall: viewer looking -X sees +Z on left, -Z on right!
              const pzLeft  = (zMid + nW * 0.5) - pi * (pW + gap);
              const pzRight = pzLeft - pW;
              mb.addQuad([nx, 1.62, pzLeft], [nx, 1.62, pzRight], [nx, 2.36, pzRight], [nx, 2.36, pzLeft], [dir, 0, 0],  pu0, nRect.v0, pu1, nRect.v1, pMat, [1,1,1,0]);
              mb.addQuad([nx, 1.62, pzRight], [nx, 1.62, pzLeft], [nx, 2.36, pzLeft], [nx, 2.36, pzRight], [-dir, 0, 0], pu1, nRect.v0, pu0, nRect.v1, pMat, [1,1,1,0]);
            } else {
              // Right wall: viewer looking +X sees -Z on left, +Z on right!
              const pzLeft  = (zMid - nW * 0.5) + pi * (pW + gap);
              const pzRight = pzLeft + pW;
              mb.addQuad([nx, 1.62, pzLeft], [nx, 1.62, pzRight], [nx, 2.36, pzRight], [nx, 2.36, pzLeft], [dir, 0, 0],  pu0, nRect.v0, pu1, nRect.v1, pMat, [1,1,1,0]);
              mb.addQuad([nx, 1.62, pzRight], [nx, 1.62, pzLeft], [nx, 2.36, pzLeft], [nx, 2.36, pzRight], [-dir, 0, 0], pu1, nRect.v0, pu0, nRect.v1, pMat, [1,1,1,0]);
            }
          }
        }

        // Occasional Red Japanese Izakaya Stool + leaning wet Tokyo vinyl umbrella outside doorway!
        if (sId === 'shop_izakaya' && bayIdx % 2 === 1) {
          const stX = wallX + dir * 0.32, stZ = z1 + 0.65;
          mb.addCylinder(stX, 0.44, 0.49, stZ, 0.16, 0.16, 10, SOLID_UV, [2,0,0,0], [0.68, 0.12, 0.10, 0.25]);
          for (const [ox, oz] of [[-0.10,-0.10],[0.10,-0.10],[-0.10,0.10],[0.10,0.10]]) {
            mb.addCylinder(stX + ox, 0.0, 0.45, stZ + oz, 0.014, 0.014, 5, SOLID_UV, [2,0,0,0], [0.55, 0.58, 0.62, 0.20]);
          }
        }
        if (sId === 'shop_ramen' && bayIdx % 2 === 0) {
          // Rolled translucent vinyl umbrella leaning against doorway pillar
          const ux = wallX + dir * 0.22, uz = z0 - 0.52;
          mb.addCylinder(ux, 0.02, 0.72, uz, 0.032, 0.048, 8, SOLID_UV, [2,0,0,0], [0.72, 0.78, 0.86, 0.12]);
          mb.addCylinder(ux, 0.72, 0.86, uz, 0.012, 0.012, 6, SOLID_UV, [2,0,0,0], [0.85, 0.85, 0.88, 0.22]);
        }

        const awnDepth = rand(0.68, 0.90);
        mb.addAwning(wallX, side, 3.05, z0 - 0.18, z1 + 0.18, awnDepth, 0.28, ARCH.metal, [0.66, 0.70, 0.78, 0]);

        const hId = horizIds[horizCursor++ % horizIds.length];
        const hRect = signRects[hId];
        const hW = Math.min(bayLen - 0.58, 3.55), hH = 0.84, hX = wallX + dir * 0.14;
        mb.addBox(wallX + dir * 0.06, 3.55, zMid, 0.15, hH + 0.06, hW + 0.06, ARCH.metal, [2,0,0,0], [0.10,0.11,0.14,0.32]);
        if (side < 0) {
          mb.addQuad([hX, 3.55 - hH * 0.5, zMid + hW * 0.5], [hX, 3.55 - hH * 0.5, zMid - hW * 0.5], [hX, 3.55 + hH * 0.5, zMid - hW * 0.5], [hX, 3.55 + hH * 0.5, zMid + hW * 0.5], [dir, 0, 0], hRect.u0, hRect.v0, hRect.u1, hRect.v1, [1, hRect.intensity, 0, 0], [1,1,1,0]);
        } else {
          mb.addQuad([hX, 3.55 - hH * 0.5, zMid - hW * 0.5], [hX, 3.55 - hH * 0.5, zMid + hW * 0.5], [hX, 3.55 + hH * 0.5, zMid + hW * 0.5], [hX, 3.55 + hH * 0.5, zMid - hW * 0.5], [dir, 0, 0], hRect.u0, hRect.v0, hRect.u1, hRect.v1, [1, hRect.intensity, 0, 0], [1,1,1,0]);
        }

        if (bayIdx % 2 === 0 || sId === 'shop_ramen' || sId === 'shop_izakaya') {
          const nLanterns = rand() < 0.55 ? 2 : 1;
          for (let li = 0; li < nLanterns; li++) {
            const lz = nLanterns === 1 ? (zMid + rand(-0.85, 0.85)) : (zMid + (li === 0 ? -1.02 : 1.02));
            const lx = wallX + dir * (awnDepth * 0.72), ly = 2.28 + rand(-0.08, 0.08);
            const ltRect = signRects[lanternIds[(bayIdx + li * 2) % lanternIds.length]];
            mb.addCylinder(lx, ly + 0.27, 2.84, lz, 0.01, 0.01, 5, SOLID_UV, [2,0,0,0], [0.1,0.1,0.12,0.5]);
            mb.addLantern(lx, ly, lz, 0.155, 0.265, ltRect, ltRect.intensity, 0);
            if (li === 0) {
              const c = ltRect.lightColor;
              lights.push({ x: lx + dir * 0.22, y: ly, z: lz, r: c[0] * 1.1, g: c[1] * 1.1, b: c[2] * 1.1, radius: 6.5, flicker: 0 });
              halos.push({ x: lx, y: ly, z: lz, r: c[0], g: c[1], b: c[2], size: 0.82, flicker: 0 });
            }
          }
        }

        if (bayIdx % 3 === 0) {
          const stRect = signRects[standIds[(bayIdx + (side > 0 ? 1 : 0)) % standIds.length]];
          const stZ = z0 - 0.70, stX = wallX + dir * 0.50;
          mb.addBox(stX, 0.52, stZ, 0.16, 1.02, 0.52, ARCH.metal, [2,0,0,0], [0.12,0.13,0.16,0.3]);
          mb.addQuad([stX - 0.21, 0.10, stZ + 0.09], [stX + 0.21, 0.10, stZ + 0.09], [stX + 0.21, 0.96, stZ + 0.09], [stX - 0.21, 0.96, stZ + 0.09], [0, 0, 1], stRect.u0, stRect.v0, stRect.u1, stRect.v1, [1, stRect.intensity, 0, 0], [1,1,1,0]);
          mb.addQuad([stX + 0.21, 0.10, stZ - 0.09], [stX - 0.21, 0.10, stZ - 0.09], [stX - 0.21, 0.96, stZ - 0.09], [stX + 0.21, 0.96, stZ - 0.09], [0, 0, -1], stRect.u0, stRect.v0, stRect.u1, stRect.v1, [1, stRect.intensity, 0, 0], [1,1,1,0]);
        }

        // Kitchen Exhaust Vent + Asymmetric Rising Wispy Steam Plume
        if (sId === 'shop_ramen' || (bayIdx % 5 === 1 && side < 0) || (bayIdx % 5 === 3 && side > 0)) {
          const exZ = z1 + 0.55, exX = wallX + dir * 0.22;
          mb.addBox(exX, 2.38, exZ, 0.44, 0.40, 0.50, ARCH.metal, [0,0,0,0], [0.76, 0.80, 0.88, 0]);
          mb.addBox(wallX + dir * 0.14, 5.8, exZ, 0.25, 6.8, 0.28, ARCH.metal, [0,0,0,0], [0.72, 0.76, 0.84, 0]);
          steamEmitters.push({
            x: exX + dir * 0.30, y: 2.22, z: exZ,
            vx: dir * 0.28, vy: 0.60, vz: rand(-0.08, 0.08),
            scale: 1.42, r: lc[0], g: lc[1], b: lc[2]
          });
        }
      }

      // STREET-LEVEL CLUTTER & INFRASTRUCTURE (Face-specific UV mapping so NO repeated grilles/dials on side faces!)
      if (bayIdx % 3 === 1) {
        const crZ = z1 + 0.52, crX = wallX + dir * 0.24;
        const crateColors = [[0.72, 0.14, 0.12], [0.84, 0.64, 0.12], [0.14, 0.36, 0.72]];
        const nStack = randInt(2, 3);
        for (let k = 0; k < nStack; k++) {
          const cc = crateColors[(bayIdx + k) % 3];
          mb.addBox(crX + rand(-0.02, 0.02), 0.16 + k * 0.32, crZ + rand(-0.02, 0.02), 0.38, 0.31, 0.46, ARCH.grate, [0,0,0,0], [cc[0], cc[1], cc[2], 0]);
        }
      }
      // AC Units: circular fan grille ONLY on alley-facing front face, clean sheet metal on sides & top!
      const nAC = randInt(1, 2);
      for (let ai = 0; ai < nAC; ai++) {
        const acY = ai === 0 && rand() < 0.45 ? 0.34 : rand(3.8, 9.0);
        const acZ = lerp(z0 - 0.7, z1 + 0.7, (ai + 0.3) / nAC);
        const acX = wallX + dir * 0.22;
        mb.addBox(acX, acY, acZ, 0.40, 0.58, 0.76, ARCH.vendSide, [0,0,0,0], [0.78, 0.77, 0.74, 0], 63 ^ frontFaceBit);
        mb.addBox(acX, acY, acZ, 0.40, 0.58, 0.76, ARCH.ac, [0,0,0,0], [0.86, 0.85, 0.82, 0], frontFaceBit);
        if (acY > 1.0) {
          mb.addBox(acX, acY - 0.32, acZ - 0.26, 0.42, 0.04, 0.04, ARCH.metal, [2,0,0,0], [0.18,0.20,0.24,0.38]);
          mb.addBox(acX, acY - 0.32, acZ + 0.26, 0.42, 0.04, 0.04, ARCH.metal, [2,0,0,0], [0.18,0.20,0.24,0.38]);
        }
      }
      // Vertical rain downspouts, conduit bundle, and Meter Box (window ONLY on front face!)
      const pipeX = wallX + dir * 0.06;
      mb.addCylinder(pipeX, 0.0, bHeight - 0.5, z0 - 0.16, 0.055, 0.055, 6, SOLID_UV, [2,0,0,0], [0.22, 0.24, 0.28, 0.22]);
      mb.addCylinder(pipeX, 0.0, bHeight * 0.72, z0 - 0.28, 0.028, 0.028, 5, SOLID_UV, [2,0,0,0], [0.30, 0.28, 0.26, 0.30]);
      mb.addBox(wallX + dir * 0.11, 1.65, z0 - 0.26, 0.20, 0.44, 0.30, ARCH.vendSide, [0,0,0,0], [0.65, 0.68, 0.72, 0], 63 ^ frontFaceBit);
      mb.addBox(wallX + dir * 0.11, 1.65, z0 - 0.26, 0.20, 0.44, 0.30, ARCH.meter, [0,0,0,0], [0.92, 0.94, 0.98, 0], frontFaceBit);

      if (bayIdx % 2 === 0) {
        const gX = side * 1.84;
        mb.addBox(gX, 0.008, zMid, 0.34, 0.02, 1.15, ARCH.grate, [0,0,0,0], [0.64, 0.68, 0.74, 0]);
        if ((side < 0 && bayIdx % 6 === 2) || (side > 0 && bayIdx % 6 === 5)) {
          steamEmitters.push({
            x: gX + dir * 0.14, y: 0.08, z: zMid,
            vx: dir * 0.11, vy: 0.48, vz: 0.05,
            scale: 1.40, r: 0.74, g: 0.82, b: 0.96
          });
        }
      }

      if (bayIdx % 5 === 3) {
        const bX = side * 1.70;
        mb.addCylinder(bX, 0.0, 0.76, z0 - 0.45, 0.052, 0.052, 8, SOLID_UV, [2,0,0,0], [0.80, 0.66, 0.12, 0.24]);
        mb.addCylinder(bX, 0.50, 0.60, z0 - 0.45, 0.056, 0.056, 8, SOLID_UV, [2,0,0,0], [0.10, 0.10, 0.12, 0.30]);
      }

      // PROTRUDING VERTICAL NEON BLADE SIGNS
      const nBlades = (bayIdx % 3 === 2) ? 1 : 2;
      for (let bi = 0; bi < nBlades; bi++) {
        const bId = bList[bCursor++ % bList.length];
        const bRect = signRects[bId];
        const bH = bi === 0 ? rand(2.25, 3.35) : rand(2.75, 4.25);
        const bW = rand(0.66, 0.92), bThick = 0.18;
        const proj = bi === 0 ? rand(0.74, 1.14) : rand(0.90, 1.34);
        const sY = bi === 0 ? rand(4.35, 6.15) : rand(7.6, 11.4);
        if (sY + bH * 0.5 > bHeight - 0.4) continue;
        const sZ = bi === 0 ? (zMid + rand(-0.6, 0.8)) : (zMid + rand(-1.4, -0.1));
        // Keep clean clearance zone around overhead alley arches (z = -22.5, -58.5) so arches never clip!
        if ((Math.abs(sZ - (-22.5)) < 2.2 || Math.abs(sZ - (-58.5)) < 2.2) && sY > 4.0 && sY < 8.4) continue;
        const sX = wallX + dir * proj;

        const strutLen = proj - bW * 0.5 + 0.1, strutX = wallX + dir * (strutLen * 0.5);
        mb.addBox(strutX, sY + bH * 0.34, sZ, strutLen, 0.055, 0.055, ARCH.metal, [2,0,0,0], [0.12,0.13,0.17,0.35]);
        mb.addBox(strutX, sY - bH * 0.34, sZ, strutLen, 0.055, 0.055, ARCH.metal, [2,0,0,0], [0.12,0.13,0.17,0.35]);
        mb.addBox(sX, sY, sZ, bW + 0.05, bH + 0.05, bThick, ARCH.metal, [2,0,0,0], [0.09,0.10,0.13,0.30], 1 | 2 | 4 | 8);

        const flick = ((bCursor + (side > 0 ? 2 : 0)) % 6 === 0) ? (1.0 + bCursor * 0.83) : 0.0;
        const emi = bRect.intensity * rand(0.92, 1.16);
        const xL = sX - bW * 0.5, xR = sX + bW * 0.5, yB = sY - bH * 0.5, yT = sY + bH * 0.5;
        const zF = sZ + bThick * 0.5 + 0.005, zB = sZ - bThick * 0.5 - 0.005;
        mb.addQuad([xL, yB, zF], [xR, yB, zF], [xR, yT, zF], [xL, yT, zF], [0, 0, 1],  bRect.u0, bRect.v0, bRect.u1, bRect.v1, [1, emi, flick, 0], [1,1,1,0]);
        mb.addQuad([xR, yB, zB], [xL, yB, zB], [xL, yT, zB], [xR, yT, zB], [0, 0, -1], bRect.u0, bRect.v0, bRect.u1, bRect.v1, [1, emi, flick, 0], [1,1,1,0]);

        const lc = bRect.lightColor, power = bi === 0 ? 1.28 : 0.98;
        lights.push({ x: sX + dir * 0.25, y: sY, z: sZ, r: lc[0] * power, g: lc[1] * power, b: lc[2] * power, radius: bi === 0 ? 12.0 : 14.0, flicker: flick });
        halos.push({ x: sX, y: sY, z: sZ, r: lc[0], g: lc[1], b: lc[2], size: Math.max(bW, bH) * 0.66, flicker: flick });
      }

      // UPPER FLOOR WINDOWS & BALCONIES
      for (let wy = 4.9; wy < bHeight - 1.6; wy += 3.1) {
        const nWin = Math.max(1, Math.floor((bayLen - 0.9) / 1.75));
        for (let wi = 0; wi < nWin; wi++) {
          const wz = lerp(z0 - 1.0, z1 + 1.0, nWin === 1 ? 0.5 : wi / (nWin - 1));
          const wId = rand() < 0.56 ? 'win_dark' : pick(winIds);
          const wRect = signRects[wId];
          const winW = 1.05, winH = 1.38, wx = wallX + dir * 0.03;
          mb.addBox(wallX + dir * 0.08, wy - winH * 0.5 - 0.05, wz, 0.22, 0.08, winW + 0.16, ARCH.concrete, [0,0,0,0], [0.46,0.48,0.52,0]);
          const wEmi = wId === 'win_dark' ? 0.04 : (wId === 'win_warm' ? 1.05 : 0.78);
          if (side < 0) {
            mb.addQuad([wx, wy - winH * 0.5, wz + winW * 0.5], [wx, wy - winH * 0.5, wz - winW * 0.5], [wx, wy + winH * 0.5, wz - winW * 0.5], [wx, wy + winH * 0.5, wz + winW * 0.5], [dir, 0, 0], wRect.u0, wRect.v0, wRect.u1, wRect.v1, [1, wEmi, 0, 0], [1,1,1,0]);
          } else {
            mb.addQuad([wx, wy - winH * 0.5, wz - winW * 0.5], [wx, wy - winH * 0.5, wz + winW * 0.5], [wx, wy + winH * 0.5, wz + winW * 0.5], [wx, wy + winH * 0.5, wz - winW * 0.5], [dir, 0, 0], wRect.u0, wRect.v0, wRect.u1, wRect.v1, [1, wEmi, 0, 0], [1,1,1,0]);
          }
        }
        if ((bayIdx + Math.floor(wy)) % 4 === 0) {
          const rx = wallX + dir * 0.42;
          mb.addBox(wallX + dir * 0.22, wy - 0.72, zMid, 0.48, 0.07, bayLen - 0.65, ARCH.metal, [2,0,0,0], [0.14,0.16,0.20,0.35]);
          mb.addBox(rx, wy - 0.05, zMid, 0.04, 0.04, bayLen - 0.65, ARCH.metal, [2,0,0,0], [0.16,0.18,0.22,0.30]);
          for (let rz = z1 + 0.4; rz <= z0 - 0.4; rz += 0.42) {
            mb.addBox(rx, wy - 0.38, rz, 0.025, 0.68, 0.025, ARCH.metal, [2,0,0,0], [0.14,0.16,0.20,0.35]);
          }

      }
