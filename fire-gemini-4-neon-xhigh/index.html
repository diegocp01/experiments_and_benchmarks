// 6. COMPOSITE SMOKE (WITH DEPTH-AWARE SOFT SMOOTHING) ONTO SCENE
// ============================================================================
const COMPOSITE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uSceneTex;
uniform sampler2D uSmokeTex;
uniform sampler2D uDepthTex;
uniform vec2 uSmokeTexel;
uniform vec2 uNearFar;

float linD(float d) {
  float z = d * 2.0 - 1.0;
  return (2.0 * uNearFar.x * uNearFar.y) / (uNearFar.y + uNearFar.x - z * (uNearFar.y - uNearFar.x));
}

void main() {
  vec3 scene = texture(uSceneTex, vUv).rgb;
  float centerD = linD(texture(uDepthTex, vUv).r);

  // 5-tap depth-aware bilateral upsample of volumetric smoke (zero haloing around silhouetted pines!)
  vec4 acc = vec4(0.0);
  float wSum = 0.0;
  vec2 offs[5] = vec2[5](
    vec2(0.0, 0.0),
    vec2(-1.0, 0.0), vec2(1.0, 0.0),
    vec2(0.0, -1.0), vec2(0.0, 1.0)
  );
  float kW[5] = float[5](0.40, 0.15, 0.15, 0.15, 0.15);
  for (int i = 0; i < 5; i++) {
    vec2 suv = vUv + offs[i] * uSmokeTexel;
    float sd = linD(texture(uDepthTex, suv).r);
    float dw = exp(-abs(sd - centerD) / max(35.0, centerD * 0.18));
    float w = kW[i] * dw;
    acc += texture(uSmokeTex, suv) * w;
    wSum += w;
  }
  vec4 smoke = acc / max(wSum, 0.0001);

  vec3 outCol = scene * smoke.a + smoke.rgb;
  fragColor = vec4(outCol, 1.0);
}`;

// ============================================================================
// 7. GPU 3D RISING EMBERS & SPARK STREAKS (~4,200 Particles)
// ============================================================================
function createEmberSystem() {
  const COUNT = 4200;
  const rng = mulberry32(99103);
  // Each ember: origin(3), phaseLifeSizeClass(4)
  // Using instanced quad (4 verts, 6 indices) so we can orient velocity-aligned motion streaks in VS!
  const qVerts = new Float32Array([-1, -1,  1, -1,  1, 1,  -1, 1]);
  const qIdx = new Uint16Array([0, 1, 2, 0, 2, 3]);

  const data = new Float32Array(COUNT * 8);
  let p = 0;
  for (let i = 0; i < COUNT; i++) {
    const rClass = rng();
    let ox, oy, oz, life, size, kind;
    if (rClass < 0.62) {
      // Kind 0: Dense ridge eruption sparks shooting up from active ridge hotspots!
      const node = fireNodes[Math.floor(rng() * NUM_FIRE_LIGHTS)];
      ox = node.x + (rng() - 0.5) * 95.0;
      oz = ridgeCurveZ(ox) + (rng() - 0.35) * 55.0;
      oy = sampleHeightBilinear(ox, oz) + 3.0 + rng() * 14.0;
      life = lerp(6.5, 16.0, rng());
      size = lerp(0.55, 1.45, rng());
      kind = 0.0;
    } else if (rClass < 0.90) {
      // Kind 1: High/mid-air wind-carried glowing firebrands drifting across valley sky!
      const node = fireNodes[Math.floor(rng() * NUM_FIRE_LIGHTS)];
      ox = node.x + (rng() - 0.5) * 140.0;
      oz = ridgeCurveZ(ox) + (rng() - 0.3) * 80.0;
      oy = sampleHeightBilinear(ox, oz) + 8.0 + rng() * 25.0;
      life = lerp(14.0, 28.0, rng());
      size = lerp(0.75, 1.85, rng());
      kind = 1.0;
    } else {
      // Kind 2: Near-camera hero valley embers (toroidal volume wrapped around camera!)
      ox = (rng() - 0.5) * 180.0;
      oy = rng() * 58.0;
      oz = (rng() - 0.5) * 180.0;
      life = lerp(9.0, 18.0, rng());
      size = lerp(0.11, 0.26, rng());
      kind = 2.0;
    }
    const phase = rng();
    const seed = rng();
    data[p++] = ox; data[p++] = oy; data[p++] = oz; data[p++] = life;
    data[p++] = phase; data[p++] = size; data[p++] = kind; data[p++] = seed;
  }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vboQ = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboQ);
  gl.bufferData(gl.ARRAY_BUFFER, qVerts, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, qIdx, gl.STATIC_DRAW);

  const vboI = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboI);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
  gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
  gl.vertexAttribDivisor(2, 1);
  gl.bindVertexArray(null);

  return { vao, count: COUNT };
}

const EMBER_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aQuad;
layout(location=1) in vec4 aOriginLife; // ox, oy, oz, life
layout(location=2) in vec4 aMeta;       // phase, size, kind, seed

uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform vec2 uViewport;
uniform float uTime;

out vec2 vUv;
out float vHeat;
out float vFlicker;
out float vKind;
out float vBokeh;

vec3 emberPos(vec3 orig, float age, float kind, float seed) {
  float a1 = seed * 6.28318;
  float a2 = fract(seed * 17.31) * 6.28318;
  if (kind > 1.5) {
    // Near-camera valley firebrands drifting lazily across the valley air in 3D wrap volume
    vec3 vel = vec3(5.2 + 2.8 * sin(a1), 0.75 + 0.65 * cos(a2), 1.8 + 1.4 * sin(a1 + a2));
    vec3 p = orig + vel * uTime;
    p.x += sin(uTime * 0.85 + a1 + p.y * 0.08) * 3.8;
    p.y += sin(uTime * 1.15 + a2 + p.x * 0.06) * 2.2;
    p.z += cos(uTime * 0.75 + a1 * 1.7) * 2.8;
    // Toroidal wrap around drifting camera
    vec3 rel = mod(p - uCamPos + vec3(90.0, 12.0, 90.0), vec3(180.0, 62.0, 180.0)) - vec3(90.0, 12.0, 90.0);
    return uCamPos + rel;
  } else {
    // Rising thermal column + wind shear + turbulent swirl!
    float updraft = (kind < 0.5 ? 20.5 : 15.0) * (0.72 + 0.56 * fract(seed * 7.13));
    float rise = updraft * age * exp(-age * 0.042);
    // Prevailing mountain wind carries embers diagonally (+X, gently +Z toward valley!)
    float windX = (kind < 0.5 ? 11.5 : 22.0) * pow(age, 1.16) * (0.75 + 0.5 * fract(seed * 11.7));
    float windZ = (kind < 0.5 ? 4.8 : 13.5) * pow(age, 1.12) * (0.65 + 0.7 * fract(seed * 5.3));
    // Swirling convective curl eddies
    float swirlR = (4.5 + age * 1.85) * (0.5 + 0.8 * fract(seed * 3.7));
    float swirlX = sin(age * 1.35 + a1) * swirlR + cos(age * 2.6 + a2) * swirlR * 0.35;
    float swirlY = cos(age * 1.75 + a2) * (2.2 + age * 0.45);
    float swirlZ = cos(age * 1.25 + a1) * swirlR * 0.85;
    return orig + vec3(windX + swirlX, rise + swirlY, windZ + swirlZ);
  }
}

void main() {
  float life = aOriginLife.w;
  float phase = aMeta.x;
  float size = aMeta.y;
  float kind = aMeta.z;
  float seed = aMeta.w;

  float age = mod(uTime + phase * life, life);
  float ageFrac = age / life;

  vec3 pos = emberPos(aOriginLife.xyz, age, kind, seed);
  vec3 posNext = emberPos(aOriginLife.xyz, age + 0.045, kind, seed);

  vec4 clip0 = uViewProj * vec4(pos, 1.0);
  vec4 clip1 = uViewProj * vec4(posNext, 1.0);

  // Reject behind camera
  if (clip0.w <= 0.4) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  vec2 ndc0 = clip0.xy / clip0.w;
  vec2 ndc1 = clip1.xy / max(clip1.w, 0.1);
  vec2 velPx = (ndc1 - ndc0) * uViewport * 0.5;
  float speedPx = length(velPx);

  // Subtle velocity-aligned cinema shutter motion streak!
  vec2 dirPx = speedPx > 0.15 ? (velPx / speedPx) : vec2(0.0, 1.0);
  vec2 perpPx = vec2(-dirPx.y, dirPx.x);

  float dist = length(pos - uCamPos);
  // Perspective pixel radius with minimum visibility floor for distant ridge sparks
  float basePx = clamp((size / max(dist, 2.0)) * uViewport.y * 0.92, 1.15, 22.0);
  // Near-camera hero embers get gentle photographic out-of-focus bokeh!
  float bokeh = kind > 1.5 ? smoothstep(26.0, 4.5, dist) : 0.0;
  basePx *= (1.0 + bokeh * 2.2);

  float stretchPx = min(speedPx * 0.65, basePx * 4.2);
  vec2 offsetPx = dirPx * (aQuad.y * (basePx + stretchPx)) + perpPx * (aQuad.x * basePx);

  gl_Position = clip0;
  gl_Position.xy += (offsetPx / (uViewport * 0.5)) * clip0.w;

  vUv = aQuad;
  vKind = kind;
  vBokeh = bokeh;

  // Temperature cools as ember rises & ages (incandescent yellow-white -> orange -> deep red)
  if (kind > 1.5) {
    float edgeFade = smoothstep(88.0, 62.0, max(abs(pos.x - uCamPos.x), abs(pos.z - uCamPos.z)));
    vHeat = (0.55 + 0.45 * sin(uTime * 1.8 + seed * 41.0)) * edgeFade;
  } else {
    float fadeIn = smoothstep(0.0, 0.06, ageFrac);
    float fadeOut = smoothstep(1.0, 0.68, ageFrac);
    vHeat = (1.12 - ageFrac * 0.72) * fadeIn * fadeOut;
  }

  // Rapid chaotic tumble-glint flicker!
  float fl = 0.52 + 0.48 * sin(uTime * (9.0 + seed * 14.0) + seed * 67.0);
  vFlicker = 0.45 + 0.85 * fl * fl;
}`;

const EMBER_FS = `#version 300 es
precision highp float;
in vec2 vUv;
in float vHeat;
in float vFlicker;
in float vKind;
in float vBokeh;
out vec4 fragColor;

${GLSL_COMMON}

void main() {
  float r2 = dot(vUv, vUv);
  if (r2 > 1.0) discard;

  // Soft glowing core; soft optical bokeh disk for near-camera hero embers!
  float core = mix(exp(-r2 * 5.2), smoothstep(1.0, 0.25, r2) * 0.65 + exp(-r2 * 3.5) * 0.35, vBokeh);
  float inten = core * vHeat * vFlicker;
  if (inten < 0.01) discard;

  vec3 col = fireBlackbody(clamp(vHeat * 0.95 + 0.15, 0.0, 1.18)) * (vKind > 1.5 ? 1.45 : 1.75);
  fragColor = vec4(col * inten, inten);
}`;

// ============================================================================
// 8. GPU 3D FALLING ASH FLAKES (~2,600 Particles, Toroidal Valley Volume)
// ============================================================================
function createAshSystem() {
  const COUNT = 2600;
  const rng = mulberry32(314159);
  const qVerts = new Float32Array([-1, -1,  1, -1,  1, 1,  -1, 1]);
  const qIdx = new Uint16Array([0, 1, 2, 0, 2, 3]);

  const data = new Float32Array(COUNT * 8);
  let p = 0;
  for (let i = 0; i < COUNT; i++) {
    data[p++] = (rng() - 0.5) * 140.0; // ox
    data[p++] = rng() * 54.0;          // oy
    data[p++] = (rng() - 0.5) * 140.0; // oz
    data[p++] = lerp(0.055, 0.155, rng()); // flake physical radius in meters
    data[p++] = rng();                 // seedA
    data[p++] = rng();                 // seedB
    data[p++] = lerp(0.65, 1.55, rng()); // fallSpeed
    data[p++] = rng() * 6.28318;       // initAngle
  }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vboQ = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboQ);
  gl.bufferData(gl.ARRAY_BUFFER, qVerts, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, qIdx, gl.STATIC_DRAW);

  const vboI = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboI);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
  gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2);
  gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
  gl.vertexAttribDivisor(2, 1);
  gl.bindVertexArray(null);

  return { vao, count: COUNT };
}

const ASH_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aQuad;
layout(location=1) in vec4 aOriginSize; // ox, oy, oz, size
layout(location=2) in vec4 aMeta;       // seedA, seedB, fallSpeed, initAng

uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform vec2 uViewport;
uniform float uTime;

out vec2 vUv;
out float vSeed;
out float vTumble;
out float vAlpha;

void main() {
  float seedA = aMeta.x;
  float seedB = aMeta.y;
  float fallSpd = aMeta.z;
  float ang = aMeta.w + uTime * (1.2 + seedA * 2.4) * (seedB > 0.5 ? 1.0 : -1.0);

  // Slow downward rain of weightless ash + lateral valley breeze + fluttering side-slip!
  vec3 pos = aOriginSize.xyz;
  pos.x += uTime * (2.6 + seedA * 1.4) + sin(uTime * (0.9 + seedB * 0.8) + seedA * 25.0) * 2.1;
  pos.y -= uTime * fallSpd;
  pos.z += uTime * (1.1 + seedB * 0.9) + cos(uTime * (0.8 + seedA * 0.7) + seedB * 19.0) * 1.6;

  // Seamless 3D toroidal wrap around camera (visible in full 360°!)
  vec3 box = vec3(135.0, 52.0, 135.0);
  vec3 rel = mod(pos - uCamPos + vec3(box.x * 0.5, 10.0, box.z * 0.5), box) - vec3(box.x * 0.5, 10.0, box.z * 0.5);
  vec3 wp = uCamPos + rel;

  vec4 clip = uViewProj * vec4(wp, 1.0);
  if (clip.w <= 1.2) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  float dist = length(rel);
  float pxR = clamp((aOriginSize.w / max(dist, 1.8)) * uViewport.y * 0.85, 0.95, 11.0);

  // 3D tumbling foreshortening (flat charred flake flipping end-over-end!)
  float tumble = 0.28 + 0.72 * abs(sin(uTime * (1.8 + seedB * 2.5) + seedA * 31.0));
  float ca = cos(ang), sa = sin(ang);
  vec2 qRot = vec2(
    aQuad.x * ca - aQuad.y * tumble * sa,
    aQuad.x * sa + aQuad.y * tumble * ca
  );

  gl_Position = clip;
  gl_Position.xy += (qRot * pxR / (uViewport * 0.5)) * clip.w;

  // Soft distance fade (avoid harsh pop near lens or box edge)
  float nearFade = smoothstep(1.8, 5.5, dist);
  float farFade = smoothstep(64.0, 24.0, dist);
  vUv = aQuad;
  vSeed = seedA;
  vTumble = tumble;
  vAlpha = nearFade * farFade * (0.45 + 0.45 * seedB);
}`;

const ASH_FS = `#version 300 es
precision highp float;
in vec2 vUv;
in float vSeed;
in float vTumble;
in float vAlpha;
out vec4 fragColor;

uniform float uGlobalFlicker;

void main() {
  // Irregular angular charred flake silhouette (distinct from circular sparks!)
  float a = atan(vUv.y, vUv.x);
  float r = length(vUv);
  float edge = 0.68 + 0.24 * sin(a * 3.0 + vSeed * 19.0) + 0.14 * cos(a * 5.0 - vSeed * 31.0);
  float mask = smoothstep(edge, edge - 0.22, r);
  if (mask < 0.02) discard;

  // Pale charred ash gray catching gentle warm amber glint from the distant wildfire!
  vec3 coolAsh = vec3(0.18, 0.17, 0.18);
  vec3 fireGlint = vec3(0.56, 0.24, 0.09) * (0.8 + 0.28 * uGlobalFlicker);
  vec3 col = mix(coolAsh, fireGlint, 0.35 + 0.55 * vTumble);

  float al = mask * vAlpha * 0.78;
  fragColor = vec4(col, al);
}`;

// 9. HDR MULTI-SCALE OPTICAL BLOOM & ACES FILMIC POST-PROCESSING
// ============================================================================
const BLOOM_EXTRACT_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;

void main() {
  vec3 col = texture(uTex, vUv).rgb;
  // Soft-knee threshold targeting blazing flames, hot ridge embers, and incandescent sparks
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float thresh = 0.55;
  float knee = 0.45;
  float soft = clamp(lum - thresh + knee, 0.0, 2.0 * knee);
  soft = (soft * soft) / (4.0 * knee + 0.0001);
  float contrib = max(soft, lum - thresh) / max(lum, 0.0001);
  fragColor = vec4(col * max(contrib, 0.0), 1.0);
}`;

const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uDir; // texelStep * axis

void main() {
  // 9-tap Gaussian filter
  vec3 sum = texture(uTex, vUv).rgb * 0.227027;
  sum += texture(uTex, vUv + uDir * 1.384615).rgb * 0.316216;
  sum += texture(uTex, vUv - uDir * 1.384615).rgb * 0.316216;
  sum += texture(uTex, vUv + uDir * 3.230769).rgb * 0.070270;
  sum += texture(uTex, vUv - uDir * 3.230769).rgb * 0.070270;
  fragColor = vec4(sum, 1.0);
}`;

const POST_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uSceneTex;
uniform sampler2D uBloom1;
uniform sampler2D uBloom2;
uniform sampler2D uBloom3;
uniform sampler2D uBloom4;
uniform float uTime;
uniform vec2 uResolution;

${GLSL_COMMON}

// Refined ACES Filmic tone mapping (smooth incandescent highlight roll-off, rich cinema shadows)
vec3 acesFilmic(vec3 x) {
  const mat3 m1 = mat3(
    0.59719, 0.07600, 0.02840,
    0.35458, 0.90834, 0.13383,
    0.04823, 0.01566, 0.83777
  );
  const mat3 m2 = mat3(
    1.60475, -0.10208, -0.00327,
    -0.53108,  1.10813, -0.07276,
    -0.07367, -0.00605,  1.07602
  );
  vec3 v = m1 * x;
  vec3 a = v * (v + 0.0245786) - 0.000090537;
  vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
  return clamp(m2 * (a / b), 0.0, 1.0);
}

void main() {
  vec3 col = texture(uSceneTex, vUv).rgb;

  // Multi-scale cinema bloom: tight glowing flame edge + wide atmospheric amber lens halation!
  vec3 b1 = texture(uBloom1, vUv).rgb;
  vec3 b2 = texture(uBloom2, vUv).rgb;
  vec3 b3 = texture(uBloom3, vUv).rgb;
  vec3 b4 = texture(uBloom4, vUv).rgb;
  vec3 bloom = b1 * 0.22 + b2 * 0.24 + b3 * 0.20 + b4 * 0.16;
  // Subtle warm film halation tint on widest bloom halo
  col += bloom * vec3(1.06, 0.88, 0.72) * 0.58;

  // Exposure tuned for moody high-ISO nocturnal cinema look
  col *= 1.18;

  // Subtle natural optical lens vignette
  vec2 centered = (vUv - 0.5) * vec2(uResolution.x / max(uResolution.y, 1.0), 1.0);
  float vig = 1.0 - smoothstep(0.45, 1.38, length(centered)) * 0.34;
  col *= vig;

  // ACES Filmic tone map
  col = acesFilmic(col);

  // Subtle shadow-grade lift so deep valley shadows stay rich dark charcoal-indigo instead of flat black
  col = mix(vec3(0.005, 0.007, 0.011), col, 0.985);

  // Gamma 2.2 encoding
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));

  // Fine organic 35mm cinema film grain (eliminates any 8-bit gradient banding in dark sky/smoke!)
  float grain = (hash12(gl_FragCoord.xy + fract(uTime * 19.37) * 137.0) - 0.5) * 0.022;
  col = clamp(col + grain, 0.0, 1.0);

  fragColor = vec4(col, 1.0);
}`;

// ============================================================================
// FRAMEBUFFERS (HDR Scene + Depth, Smoke Volume, Composited HDR, 4-Level Bloom Pyramid)
// ============================================================================
function createTex2D(w, h, internalFmt, fmt, type, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFmt, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function createFBO(w, h, withDepthTex, withDepthRB) {
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  const filter = (HDR_TYPE === gl.HALF_FLOAT && !extFloatLinear) ? gl.LINEAR : gl.LINEAR;
  const colTex = createTex2D(w, h, HDR_INTERNAL, gl.RGBA, HDR_TYPE, filter);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colTex, 0);
  let depthTex = null, depthRB = null;
  if (withDepthTex) {
    depthTex = createTex2D(w, h, gl.DEPTH_COMPONENT24, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, gl.NEAREST);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, depthTex, 0);
  } else if (withDepthRB) {
    depthRB = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depthRB);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depthRB);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, colTex, depthTex, depthRB, w, h };
}

function destroyFBO(f) {
  if (!f) return;
  gl.deleteFramebuffer(f.fbo);
  gl.deleteTexture(f.colTex);
  if (f.depthTex) gl.deleteTexture(f.depthTex);
  if (f.depthRB) gl.deleteRenderbuffer(f.depthRB);
}

let fboScene = null, fboSmoke = null, fboComp = null;
let bloomA = [], bloomB = [];
let viewW = 0, viewH = 0;

function resizeBuffers() {
  const dpr = Math.min(window.devicePixelRatio || 1, PARAM_FREEZE ? 1.0 : 1.75);
  const w = Math.max(2, Math.floor(window.innerWidth * dpr));
  const h = Math.max(2, Math.floor(window.innerHeight * dpr));
  if (w === viewW && h === viewH) return;
  viewW = w; viewH = h;
  canvas.width = w;
  canvas.height = h;

  destroyFBO(fboScene);
  destroyFBO(fboSmoke);
  destroyFBO(fboComp);
  bloomA.forEach(destroyFBO);
  bloomB.forEach(destroyFBO);
  bloomA = []; bloomB = [];

  fboScene = createFBO(w, h, true, false);
  const sw = Math.max(2, Math.floor(w * 0.58));
  const sh = Math.max(2, Math.floor(h * 0.58));
  fboSmoke = createFBO(sw, sh, false, false);
  fboComp = createFBO(w, h, false, true);

  let bw = Math.max(2, w >> 1), bh = Math.max(2, h >> 1);
  for (let i = 0; i < 4; i++) {
    bloomA.push(createFBO(bw, bh, false, false));
    bloomB.push(createFBO(bw, bh, false, false));
    bw = Math.max(2, bw >> 1);
    bh = Math.max(2, bh >> 1);
  }
}

resizeBuffers();

// ============================================================================
// MATRIX MATH UTILITIES
// ============================================================================
function mat4Perspective(fovRad, aspect, near, far) {
  const f = 1.0 / Math.tan(fovRad * 0.5);
  const nf = 1.0 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, (2 * far * near) * nf, 0
  ]);
}

function mat4LookDir(eye, yaw, pitch, roll) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  // yaw=0 looks due North (-Z) straight toward the burning mountain ridge!
  const fx = sy * cp;
  const fy = sp;
  const fz = -cy * cp;

  // World up with optional tiny cinema gimbal roll
  const ux0 = Math.sin(roll), uy0 = Math.cos(roll), uz0 = 0;
  // right = normalize(cross(f, up))
  let rx = fy * uz0 - fz * uy0;
  let ry = fz * ux0 - fx * uz0;
  let rz = fx * uy0 - fy * ux0;
  const rl = Math.hypot(rx, ry, rz) || 1.0;
  rx /= rl; ry /= rl; rz /= rl;
  // true up = cross(r, f)
  const ux = ry * fz - rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy - ry * fx;

  return new Float32Array([
    rx, ux, -fx, 0,
    ry, uy, -fy, 0,
    rz, uz, -fz, 0,
    -(rx * eye[0] + ry * eye[1] + rz * eye[2]),
    -(ux * eye[0] + uy * eye[1] + uz * eye[2]),
     (fx * eye[0] + fy * eye[1] + fz * eye[2]),
    1
  ]);
}

function mat4Mul(a, b) {
  const out = new Float32Array(16);
  for (let col = 0; col < 4; col++) {
    const b0 = b[col * 4], b1 = b[col * 4 + 1], b2 = b[col * 4 + 2], b3 = b[col * 4 + 3];
    out[col * 4 + 0] = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
    out[col * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
    out[col * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[col * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return out;
}

function mat4Invert(m) {
  const out = new Float32Array(16);
  const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3];
  const a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];
  const a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11];
  const a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];

  const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10;
  const b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
  const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
  const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
  const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31;
  const b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;

  let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
  if (!det) return out;
  det = 1.0 / det;

  out[0]  = (a11 * b11 - a12 * b10 + a13 * b09) * det;
  out[1]  = (a02 * b10 - a01 * b11 - a03 * b09) * det;
  out[2]  = (a31 * b05 - a32 * b04 + a33 * b03) * det;
  out[3]  = (a22 * b04 - a21 * b05 - a23 * b03) * det;
  out[4]  = (a12 * b08 - a10 * b11 - a13 * b07) * det;
  out[5]  = (a00 * b11 - a02 * b08 + a03 * b07) * det;
  out[6]  = (a32 * b02 - a30 * b05 - a33 * b01) * det;
  out[7]  = (a20 * b05 - a22 * b02 + a23 * b01) * det;
  out[8]  = (a10 * b10 - a11 * b08 + a13 * b06) * det;
  out[9]  = (a01 * b08 - a00 * b10 - a03 * b06) * det;
  out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
  out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
  out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
  out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
  out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
  out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
  return out;
}

// ============================================================================
// INTERACTIVE 360° CAMERA + VALLEY FLOOR DRIFT + AUTO-RESUME
// ============================================================================
const DEFAULT_FOV = 48.0;
const MIN_FOV = 16.0;
const MAX_FOV = 78.0;
const MIN_PITCH = -0.48; // ~ -27.5° (valley floor)
const MAX_PITCH = 1.40;  // ~ +80° (overhead smoke & stars)
const RESUME_DELAY = 3.8; // seconds of inactivity before automatic drift resumes

const cam = {
  driftPhase: 0.25,        // position along valley drift curve
  driftBlend: 1.0,         // 1 = full auto drift, 0 = paused for manual inspection
  yaw: 0.0,
  pitch: 0.22,             // looking slightly up from valley floor toward the burning ridge
  fov: DEFAULT_FOV,
  targetYaw: 0.0,
  targetPitch: 0.22,
  targetFov: DEFAULT_FOV,
  velYaw: 0.0,
  velPitch: 0.0,
  lastInputTime: -100.0,
  isInteracting: false,
  autoMode: true
};

function shortestAngleDiff(from, to) {
  let d = (to - from) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function computeAutoLook(phase, simT) {
  const pos = valleyPathPos(phase);
  const eyeY = sampleHeightBilinear(pos.x, pos.z) + 7.2 + Math.sin(simT * 0.42) * 0.45;
  // Gently gaze toward the dramatic heart of the burning mountain ridge with subtle organic scanning
  const aimX = Math.sin(phase * 0.65 + 0.3) * 145.0 + Math.sin(simT * 0.14) * 42.0;
  const aimZ = ridgeCurveZ(aimX);
  const aimY = sampleHeightBilinear(aimX, aimZ) + 26.0 + Math.sin(simT * 0.21) * 9.0;
  const dx = aimX - pos.x, dy = aimY - eyeY, dz = aimZ - pos.z;
  const horiz = Math.hypot(dx, dz);
  const yaw = Math.atan2(dx, -dz);
  const pitch = Math.atan2(dy, horiz);
  return { pos: [pos.x, eyeY, pos.z], yaw, pitch };
}

// Initialize camera to exact auto orientation
{
  const initT = PARAM_T !== null ? PARAM_T : 8.0;
  cam.driftPhase = 0.25 + initT * 0.0175;
  const initLook = computeAutoLook(cam.driftPhase, initT);
  cam.yaw = cam.targetYaw = (PARAM_YAW !== null ? PARAM_YAW : initLook.yaw);
  cam.pitch = cam.targetPitch = (PARAM_PITCH !== null ? PARAM_PITCH : initLook.pitch);
  cam.fov = cam.targetFov = (PARAM_FOV !== null ? clamp(PARAM_FOV, MIN_FOV, MAX_FOV) : DEFAULT_FOV);
}

// Fade out subtle hint after 5.5s or first interaction
let hintHidden = false;
function hideHint() {
  if (!hintHidden) {
    hintHidden = true;
    hintEl.classList.add('hidden');
  }
}
if (!PARAM_FREEZE) setTimeout(hideHint, 5500);

let nowSec = 0.0;
function markUserInput() {
  cam.lastInputTime = nowSec;
  cam.autoMode = false;
  hideHint();
}

// Mouse Drag & Scroll Zoom
let mouseDown = false, lastMouseX = 0, lastMouseY = 0;
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouseDown = true;
  cam.isInteracting = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  cam.velYaw = 0; cam.velPitch = 0;
  canvas.classList.add('dragging');
  markUserInput();
});

window.addEventListener('mousemove', (e) => {
  if (!mouseDown) return;
  const dx = e.clientX - lastMouseX;
  const dy = e.clientY - lastMouseY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;

  const sens = 0.0036 * (cam.fov / DEFAULT_FOV);
  cam.targetYaw -= dx * sens;
  cam.targetPitch = clamp(cam.targetPitch + dy * sens, MIN_PITCH, MAX_PITCH);
  cam.velYaw = -dx * sens * 0.35;
  cam.velPitch = dy * sens * 0.35;
  markUserInput();
});

window.addEventListener('mouseup', () => {
  if (!mouseDown) return;
  mouseDown = false;
  cam.isInteracting = false;
  canvas.classList.remove('dragging');
  markUserInput();
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16.0;
  else if (e.deltaMode === 2) dy *= 100.0;
  dy = clamp(dy, -120, 120);
  cam.targetFov = clamp(cam.targetFov * (1.0 + dy * 0.0014), MIN_FOV, MAX_FOV);
  markUserInput();
}, { passive: false });

// Double-click smoothly returns to ridge gaze
canvas.addEventListener('dblclick', () => {
  cam.lastInputTime = nowSec - RESUME_DELAY - 0.1;
  cam.autoMode = true;
});

// Touch Controls: 1-finger drag to look 360°, 2-finger pinch to zoom!
const activeTouches = new Map();
let lastPinchDist = null;
let lastTouchMid = null;

function touchMetrics() {
  const pts = Array.from(activeTouches.values());
  if (pts.length === 1) return { count: 1, x: pts[0].x, y: pts[0].y, dist: 0 };
  if (pts.length >= 2) {
    const mx = 0.5 * (pts[0].x + pts[1].x);
    const my = 0.5 * (pts[0].y + pts[1].y);
    const d = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    return { count: 2, x: mx, y: my, dist: d };
  }
  return { count: 0, x: 0, y: 0, dist: 0 };
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
  }
  cam.isInteracting = true;
  cam.velYaw = 0; cam.velPitch = 0;
  const m = touchMetrics();
  lastTouchMid = { x: m.x, y: m.y };
  lastPinchDist = m.count >= 2 ? m.dist : null;
  markUserInput();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (activeTouches.has(t.identifier)) {
      activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
    }
  }
  const m = touchMetrics();
  if (m.count === 1 && lastTouchMid) {
    const dx = m.x - lastTouchMid.x;
    const dy = m.y - lastTouchMid.y;
    const sens = 0.0044 * (cam.fov / DEFAULT_FOV);
    cam.targetYaw -= dx * sens;
    cam.targetPitch = clamp(cam.targetPitch + dy * sens, MIN_PITCH, MAX_PITCH);
    cam.velYaw = -dx * sens * 0.35;
    cam.velPitch = dy * sens * 0.35;
  } else if (m.count >= 2) {
    if (lastPinchDist && m.dist > 8) {
      const ratio = lastPinchDist / m.dist;
      cam.targetFov = clamp(cam.targetFov * ratio, MIN_FOV, MAX_FOV);
    }
    if (lastTouchMid) {
      const dx = m.x - lastTouchMid.x;
      const dy = m.y - lastTouchMid.y;
      const sens = 0.0028 * (cam.fov / DEFAULT_FOV);
      cam.targetYaw -= dx * sens;
      cam.targetPitch = clamp(cam.targetPitch + dy * sens, MIN_PITCH, MAX_PITCH);
    }
    lastPinchDist = m.dist;
  }
  lastTouchMid = { x: m.x, y: m.y };
  markUserInput();
}, { passive: false });

function handleTouchEnd(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    activeTouches.delete(e.changedTouches[i].identifier);
  }
  const m = touchMetrics();
  if (m.count === 0) {
    cam.isInteracting = false;
    lastTouchMid = null;
    lastPinchDist = null;
  } else {
    lastTouchMid = { x: m.x, y: m.y };
    lastPinchDist = m.count >= 2 ? m.dist : null;
  }
  markUserInput();
}
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// ============================================================================
// MAIN RENDER LOOP
// ============================================================================
const fireLightsBuf = new Float32Array(NUM_FIRE_LIGHTS * 4);

function updateFireLights(simT) {
  let sum = 0;
  for (let i = 0; i < NUM_FIRE_LIGHTS; i++) {
    const n = fireNodes[i];
    // Multi-frequency chaotic wildfire intensity flicker per ridge cluster
    const f1 = Math.sin(simT * 1.45 * n.speed + n.phase);
    const f2 = Math.sin(simT * 4.35 * n.speed + n.phase * 2.1);
    const f3 = Math.sin(simT * 10.8 * n.speed + n.phase * 3.7);
    const flare = Math.pow(0.5 + 0.5 * Math.sin(simT * 0.52 + n.phase * 1.3), 3.0);
    const flick = clamp(0.76 + 0.16 * f1 + 0.11 * f2 + 0.06 * f3 + 0.34 * flare, 0.42, 1.55);
    const pwr = n.basePower * flick;
    fireLightsBuf[i * 4 + 0] = n.x;
    fireLightsBuf[i * 4 + 1] = n.y;
    fireLightsBuf[i * 4 + 2] = n.z;
    fireLightsBuf[i * 4 + 3] = pwr;
    sum += pwr;
  }
  return sum / NUM_FIRE_LIGHTS;
}

function renderFrame(simT, dt) {
  // Update camera state (unless frozen via query parameter)
  if (!PARAM_FREEZE) {
    const idleTime = nowSec - cam.lastInputTime;
    const shouldResume = !cam.isInteracting && idleTime > RESUME_DELAY;
    if (shouldResume) cam.autoMode = true;

    // Smoothly ramp valley drift speed: glides slowly during auto mode, gently pauses/slows during manual inspection
    const targetDriftBlend = cam.autoMode ? 1.0 : 0.18;
    cam.driftBlend += (targetDriftBlend - cam.driftBlend) * (1.0 - Math.exp(-dt * 1.4));
    cam.driftPhase += dt * 0.0175 * cam.driftBlend;

    const autoLook = computeAutoLook(cam.driftPhase, simT);

    if (cam.autoMode) {
      // Smoothly glide back toward automatic ridge-gazing view & default cinema framing
      const k = 1.0 - Math.exp(-dt * 0.95);
      cam.targetYaw += shortestAngleDiff(cam.targetYaw, autoLook.yaw) * k;
      cam.targetPitch += (autoLook.pitch - cam.targetPitch) * k;
      cam.targetFov += (DEFAULT_FOV - cam.targetFov) * (1.0 - Math.exp(-dt * 0.7));
      cam.velYaw *= Math.exp(-dt * 5.0);
      cam.velPitch *= Math.exp(-dt * 5.0);
    } else if (!cam.isInteracting) {
      // Gentle cinematic inertia coast after releasing mouse/finger
      cam.targetYaw += cam.velYaw;
      cam.targetPitch = clamp(cam.targetPitch + cam.velPitch, MIN_PITCH, MAX_PITCH);
      const dragDamp = Math.exp(-dt * 6.2);
      cam.velYaw *= dragDamp;
      cam.velPitch *= dragDamp;
    }

    const smoothK = 1.0 - Math.exp(-dt * 10.5);
    cam.yaw += shortestAngleDiff(cam.yaw, cam.targetYaw) * smoothK;
    cam.pitch += (cam.targetPitch - cam.pitch) * smoothK;
    cam.fov += (cam.targetFov - cam.fov) * (1.0 - Math.exp(-dt * 9.0));
  }

  const autoNow = computeAutoLook(cam.driftPhase, simT);
  const eyePos = autoNow.pos;
  // Subtle organic cinema dolly/breathing roll
  const roll = Math.sin(simT * 0.31) * 0.0045 * cam.driftBlend;

  const near = 0.8, far = 2600.0;
  const aspect = viewW / Math.max(viewH, 1);
  const proj = mat4Perspective((cam.fov * Math.PI) / 180.0, aspect, near, far);
  const view = mat4LookDir(eyePos, cam.yaw, cam.pitch, roll);
  const viewProj = mat4Mul(proj, view);
  const invViewProj = mat4Invert(viewProj);

  const globalFlicker = updateFireLights(simT);

  // --------------------------------------------------------------------------
  // PASS 1: SKY DOME + TERRAIN + 3D SILHOUETTED CONIFERS -> fboScene (+ Depth)
  // --------------------------------------------------------------------------
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene.fbo);
  gl.viewport(0, 0, fboScene.w, fboScene.h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);

  // 1A. Sky Dome
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.useProgram(progSky.prog);
  gl.uniformMatrix4fv(progSky.u.uInvViewProj, false, invViewProj);
  gl.uniform3fv(progSky.u.uCamPos, eyePos);
  gl.uniform1f(progSky.u.uTime, simT);
  gl.uniform1f(progSky.u.uGlobalFlicker, globalFlicker);
  gl.uniform4fv(progSky.u.uFireLights, fireLightsBuf);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 1B. 360° Mountain Valley Terrain
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  gl.useProgram(progTerrain.prog);
  gl.uniformMatrix4fv(progTerrain.u.uViewProj, false, viewProj);
  gl.uniform3fv(progTerrain.u.uCamPos, eyePos);
  gl.uniform1f(progTerrain.u.uTime, simT);
  gl.uniform1f(progTerrain.u.uGlobalFlicker, globalFlicker);
  gl.uniform4fv(progTerrain.u.uFireLights, fireLightsBuf);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, lightMapTex);
  gl.uniform1i(progTerrain.u.uLightMap, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, fireMapTex);
  gl.uniform1i(progTerrain.u.uFireMap, 1);
  gl.bindVertexArray(terrainGeom.vao);
  gl.drawElements(gl.TRIANGLES, terrainGeom.count, gl.UNSIGNED_INT, 0);

  // 1C. Instanced 3D Silhouetted Conifer Trees (double-sided crossed cards)
  gl.disable(gl.CULL_FACE);
  gl.useProgram(progTree.prog);
  gl.uniformMatrix4fv(progTree.u.uViewProj, false, viewProj);
  gl.uniform3fv(progTree.u.uCamPos, eyePos);
  gl.uniform1f(progTree.u.uTime, simT);
  gl.uniform1f(progTree.u.uGlobalFlicker, globalFlicker);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, coniferAtlasTex);
  gl.uniform1i(progTree.u.uConiferAtlas, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, lightMapTex);
  gl.uniform1i(progTree.u.uLightMap, 1);
  gl.bindVertexArray(coniferGeom.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, coniferGeom.indexCount, gl.UNSIGNED_SHORT, 0, coniferGeom.instCount);

  // --------------------------------------------------------------------------
  // PASS 2: 3D VOLUMETRIC RIDGE FLAMES & TORCHING CROWNS -> fboScene (Depth-Tested!)
  // --------------------------------------------------------------------------
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); // Luminous fire composited with rich core glow
  gl.useProgram(progFlame.prog);
  gl.uniformMatrix4fv(progFlame.u.uViewProj, false, viewProj);
  gl.uniform1f(progFlame.u.uTime, simT);
  gl.uniform3fv(progFlame.u.uCamPos, eyePos);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_3D, noise3DTex);
  gl.uniform1i(progFlame.u.uNoise3D, 0);
  gl.bindVertexArray(flameGeom.vao);
  gl.drawElements(gl.TRIANGLES, flameGeom.count, gl.UNSIGNED_INT, 0);

  // --------------------------------------------------------------------------
  // PASS 3: VOLUMETRIC RAYMARCHED SMOKE COLUMNS LIT FROM BELOW -> fboSmoke
  // --------------------------------------------------------------------------
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboSmoke.fbo);
  gl.viewport(0, 0, fboSmoke.w, fboSmoke.h);
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);

  gl.useProgram(progSmoke.prog);
  gl.uniformMatrix4fv(progSmoke.u.uInvViewProj, false, invViewProj);
  gl.uniformMatrix4fv(progSmoke.u.uViewProj, false, viewProj);
  gl.uniform3fv(progSmoke.u.uCamPos, eyePos);
  gl.uniform1f(progSmoke.u.uTime, simT);
  gl.uniform1f(progSmoke.u.uGlobalFlicker, globalFlicker);
  gl.uniform2f(progSmoke.u.uNearFar, near, far);
  gl.uniform4fv(progSmoke.u.uFireLights, fireLightsBuf);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboScene.depthTex);
  gl.uniform1i(progSmoke.u.uDepthTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_3D, noise3DTex);
  gl.uniform1i(progSmoke.u.uNoise3D, 1);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // --------------------------------------------------------------------------
  // PASS 4: BLIT DEPTH + COMPOSITE SMOKE + RISING EMBERS + FALLING ASH -> fboComp
  // --------------------------------------------------------------------------
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboScene.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboComp.fbo);
  gl.blitFramebuffer(0, 0, fboScene.w, fboScene.h, 0, 0, fboComp.w, fboComp.h, gl.DEPTH_BUFFER_BIT, gl.NEAREST);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fboComp.fbo);
  gl.viewport(0, 0, fboComp.w, fboComp.h);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);

  gl.useProgram(progComp.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboScene.colTex);
  gl.uniform1i(progComp.u.uSceneTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, fboSmoke.colTex);
  gl.uniform1i(progComp.u.uSmokeTex, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, fboScene.depthTex);
  gl.uniform1i(progComp.u.uDepthTex, 2);
  gl.uniform2f(progComp.u.uSmokeTexel, 1.0 / fboSmoke.w, 1.0 / fboSmoke.h);
  gl.uniform2f(progComp.u.uNearFar, near, far);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 4A. Rising Glowing Embers & Sparks (depth-tested against terrain & trees, additive glow!)
  gl.enable(gl.DEPTH_TEST);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progEmber.prog);
  gl.uniformMatrix4fv(progEmber.u.uViewProj, false, viewProj);
  gl.uniform3fv(progEmber.u.uCamPos, eyePos);
  gl.uniform2f(progEmber.u.uViewport, fboComp.w, fboComp.h);
  gl.uniform1f(progEmber.u.uTime, simT);
  gl.bindVertexArray(emberGeom.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, emberGeom.count);

  // 4B. Falling Ash Flakes (soft alpha-blended pale charred flakes drifting through valley air!)
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progAsh.prog);
  gl.uniformMatrix4fv(progAsh.u.uViewProj, false, viewProj);
  gl.uniform3fv(progAsh.u.uCamPos, eyePos);
  gl.uniform2f(progAsh.u.uViewport, fboComp.w, fboComp.h);
  gl.uniform1f(progAsh.u.uTime, simT);
  gl.uniform1f(progAsh.u.uGlobalFlicker, globalFlicker);
  gl.bindVertexArray(ashGeom.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, ashGeom.count);

  // --------------------------------------------------------------------------
  // PASS 5: MULTI-SCALE HDR OPTICAL BLOOM PYRAMID (4 Levels)
  // --------------------------------------------------------------------------
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(emptyVao);

  // Extract highlights -> bloomA[0]
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA[0].fbo);
  gl.viewport(0, 0, bloomA[0].w, bloomA[0].h);
  gl.useProgram(progBloomExt.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboComp.colTex);
  gl.uniform1i(progBloomExt.u.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.useProgram(progBlur.prog);
  gl.uniform1i(progBlur.u.uTex, 0);
  for (let i = 0; i < 4; i++) {
    const srcTex = (i === 0) ? bloomA[0].colTex : bloomA[i - 1].colTex;
    // Horizontal blur -> bloomB[i]
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB[i].fbo);
    gl.viewport(0, 0, bloomB[i].w, bloomB[i].h);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform2f(progBlur.u.uDir, 1.35 / bloomB[i].w, 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Vertical blur -> bloomA[i]
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA[i].fbo);
    gl.viewport(0, 0, bloomA[i].w, bloomA[i].h);
    gl.bindTexture(gl.TEXTURE_2D, bloomB[i].colTex);
    gl.uniform2f(progBlur.u.uDir, 0.0, 1.35 / bloomA[i].h);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // --------------------------------------------------------------------------
  // PASS 6: FINAL ACES FILMIC GRADE, HALATION, VIGNETTE & 35mm FILM GRAIN
  // --------------------------------------------------------------------------
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, viewW, viewH);
  gl.useProgram(progPost.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboComp.colTex);   gl.uniform1i(progPost.u.uSceneTex, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA[0].colTex); gl.uniform1i(progPost.u.uBloom1, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bloomA[1].colTex); gl.uniform1i(progPost.u.uBloom2, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, bloomA[2].colTex); gl.uniform1i(progPost.u.uBloom3, 3);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, bloomA[3].colTex); gl.uniform1i(progPost.u.uBloom4, 4);
  gl.uniform1f(progPost.u.uTime, simT);
  gl.uniform2f(progPost.u.uResolution, viewW, viewH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Expose minimal read-only state for automated verification tests
window.__wildfire = {
  getState: () => ({
    yaw: cam.yaw, pitch: cam.pitch, fov: cam.fov,
    autoMode: cam.autoMode, driftPhase: cam.driftPhase,
    trees: coniferGeom.instCount, embers: emberGeom.count, ash: ashGeom.count
  }),
  advance: (sec) => {
    nowSec += sec;
    simTime += sec;
    renderFrame(simTime, sec);
  }
};

let simTime = PARAM_T !== null ? PARAM_T : 8.0;
let lastWall = performance.now();

if (PARAM_FREEZE) {
  const drawFrozen = () => {
    resizeBuffers();
    renderFrame(simTime, 0.016);
    gl.finish();
    document.title = 'READY';
  };
  drawFrozen();
  requestAnimationFrame(() => {
    drawFrozen();
    requestAnimationFrame(drawFrozen);
  });
} else {
  function loop(now) {
    const dt = clamp((now - lastWall) * 0.001, 0.001, 0.05);
    lastWall = now;
    nowSec += dt;
    simTime += dt;
    resizeBuffers();
    renderFrame(simTime, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

})();
</script>
