<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b28"><title>Ocean Drive — A Blue Hour Flight</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b28;color:#f0eae1;font-family:Arial,Helvetica,sans-serif}canvas{display:block}#viewport{position:fixed;inset:0}#transition{position:fixed;inset:0;z-index:2;background:#080c11;pointer-events:none;opacity:1}body:before,body:after{content:"";position:fixed;left:0;right:0;height:5.2vh;background:#080c11;z-index:3;pointer-events:none}body:before{top:0}body:after{bottom:0}.ui{position:fixed;z-index:4;transition:opacity .5s}.top{left:4.4vw;right:4.4vw;top:8.8vh;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.30em;color:#f4e2ce;display:flex;align-items:center;gap:11px}.dot{width:5px;height:5px;background:#e5b491;border-radius:50%;box-shadow:0 0 10px #f0ba91}.title{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(32px,3.5vw,60px);letter-spacing:-.035em;line-height:1.1;margin:12px 0 10px;text-shadow:0 2px 30px #06122055}.subtitle{font-size:10px;letter-spacing:.18em;color:#e4ded5b8}.coords{text-align:right;font-size:9px;letter-spacing:.15em;line-height:1.8;color:#ece9e0bd}.coords b{display:block;font-weight:400;font-size:11px;color:#f4eee4}.compass{position:absolute;right:0;top:65px;border:1px solid #d6e1e33d;border-radius:50%;width:41px;height:41px;display:grid;place-items:center;font-size:9px;background:#15233120;backdrop-filter:blur(5px)}.compass:before{content:'▴';position:absolute;top:1px;color:#efb6a0;font-size:11px}.bottom{bottom:9vh;left:4.4vw;right:4.4vw;display:flex;align-items:flex-end;gap:30px}.flight{width:220px;flex-shrink:0}.flight .label{font-size:9px;letter-spacing:.22em;color:#ebe2d4a6;margin-bottom:12px}.flight .value{font-family:Georgia,serif;font-size:18px;font-weight:400}.flight .value span{font-family:Arial;font-size:9px;letter-spacing:.14em;color:#ffffff88;margin-left:9px}.controls{display:flex;align-items:center;gap:14px;max-width:600px;flex:1;padding:12 </style></head><body><div id="viewport" aria-label="Procedural three-dimensional northbound drone flight over Ocean Drive, Miami Beach"></div><div id="transition"></div><div id="loading"><p>Ocean Drive</p><span>BUILDING THE BLUE HOUR</span></div><header class="ui top"><div><div class="eyebrow"><span class="dot"></span> A BLUE HOUR FLIGHT</div><h1 class="title">Ocean Drive</h1><div class="subtitle">MIAMI BEACH, FLORIDA &nbsp; / &nbsp; THE ART DECO DISTRICT</div></div><div class="coords"><b>25° 46′  N &nbsp; 80° 08′  W</b>ATLANTIC COAST &nbsp; · &nbsp; NORTHBOUND<div class="compass">N</div></div></header><footer class="ui bottom"><div class="flight"><div class="label">AFTER THE RAIN</div><div class="value">The evening passage <span id="alt">5.5 M</span></div></div><div class="controls"><button id="play" aria-label="Pause flight" title="Play / pause (Space)">Ⅱ</button><button id="restart" aria-label="Restart flight" title="Restart (R)">↺</button><input id="seek" aria-label="Flight timeline" type="range" min="0" max="100" step=".01" value="0"><span id="time">00:00</span></div><div class="right-controls"><button id="quality" title="Toggle rendering quality">HIGH</button><button id="fullscreen" title="Fullscreen (F)">⛶</button><button id="hide" title="Hide controls (H)">HIDE UI</button><div class="hint">SPACE TO PAUSE &nbsp; / &nbsp; H TO HIDE</div></div></footer><script>window.addEventListener('error',e=>{let el=document.querySelector('#loading');if(!window.sceneReady){el.classList.remove('done');el.innerHTML='<p>Unable to start the flight</p><span class="error">This scene requires a browser with WebGL 2 enabled. '+String(e.message).replace(/[<>]/g,'')+'</span>';}});</script><script>/* BUNDLE */</script></body></html>
