<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grand Canyon · Drone Flight</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;color:#f2ede6;user-select:none;-webkit-user-select:none}
  #stage{position:relative;overflow:hidden;background:#000}
  #gl{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #gl.drag{cursor:grabbing}
  .ov{position:absolute;pointer-events:none;transition:opacity 1.2s ease}
  #title{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0}
  #title h1{margin:0;font-weight:200;font-size:clamp(22px,4.2vw,64px);letter-spacing:.62em;text-indent:.62em;text-shadow:0 2px 24px rgba(0,0,0,.35)}
  #title p{margin:.9em 0 0;font-weight:300;font-size:clamp(10px,1.05vw,15px);letter-spacing:.45em;text-indent:.45em;opacity:.8;text-transform:uppercase}
  #hint{left:0;right:0;bottom:14px;text-align:center;font-size:11px;letter-spacing:.14em;opacity:0;color:rgba(255,255,255,.72);text-shadow:0 1px 6px rgba(0,0,0,.6)}
  #hint b{font-weight:600;color:#fff}
  #bar{left:0;bottom:0;height:2px;width:0;background:rgba(255,255,255,.55);opacity:0}
  #load{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  #load .ln{width:180px;height:1px;margin:14px auto 0;background:rgba(255,255,255,.15);overflow:hidden}
  #load .ln i{display:block;height:100%;width:0;background:rgba(255,255,255,.8);transition:width .25s ease}
  #err{left:8%;right:8%;top:40%;text-align:center;font-size:14px;line-height:1.6;color:#ffd9c9;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="title" class="ov"><h1>GRAND CANYON</h1><p>Colorado River · Arizona</p></div>
  <div id="hint" class="ov"><b>drag</b> look &nbsp;·&nbsp; <b>space</b> pause &nbsp;·&nbsp; <b>← →</b> seek &nbsp;·&nbsp; <b>S</b> sound &nbsp;·&nbsp; <b>F</b> fullscreen &nbsp;·&nbsp; <b>L</b> letterbox &nbsp;·&nbsp; <b>H</b> hide</div>
  <div id="bar" class="ov"></div>
  <div id="load" class="ov">Generating terrain<div class="ln"><i id="loadbar"></i></div></div>
  <div id="err" class="ov"></div>
</div>
<script>
(() => {
'use strict';

/* ============================================================================
   Grand Canyon drone flight
   Everything is procedural: an erosion-distance field (river + side canyons +
   buttes) is generated on the GPU, mapped through a stratigraphic cliff/slope
   profile, then ray marched with precomputed sun-shadow heights, sky
   visibility, a single-scattering sky, volumetric haze and a reflective river.
   ========================================================================== */

const Q = new URLSearchParams(location.hash.replace(/^#/, ''));
const STILL = Q.has('still');
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl');

function fail(msg) {
  console.error('FAIL: ' + msg);
  const e = $('err'); e.style.display = 'block'; e.style.opacity = 1; e.textContent = msg;
  $('load').style.opacity = 0;
  window.__error = msg;
}

const gl = canvas.getContext('webgl2', {antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: STILL, powerPreference: 'high-performance'});
if (!gl) { fail('This experience needs WebGL 2, which is not available in this browser.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fail('This browser cannot render to floating point textures (EXT_color_buffer_float).'); return; }
const FLOAT_LINEAR = !Q.has('nolinear') && !!gl.getExtension('OES_texture_float_linear');

/* ---------------------------------------------------------------- settings */
const COARSE = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const FIELD_N = +(Q.get('field') || (COARSE ? 1024 : 2048));   // erosion field resolution
const WORLD_SIZE = 40000;                         // metres covered by the field
const WORLD_C = [0, 0];                           // world centre (x, z)
const DURATION = 126;                             // seconds per flight loop
const SUN_EL = 11.5 * Math.PI / 180;              // sun elevation
const SUN_AZ = 240 * Math.PI / 180;               // bearing of the sun (+z is north, +x is east): WSW
const HAZE = 1.2;                                 // Mie turbidity multiplier near the ground
const SKY_HAZE = 1.9;                             // aerosol load used for the sky dome and sun colour
const CANYON_HAZE = 0.35e-5;                       // extra low-level haze inside the canyon

/* River centreline x = sum A*sin(z*2pi/L + P) */
const RIVER = {A: [1550, 520, 140], L: [17000, 7300, 3100], P: [0.3, 2.1, 4.0]};
const RF = RIVER.L.map(l => 2 * Math.PI / l);
function riverX(z) { let s = 0; for (let i = 0; i < 3; i++) s += RIVER.A[i] * Math.sin(z * RF[i] + RIVER.P[i]); return s; }
function riverXd(z) { let s = 0; for (let i = 0; i < 3; i++) s += RIVER.A[i] * RF[i] * Math.cos(z * RF[i] + RIVER.P[i]); return s; }

/* Stratigraphic profile: [E0, E1, rise, k]. E is horizontal distance from the
   nearest drainage; cliffs are short in E and tall, slopes are long and low.
   k bends a segment into a concave bench (0 = straight ramp). */
const PROFILE_BASE = -9;
const PROFILE = [
  [0,    45,    8, 0.0],   // river bed
  [45,   75,    7, 0.6],   // banks and beaches
  [75,   200, 240, 0.0],   // inner gorge, Vishnu schist
  [200,  320, 120, 0.1],
  [320,  345,  80, 0.0],   // Tapeats sandstone cliff
  [345, 1000,  85, 0.9],   // Tonto platform (Bright Angel shale)
  [1000,1050,  75, 0.0],   // Muav limestone
  [1050,1105, 175, 0.0],   // Redwall limestone cliff
  [1105,1250,  50, 0.45],  // Supai group: slopes and ledges
  [1250,1272,  38, 0.0],
  [1272,1420,  45, 0.45],
  [1420,1442,  40, 0.0],
  [1442,1580,  45, 0.45],
  [1580,1602,  35, 0.0],
  [1602,1850,  22, 0.3],   // Esplanade-like bench
  [1850,2160, 100, 0.5],   // Hermit shale slope
  [2160,2200, 110, 0.0],   // Coconino sandstone cliff
  [2200,2370,  70, 0.4],   // Toroweap slope
  [2370,2410,  90, 0.0],   // Kaibab limestone rim
];
const RIM_E = 2410, PLATEAU_SLOPE = 0.012, PLATEAU_RUN = 9000;
function profileJS(E) {
  let y = PROFILE_BASE;
  for (const [a, b, h, k] of PROFILE) { const x = Math.min(1, Math.max(0, (E - a) / (b - a))); y += h * x * (1 - k + k * x); }
  return y + PLATEAU_SLOPE * Math.min(PLATEAU_RUN, Math.max(0, E - RIM_E));
}
const fl = v => { let s = (+v).toPrecision(9).replace(/\.?0+$/, ''); if (!/[.e]/.test(s)) s += '.0'; return s; };
const PROF_N = 4096, PROF_EMAX = 3072;
function profileLUTGLSL() {
  const yMax = profileJS(PROF_EMAX);
  return `uniform sampler2D uProfile;
vec2 profTex(float E){
#ifdef MANUAL_BILINEAR
  float x = max(E, 0.0)*${fl((PROF_N - 1) / PROF_EMAX)};
  int i = int(x);
  vec2 a = texelFetch(uProfile, ivec2(i, 0), 0).rg, b = texelFetch(uProfile, ivec2(min(i + 1, ${PROF_N - 1}), 0), 0).rg;
  return mix(a, b, x - float(i));
#else
  return texture(uProfile, vec2(max(E, 0.0)*${fl((PROF_N - 1) / PROF_EMAX / PROF_N)} + ${fl(0.5 / PROF_N)}, 0.5)).rg;
#endif
}
float profileY(float E){
  if (E >= ${fl(PROF_EMAX)}) return ${fl(yMax)} + ${fl(PLATEAU_SLOPE)}*min(E - ${fl(PROF_EMAX)}, ${fl(PLATEAU_RUN - (PROF_EMAX - RIM_E))});
  return profTex(E).r;
}
vec2 profileYD(float E){   // height and its slope dP/dE
  if (E >= ${fl(PROF_EMAX)}) return vec2(profileY(E), ${fl(PLATEAU_SLOPE)});
  return profTex(E);
}
`;
}
/* Free-standing buttes ("temples"): x, z, E at summit, flank steepness */
const BUTTES = [[-850, -650, 1700, 1.1], [2250, -1450, 2120, 1.2], [-300, 1950, 1560, 1.15]];

/* ------------------------------------------------------------- GLSL chunks */
const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
`;
const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

const COMMON = `
#define PI 3.14159265359
${FLOAT_LINEAR ? '' : '#define MANUAL_BILINEAR'}
uniform vec4 uWorld;      // centre x, centre z, size, 1/size
uniform vec2 uFieldRes;
uniform sampler2D uField;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y)*p3.z); }

float vnoise(vec2 x){
  vec2 i = floor(x), f = fract(x);
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);
  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));
  return -1.0 + 2.0*(a + (b - a)*u.x + (c - a)*u.y + (a - b - c + d)*u.x*u.y);
}
float vnoise3(vec3 x){
  vec3 i = floor(x), f = fract(x);
  vec3 u = f*f*(3.0 - 2.0*f);
  float a = hash13(i), b = hash13(i + vec3(1,0,0)), c = hash13(i + vec3(0,1,0)), d = hash13(i + vec3(1,1,0));
  float e = hash13(i + vec3(0,0,1)), f1 = hash13(i + vec3(1,0,1)), g = hash13(i + vec3(0,1,1)), h = hash13(i + vec3(1,1,1));
  return -1.0 + 2.0*mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z);
}
float gnoise(vec2 x){
  vec2 i = floor(x), f = fract(x);
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);
  vec2 ga = hash22(i)*2.0 - 1.0, gb = hash22(i + vec2(1,0))*2.0 - 1.0, gc = hash22(i + vec2(0,1))*2.0 - 1.0, gd = hash22(i + vec2(1,1))*2.0 - 1.0;
  float va = dot(ga, f), vb = dot(gb, f - vec2(1,0)), vc = dot(gc, f - vec2(0,1)), vd = dot(gd, f - vec2(1,1));
  return 1.6*(va + u.x*(vb - va) + u.y*(vc - va) + u.x*u.y*(va - vb - vc + vd));
}

const vec3 RA = vec3(${RIVER.A.map(fl).join(',')});
const vec3 RF = vec3(${RF.map(fl).join(',')});
const vec3 RP = vec3(${RIVER.P.map(fl).join(',')});
float riverX(float z){ return dot(RA, sin(z*RF + RP)); }
float riverXd(float z){ return dot(RA*RF, cos(z*RF + RP)); }
float riverXdd(float z){ return -dot(RA*RF*RF, sin(z*RF + RP)); }

vec2 worldToUV(vec2 xz){ return (xz - uWorld.xy)*uWorld.w + 0.5; }

uniform float uFieldLodK;   // 1/texel size in metres
float fieldE(vec2 xz, float fp){
#ifdef MANUAL_BILINEAR
  vec2 st = worldToUV(xz)*uFieldRes - 0.5; vec2 i = floor(st); vec2 f = st - i;
  ivec2 ii = ivec2(i), mx = ivec2(uFieldRes) - 1;
  float a = texelFetch(uField, clamp(ii, ivec2(0), mx), 0).r, b = texelFetch(uField, clamp(ii + ivec2(1,0), ivec2(0), mx), 0).r;
  float c = texelFetch(uField, clamp(ii + ivec2(0,1), ivec2(0), mx), 0).r, d = texelFetch(uField, clamp(ii + ivec2(1,1), ivec2(0), mx), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
#else
  return textureLod(uField, worldToUV(xz), max(log2(max(fp*uFieldLodK*1.3, 1e-3)), 0.0)).r;
#endif
}
// Smooth (C2) cubic B-spline reconstruction with full-precision weights, for normals.
float fieldEHQ(vec2 xz){
  vec2 st = worldToUV(xz)*uFieldRes - 0.5; vec2 i = floor(st); vec2 f = st - i;
  vec2 f2 = f*f, f3 = f2*f;
  vec4 wx = vec4((1.0 - f.x)*(1.0 - f.x)*(1.0 - f.x), 3.0*f3.x - 6.0*f2.x + 4.0, -3.0*f3.x + 3.0*f2.x + 3.0*f.x + 1.0, f3.x)/6.0;
  vec4 wy = vec4((1.0 - f.y)*(1.0 - f.y)*(1.0 - f.y), 3.0*f3.y - 6.0*f2.y + 4.0, -3.0*f3.y + 3.0*f2.y + 3.0*f.y + 1.0, f3.y)/6.0;
  ivec2 ii = ivec2(i) - 1, mx = ivec2(uFieldRes) - 1;
  float s = 0.0;
  for (int y = 0; y < 4; y++){
    float row = 0.0;
    for (int x = 0; x < 4; x++) row += wx[x]*texelFetch(uField, clamp(ii + ivec2(x, y), ivec2(0), mx), 0).r;
    s += wy[y]*row;
  }
  return s;
}

${profileLUTGLSL()}

const vec4 MESAS[5] = vec4[5](vec4(-26000.0, -15000.0, 2600.0, 240.0), vec4(24000.0, 9000.0, 3400.0, 190.0),
                               vec4(-19000.0, 22000.0, 2200.0, 160.0), vec4(30000.0, -21000.0, 4200.0, 260.0),
                               vec4(-34000.0, 6000.0, 3000.0, 210.0));
float plateauH(vec2 p, float E){
  float m = smoothstep(${fl(RIM_E + 30)}, ${fl(RIM_E + 700)}, E);
  if (m <= 0.0) return 0.0;
  float h = 24.0*vnoise(p*(1.0/2900.0) + vec2(5.2, 1.3)) + 8.0*vnoise(p*(1.0/760.0) + vec2(2.1, 7.7));
  float far = smoothstep(${fl(RIM_E + 1500)}, ${fl(RIM_E + 6000)}, E);
  if (far > 0.0){
    h += far*(70.0*vnoise(p*(1.0/13000.0) + vec2(1.1, 4.7)) + 30.0*vnoise(p*(1.0/5200.0) + vec2(8.2, 3.3)));
    for (int i = 0; i < 5; i++){
      vec4 ms = MESAS[i];
      vec2 d = p - ms.xy;
      float r0 = length(d);
      if (r0 > ms.z*1.12 + 270.0) continue;
      float r = r0 + 260.0*vnoise(p*(1.0/1400.0) + float(i)*5.0);
      h += far*ms.w*(1.0 - smoothstep(ms.z*0.82, ms.z*1.12, r))*(0.9 + 0.1*smoothstep(ms.z*0.3, ms.z*0.8, r));
    }
  }
  return m*h;
}
float baseH(vec2 p){ float E = fieldE(p, 0.0); return profileY(E) + plateauH(p, E); }
`;

/* Pass A: the drainage network is rasterised as seed lines (x, z, floor),
   a jump-flood pass finds for every texel the channel point minimising
   floor + distance, and the final pass adds wall irregularity and buttes. */
const VS_SEED = `#version 300 es
in vec3 aP;            // world x, world z, channel floor (in E units)
uniform vec4 uWorld;
out vec3 vP;
void main(){ vP = aP; gl_Position = vec4((aP.xy - uWorld.xy)*uWorld.w*2.0, aP.z/12000.0*2.0 - 1.0, 1.0); }`;
const FS_SEED = HDR + `in vec3 vP; out vec4 oCol; void main(){ oCol = vec4(vP, 1.0); }`;
const FS_JFA = HDR + `
uniform sampler2D uSeed; uniform vec4 uWorld; uniform vec2 uFieldRes; uniform int uStep;
out vec4 oCol;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy), mx = ivec2(uFieldRes) - 1;
  vec2 p = uWorld.xy + (gl_FragCoord.xy/uFieldRes - 0.5)*uWorld.z;
  vec4 best = vec4(0.0); float be = 1e30;
  for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++){
    ivec2 q = ip + ivec2(dx, dy)*uStep;
    if (any(lessThan(q, ivec2(0))) || any(greaterThan(q, mx))) continue;
    vec4 s = texelFetch(uSeed, q, 0);
    if (s.w < 0.5) continue;
    float e = s.z + length(p - s.xy);
    if (e < be){ be = e; best = s; }
  }
  oCol = best;
}`;
const FS_FIELD = HDR + COMMON + `
uniform sampler2D uSeed;
uniform vec4 uButtes[8];
uniform int uNumButtes;
uniform vec4 uFans[48];
uniform int uNumFans;
out vec4 oCol;
float smax(float a, float b, float k){ float h = max(k - abs(a - b), 0.0)/k; return max(a, b) + h*h*k*0.25; }
float seedE(vec2 p){
  vec2 st = worldToUV(p)*uFieldRes - 0.5;
  ivec2 i = ivec2(floor(st)), mx = ivec2(uFieldRes) - 1;
  float e = 1e30;
  for (int y = 0; y <= 1; y++) for (int x = 0; x <= 1; x++){
    vec4 s = texelFetch(uSeed, clamp(i + ivec2(x, y), ivec2(0), mx), 0);
    if (s.w > 0.5) e = min(e, s.z + length(p - s.xy));
  }
  return e > 1e29 ? 30000.0 : e;
}
float Ebase(vec2 p){
  float E0 = seedE(p);
  // gentle domain warp of the walls (none at the river itself)
  float wa = smoothstep(90.0, 900.0, E0)*170.0;
  vec2 wv = vec2(gnoise(p/2600.0 + vec2(3.3, 1.7)) + 0.5*gnoise(p/1100.0 + vec2(8.1, 2.2)),
                 gnoise(p/2600.0 + vec2(7.9, 5.1)) + 0.5*gnoise(p/1100.0 + vec2(1.4, 9.6)));
  float E = seedE(p + wv*wa);
  // large and medium scale irregularity of the walls; fades out on the plateau
  float a = clamp(E*0.22, 0.0, 330.0)*(1.0 - smoothstep(${fl(RIM_E + 150)}, ${fl(RIM_E + 900)}, E));
  float n = 0.0, amp = 1.0, sc = 1.0/4000.0; vec2 q = p;
  for (int i = 0; i < 6; i++){ n += amp*gnoise(q*sc + vec2(float(i)*7.13, float(i)*3.71)); q = mat2(0.8, 0.6, -0.6, 0.8)*q; sc *= 2.0; amp *= 0.55; }
  E += a*n*0.75;
  // river width varies; banks wander
  float rb = 1.0 - smoothstep(60.0, 260.0, E);
  E += rb*(22.0*gnoise(p/900.0 + vec2(2.0, 9.0)) + 9.0*gnoise(p/260.0 + vec2(6.0, 1.0)));
  // rocky shores: the beach shrinks to nothing along many stretches
  float rocky = smoothstep(-0.1, 0.4, gnoise(p/700.0 + vec2(9.1, 3.3)) + 0.4*gnoise(p/170.0));
  E += rocky*26.0*smoothstep(42.0, 75.0, E);
  // debris fans at side-canyon mouths push into the river
  for (int i = 0; i < 48; i++){
    if (i >= uNumFans) break;
    vec4 f = uFans[i];
    vec2 d = p - f.xy;
    float r = length(d) + 25.0*gnoise(p/90.0 + float(i));
    E = smax(E, f.z - r*0.85, 40.0);
  }
  for (int i = 0; i < 8; i++){
    if (i >= uNumButtes) break;
    vec4 b = uButtes[i];
    vec2 d = p - b.xy;
    d += 150.0*vec2(gnoise(p/450.0 + float(i)*3.1), gnoise(p/450.0 + 7.7 + float(i)));
    E = smax(E, b.z - length(d)*b.w, 200.0);
  }
  return E;
}
// Gabor-like stripes whose crests run down the slope (along dir); each cell
// jitters wavelength, strength and orientation so the fluting never repeats.
float gully(vec2 p, vec2 dir, float lambda, float seed){
  vec2 ci = floor(p/lambda);
  float s = 0.0, ws = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = ci + vec2(float(i), float(j));
    vec2 hA = hash22(c + seed), hB = hash22(c + seed + 3.7);
    vec2 d = p - (c + hA)*lambda;
    float w = exp(-dot(d, d)/(lambda*lambda*0.5));
    float an = (hB.x - 0.5)*0.55;
    vec2 cd = vec2(-dir.y, dir.x);
    cd = vec2(cd.x*cos(an) - cd.y*sin(an), cd.x*sin(an) + cd.y*cos(an));
    float lj = lambda*mix(0.6, 1.4, hB.y);
    float amp = 0.35 + 1.3*hash12(c + seed + 11.0);
    s += w*amp*cos(dot(d, cd)*(6.2831853/lj) + hash12(c + seed + 7.0)*6.2831853);
    ws += w;
  }
  return s/max(ws, 1e-5);
}
#ifdef FIELD_STAGE1
void main(){
  vec2 uv = gl_FragCoord.xy/uFieldRes;
  vec2 p = uWorld.xy + (uv - 0.5)*uWorld.z;
  oCol = vec4(p, max(Ebase(p), 0.0), 1.0);
}
#else
void main(){
  vec2 uv = gl_FragCoord.xy/uFieldRes;
  vec2 p = uWorld.xy + (uv - 0.5)*uWorld.z;
  // E after the Lipschitz envelope: walls never rise faster than the designed profile
  float E = seedE(p);
  float h = uWorld.z/uFieldRes.x*0.75;
  vec2 g = vec2(seedE(p + vec2(h, 0.0)) - seedE(p - vec2(h, 0.0)), seedE(p + vec2(0.0, h)) - seedE(p - vec2(0.0, h)));
  float glen = length(g);
  if (glen > 1e-4){
    vec2 dir = g/glen;
    // amplitude by zone: rugged inner gorge, mild platform, strong upper walls, none on the rim
    float A = 34.0*smoothstep(70.0, 130.0, E)*(1.0 - smoothstep(300.0, 360.0, E))
            + 40.0*smoothstep(330.0, 420.0, E)*(1.0 - smoothstep(900.0, 1000.0, E))
            + 34.0*smoothstep(960.0, 1060.0, E)*(1.0 - smoothstep(${fl(RIM_E - 60)}, ${fl(RIM_E + 30)}, E));
    A *= smoothstep(0.25, 0.7, glen/(2.0*h));
    if (A > 0.0){
      float g1 = gully(p, dir, 230.0, 1.3), g2 = gully(p*1.0 + 31.0, dir, 105.0, 5.7);
      float v1 = 2.0*smoothstep(0.0, 0.85, abs(g1)) - 1.0;
      float v2 = 2.0*smoothstep(0.0, 0.85, abs(g2)) - 1.0;
      E += A*(0.7*v1 + 0.45*v2);
    }
  }
  oCol = vec4(max(E, 0.0), 0.0, 0.0, 1.0);
}
#endif`;

/* Pass B: sun shadow heights (for two sun-disc edges) + sky visibility */
const FS_SHADOW = HDR + COMMON + `
uniform vec3 uSunDir;
uniform float uSunHalf;
layout(location = 0) out vec4 oShadow;
layout(location = 1) out vec4 oSky;
void main(){
  vec2 uv = gl_FragCoord.xy/uFieldRes;
  vec2 p = uWorld.xy + (uv - 0.5)*uWorld.z;
  float texel = uWorld.z/uFieldRes.x;
  float h0 = baseH(p);
  vec2 dir = normalize(uSunDir.xz);
  float el = asin(uSunDir.y);
  float tLo = tan(el - uSunHalf), tHi = tan(el + uSunHalf);
  float m1 = -1e6, m2 = -1e6;
  float d = texel*0.7;
  for (int i = 0; i < 260; i++){
    float hq = baseH(p + dir*d);
    m1 = max(m1, hq - d*tLo);
    m2 = max(m2, hq - d*tHi);
    d += max(texel*0.7, d*0.02);
    if (d > 12000.0) break;
  }
  oShadow = vec4(m1, m2, 0.0, 1.0);
  float vis = 0.0;
  for (int k = 0; k < 12; k++){
    float a = (float(k) + 0.5)/12.0*6.2831853;
    vec2 dd = vec2(cos(a), sin(a));
    float ms = 0.0, s = texel;
    for (int j = 0; j < 20; j++){
      ms = max(ms, (baseH(p + dd*s) - h0)/s);
      s *= 1.42;
    }
    vis += 1.0/(1.0 + ms*ms);
  }
  oSky = vec4(vis/12.0, 0.0, 0.0, 1.0);
}`;

/* Sky LUT: single scattering (Rayleigh + Mie + ozone) for the fixed sun */
const ATMO = `
const float RG = 6360e3, RT = 6460e3;
const vec3 BR = vec3(5.802e-6, 13.558e-6, 33.1e-6);
const float BMS = 3.996e-6, BME = 4.44e-6;
const vec3 BO = vec3(0.650e-6, 1.881e-6, 0.085e-6);
const float HR = 8000.0, HM = 1200.0;
const float ALT0 = 750.0;   // river altitude above sea level
`;
const FS_SKY = HDR + `
uniform vec3 uSunDir; uniform float uHaze; uniform float uAlt;
out vec4 oCol;
` + ATMO + `
vec2 raySphere(vec3 ro, vec3 rd, float r){ float b = dot(ro, rd), c = dot(ro, ro) - r*r, h = b*b - c; if (h < 0.0) return vec2(-1.0); h = sqrt(h); return vec2(-b - h, -b + h); }
vec3 density(float h){ return vec3(exp(-h/HR), exp(-h/HM), max(0.0, 1.0 - abs(h - 25000.0)/15000.0)); }
vec3 extinction(vec3 d){ return BR*d.x + BME*uHaze*d.y + BO*d.z; }
vec3 sunTrans(vec3 p){
  vec2 t = raySphere(p, uSunDir, RT);
  float L = t.y; vec3 od = vec3(0.0);
  for (int i = 0; i < 24; i++){ vec3 q = p + uSunDir*(L*(float(i) + 0.5)/24.0); od += density(length(q) - RG); }
  return exp(-extinction(od*(L/24.0)));
}
void main(){
  vec2 uv = gl_FragCoord.xy/vec2(256.0, 128.0);
  float az = (uv.x - 0.5)*6.2831853;
  float v = uv.y*2.0 - 1.0;
  float el = sign(v)*v*v*1.5707963;
  vec3 rd = vec3(cos(el)*cos(az), sin(el), cos(el)*sin(az));
  vec3 ro = vec3(0.0, RG + uAlt, 0.0);
  vec2 ta = raySphere(ro, rd, RT);
  vec2 tg = raySphere(ro, rd, RG);
  float L = ta.y;
  if (tg.x > 0.0) L = tg.x;
  float mu = dot(rd, uSunDir);
  float phR = 0.0596831*(1.0 + mu*mu);
  float g = 0.78, g2 = g*g;
  float phM = 0.1193662*(1.0 - g2)*(1.0 + mu*mu)/((2.0 + g2)*pow(1.0 + g2 - 2.0*g*mu, 1.5));
  vec3 od = vec3(0.0), sR = vec3(0.0), sM = vec3(0.0);
  const int N = 48;
  float tPrev = 0.0;
  for (int i = 0; i < N; i++){
    float f = (float(i) + 0.5)/float(N);
    float t = L*f*f;
    float dt = L*((float(i) + 1.0)*(float(i) + 1.0) - float(i)*float(i))/float(N*N);
    vec3 p = ro + rd*t;
    vec3 d = density(length(p) - RG);
    od += d*dt;
    vec3 T = exp(-extinction(od))*sunTrans(p);
    sR += T*d.x*dt; sM += T*d.y*dt;
  }
  vec3 col = 20.0*(sR*BR*phR + sM*BMS*uHaze*phM);
  // cheap multiple-scattering lift so the anti-solar sky is not too dark
  col += 20.0*(sR*BR + sM*BMS*uHaze)*0.018;
  oCol = vec4(col, 1.0);
}`;

/* Main scene: ray march terrain, shade, atmosphere */
const FS_SCENE = HDR + COMMON + ATMO + `
uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd;
uniform float uTanHalf, uAspect, uPixAng, uTime, uFrame, uMaxH, uMaxHNear, uHaze, uCanyonHaze;
uniform vec2 uRes, uJitter;
uniform vec3 uSunDir, uSunCol, uSkyIrr, uSkyAmb;
uniform sampler2D uShadow, uSkyVis, uSkyLUT, uStrata;
uniform vec4 uFans[48];
uniform int uNumFans;
out vec4 oCol;

const float STRATA_Y0 = -20.0, STRATA_INV = 1.0/1640.0;

float ign(vec2 p){ p += uFrame*vec2(5.588238, 3.17); return fract(52.9829189*fract(0.06711056*p.x + 0.00583715*p.y)); }

/* --- terrain ----------------------------------------------------------- */
float ridge(float n){ n = 1.0 - abs(n); return n*sqrt(n) - 0.5; }
float detailE(vec2 p, float fp, float E){
  // calm near the water, rugged in the schist gorge, crisp on the upper cliffs
  float base = mix(0.35, 1.0, smoothstep(50.0, 140.0, E));
  float gorge = smoothstep(80.0, 130.0, E)*(1.0 - smoothstep(330.0, 360.0, E));
  float upper = smoothstep(1000.0, 1060.0, E)*(1.0 - smoothstep(${fl(RIM_E - 40)}, ${fl(RIM_E + 40)}, E));
  float a1 = base*(1.0 + 0.5*gorge + 0.4*upper), a2 = base*(1.0 + 1.0*gorge + 0.5*upper);
  float d = 0.0;
  float w2 = 1.0 - smoothstep(7.0, 18.0, fp);
  if (w2 > 0.0){
    d += w2*a1*13.0*(0.5 - abs(vnoise(p*(1.0/66.0) + vec2(3.7, 8.1))));
    float w3 = 1.0 - smoothstep(3.0, 8.0, fp);
    if (w3 > 0.0){
      // domain-warped, rotated octaves so no grid or repeating facet shows
      vec2 q = p + 10.0*vec2(vnoise(p*(1.0/47.0) + vec2(1.0, 5.0)), vnoise(p*(1.0/47.0) + vec2(6.0, 2.0)));
      q = mat2(0.8, -0.6, 0.6, 0.8)*q;
      d += w3*a2*6.5*vnoise(q*(1.0/29.0) + vec2(1.3, 4.4));
      float w4 = 1.0 - smoothstep(1.2, 3.0, fp);
      if (w4 > 0.0){
        q = mat2(0.6, 0.8, -0.8, 0.6)*q;
        d += w4*a2*2.6*ridge(vnoise(q*(1.0/11.0) + vec2(7.1, 0.3)));
        float w5 = 1.0 - smoothstep(0.45, 1.1, fp);
        if (w5 > 0.0){
          q = mat2(0.8, 0.6, -0.6, 0.8)*q;
          d += w5*a2*1.0*vnoise(q*(1.0/4.1) + vec2(2.9, 5.5));
          float w6 = 1.0 - smoothstep(0.15, 0.45, fp);
          if (w6 > 0.0) d += w6*a2*0.35*vnoise(q*(1.0/1.5) + vec2(0.7, 3.3));
        }
      }
    }
  }
  return d;
}
float treeDensity(vec2 p, float E){
  float edge = smoothstep(${fl(RIM_E + 25)}, ${fl(RIM_E + 110)}, E);
  float d = 0.10 + 0.5*smoothstep(${fl(RIM_E + 150)}, ${fl(RIM_E + 1500)}, E) + 0.32*vnoise(p*(1.0/650.0) + vec2(4.1, 1.9))
               + 0.14*vnoise(p*(1.0/150.0) + vec2(8.3, 2.7));
  d *= smoothstep(-0.55, 0.35, vnoise(p*(1.0/55.0) + vec2(2.3, 6.1)) + 0.5*vnoise(p*(1.0/19.0)));   // clumps and clearings
  return clamp(d, 0.0, 0.85)*edge;
}
float treeField(vec2 p, float E, float fp, out float mask){
  mask = 0.0;
  float dens = treeDensity(p, E);
  if (dens <= 0.0) return 0.0;
  float far = smoothstep(0.9, 2.2, fp);
  float avgH = dens*1.8;
  if (far >= 1.0){ mask = dens*0.5; return avgH; }
  const float CS = 8.0;
  vec2 g = p/CS, c = floor(g), f = g - c;
  float h = 0.0, m = 0.0;
  if (hash12(c + 17.31) < dens){
    vec2 rr = hash22(c + 3.17);
    float r = mix(0.17, 0.43, rr.x*rr.x);
    vec2 ctr = vec2(r) + (1.0 - 2.0*r)*hash22(c + 9.71);
    vec2 d = (f - ctr)/r;
    float ang = atan(d.y, d.x + 1e-5);
    float wob = 1.0 + 0.2*sin(ang*3.0 + rr.y*20.0) + 0.12*sin(ang*5.0 + rr.x*31.0);
    float q = 1.0 - dot(d, d)/(wob*wob);
    if (q > 0.0){
      float H = mix(2.6, 7.0, rr.y);
      h = H*pow(q, 0.7)*(0.72 + 0.28*vnoise(p*0.9 + rr*9.0)) + 0.45*vnoise(p*2.6);
      m = smoothstep(0.0, 0.1, q);
    }
  }
  mask = mix(m, dens*0.5, far);
  return mix(h, avgH, far);
}
float plateauDetail(vec2 p, float fp){
  float w = 1.0 - smoothstep(3.0, 9.0, fp);
  if (w <= 0.0) return 0.0;
  float r = 1.0 - abs(vnoise(p*(1.0/41.0) + vec2(2.2, 9.1)));
  return w*(1.3*r*r + 0.45*vnoise(p*(1.0/9.0)) + 0.15*vnoise(p*(1.0/2.7)));
}
// hummocky relief on the broad benches (Tonto platform, Esplanade) in height space
float benchRelief(vec2 p, float E, float fp){
  float m = smoothstep(390.0, 480.0, E)*(1.0 - smoothstep(880.0, 985.0, E))
          + 0.7*smoothstep(1630.0, 1690.0, E)*(1.0 - smoothstep(1780.0, 1840.0, E));
  if (m <= 0.0) return 0.0;
  float r = 0.0;
  float w1 = 1.0 - smoothstep(25.0, 60.0, fp);
  if (w1 > 0.0){
    r += w1*(9.0*vnoise(p*(1.0/340.0) + vec2(4.0, 2.0)) + 4.5*(0.6 - abs(vnoise(p*(1.0/120.0) + vec2(1.0, 7.0)))*1.4));
    float w2 = 1.0 - smoothstep(4.0, 12.0, fp);
    if (w2 > 0.0) r += w2*(1.6*vnoise(p*(1.0/31.0) + vec2(3.0, 3.0)) + 0.6*vnoise(p*(1.0/9.0)));
  }
  return m*r;
}
vec3 voro(vec2 x){
  vec2 n = floor(x), f = x - n;
  float f1 = 8.0, f2 = 8.0, id = 0.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 g = vec2(float(i), float(j));
    vec2 r = g + hash22(n + g) - f;
    float d = dot(r, r);
    if (d < f1){ f2 = f1; f1 = d; id = hash12(n + g + 17.0); } else if (d < f2) f2 = d;
  }
  return vec3(sqrt(f1), sqrt(f2), id);
}
// jointed blocks and cracks on steep rock, only near the camera
float rockBlocks(vec2 p, float fp, float steep, float E){
  float w = (1.0 - smoothstep(1.2, 2.8, fp))*smoothstep(0.5, 1.4, steep)*smoothstep(60.0, 110.0, E);
  if (w <= 0.0) return 0.0;
  vec2 q = p + 4.0*vec2(vnoise(p*(1.0/23.0)), vnoise(p*(1.0/23.0) + 7.0));
  vec3 v = voro(q*(1.0/13.0));
  float crack = smoothstep(0.0, 0.16, v.y - v.x);
  float d = (v.z - 0.5)*3.6 + (crack - 1.0)*2.4;
  float w2 = 1.0 - smoothstep(0.35, 0.9, fp);
  if (w2 > 0.0){
    vec3 v2 = voro(q*(1.0/4.6) + 3.1);
    d += w2*((v2.z - 0.5)*1.2 + (smoothstep(0.0, 0.2, v2.y - v2.x) - 1.0)*0.9);
  }
  return w*d;
}
// bedding ledges on the sedimentary cliffs (height-space terracing)
float ledges(float h, float slope, float fp, float E){
  float w = smoothstep(0.9, 2.2, slope)*(1.0 - smoothstep(0.8, 2.2, fp))*smoothstep(330.0, 380.0, E);
  if (w <= 0.0) return h;
  float band = floor(h*(1.0/19.0));
  float T = 2.6 + 3.2*hash12(vec2(band, 3.7));
  float u = h/T;
  float ter = T*(floor(u) + smoothstep(0.0, 0.55, fract(u)));
  return mix(h, ter, 0.55*w);
}
float terrainH(vec2 p, float fp, out float E){
  E = fieldE(p, fp);
  float ed = E + detailE(p, fp, E);
  vec2 pd = profileYD(ed);
  if (fp < 2.8) { ed += rockBlocks(p, fp, pd.y, E); pd = profileYD(ed); }
  float h = ledges(pd.x, pd.y, fp, E) + benchRelief(p, E, fp);
  if (E > ${fl(RIM_E - 20)}){
    float m;
    h += plateauH(p, E) + treeField(p, E, fp, m) + plateauDetail(p, fp)*smoothstep(${fl(RIM_E)}, ${fl(RIM_E + 60)}, E);
  }
  return h;
}
float terrainHQ(vec2 p, float fp, float t){
  float E = fp < 0.6/uFieldLodK ? fieldEHQ(p) : fieldE(p, fp);
  float ed = E + detailE(p, fp, E);
  vec2 pd = profileYD(ed);
  if (fp < 2.8) { ed += rockBlocks(p, fp, pd.y, E); pd = profileYD(ed); }
  float h = ledges(pd.x, pd.y, fp, E) + benchRelief(p, E, fp);
  if (E > ${fl(RIM_E - 20)}){
    float m;
    h += plateauH(p, E) + treeField(p, E, fp, m) + plateauDetail(p, fp)*smoothstep(${fl(RIM_E)}, ${fl(RIM_E + 60)}, E);
  }
  return h;
}
uniform int uFour;   // always 4; a uniform bound stops compilers from unrolling heavy loops
vec3 terrainNormal(vec2 p, float t){
  float fp = t*uPixAng;
  float e = clamp(fp*0.7, 0.3, 25.0);
  vec4 hh = vec4(0.0);
  for (int i = 0; i < uFour; i++){
    vec2 o = (i == 0) ? vec2(e, 0.0) : (i == 1) ? vec2(-e, 0.0) : (i == 2) ? vec2(0.0, e) : vec2(0.0, -e);
    hh[i] = terrainHQ(p + o, fp, t);
  }
  return normalize(vec3(hh.y - hh.x, 2.0*e, hh.w - hh.z));
}

/* --- ray march (water surface at y = 0 is treated as solid) ---------- */
float castRay(vec3 ro, vec3 rd, float tmax, float kStep, int maxSteps, out bool water, out float Ehit){
  water = false; Ehit = 0.0;
  float t = 0.3;
  if (ro.y > uMaxH){ if (rd.y >= 0.0) return -1.0; t = max(t, (ro.y - uMaxH)/(-rd.y)); }
  float tPrev = t, a = 0.0, b = 0.0, lastH = 0.0;
  int refine = 0;
  for (int i = 0; i < 340; i++){
    if (refine == 0){ if (t > tmax) return -1.0; if (i >= maxSteps) break; }
    vec3 p = ro + rd*t;
    if (refine == 0 && rd.y >= 0.0 && p.y > (t < 12000.0 ? uMaxHNear : uMaxH)) return -1.0;
    float E;
    float hr = terrainH(p.xz, t*uPixAng, E);
    Ehit = E; lastH = hr;
    float d = p.y - max(hr, 0.0);
    if (refine > 0){
      if (d < 0.0) b = t; else a = t;
      if (++refine > 7) break;
      t = 0.5*(a + b);
      continue;
    }
    if (d < 0.0){ refine = 1; a = tPrev; b = t; t = 0.5*(a + b); continue; }
    if (d < 0.0004*t) break;
    tPrev = t;
    t += max(kStep*d, 0.0012*t + 0.05);
  }
  if (lastH < 0.0 && rd.y < 0.0 && ro.y > 0.0){ water = true; t = ro.y/(-rd.y); }
  return t;
}

// low-detail terrain for reflections (smaller code, cheaper per step)
float terrainLow(vec2 p, float fp, out float E){
  E = fieldE(p, fp);
  float h = profileY(E);
  if (E > ${fl(RIM_E - 20)}) h += plateauH(p, E) + treeDensity(p, E)*1.8;
  return h;
}
float castRayLow(vec3 ro, vec3 rd, float tmax, out float Ehit){
  Ehit = 0.0;
  float t = 0.5, tPrev = t, lastD = 1.0;
  for (int i = 0; i < 110; i++){
    if (t > tmax) return -1.0;
    vec3 p = ro + rd*t;
    if (rd.y >= 0.0 && p.y > uMaxHNear) return -1.0;
    float E;
    float d = p.y - max(terrainLow(p.xz, t*uPixAng*2.0, E), 0.0);
    Ehit = E;
    if (d < 0.0){ return mix(tPrev, t, lastD/max(lastD - d, 1e-4)); }
    if (d < 0.001*t) return t;
    tPrev = t; lastD = d;
    t += max(0.6*d, 0.002*t + 0.1);
  }
  return t;
}

/* --- lighting helpers ------------------------------------------------- */
bool inField(vec2 uv){ return all(greaterThan(uv, vec2(0.0))) && all(lessThan(uv, vec2(1.0))); }
float sunVis(vec3 p){
  vec2 uv = worldToUV(p.xz);
  if (!inField(uv)) return 1.0;
  vec2 hs = texture(uShadow, uv).rg;
  return smoothstep(hs.y - 0.5, hs.x + 0.5, p.y);
}
float skyVisAt(vec2 xz){
  vec2 uv = worldToUV(xz);
  return inField(uv) ? texture(uSkyVis, uv).r : 1.0;
}
float detailShadow(vec3 p, float t){
  float fp = t*uPixAng;
  float res = 1.0, s = 0.6 + fp, E;
  for (int i = 0; i < 20; i++){
    vec3 q = p + uSunDir*s;
    if (q.y > uMaxHNear) break;
    float d = q.y - terrainH(q.xz, fp + s*uPixAng*0.5, E);
    res = min(res, 7.0*d/s);
    if (res < 0.001) break;
    s += clamp(0.6*d, 0.9 + fp*0.5 + s*0.06, 90.0);
    if (s > 900.0) break;
  }
  return clamp(res, 0.0, 1.0);
}
float calcAO(vec3 p, vec3 n, float t){
  float fp = t*uPixAng, occ = 0.0, w = 1.0, E;
  for (int i = 0; i < uFour + 1; i++){
    float h = fp + 0.6 + 3.0*float(i) + 3.5*float(i*i);
    vec3 q = p + n*h;
    float d = q.y - terrainH(q.xz, fp, E);
    occ += w*clamp((h - d)/h, 0.0, 1.0);
    w *= 0.72;
  }
  return clamp(1.0 - 0.38*occ, 0.0, 1.0);
}
float bounceSrc(vec3 p){
  vec2 dh = -normalize(uSunDir.xz);
  float s = sunVis(vec3(p.xz + dh*250.0, p.y + 60.0));
  s += sunVis(vec3(p.xz + dh*800.0, p.y + 220.0));
  s += sunVis(vec3(p.xz + dh*1800.0, p.y + 500.0));
  return s/3.0;
}

/* --- materials -------------------------------------------------------- */
vec3 strataCol(float y, float row){ return texture(uStrata, vec2(clamp((y - STRATA_Y0)*STRATA_INV, 0.0, 1.0), row)).rgb; }

vec3 terrainAlbedo(vec3 p, vec3 n, float t, float E){
  float fp = t*uPixAng;
  float ys = p.y + 5.5*vnoise(p.xz*(1.0/1400.0) + vec2(2.0, 7.0)) + 2.0*vnoise(p.xz*(1.0/330.0) + vec2(5.0, 1.0))
           + 0.7*vnoise(p.xz*(1.0/41.0) + vec2(1.0, 3.0))*(1.0 - smoothstep(1.0, 4.0, fp));
  float steep = 1.0 - n.y;

  if (ys < 375.0){
    // foliated schist with irregular pinkish granite masses
    float fo = vnoise3(p*vec3(1.0/26.0, 1.0/9.0, 1.0/26.0) + vec3(3.0, 1.0, 7.0));
    col *= 1.0 + 0.12*fo;

    col = mix(col, vec3(0.13, 0.085, 0.07), gm*0.55*smoothstep(380.0, 345.0, ys)*smoothstep(4.0, 14.0, ys));
  }
  // blotches of darker and lighter rock (rockfall scars, varnish)
  float bl = vnoise3(p*(1.0/48.0) + vec3(1.7, 3.1, 0.4))*0.6 + vnoise3(p*(1.0/14.0) + vec3(5.2, 0.8, 2.6))*0.4;
  col *= 1.0 + 0.22*bl*(1.0 - smoothstep(4.0, 14.0, fp));
  float pn = vnoise(p.xz*(1.0/600.0) + 1.3)*0.6 + vnoise(p.xz*(1.0/150.0) + 7.1)*0.4;
  col *= 1.0 + 0.13*pn;
  float sf = 1.0 - smoothstep(3.0, 10.0, fp);
  if (cliff > 0.0 && sf > 0.0){
    float s = vnoise3(vec3(p.x/9.0, p.y/85.0, p.z/9.0))*0.65 + vnoise3(vec3(p.x/3.0, p.y/30.0, p.z/3.0))*0.35;
    col *= 1.0 - 0.32*cliff*smoothstep(0.0, 0.75, s)*sf;
  }
  if (fp < 1.6) col *= 1.0 + 0.10*vnoise(p.xz*0.9 + p.y*0.37)*(1.0 - smoothstep(0.5, 1.6, fp));
  // sparse desert shrubs on benches and slopes
  float flatness = smoothstep(0.34, 0.10, steep);
  float veg = 0.42*smoothstep(440.0, 470.0, ys)*smoothstep(570.0, 530.0, ys)
            + 0.10*smoothstep(780.0, 800.0, ys)*smoothstep(1160.0, 1110.0, ys)
            + 0.07*smoothstep(1250.0, 1270.0, ys)*smoothstep(1400.0, 1380.0, ys);
  veg *= flatness;
  if (veg > 0.0){
    float patchy = 0.75 + 0.25*vnoise(p.xz*(1.0/160.0) + vec2(3.0, 8.0)) + 0.12*vnoise(p.xz*(1.0/37.0));
    float dots = smoothstep(0.5, 0.75, vnoise(p.xz*(1.0/1.7)) + 0.35*vnoise(p.xz*(1.0/6.0)) + 0.25*vnoise(p.xz*(1.0/23.0)));
    float cov = mix(dots*patchy, 0.2*patchy, smoothstep(0.35, 1.4, fp));
    col = mix(col, vec3(0.05, 0.055, 0.04), clamp(veg*cov*2.0, 0.0, 0.8));
    // stony desert pavement and pale washes
    col *= 1.0 + 0.16*vnoise(p.xz*(1.0/7.0) + vec2(1.0, 2.0))*(1.0 - smoothstep(1.0, 4.0, fp));
  }
  // beaches only in places; elsewhere the bank is dark boulders
  float bank = smoothstep(-1.0, 1.0, p.y)*(1.0 - smoothstep(6.0, 10.0, p.y));
  if (bank > 0.0){
    float sandy = smoothstep(-0.15, 0.35, vnoise(p.xz*(1.0/380.0) + vec2(4.4, 2.2)) + 0.3*vnoise(p.xz*(1.0/70.0)));
    vec3 boulders = vec3(0.06, 0.055, 0.05)*(1.0 + 0.6*vnoise(p.xz*(1.0/3.0)));
    col = mix(col, boulders, bank*(1.0 - sandy)*0.85);
  }
  // riparian green along the banks
  float rip = smoothstep(1.0, 2.5, p.y)*(1.0 - smoothstep(7.0, 13.0, p.y))*(1.0 - smoothstep(95.0, 140.0, E));
  if (rip > 0.0){
    float rv = smoothstep(0.05, 0.6, vnoise(p.xz*(1.0/9.0)) + 0.6*vnoise(p.xz*(1.0/70.0)) + 0.3*vnoise(p.xz*(1.0/3.0)));
    col = mix(col, vec3(0.028, 0.038, 0.020)*(1.0 + 0.4*vnoise(p.xz*0.7)), rip*rv*0.8);
  }
  // plateau: soil, grass and pinyon-juniper woodland
  if (E > ${fl(RIM_E - 20)}){
    float pm = smoothstep(${fl(RIM_E - 5)}, ${fl(RIM_E + 40)}, E)*smoothstep(0.45, 0.15, steep);
    float sv = vnoise(p.xz*(1.0/90.0));
    vec3 soil = mix(vec3(0.27, 0.185, 0.125), vec3(0.24, 0.21, 0.15), 0.5 + 0.5*sv);
    float rk = smoothstep(0.25, 0.75, vnoise(p.xz*(1.0/17.0) + 4.0) + 0.5*vnoise(p.xz*(1.0/5.0) + 1.0));
    soil = mix(soil, vec3(0.37, 0.35, 0.31), rk*0.6);
    float gr = smoothstep(-0.2, 0.6, vnoise(p.xz*(1.0/40.0) + 9.0));
    soil = mix(soil, vec3(0.31, 0.27, 0.15), gr*0.35);
    if (fp < 1.5) soil *= 1.0 + 0.18*vnoise(p.xz*1.7)*(1.0 - smoothstep(0.5, 1.5, fp));
    float shrub = smoothstep(0.45, 0.75, vnoise(p.xz*(1.0/1.9) + 2.0) + 0.3*vnoise(p.xz*(1.0/7.0)));
    shrub = mix(shrub, 0.34, smoothstep(0.35, 1.4, fp));
    soil = mix(soil*0.9, vec3(0.06, 0.065, 0.045), shrub*0.8);
    col = mix(col, soil, pm*0.85);
    float tm;
    treeField(p.xz, E, fp, tm);
    vec3 tree = mix(vec3(0.016, 0.022, 0.016), vec3(0.026, 0.031, 0.020), 0.5 + 0.5*vnoise(p.xz*0.37));
    float far = smoothstep(0.9, 2.2, fp);
    float dens = treeDensity(p.xz, E);
    col *= 1.0 - 0.85*far*(1.0 - exp(-dens*2.2));   // cast shadows of unresolved trees
    col = mix(col, tree, tm);
  }
  return col;
}

/* --- sky and atmosphere ---------------------------------------------- */
vec3 skyLUT(vec3 rd){
  float az = atan(rd.z, rd.x);
  float el = asin(clamp(rd.y, -1.0, 1.0));
  float v = sign(el)*sqrt(abs(el)/1.5707963);
  return texture(uSkyLUT, vec2(az/6.2831853 + 0.5, v*0.5 + 0.5)).rgb;
}
// distant mesas and a far volcanic massif on the horizon (elevation angle in radians)
float horizonRidge(vec3 rd){
  vec2 cdir = normalize(rd.xz);
  float b = atan(cdir.x, cdir.y);
  float h = 0.0022*(0.5 + 0.5*vnoise(cdir*5.0 + vec2(3.1, 7.3))) + 0.0012*(0.5 + 0.5*vnoise(cdir*13.0 + vec2(1.7, 4.2)))
          + 0.0006*(0.5 + 0.5*vnoise(cdir*37.0 + vec2(5.5, 2.8)));
  h = h - 0.0012;
  float pk = b - 2.88;                       // massif far to the south-south-east
  pk = atan(sin(pk), cos(pk));
  h = max(h, 0.0185*exp(-pk*pk/0.0035)*(0.85 + 0.15*vnoise(cdir*60.0)) - 0.001);
  return h;
}
float cloudDens(vec2 q){
  vec2 w = q*(1.0/10000.0) + uTime*vec2(0.0011, 0.0005);
  vec2 s = vec2(dot(w, vec2(0.83, 0.56)), dot(w, vec2(-0.56, 0.83))*2.6);
  s += 0.11*vec2(vnoise(s*0.9 + 3.3), vnoise(s*0.9 + 8.1));          // gently curl the wisps
  float n = 0.5*vnoise(s) + 0.25*vnoise(s*2.03 + 1.7) + 0.13*vnoise(s*4.1 + 4.4) + 0.07*vnoise(s*8.3 + 2.9);
  float cov = 0.5 + 0.5*vnoise(w*0.45 + vec2(3.0, 1.0));
  float base = smoothstep(0.24 - 0.36*cov, 0.80 - 0.36*cov, n);
  vec2 f = vec2(s.x*9.0, s.y*1.25);                                     // fibrous striations
  float fib = 0.5 + 0.42*vnoise(f + 6.1) + 0.24*vnoise(f*2.3 + 3.3) + 0.12*vnoise(f*5.1 + 1.7);
  return base*clamp(fib, 0.0, 1.0);
}
vec3 skyColor(vec3 rd, bool withSun){
  vec3 c = skyLUT(rd);
  float el = asin(clamp(rd.y, -1.0, 1.0));
  float hr = horizonRidge(rd);
  float px = uPixAng*0.7;
  float mtn = 1.0 - smoothstep(hr - px, hr + px, el);
  vec3 sunC = uSunCol*vec3(1.0, 0.82, 0.70);
  float mu = dot(rd, uSunDir);
  if (withSun){
    float a = acos(clamp(mu, -1.0, 1.0));
    float r = a/0.00475;
    if (r < 1.6){
      float limb = 0.4 + 0.6*sqrt(max(0.0, 1.0 - min(r, 1.0)*min(r, 1.0)));
      float edge = 1.0 - smoothstep(0.9, 1.0 + 0.5*uPixAng/0.00475, r);
      c += uSunCol*900.0*limb*edge*(1.0 - mtn);
    }
  }
  // high cirrus lit by the setting sun
  if (rd.y > 0.002){
    float t = (6500.0 - uCamPos.y)/rd.y;
    vec2 q = uCamPos.xz + rd.xz*t;
    float d = cloudDens(q);
    if (d > 0.0){
      float ds = cloudDens(q + normalize(uSunDir.xz)*900.0);
      float hg = 0.0795775*(1.0 - 0.5184)/pow(1.0 + 0.5184 - 1.44*mu, 1.5);
      vec3 cc = sunC*vec3(1.0, 0.9, 0.86)*(0.07 + 0.42*hg)*(1.0 - 0.3*ds) + uSkyIrr*0.2;
      float fade = smoothstep(0.003, 0.07, rd.y)*exp(-t*(1.0/160000.0));
      c = mix(c, cc, d*0.66*fade);
    }
  }
  // far horizon silhouettes, lost in haze
  if (mtn > 0.0){
    vec3 hz = skyLUT(normalize(vec3(rd.x, 0.004, rd.z)));
    c = mix(c, hz*vec3(0.80, 0.80, 0.86), mtn);
  }
  return c;
}
vec3 atmosphere(vec3 col, vec3 ro, vec3 rd, float tEnd){
  float mu = dot(rd, uSunDir);
  float phR = 0.0596831*(1.0 + mu*mu);
  float g = 0.80, g2 = g*g;
  float phM = 0.1193662*(1.0 - g2)*(1.0 + mu*mu)/((2.0 + g2)*pow(1.0 + g2 - 2.0*g*mu, 1.5));
  float gc = 0.5, gc2 = gc*gc;
  float phC = 0.1193662*(1.0 - gc2)*(1.0 + mu*mu)/((2.0 + gc2)*pow(1.0 + gc2 - 2.0*gc*mu, 1.5));
  float jit = ign(gl_FragCoord.xy);
  vec3 od = vec3(0.0), aS = vec3(0.0), aA = vec3(0.0);
  const int N = 22;
  float tPrev = 0.0;
  for (int i = 0; i < N; i++){
    float f = (float(i) + jit)/float(N);
    float ti = tEnd*f*f;
    float dt = ti - tPrev; tPrev = ti;
    vec3 x = ro + rd*ti;
    float alt = x.y + ALT0;
    float dR = exp(-alt/HR);
    float dM = exp(-alt/HM)*uHaze;
    float dC = uCanyonHaze*exp(-max(x.y, 0.0)/420.0);
    vec3 ext = BR*dR + (BME*dM + dC*1.1);
    vec3 T = exp(-od - ext*dt*0.5);
    od += ext*dt;
    float vis = (x.y > uMaxHNear) ? 1.0 : sunVis(x);
    vec3 sc = BR*dR*phR + BMS*dM*phM + dC*phC;
    aS += T*sc*vis*dt;
    float sva = mix(skyVisAt(x.xz), 1.0, clamp(x.y*(1.0/1400.0), 0.0, 1.0));
    aA += T*(BR*dR + BMS*dM + dC)*dt*sva;
  }
  // remaining segment after the last sample
  {
    vec3 x = ro + rd*tEnd;
    float alt = x.y + ALT0;
    float dR = exp(-alt/HR), dM = exp(-alt/HM)*uHaze, dC = uCanyonHaze*exp(-max(x.y, 0.0)/420.0);
    float dt = tEnd - tPrev;
    vec3 ext = BR*dR + (BME*dM + dC*1.1);
    vec3 T = exp(-od - ext*dt*0.5);
    od += ext*dt;
    float vis = (x.y > uMaxHNear) ? 1.0 : sunVis(x + vec3(0.0, 5.0, 0.0));
    aS += T*(BR*dR*phR + BMS*dM*phM + dC*phC)*vis*dt;
    float sva = mix(skyVisAt(x.xz), 1.0, clamp(x.y*(1.0/1400.0), 0.0, 1.0));
    aA += T*(BR*dR + BMS*dM + dC)*dt*sva;
  }
  vec3 tr = exp(-od);
  return col*tr + aS*uSunCol + aA*uSkyAmb*0.6;
}

/* --- shading --------------------------------------------------------- */
vec3 shadeTerrain(vec3 p, vec3 rd, float t, float E){
  vec3 n = terrainNormal(p.xz, t);
  vec3 alb = terrainAlbedo(p, n, t, E);
  float ndl = dot(n, uSunDir);
  float sh = 0.0;
  if (ndl > 0.0){
    sh = sunVis(p + n*2.0 + vec3(0.0, 2.5, 0.0));
    if (sh > 0.0 && t < 3500.0) sh *= mix(detailShadow(p + n*0.25, t), 1.0, smoothstep(2500.0, 3500.0, t));
  }
  float ao = calcAO(p, n, t);
  float sv = skyVisAt(p.xz);
  vec3 sky = uSkyIrr*(0.6 + 0.4*n.y)*mix(sv, 1.0, 0.12)*ao;
  vec3 bdir = normalize(vec3(-uSunDir.x, 0.15, -uSunDir.z));
  float bsrc = bounceSrc(p);
  vec3 bounce = uSunCol*vec3(0.40, 0.27, 0.20)*0.23*(0.3 + 0.7*max(dot(n, bdir), 0.0))*(1.0 - 0.75*sv)*ao*bsrc;
  vec3 sun = uSunCol*max(ndl, 0.0)*sh;
  return alb*(1.0/PI)*(sun + sky + bounce);
}
vec3 shadeTerrainCheap(vec3 p, float t, float E){
  float fp = t*uPixAng;
  float e = clamp(fp*1.5, 2.0, 40.0), E2;
  vec4 hh = vec4(0.0);
  for (int i = 0; i < uFour; i++){
    vec2 o = (i == 0) ? vec2(e, 0.0) : (i == 1) ? vec2(-e, 0.0) : (i == 2) ? vec2(0.0, e) : vec2(0.0, -e);
    hh[i] = terrainLow(p.xz + o, fp, E2);
  }
  vec3 n = normalize(vec3(hh.y - hh.x, 2.0*e, hh.w - hh.z));
  vec3 alb = terrainAlbedo(p, n, t, E);
  float ndl = max(dot(n, uSunDir), 0.0);
  float sh = ndl > 0.0 ? sunVis(p + n*2.0 + vec3(0.0, 2.5, 0.0)) : 0.0;
  float sv = skyVisAt(p.xz);
  vec3 bdir = normalize(vec3(-uSunDir.x, 0.15, -uSunDir.z));
  vec3 bounce = uSunCol*vec3(0.42, 0.27, 0.19)*0.32*(0.3 + 0.7*max(dot(n, bdir), 0.0))*(1.0 - 0.75*sv)*bounceSrc(p);
  return alb*(1.0/PI)*(uSunCol*ndl*sh + uSkyIrr*(0.6 + 0.4*n.y)*sv + bounce);
}

// how much white water: rapids form just downstream of the debris fans
float rapidsAt(vec3 p){
  float r = 0.0;
  for (int i = 0; i < 48; i++){
    if (i >= uNumFans) break;
    vec4 f = uFans[i];
    float s = p.z - f.y;
    if (s < -100.0 || s > 360.0) continue;
    float w = smoothstep(-70.0, 10.0, s)*(1.0 - smoothstep(110.0, 330.0, s));
    w *= 1.0 - smoothstep(60.0, 140.0, abs(p.x - f.x));
    r = max(r, w);
  }
  return r;
}
float waterH(vec2 q, float fp, float rap){
  float tm = uTime, h = 0.0;
  float streak = 0.45 + 0.9*smoothstep(-0.35, 0.55, vnoise(vec2(q.x/16.0, (q.y - tm*2.4)/150.0)) + 0.4*vnoise(vec2(q.x/5.0, (q.y - tm*2.4)/60.0)));
  float amp = streak*(1.0 + 2.6*rap);
  float a = 1.0 - smoothstep(3.0, 10.0, fp);
  if (a > 0.0) h += a*0.30*amp*vnoise(vec2(q.x/13.0, (q.y - tm*2.6)/24.0));
  float b = 1.0 - smoothstep(1.0, 4.0, fp);
  if (b > 0.0) h += b*0.10*amp*vnoise(vec2(q.x/4.2, (q.y - tm*2.9)/6.5) + 3.1);
  float c = 1.0 - smoothstep(0.35, 1.4, fp);
  if (c > 0.0) h += c*0.035*amp*vnoise(vec2(q.x/1.3, (q.y - tm*3.1)/1.9) + 7.3);
  if (rap > 0.0 && a > 0.0) h += a*rap*0.45*sin(q.y*0.42 - tm*0.6 + 2.0*vnoise(q*0.05))*(0.6 + 0.4*vnoise(q*0.2));
  return h;
}
vec3 shadeWater(vec3 p, vec3 rd, float t){
  float fp = t*uPixAng;
  vec2 tg = normalize(vec2(riverXd(p.z), 1.0)), nm = vec2(tg.y, -tg.x);
  vec2 q = vec2(dot(p.xz, nm), dot(p.xz, tg));
  float rap = rapidsAt(p);
  float e = max(0.12, fp*0.5);
  float h0 = waterH(q, fp, rap), hx = waterH(q + vec2(e, 0.0), fp, rap), hy = waterH(q + vec2(0.0, e), fp, rap);
  vec2 gq = vec2(hx - h0, hy - h0)/e;
  vec2 gw = gq.x*nm + gq.y*tg;
  vec3 n = normalize(vec3(-gw.x, 1.0, -gw.y));
  float cosi = max(dot(n, -rd), 0.0);
  float F = 0.02 + 0.98*pow(1.0 - cosi, 5.0);
  vec3 rr = reflect(rd, n); rr.y = max(rr.y, 0.003);
  rr = normalize(rr);
  float E2;
  float tr = castRayLow(p + vec3(0.0, 0.4, 0.0), rr, 30000.0, E2);
  vec3 refl;
  if (tr > 0.0){
    vec3 hp = p + rr*tr;
    refl = atmosphere(shadeTerrainCheap(hp, t + tr, E2), p, rr, tr);
  } else refl = skyColor(rr, false);
  float sh = sunVis(p + vec3(0.0, 1.5, 0.0));
  float sv = skyVisAt(p.xz);
  float E3; float depth = max(0.0, -terrainLow(p.xz, fp, E3));
  vec3 bed = vec3(0.09, 0.085, 0.065);
  vec3 deep = vec3(0.018, 0.050, 0.036);
  vec3 bodyAlb = mix(bed, deep, 1.0 - exp(-depth*0.5));
  vec3 lightIn = uSunCol*max(uSunDir.y, 0.0)*sh + uSkyIrr*mix(sv, 1.0, 0.2);
  vec3 body = bodyAlb*lightIn*(1.0/PI);
  vec3 hv = normalize(uSunDir - rd);
  float rough = 0.06 + min(fp*0.02, 0.2) + rap*0.1;
  float ndh = max(dot(n, hv), 0.0);
  float a2 = rough*rough;
  float dd = ndh*ndh*(a2 - 1.0) + 1.0;
  float D = a2/(PI*dd*dd);
  vec3 col = mix(body, refl, F) + uSunCol*D*F*0.25*sh;
  // white water
  if (rap > 0.0){
    float fn = vnoise(vec2(q.x/5.5, (q.y - uTime*4.2)/12.0)) + 0.55*vnoise(vec2(q.x/2.2, (q.y - uTime*4.8)/4.5) + 3.0);
    float foam = smoothstep(0.25, 0.95, fn*0.8 + 0.3)*rap;
    foam = mix(foam, rap*0.55, smoothstep(0.6, 2.5, fp));
    vec3 fc = vec3(0.62, 0.64, 0.62)*lightIn*(1.0/PI);
    col = mix(col, fc, clamp(foam, 0.0, 0.92));
  }
  return col;
}

void main(){
  vec2 frag = gl_FragCoord.xy + uJitter;
  vec2 ndc = frag/uRes*2.0 - 1.0;
  vec3 rd = normalize(uCamFwd + ndc.x*uAspect*uTanHalf*uCamRight + ndc.y*uTanHalf*uCamUp);
  vec3 ro = uCamPos;
  bool water; float E;
  float t = castRay(ro, rd, 90000.0, 0.42, 320, water, E);
  vec3 col; float depth;
  if (t < 0.0){
    col = skyColor(rd, true);
    depth = 10000.0;
  } else {
    vec3 p = ro + rd*t;
    col = water ? shadeWater(p, rd, t) : shadeTerrain(p, rd, t, E);
    col = atmosphere(col, ro, rd, t);
    // very distant terrain dissolves into the horizon sky
    float farF = (1.0 - exp(-max(t - 7000.0, 0.0)*(1.0/42000.0)))*0.9;
    col = mix(col, skyLUT(normalize(vec3(rd.x, max(rd.y, 0.0) + 0.002, rd.z))), farF);
    depth = t*0.001;
  }
  oCol = vec4(max(col, vec3(0.0)), depth);
}`;

/* Temporal anti-aliasing with reprojection and neighbourhood clipping */
const FS_TAA = HDR + `
uniform sampler2D uCur, uHist;
uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd, uPCamPos, uPCamRight, uPCamUp, uPCamFwd;
uniform float uTanHalf, uAspect, uBlend, uClamp;
uniform vec2 uRes;
out vec4 oCol;
vec3 toY(vec3 c){ return vec3(0.25*c.r + 0.5*c.g + 0.25*c.b, 0.5*c.r - 0.5*c.b, -0.25*c.r + 0.5*c.g - 0.25*c.b); }
vec3 fromY(vec3 y){ return vec3(y.x + y.y - y.z, y.x + y.z, y.x - y.y - y.z); }
vec3 tm(vec3 c){ return c/(1.0 + max(c.r, max(c.g, c.b))); }
vec3 itm(vec3 c){ return c/max(1.0 - max(c.r, max(c.g, c.b)), 1e-4); }
vec4 histCR(vec2 uv){
  vec2 sp = uv*uRes, tc = floor(sp - 0.5) + 0.5, f = sp - tc;
  vec2 w0 = f*(-0.5 + f*(1.0 - 0.5*f)), w1 = 1.0 + f*f*(-2.5 + 1.5*f), w2 = f*(0.5 + f*(2.0 - 1.5*f)), w3 = f*f*(-0.5 + 0.5*f);
  vec2 w12 = w1 + w2, tc0 = (tc - 1.0)/uRes, tc3 = (tc + 2.0)/uRes, tc12 = (tc + w2/w12)/uRes;
  vec4 r = texture(uHist, vec2(tc12.x, tc0.y))*(w12.x*w0.y) + texture(uHist, vec2(tc0.x, tc12.y))*(w0.x*w12.y)
         + texture(uHist, tc12)*(w12.x*w12.y) + texture(uHist, vec2(tc3.x, tc12.y))*(w3.x*w12.y)
         + texture(uHist, vec2(tc12.x, tc3.y))*(w12.x*w3.y);
  return r/((w12.x*w0.y) + (w0.x*w12.y) + (w12.x*w12.y) + (w3.x*w12.y) + (w12.x*w3.y));
}
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);

    const up0 = V.cross(right0, fwd);
    fwd = V.norm(V.add(V.add(V.mul(fwd, Math.cos(yaw) * Math.cos(pitch)), V.mul(right0, Math.sin(yaw) * Math.cos(pitch))), V.mul(up0, Math.sin(pitch))));
  }
  let right = V.norm(V.cross(fwd, [0, 1, 0]));
  let up = V.cross(right, fwd);
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const r2 = V.add(V.mul(right, cr), V.mul(up, sr)), u2 = V.sub(V.mul(up, cr), V.mul(right, sr));
  const hfov = 72 * Math.PI / 180;
  const tanHalf = Math.tan(hfov / 2) / aspect;
  return {pos, fwd, right: r2, up: u2, tanHalf, speed};
}

/* ----------------------------------------------------------- render targets */
let RT = null;
function allocTargets(w, h) {
  if (RT) { freeTarget(RT.scene); RT.hist.forEach(freeTarget); RT.bloom.forEach(freeTarget); }
  RT = {w, h};
  RT.scene = makeTarget(w, h, [[gl.RGBA16F, gl.NEAREST]]);
  RT.hist = [makeTarget(w, h, [[gl.RGBA16F, gl.LINEAR]]), makeTarget(w, h, [[gl.RGBA16F, gl.LINEAR]])];
  RT.bloom = [];
  let bw = w, bh = h;
  for (let i = 0; i < 6; i++) { bw = Math.max(1, bw >> 1); bh = Math.max(1, bh >> 1); RT.bloom.push(makeTarget(bw, bh, [[gl.RGBA16F, gl.LINEAR]])); }
  RT.histIdx = 0; RT.valid = false;
}

const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
let frameNo = 0, prevCam = null, expoIdx = 0;

function renderFrame(time, cam, opts) {
  const w = RT.w, h = RT.h;
  const jit = opts.jitter || [halton(frameNo % 16 + 1, 2) - 0.5, halton(frameNo % 16 + 1, 3) - 0.5];
  const pixAng = 2 * cam.tanHalf / h;
  draw(P.scene, RT.scene, {
    uWorld: [WORLD_C[0], WORLD_C[1], WORLD_SIZE, 1 / WORLD_SIZE], uFieldRes: [FIELD_N, FIELD_N], uFieldLodK: FIELD_N / WORLD_SIZE, uField: R.field.tex, uProfile: R.profile,
    uCamPos: cam.pos, uCamRight: cam.right, uCamUp: cam.up, uCamFwd: cam.fwd, uTanHalf: cam.tanHalf, uAspect: w / h,
    uPixAng: pixAng, uTime: time, uFrame: frameNo % 64, uMaxH: S.maxH, uMaxHNear: S.maxHNear, uHaze: HAZE, uCanyonHaze: CANYON_HAZE,
    uRes: [w, h], uJitter: jit, uSunDir: SUN, uSunCol: S.sunCol, uSkyIrr: S.skyIrr, uSkyAmb: S.skyAmb,
    uShadow: R.shadow.texs[0], uSkyVis: R.shadow.texs[1], uSkyLUT: R.sky.tex, uStrata: R.strata,
    uFans: S.fans, uNumFans: S.numFans, uFour: 4,
  }, opts.rect);
  if (opts.rect && !opts.lastTile) return;
  const src = RT.hist[RT.histIdx], dst = RT.hist[1 - RT.histIdx];
  const pc = prevCam || cam;
  draw(P.taa, dst, {
    uCur: RT.scene.tex, uHist: src.tex, uCamPos: cam.pos, uCamRight: cam.right, uCamUp: cam.up, uCamFwd: cam.fwd,
    uPCamPos: pc.pos, uPCamRight: pc.right, uPCamUp: pc.up, uPCamFwd: pc.fwd, uTanHalf: cam.tanHalf, uAspect: w / h,
    uBlend: RT.valid ? (opts.blend != null ? opts.blend : 0.1) : 1.0, uClamp: opts.noClamp ? 0 : 1, uRes: [w, h],
  });
  RT.histIdx = 1 - RT.histIdx; RT.valid = true; prevCam = cam; frameNo++;
}
function post(time, opts) {
  const img = RT.hist[RT.histIdx];
  let src = img;
  for (let i = 0; i < RT.bloom.length; i++) {
    const d = RT.bloom[i];
    draw(P.down, d, {uSrc: src.tex, uSrcTexel: [1 / src.w, 1 / src.h], uDstRes: [d.w, d.h], uFirst: i === 0 ? 1 : 0});
    src = d;
  }
  // exposure metering on the 1/16 level
  const ePrev = R.expo[expoIdx], eNext = R.expo[1 - expoIdx];
  draw(P.meter, eNext, {uSrc: RT.bloom[3].tex, uPrev: ePrev.tex, uRate: opts.meterRate != null ? opts.meterRate : 0.03});
  expoIdx = 1 - expoIdx;
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = RT.bloom.length - 1; i > 0; i--) {
    const s = RT.bloom[i], d = RT.bloom[i - 1];
    draw(P.up, d, {uSrc: s.tex, uSrcTexel: [1 / s.w, 1 / s.h], uDstRes: [d.w, d.h], uWeight: 1.0});
  }
  gl.disable(gl.BLEND);
  draw(P.final, null, {
    uImg: img.tex, uBloom: RT.bloom[0].tex, uExpo: R.expo[expoIdx].tex, uOutRes: [canvas.width, canvas.height], uInRes: [RT.w, RT.h],
    uTime: time, uFade: opts.fade != null ? opts.fade : 1, uBloomStr: 0.045, uExpBase: 1.0, uSharp: RT.w < canvas.width ? 0.35 : 0.18, uGrain: 0.022,
  });
}

/* --------------------------------------------------------------- layout */
let letterbox = true;
const LB_ASPECT = 2.39;
function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  let w = W, h = H;
  if (letterbox && W / H < LB_ASPECT + 0.01) h = Math.round(W / LB_ASPECT);
  else if (letterbox) w = Math.round(H * LB_ASPECT);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  const maxPx = 3.2e6;
  if (cw * ch > maxPx) { const s = Math.sqrt(maxPx / (cw * ch)); cw = Math.round(cw * s); ch = Math.round(ch * s); }
  canvas.width = cw; canvas.height = ch;
}

/* --------------------------------------------------------------- still API */
async function renderStill(t, w, h, spp, opts = {}) {
  canvas.width = w; canvas.height = h;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  if (!RT || RT.w !== w || RT.h !== h) allocTargets(w, h);
  RT.valid = false; prevCam = null;
  if (opts.yaw != null) look.yaw = opts.yaw; if (opts.pitch != null) look.pitch = opts.pitch;
  const cam = opts.cam || cameraAt(t, w / h);
  const tiles = opts.tiles || 4;
  for (let i = 0; i < spp; i++) {
    const jit = spp === 1 ? [0, 0] : [halton(i + 1, 2) - 0.5, halton(i + 1, 3) - 0.5];
    for (let k = 0; k < tiles; k++) {
      const y0 = Math.floor(k * h / tiles), y1 = Math.floor((k + 1) * h / tiles);
      renderFrame(t, cam, {jitter: jit, rect: [0, y0, w, y1 - y0], lastTile: k === tiles - 1, blend: 1 / (i + 1), noClamp: true});
      gl.finish();
      await sleep(0);
    }
  }
  post(t, {meterRate: 1});
  gl.finish();
  return canvas.toDataURL('image/png');
}
window.renderStill = renderStill;
// sequence rendering through the real-time TAA path (used for motion checks)
window.__seqInit = (w, h) => {
  canvas.width = w; canvas.height = h; stage.style.width = w + 'px'; stage.style.height = h + 'px';
  allocTargets(w, h); RT.valid = false; prevCam = null; frameNo = 0;
};
window.__seqFrame = async (t, tiles) => {
  const cam = cameraAt(t, RT.w / RT.h);
  const n = tiles || 1;
  for (let k = 0; k < n; k++) {
    const y0 = Math.floor(k * RT.h / n), y1 = Math.floor((k + 1) * RT.h / n);
    renderFrame(t, cam, {rect: [0, y0, RT.w, y1 - y0], lastTile: k === n - 1});
    gl.finish(); await sleep(0);
  }
  post(t, {});
  gl.finish();
  return canvas.toDataURL('image/png');
};
window.__cameraAt = (t) => cameraAt(t, LB_ASPECT);
window.__groundJS = groundJS;
window.__profileJS = profileJS;
window.__riverX = riverX;
window.__setKeys = (k) => { window.__keys = k; buildPath(); };
window.__getField = (step) => { const N = FIELD_N, s = step || 4, M = N / s, out = new Float32Array(M * M); for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) out[j * M + i] = FIELD[(j * s) * N + i * s]; let b = ''; const u8 = new Uint8Array(out.buffer); for (let i = 0; i < u8.length; i += 32768) b += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(b); };

/* ------------------------------------------------------------- wind sound */
/* Procedural wind: looping brown noise through a low rumble and an airy band,
   modulated by flight speed and slow gusts. Off until the viewer presses S. */
let audio = null;
function toggleSound() {
  if (!audio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC(), sr = ctx.sampleRate, len = Math.floor(sr * 6), fade = Math.floor(sr * 0.5);
    const buf = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const tmp = new Float32Array(len + fade);
      let last = 0;
      for (let i = 0; i < tmp.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; tmp[i] = last * 3.5; }
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = tmp[i];
      for (let i = 0; i < fade; i++) { const w = i / fade; d[i] = d[i] * w + tmp[len + i] * (1 - w); }   // seamless loop
    }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const low = ctx.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 360;
    const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 900; band.Q.value = 0.55;
    const gLow = ctx.createGain(), gBand = ctx.createGain(), master = ctx.createGain();
    gLow.gain.value = 0.5; gBand.gain.value = 0.1; master.gain.value = 0;
    src.connect(low); low.connect(gLow); gLow.connect(master);
    src.connect(band); band.connect(gBand); gBand.connect(master);
    master.connect(ctx.destination);
    src.start();
    audio = {ctx, band, gLow, gBand, master, on: false};
  }
  audio.on = !audio.on;
  if (audio.ctx.state === 'suspended') audio.ctx.resume();
  audio.master.gain.setTargetAtTime(audio.on ? 0.6 : 0, audio.ctx.currentTime, 0.5);
}
function updateSound(cam, t, fade) {
  if (!audio || !audio.on) return;
  const ct = audio.ctx.currentTime;
  const gust = 0.65 + 0.35 * Math.sin(t * 0.37) * Math.sin(t * 0.23 + 1.3);
  const sp = Math.min(1.4, cam.speed / 95);
  audio.gLow.gain.setTargetAtTime((0.45 + 0.3 * gust) * fade, ct, 0.3);
  audio.gBand.gain.setTargetAtTime((0.06 + 0.2 * sp * gust) * fade, ct, 0.3);
  audio.band.frequency.setTargetAtTime(550 + 650 * sp, ct, 0.6);
}

/* ------------------------------------------------------------ interactive */
let playing = true, animT = 0, lastNow = 0, uiHidden = false, perfAcc = 0, perfN = 0, scale = 1, lastScaleChange = 0, loops = 0, idleFrames = 0;
function chooseInternal() {
  perfAcc = 0; perfN = 0; idleFrames = 0;
  const cw = canvas.width, ch = canvas.height;
  const budget = 1.15e6;
  scale = Math.min(scale, 1, Math.sqrt(budget / (cw * ch)));
  const w = Math.max(320, Math.round(cw * scale)), h = Math.max(140, Math.round(ch * scale));
  if (!RT || RT.w !== w || RT.h !== h) allocTargets(w, h);
}
function showUI(on) {
  $('hint').style.opacity = on && !uiHidden ? 1 : 0;
  $('bar').style.opacity = on && !uiHidden ? 1 : 0;
}
let uiTimer = 0;
function poke() { showUI(true); clearTimeout(uiTimer); uiTimer = setTimeout(() => showUI(false), 2600); }
const stats = window.__stats = {frames: 0, lastDt: 0, scale: 1, w: 0, h: 0};
function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = Math.min(1, (now - lastNow) / 1000 || 0.016);
  const dt = Math.min(0.1, rawDt); lastNow = now;
  stats.frames++; stats.lastDt = dt; stats.scale = scale; stats.w = RT ? RT.w : 0; stats.h = RT ? RT.h : 0; stats.t = animT;
  if (playing) animT += dt;
  if (animT >= DURATION) { animT -= DURATION; RT.valid = false; prevCam = null; loops++; }
  if (animT < 0) animT += DURATION;
  // performance governor: proportional internal-resolution control (time based)
  perfAcc += rawDt; perfN++;
  if (perfAcc > 0.8 && perfN >= 4) {
    const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
    const target = 1 / 40;
    if (avg > target * 1.25 && scale > 0.3) {
      scale = Math.max(0.3, scale * Math.max(0.7, Math.sqrt(target / avg)));
      lastScaleChange = now; chooseInternal();
    } else if (avg < target * 0.72 && scale < 1 && now - lastScaleChange > 3000) {
      scale = Math.min(1, scale * 1.08); lastScaleChange = now; chooseInternal();
    }
  }
  look.yaw += (look.tyaw - look.yaw) * Math.min(1, dt * 6);
  look.pitch += (look.tpitch - look.pitch) * Math.min(1, dt * 6);
  if (!dragging) { look.tyaw *= Math.exp(-dt * 0.9); look.tpitch *= Math.exp(-dt * 0.9); }
  // when paused and still, stop rendering once the image has converged
  const still = !playing && !dragging && Math.abs(look.tyaw - look.yaw) + Math.abs(look.tpitch - look.pitch) + Math.abs(look.yaw) + Math.abs(look.pitch) < 1e-3;
  idleFrames = still ? idleFrames + 1 : 0;
  if (idleFrames > 48) { perfAcc = 0; perfN = 0; return; }
  const cam = cameraAt(animT, canvas.width / canvas.height);
  renderFrame(animT, cam, {});
  const fade = Math.min(1, animT / 1.6, (DURATION - animT) / 1.6);
  post(animT, {fade: Math.max(0, fade)});
  updateSound(cam, animT, Math.max(0.15, fade));
  const tt = $('title');
  tt.style.opacity = (loops === 0 && animT > 1.2 && animT < 7.5 && !uiHidden) ? 1 : 0;
  $('bar').style.width = (animT / DURATION * 100) + '%';
}
let dragging = false, dx0 = 0, dy0 = 0, y0 = 0, p0 = 0;
canvas.addEventListener('pointerdown', e => { poke(); dragging = true; dx0 = e.clientX; dy0 = e.clientY; y0 = look.tyaw; p0 = look.tpitch; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  poke();
  if (!dragging) return;
  const s = 2.2 / canvas.clientWidth;
  look.tyaw = Math.max(-1.6, Math.min(1.6, y0 + (e.clientX - dx0) * s));
  look.tpitch = Math.max(-0.7, Math.min(0.6, p0 - (e.clientY - dy0) * s));
});
const endDrag = () => { dragging = false; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { playing = !playing; e.preventDefault(); }
  else if (e.code === 'ArrowRight') { animT = Math.min(DURATION - 0.01, animT + 5); RT.valid = false; }
  else if (e.code === 'ArrowLeft') { animT = Math.max(0, animT - 5); RT.valid = false; }
  else if (e.code === 'KeyF') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if (e.code === 'KeyH') { uiHidden = !uiHidden; showUI(!uiHidden); }
  else if (e.code === 'KeyL') { letterbox = !letterbox; layout(); chooseInternal(); }
  else if (e.code === 'KeyS') { toggleSound(); }
  idleFrames = 0;
  poke();
});
window.addEventListener('resize', () => { if (!STILL) { layout(); chooseInternal(); } });
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  fail('The graphics driver reset the WebGL context. Reload the page to restart the flight.');
});

/* ----------------------------------------------------------------- start */
(async () => {
  try {
    if (!STILL) layout(); else { canvas.width = 640; canvas.height = 268; }
    await init();
    $('load').style.opacity = 0;
    window.__ready = true;
    if (!STILL) {
      chooseInternal();
      poke();
      requestAnimationFrame(t => { lastNow = t; frame(t); });
    }
  } catch (err) {
    console.error(err);
    fail('Something went wrong while starting the renderer: ' + (err && err.message ? err.message : err));
  }
})();
})();
</script>
