    if (e.touches.length === 1) {
      cam.isDragging = true;
      cam.lastX = e.touches[0].clientX;
      cam.lastY = e.touches[0].clientY;
    } else if (e.touches.length >= 2) {
      cam.isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      cam.pinchDist = Math.hypot(dx, dy);
      cam.lastX = 0.5 * (e.touches[0].clientX + e.touches[1].clientX);
      cam.lastY = 0.5 * (e.touches[0].clientY + e.touches[1].clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (e.cancelable) e.preventDefault();
    const now = performance.now() * 0.001;
    markUserInteraction(now);
    if (!e.touches || e.touches.length === 0) return;
    if (e.touches.length === 1 && cam.isDragging) {
      const dx = e.touches[0].clientX - cam.lastX;
      const dy = e.touches[0].clientY - cam.lastY;
      cam.lastX = e.touches[0].clientX;
      cam.lastY = e.touches[0].clientY;
      cam.targetTheta -= dx * 0.0072;
      cam.targetPhi = clamp(cam.targetPhi + dy * 0.0058, 0.045, 1.38);
    } else if (e.touches.length >= 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (cam.pinchDist > 8.0 && dist > 8.0) {
        const scale = cam.pinchDist / dist;
        cam.targetRadius = clamp(cam.targetRadius * scale, 1.35, 6.80);
      }
      cam.pinchDist = dist;

      // Also allow gentle two-finger orbit while pinching
      const mx = 0.5 * (e.touches[0].clientX + e.touches[1].clientX);
      const my = 0.5 * (e.touches[0].clientY + e.touches[1].clientY);
      cam.targetTheta -= (mx - cam.lastX) * 0.0045;
      cam.targetPhi = clamp(cam.targetPhi + (my - cam.lastY) * 0.0040, 0.045, 1.38);
      cam.lastX = mx;
      cam.lastY = my;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    markUserInteraction(performance.now() * 0.001);
    if (!e.touches || e.touches.length === 0) {
      cam.isDragging = false;
      cam.pinchDist = 0;
    } else if (e.touches.length === 1) {
      cam.isDragging = true;
      cam.lastX = e.touches[0].clientX;
      cam.lastY = e.touches[0].clientY;
    }
  }, { passive: false });

  function updateCamera(nowSec, dt) {
    const idleTime = cam.isDragging ? 0.0 : (nowSec - cam.lastInputTime);
    // Smoothly ramp automatic cinematic glide weight from 0 -> 1 after IDLE_RESUME_DELAY seconds!
    const autoWeight = smoothstep(IDLE_RESUME_DELAY, IDLE_RESUME_DELAY + 2.2, idleTime);

    if (autoWeight > 0.001) {
      cam.autoPhase += dt * autoWeight;
      // Slow, majestic 360° wind-tunnel inspection glide (~44 seconds per full revolution)
      cam.targetTheta += dt * 0.142 * autoWeight;

      // Subtle cinematic elevation & distance choreography synchronized with car azimuth!
      const az = cam.targetTheta;
      const desiredPhi = 0.21 + 0.08 * Math.sin(az * 1.0 - 0.4) + 0.04 * Math.cos(az * 2.0);
      const desiredRad = 5.78 + 0.42 * Math.cos(az * 1.0 + 0.6) - 0.22 * Math.sin(az * 2.0);
      cam.targetPhi = lerp(cam.targetPhi, desiredPhi, 1.0 - Math.exp(-dt * 0.65 * autoWeight));
      cam.targetRadius = lerp(cam.targetRadius, desiredRad, 1.0 - Math.exp(-dt * 0.55 * autoWeight));
    }

    // Critically damped exponential smoothing for buttery 60/120Hz responsiveness
    const damp = 1.0 - Math.exp(-dt * 10.5);
    cam.theta  = lerp(cam.theta, cam.targetTheta, damp);
    cam.phi    = lerp(cam.phi, cam.targetPhi, damp);
    cam.radius = lerp(cam.radius, cam.targetRadius, damp);

    // Aspect-ratio-adaptive framing so narrow/square viewports frame the full 5.5m F1 car & wake without cropping!
    const aspect = Math.max(0.55, rtWidth / Math.max(1, rtHeight));
    const aspectScale = clamp(1.50 / aspect, 1.0, 1.56);
    let effRadius = cam.radius * lerp(1.0, aspectScale, smoothstep(2.4, 4.6, cam.radius));

    // Gaze-aware longitudinal target shift
    const macroBlend = 1.0 - smoothstep(1.6, 3.8, cam.radius);
    const lookX = lerp(-0.04, -0.85 * Math.cos(cam.theta), macroBlend * 0.72) + 0.10 * smoothstep(4.2, 6.2, effRadius);
    const lookY = lerp(0.41, 0.34, macroBlend * 0.6);

    // Ray-accurate tunnel chamber boundary limit so zooming out NEVER clips tunnel walls or ceiling!
    const cosPhi = Math.cos(cam.phi), sinPhi = Math.sin(cam.phi);
    const dirX = cosPhi * Math.cos(cam.theta);
    const dirY = sinPhi;
    const dirZ = cosPhi * Math.sin(cam.theta);
    let maxRayR = 9.2;
    if (Math.abs(dirZ) > 0.01) maxRayR = Math.min(maxRayR, 3.82 / Math.abs(dirZ));
    if (dirY > 0.01) maxRayR = Math.min(maxRayR, (3.76 - lookY) / dirY);
    effRadius = Math.min(effRadius, maxRayR);

    const cx = clamp(lookX + effRadius * dirX, -8.5, 9.2);
    const cy = clamp(lookY + effRadius * dirY, 0.14, 3.82);
    const cz = effRadius * dirZ;

    return {
      eye: [cx, cy, cz],
      target: [lookX, lookY, 0.0]
    };
  }

  // ============================================================================
  // 11. MAIN MULTI-PASS RENDER PIPELINE
  // ============================================================================
  const matProj = mat4Identity();
  const matView = mat4Identity();
  const matVP   = mat4Identity();
  const matReflView = mat4Identity();
  const matReflVP   = mat4Identity();
  const NEAR_CLIP = 0.12, FAR_CLIP = 34.0;

  function drawOpaqueGeometry(progUniforms, wheelAngle, fanAngle, reflectionSign, isShadowPass) {
    // 1. Static F1 Car + Wind Tunnel
    gl.uniform1i(progUniforms.u_mode, 0);
    gl.uniform3f(progUniforms.u_offset, 0, 0, 0);
    gl.uniform1f(progUniforms.u_spinAngle, 0);
    gl.uniform1f(progUniforms.u_reflection, reflectionSign);
    gl.bindVertexArray(meshStatic.vao);
    gl.drawElements(gl.TRIANGLES, meshStatic.count, meshStatic.type, 0);

    // 2. 4 Spinning 18-Inch Wheels & Tires (with live rotation + world-space contact patch!)
    gl.uniform1i(progUniforms.u_mode, 1);
    gl.uniform1f(progUniforms.u_spinAngle, wheelAngle);
    for (let i = 0; i < 4; i++) {
      const w = wheelInstances[i];
      gl.uniform3f(progUniforms.u_offset, w.pos[0], w.pos[1], w.pos[2]);
      gl.bindVertexArray(w.mesh.vao);
      gl.drawElements(gl.TRIANGLES, w.mesh.count, w.mesh.type, 0);
    }

    // 3. Giant Downstream Rotating Wind-Tunnel Axial Turbine Fan (skip in car tight shadow ortho)
    if (!isShadowPass) {
      gl.uniform1i(progUniforms.u_mode, 2);
      gl.uniform3f(progUniforms.u_offset, fanCenter[0], fanCenter[1], fanCenter[2]);
      gl.uniform1f(progUniforms.u_spinAngle, fanAngle);
      gl.bindVertexArray(meshTunnelFan.vao);
      gl.drawElements(gl.TRIANGLES, meshTunnelFan.count, meshTunnelFan.type, 0);
    }
  }

  let prevTime = performance.now() * 0.001;
  let firstFrameDone = false;

  function renderFrame(nowMs) {
    const now = nowMs * 0.001;
    const dt = Math.min(0.05, Math.max(0.001, now - prevTime));
    prevTime = now;

    resizeRenderTargets();

    // Update Camera
    const { eye, target } = updateCamera(now, dt);
    const aspect = rtWidth / rtHeight;
    mat4Perspective(matProj, 40.0 * Math.PI / 180.0, aspect, NEAR_CLIP, FAR_CLIP);
    mat4LookAt(matView, eye, target, [0, 1, 0]);
    mat4Multiply(matVP, matProj, matView);

    // Extract camera right & up vectors from view matrix for billboard wake particles
    const camRight = [matView[0], matView[4], matView[8]];
    const camUp    = [matView[1], matView[5], matView[9]];

    // Wheel spin angle synchronized with rolling road speed: omega = V / R_tire!
    const wheelOmega = WIND_SPEED / TIRE_RADIUS;
    const wheelAngle = (now * wheelOmega) % TAU;
    const fanAngle   = (now * 2.65) % TAU;

    // Update Dynamic 3D Smoke Streamlines & Turbulent Wake Particles
    smokeSystem.update(now, dt, eye);

    // ------------------------------------------------------------------------
    // PASS 1: OVERHEAD SHADOW MAP (2048x2048)
    // ------------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboShadow);
    gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);
    gl.clear(gl.DEPTH_BUFFER_BIT);

    gl.useProgram(progShadow);
    gl.uniformMatrix4fv(uShadow.u_lightVP, false, matLightVP);
    drawOpaqueGeometry(uShadow, wheelAngle, fanAngle, 1.0, true);

    // ------------------------------------------------------------------------
    // PASS 2: REAL-TIME PLANAR FLOOR REFLECTION PASS (Mirrored across y = 0)
    // ------------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboPlanar);
    gl.viewport(0, 0, planarW, planarH);
    gl.clearColor(0.015, 0.020, 0.028, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.useProgram(progPBR);
    gl.uniformMatrix4fv(uPBR.u_viewProj, false, matVP);
    gl.uniformMatrix4fv(uPBR.u_lightVP, false, matLightVP);
    gl.uniform3f(uPBR.u_camPos, eye[0], eye[1], eye[2]);
    gl.uniform1f(uPBR.u_time, now);
    gl.uniform1f(uPBR.u_wheelSpeed, wheelOmega);
    gl.uniform2f(uPBR.u_resolution, planarW, planarH);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texShadow);
    gl.uniform1i(uPBR.u_shadowMap, 0);

    drawOpaqueGeometry(uPBR, wheelAngle, fanAngle, -1.0, false);

    // Also render reflected smoke ribbons onto the glossy rolling road!
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.useProgram(progRibbon);
    gl.uniformMatrix4fv(uRibbon.u_viewProj, false, matVP);
    gl.uniform3f(uRibbon.u_camPos, eye[0], eye[1], eye[2]);
    gl.uniform1f(uRibbon.u_reflection, -1.0);
    gl.uniform2f(uRibbon.u_resolution, planarW, planarH);
    gl.uniform2f(uRibbon.u_nearFar, NEAR_CLIP, FAR_CLIP);
    gl.uniform1f(uRibbon.u_time, now);
    gl.bindVertexArray(smokeSystem.ribbonVao);
    gl.drawElements(gl.TRIANGLES, smokeSystem.ribbonIndexCount, gl.UNSIGNED_INT, 0);

    gl.disable(gl.BLEND);
    gl.depthMask(true);

    // Generate mipmaps on planar reflection texture for physically rough floor reflections!
    gl.bindTexture(gl.TEXTURE_2D, texPlanarColor);
    gl.generateMipmap(gl.TEXTURE_2D);

    // ------------------------------------------------------------------------
    // PASS 3: MAIN HDR OPAQUE SCENE PASS (Car, Carbon Weave, Tires, Rolling Road, Tunnel)
    // ------------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene);
    gl.viewport(0, 0, rtWidth, rtHeight);
    gl.clearColor(0.012, 0.016, 0.024, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.useProgram(progPBR);
    gl.uniformMatrix4fv(uPBR.u_viewProj, false, matVP);
    gl.uniformMatrix4fv(uPBR.u_lightVP, false, matLightVP);
    gl.uniform3f(uPBR.u_camPos, eye[0], eye[1], eye[2]);
    gl.uniform1f(uPBR.u_time, now);
    gl.uniform1f(uPBR.u_wheelSpeed, wheelOmega);
    gl.uniform2f(uPBR.u_resolution, rtWidth, rtHeight);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texShadow);
    gl.uniform1i(uPBR.u_shadowMap, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texPlanarColor);
    gl.uniform1i(uPBR.u_planarRefl, 1);

    drawOpaqueGeometry(uPBR, wheelAngle, fanAngle, 1.0, false);

    // Copy opaque depth buffer to texSceneDepthCopy for soft volumetric smoke intersection!
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fboScene);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fboDepthCopy);
    gl.blitFramebuffer(0, 0, rtWidth, rtHeight, 0, 0, rtWidth, rtHeight, gl.DEPTH_BUFFER_BIT, gl.NEAREST);

    // ------------------------------------------------------------------------
    // PASS 4: VOLUMETRIC WAKE BILLOWS & LAMINAR-TO-VORTEX SMOKE STREAMLINE RIBBONS
    // ------------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene);
    gl.viewport(0, 0, rtWidth, rtHeight);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); // Premultiplied alpha volumetric compositing
    gl.depthMask(false);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, texSceneDepthCopy);

    // 4A. Advected 3D Turbulent Wake & Wheel-Wash Billow Clouds
    gl.useProgram(progParticle);
    gl.uniformMatrix4fv(uParticle.u_viewProj, false, matVP);
    gl.uniform3f(uParticle.u_camRight, camRight[0], camRight[1], camRight[2]);
    gl.uniform3f(uParticle.u_camUp, camUp[0], camUp[1], camUp[2]);
    gl.uniform1f(uParticle.u_reflection, 1.0);
    gl.uniform1i(uParticle.u_sceneDepth, 2);
    gl.uniform2f(uParticle.u_resolution, rtWidth, rtHeight);
    gl.uniform2f(uParticle.u_nearFar, NEAR_CLIP, FAR_CLIP);
    gl.uniform1f(uParticle.u_time, now);
    gl.uniform3f(uParticle.u_camPos, eye[0], eye[1], eye[2]);

    gl.bindVertexArray(smokeSystem.partVao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, smokeSystem.nParticles);

    // 4B. View-Aligned Volumetric Smoke Streamline Filaments
    gl.useProgram(progRibbon);
    gl.uniformMatrix4fv(uRibbon.u_viewProj, false, matVP);
    gl.uniform3f(uRibbon.u_camPos, eye[0], eye[1], eye[2]);
    gl.uniform1f(uRibbon.u_reflection, 1.0);
    gl.uniform1i(uRibbon.u_sceneDepth, 2);
    gl.uniform2f(uRibbon.u_resolution, rtWidth, rtHeight);
    gl.uniform2f(uRibbon.u_nearFar, NEAR_CLIP, FAR_CLIP);
    gl.uniform1f(uRibbon.u_time, now);

    gl.bindVertexArray(smokeSystem.ribbonVao);
    gl.drawElements(gl.TRIANGLES, smokeSystem.ribbonIndexCount, gl.UNSIGNED_INT, 0);

    gl.disable(gl.BLEND);
    gl.depthMask(true);

    // ------------------------------------------------------------------------
    // PASS 5: DUAL-KAWASE HDR BLOOM PYRAMID
    // ------------------------------------------------------------------------
    gl.disable(gl.DEPTH_TEST);
    gl.bindVertexArray(emptyVao);

    gl.useProgram(progBloomDn);
    gl.uniform1i(uBloomDn.u_tex, 0);
    gl.activeTexture(gl.TEXTURE0);

    let prevTex = texSceneColor;
    let prevW = rtWidth, prevH = rtHeight;
    for (let i = 0; i < bloomLevels; i++) {
      const [bw, bh] = bloomSizes[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomDownFbos[i]);
      gl.viewport(0, 0, bw, bh);
      gl.bindTexture(gl.TEXTURE_2D, prevTex);
      gl.uniform2f(uBloomDn.u_texelSize, 1.0 / prevW, 1.0 / prevH);
      gl.uniform1i(uBloomDn.u_firstPass, i === 0 ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      prevTex = bloomDownTexs[i];
      prevW = bw; prevH = bh;
    }

    gl.useProgram(progBloomUp);
    gl.uniform1i(uBloomUp.u_tex, 0);
    for (let i = bloomLevels - 1; i >= 0; i--) {
      const [bw, bh] = bloomSizes[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomUpFbos[i]);
      gl.viewport(0, 0, bw, bh);
      if (i === bloomLevels - 1) {
        gl.bindTexture(gl.TEXTURE_2D, bloomDownTexs[i]);
        gl.uniform2f(uBloomUp.u_texelSize, 1.0 / bw, 1.0 / bh);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      } else {
        // Additive upsample combine onto current mip level
        gl.bindTexture(gl.TEXTURE_2D, bloomDownTexs[i]);
        gl.uniform2f(uBloomUp.u_texelSize, 0.0, 0.0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        const [pw, ph] = bloomSizes[i + 1];
        gl.bindTexture(gl.TEXTURE_2D, bloomUpTexs[i + 1]);
        gl.uniform2f(uBloomUp.u_texelSize, 1.0 / pw, 1.0 / ph);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.disable(gl.BLEND);
      }
    }

    // ------------------------------------------------------------------------
    // PASS 6: FINAL COMPOSITE (FXAA + BLOOM + ACES FILMIC TONEMAP + VIGNETTE)
    // ------------------------------------------------------------------------
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, rtWidth, rtHeight);
    gl.useProgram(progComp);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texSceneColor);
    gl.uniform1i(uComp.u_scene, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, bloomUpTexs[0]);
    gl.uniform1i(uComp.u_bloom, 1);

    gl.uniform2f(uComp.u_texelSize, 1.0 / rtWidth, 1.0 / rtHeight);
    gl.uniform1f(uComp.u_time, now);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    if (!firstFrameDone) {
      firstFrameDone = true;
      document.getElementById('loading').classList.add('hidden');
    }

    requestAnimationFrame(renderFrame);
  }

  requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
