<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Formula 1 Aerodynamic Wind Tunnel — Prototype X-01</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
    touch-action: none;
  }
  canvas:active {
    cursor: grabbing;
  }
  #hud {
    position: fixed;
    left: 24px;
    bottom: 22px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.8s ease;
  }
  .telemetry-card {
    background: rgba(8, 12, 18, 0.58);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(180, 210, 240, 0.12);
    border-radius: 8px;
    padding: 9px 14px;
    color: rgba(226, 236, 248, 0.82);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    line-height: 1.55;
  }
  .telemetry-title {
    color: rgba(255, 255, 255, 0.94);
    font-weight: 600;
    letter-spacing: 0.13em;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38d996;
    box-shadow: 0 0 8px #38d996;
    display: inline-block;
  }
  .telemetry-row {
    display: flex;
    gap: 16px;
    margin-top: 3px;
    color: rgba(168, 188, 212, 0.76);
    font-variant-numeric: tabular-nums;
  }
  .telemetry-row span b {
    color: rgba(232, 242, 255, 0.92);
    font-weight: 500;
  }
  .controls-hint {
    background: rgba(8, 12, 18, 0.52);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(180, 210, 240, 0.11);
    border-radius: 999px;
    padding: 7px 15px;
    color: rgba(205, 220, 238, 0.74);
    font-size: 11px;
    letter-spacing: 0.06em;
    transition: opacity 0.6s ease;
  }
  #loading {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, #0d131c 0%, #040609 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #dbe7f5;
    z-index: 30;
    transition: opacity 0.65s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loader-bar-wrap {
    width: 220px;
    height: 2px;
    background: rgba(255, 255, 255, 0.1);
    margin-top: 14px;
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #569cd6, #c8e6ff);
    transform-origin: left;
    animation: pulseLoad 1.1s ease-in-out infinite;
  }
  @keyframes pulseLoad {
    0% { transform: scaleX(0.15); }
    50% { transform: scaleX(0.85); }
    100% { transform: scaleX(1.0); }
  }
  @media (max-width: 680px) {
    #hud { left: 12px; right: 12px; bottom: 12px; flex-direction: column; align-items: flex-start; gap: 8px; }
    .telemetry-row { gap: 10px; font-size: 10px; }
    .controls-hint { font-size: 10px; padding: 6px 12px; }
  }
</style>
</head>
<body>
<div id="loading">
  <div style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.88;">Initializing Aero Tunnel &amp; Potential Flow Solver</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
</div>

<canvas id="glcanvas"></canvas>

<div id="hud">
  <div class="telemetry-card">
    <div class="telemetry-title"><span class="status-dot"></span>Rolling-Road Aero Test &middot; Prototype X-01</div>
    <div class="telemetry-row">
      <span>Airspeed <b>50.0 m/s (180 km/h)</b></span>
      <span>Belt Sync <b>100.0%</b></span>
      <span>Ride Hgt <b>26 / 54 mm</b></span>
    </div>
  </div>
  <div class="controls-hint" id="camHint">Drag / Touch to Orbit 360&deg; &middot; Scroll / Pinch to Zoom</div>
</div>

<script>
(() => {
  'use strict';

  // ============================================================================
  // 1. MATH & VECTOR UTILITIES
  // ============================================================================
  const TAU = Math.PI * 2.0;
  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (e0, e1, x) => {
    const t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
    return t * t * (3.0 - 2.0 * t);
  };

  function vec3(x = 0, y = 0, z = 0) { return [x, y, z]; }
  function vAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function vSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function vScale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
  function vDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function vCross(a, b) {
    return [
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]
    ];
  }
  function vLen(a) { return Math.hypot(a[0], a[1], a[2]); }
  function vNorm(a) {
    const l = Math.hypot(a[0], a[1], a[2]);
    return l > 1e-8 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 1, 0];
  }
  function vLerp(a, b, t) {
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  }

  function mat4Identity() {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  }
  function mat4Multiply(out, a, b) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
    const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
    const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
    const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    let b0, b1, b2, b3;
    b0 = b[0]; b1 = b[1]; b2 = b[2]; b3 = b[3];
    out[0] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
    out[1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
    out[2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
    out[3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
    b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
    out[4] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
    out[5] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
    out[6] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
    out[7] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
    b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
    out[8]  = b0*a00 + b1*a10 + b2*a20 + b3*a30;
    out[9]  = b0*a01 + b1*a11 + b2*a21 + b3*a31;
    out[10] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
    out[11] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
    b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
    out[12] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
    out[13] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
    out[14] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
    out[15] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
    return out;
  }
  function mat4Perspective(out, fovy, aspect, near, far) {
    const f = 1.0 / Math.tan(fovy * 0.5);
    out.fill(0);
    out[0] = f / aspect;
    out[5] = f;
    out[10] = (far + near) / (near - far);
    out[11] = -1;
    out[14] = (2 * far * near) / (near - far);
    return out;
  }
  function mat4Ortho(out, left, right, bottom, top, near, far) {
    out.fill(0);
    const lr = 1 / (left - right);
    const bt = 1 / (bottom - top);
    const nf = 1 / (near - far);
    out[0] = -2 * lr;
    out[5] = -2 * bt;
    out[10] = 2 * nf;
    out[12] = (left + right) * lr;
    out[13] = (top + bottom) * bt;
    out[14] = (far + near) * nf;
    out[15] = 1;
    return out;
  }
  function mat4LookAt(out, eye, center, up) {
    const z = vNorm(vSub(eye, center));
    const x = vNorm(vCross(up, z));
    const y = vCross(z, x);
    out[0] = x[0]; out[1] = y[0]; out[2]  = z[0]; out[3]  = 0;
    out[4] = x[1]; out[5] = y[1]; out[6]  = z[1]; out[7]  = 0;
    out[8] = x[2]; out[9] = y[2]; out[10] = z[2]; out[11] = 0;
    out[12] = -vDot(x, eye);
    out[13] = -vDot(y, eye);
    out[14] = -vDot(z, eye);
    out[15] = 1;
    return out;
  }

  // ============================================================================
  // 2. MATERIAL CONSTANTS & SCENE PARAMETERS
  // ============================================================================
  const MAT_CARBON_GLOSS  = 0.0; // Clearcoated 2x2 twill carbon bodywork & wings
  const MAT_CARBON_SATIN  = 1.0; // Satin structural carbon (floor, diffuser, suspension, rims)
  const MAT_ACCENT_AERO   = 2.0; // Subtle satin prototype silver-ice metallic aero trim
  const MAT_METAL_CNC     = 3.0; // Brushed titanium / CNC steel / exhaust
  const MAT_TIRE_RUBBER   = 4.0; // F1 dry slick compound + detailed molded sidewall
  const MAT_ROLLING_ROAD  = 5.0; // Moving ground belt synchronized with wheels
  const MAT_TUNNEL_WALL   = 6.0; // Acoustic dark slate anodized tunnel panels
  const MAT_TUNNEL_FLOOR  = 7.0; // Precision machined steel floor & turntable
  const MAT_EMISSIVE      = 8.0; // LED strips, ruby FIA rear rain light, cockpit telemetry
  const MAT_VISOR_GLOSS   = 9.0; // Dark chrome iridescent helmet visor & gloss shell
  const MAT_DARK_CAVITY   = 10.0; // Recessed intakes, radiator mesh, honeycomb

  const WIND_SPEED = 14.5;      // Visual flow speed (scaled for crisp cinema streamline tracking; represents 50 m/s)
  const TIRE_RADIUS = 0.360;    // 18-inch regulation 720mm outer tire diameter
  const FRONT_AXLE_X = -1.74;
  const REAR_AXLE_X  = +1.80;
  const FRONT_TRACK_Z = 0.820;
  const REAR_TRACK_Z  = 0.790;

  // ============================================================================
  // 3. PROCEDURAL PARAMETRIC MESH BUILDER (WITH SMOOTH NORMALS & TANGENTS)
  // ============================================================================
  class MeshBuilder {
    constructor() {
      this.pos = [];
      this.norm = [];
      this.uv = [];
      this.mat = []; // [matId, auxParam]
      this.idx = [];
    }

    get vertCount() { return this.pos.length / 3; }

    addVertex(px, py, pz, nx, ny, nz, u, v, matId, aux = 0.0) {
      const i = this.pos.length / 3;
      this.pos.push(px, py, pz);
      this.norm.push(nx, ny, nz);
      this.uv.push(u, v);
      this.mat.push(matId, aux);
      return i;
    }

    addTri(a, b, c) {
      this.idx.push(a, b, c);
    }

    addQuad(a, b, c, d) {
      this.idx.push(a, b, c, a, c, d);
    }

    // Loft a grid of 3D points: rings[r][s] = [x,y,z], uCoords[r][s], vCoords[r][s]
    // Automatically computes smooth analytical finite-difference vertex normals!
    addLoft(rings, matId, aux = 0.0, closedS = false, uvScaleU = 1.0, uvScaleV = 1.0, customUV = null, flipWinding = false) {
      const R = rings.length;
      const S = rings[0].length;
      const base = this.vertCount;

      // Arc-length accumulation for uniform metric UVs (crucial for uniform 3mm carbon weave!)
      const uDist = new Array(R).fill(0);
      for (let r = 1; r < R; r++) {
        const p0 = rings[r - 1][Math.floor(S * 0.5)];
        const p1 = rings[r][Math.floor(S * 0.5)];
        uDist[r] = uDist[r - 1] + vLen(vSub(p1, p0));
      }

      for (let r = 0; r < R; r++) {
        let vAccum = 0;
        for (let s = 0; s < S; s++) {
          if (s > 0) vAccum += vLen(vSub(rings[r][s], rings[r][s - 1]));
          const p = rings[r][s];
          const prPrev = rings[Math.max(0, r - 1)][s];
          const prNext = rings[Math.min(R - 1, r + 1)][s];
          let psPrev, psNext;
          if (closedS) {
            // Note: when closedS is true, last point may duplicate first point
            const sPrev = s === 0 ? S - 2 : s - 1;
            const sNext = s === S - 1 ? 1 : s + 1;
            psPrev = rings[r][sPrev];
            psNext = rings[r][sNext];
          } else {
            psPrev = rings[r][Math.max(0, s - 1)];
            psNext = rings[r][Math.min(S - 1, s + 1)];
          }
          const dR = vSub(prNext, prPrev);
          const dS = vSub(psNext, psPrev);
          let n = flipWinding ? vCross(dR, dS) : vCross(dS, dR);
          if (vLen(n) < 1e-8) n = [0, 1, 0];
          else n = vNorm(n);

          let u = uDist[r] * uvScaleU;
          let v = vAccum * uvScaleV;
          if (customUV) {
            const cuv = customUV(r, s, r / (R - 1), s / (S - 1), p);
            u = cuv[0]; v = cuv[1];
          }
          this.addVertex(p[0], p[1], p[2], n[0], n[1], n[2], u, v, matId, aux);
        }
      }

      for (let r = 0; r < R - 1; r++) {
        for (let s = 0; s < S - 1; s++) {
          const i00 = base + r * S + s;
          const i10 = base + (r + 1) * S + s;
          const i11 = base + (r + 1) * S + (s + 1);
          const i01 = base + r * S + (s + 1);
          if (flipWinding) this.addQuad(i00, i10, i11, i01);
          else this.addQuad(i00, i01, i11, i10);
        }
      }
    }

    // Cap a closed ring of points
    addCap(ring, normal, matId, aux = 0.0, flip = false, uvScale = 1.0) {
      let cx = 0, cy = 0, cz = 0;
      const nPts = ring.length;
      for (let i = 0; i < nPts; i++) {
        cx += ring[i][0]; cy += ring[i][1]; cz += ring[i][2];
      }
      cx /= nPts; cy /= nPts; cz /= nPts;
      const n = vNorm(normal);
      const refUp = Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
      const tU = vNorm(vCross(refUp, n));
      const tV = vCross(n, tU);

      const cIdx = this.addVertex(cx, cy, cz, n[0], n[1], n[2], 0, 0, matId, aux);
      const ringStart = this.vertCount;
      for (let i = 0; i < nPts; i++) {
        const d = [ring[i][0] - cx, ring[i][1] - cy, ring[i][2] - cz];
        this.addVertex(
          ring[i][0], ring[i][1], ring[i][2],
          n[0], n[1], n[2],
          vDot(d, tU) * uvScale, vDot(d, tV) * uvScale,
          matId, aux
        );
      }
      for (let i = 0; i < nPts - 1; i++) {
        if (flip) this.addTri(cIdx, ringStart + i + 1, ringStart + i);
        else this.addTri(cIdx, ringStart + i, ringStart + i + 1);
      }
    }

    // Build an airfoil-section strut (for wishbones, pushrods, aero pylons, sting)
    addAirfoilStrut(p0, p1, chord, thickness, matId, aux = 0.0, chordDirHint = [1, 0, 0], segsL = 6, segsS = 16) {
      const axis = vNorm(vSub(p1, p0));
      let cDir = vSub(chordDirHint, vScale(axis, vDot(chordDirHint, axis)));
      if (vLen(cDir) < 1e-4) cDir = vCross(axis, [0, 1, 0]);
      cDir = vNorm(cDir);
      const tDir = vNorm(vCross(axis, cDir));

      const rings = [];
      for (let r = 0; r <= segsL; r++) {
        const f = r / segsL;
        const center = vLerp(p0, p1, f);
        const ring = [];
        for (let s = 0; s <= segsS; s++) {
          const ang = (s / segsS) * TAU;
          // NACA symmetric teardrop profile mapped from circle angle
          const u = 0.5 * (1.0 - Math.cos(ang)); // 0 at leading edge (-cDir), 1 at trailing edge (+cDir)
          const sign = Math.sin(ang) >= 0 ? 1 : -1;
          const yt = 5.0 * (0.2969 * Math.sqrt(Math.max(u, 1e-5)) - 0.1260 * u - 0.3516 * u * u + 0.2843 * u * u * u - 0.1015 * u * u * u * u);
          const localC = (u - 0.42) * chord;
          const localT = sign * yt * thickness;
          ring.push([
            center[0] + cDir[0] * localC + tDir[0] * localT,
            center[1] + cDir[1] * localC + tDir[1] * localT,
            center[2] + cDir[2] * localC + tDir[2] * localT
          ]);
        }
        rings.push(ring);
      }
      this.addLoft(rings, matId, aux, true, 1.0, 1.0, null, false);
    }

    // Swept tube along a 3D polyline
    addTube(points, radii, matId, aux = 0.0, segsS = 18, aspectY = 1.0) {
      const rings = [];
      let prevUp = [0, 1, 0];
      for (let i = 0; i < points.length; i++) {
        const pPrev = points[Math.max(0, i - 1)];
        const pNext = points[Math.min(points.length - 1, i + 1)];
        const tang = vNorm(vSub(pNext, pPrev));
        let side = vCross(tang, prevUp);
        if (vLen(side) < 1e-4) side = vCross(tang, [1, 0, 0]);
        side = vNorm(side);
        const up = vNorm(vCross(side, tang));
        prevUp = up;
        const rad = Array.isArray(radii) ? radii[i] : radii;
        const rx = Array.isArray(rad) ? rad[0] : rad;
        const ry = Array.isArray(rad) ? rad[1] : rad * aspectY;
        const ring = [];
        for (let s = 0; s <= segsS; s++) {
          const a = (s / segsS) * TAU;
          const ca = Math.cos(a) * rx;
          const sa = Math.sin(a) * ry;
          ring.push([
            points[i][0] + side[0] * ca + up[0] * sa,
            points[i][1] + side[1] * ca + up[1] * sa,
            points[i][2] + side[2] * ca + up[2] * sa
          ]);
        }
        rings.push(ring);
      }
      this.addLoft(rings, matId, aux, true, 1.0, 1.0, null, true);
    }

    // Oriented box helper
    addBox(cx, cy, cz, sx, sy, sz, matId, aux = 0.0, uvScale = 1.0) {
      const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
      const faces = [
        { n: [ 1, 0, 0], u: [0, 0,-1], v: [0, 1, 0], h: [hz, hy, hx] },
        { n: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0], h: [hz, hy, hx] },
        { n: [ 0, 1, 0], u: [1, 0, 0], v: [0, 0,-1], h: [hx, hz, hy] },
        { n: [ 0,-1, 0], u: [1, 0, 0], v: [0, 0, 1], h: [hx, hz, hy] },
        { n: [ 0, 0, 1], u: [1, 0, 0], v: [0, 1, 0], h: [hx, hy, hz] },
        { n: [ 0, 0,-1], u: [-1,0, 0], v: [0, 1, 0], h: [hx, hy, hz] }
      ];
      for (const f of faces) {
        const b = this.vertCount;
        const corners = [[-1,-1], [1,-1], [1,1], [-1,1]];
        for (const [cu, cv] of corners) {
          const px = cx + f.n[0]*f.h[2] + f.u[0]*cu*f.h[0] + f.v[0]*cv*f.h[1];
          const py = cy + f.n[1]*f.h[2] + f.u[1]*cu*f.h[0] + f.v[1]*cv*f.h[1];
          const pz = cz + f.n[2]*f.h[2] + f.u[2]*cu*f.h[0] + f.v[2]*cv*f.h[1];
          this.addVertex(px, py, pz, f.n[0], f.n[1], f.n[2], cu*f.h[0]*uvScale, cv*f.h[1]*uvScale, matId, aux);
        }
        this.addQuad(b, b+1, b+2, b+3);
      }
    }

    // Compute per-vertex tangent + handedness (Lengyel's method) for anisotropic carbon weave & normal mapping
    compile(gl) {
      const nVerts = this.vertCount;
      const tan1 = new Float32Array(nVerts * 3);
      const tan2 = new Float32Array(nVerts * 3);

      for (let i = 0; i < this.idx.length; i += 3) {
        const i1 = this.idx[i], i2 = this.idx[i + 1], i3 = this.idx[i + 2];
        const x1 = this.pos[i2*3] - this.pos[i1*3];
        const y1 = this.pos[i2*3+1] - this.pos[i1*3+1];
        const z1 = this.pos[i2*3+2] - this.pos[i1*3+2];
        const x2 = this.pos[i3*3] - this.pos[i1*3];
        const y2 = this.pos[i3*3+1] - this.pos[i1*3+1];
        const z2 = this.pos[i3*3+2] - this.pos[i1*3+2];

        const s1 = this.uv[i2*2] - this.uv[i1*2];
        const t1 = this.uv[i2*2+1] - this.uv[i1*2+1];
        const s2 = this.uv[i3*2] - this.uv[i1*2];
        const t2 = this.uv[i3*2+1] - this.uv[i1*2+1];

        const denom = s1 * t2 - s2 * t1;
        if (Math.abs(denom) > 1e-10) {
          const r = 1.0 / denom;
          const sx = (t2 * x1 - t1 * x2) * r;
          const sy = (t2 * y1 - t1 * y2) * r;
          const sz = (t2 * z1 - t1 * z2) * r;
          const tx = (s1 * x2 - s2 * x1) * r;
          const ty = (s1 * y2 - s2 * y1) * r;
          const tz = (s1 * z2 - s2 * z1) * r;
          for (const iv of [i1, i2, i3]) {
            tan1[iv*3] += sx; tan1[iv*3+1] += sy; tan1[iv*3+2] += sz;
            tan2[iv*3] += tx; tan2[iv*3+1] += ty; tan2[iv*3+2] += tz;
          }
        }
      }

      const tangents = new Float32Array(nVerts * 4);
      for (let i = 0; i < nVerts; i++) {
        const nx = this.norm[i*3], ny = this.norm[i*3+1], nz = this.norm[i*3+2];
        let tx = tan1[i*3], ty = tan1[i*3+1], tz = tan1[i*3+2];
        const ndott = nx * tx + ny * ty + nz * tz;
        tx -= nx * ndott; ty -= ny * ndott; tz -= nz * ndott;
        let tl = Math.hypot(tx, ty, tz);
        let handed = 1.0;
        if (tl < 1e-6) {
          // Safe fallback tangent orthogonal to normal
          const ref = Math.abs(ny) < 0.9 ? [0, 1, 0] : [1, 0, 0];
          const fb = vNorm(vCross(ref, [nx, ny, nz]));
          tx = fb[0]; ty = fb[1]; tz = fb[2];
        } else {
          tx /= tl; ty /= tl; tz /= tl;
          const cx = ny * tz - nz * ty;
          const cy = nz * tx - nx * tz;
          const cz = nx * ty - ny * tx;
          handed = (cx * tan2[i*3] + cy * tan2[i*3+1] + cz * tan2[i*3+2]) < 0.0 ? -1.0 : 1.0;
        }
        tangents[i*4] = tx;
        tangents[i*4+1] = ty;
        tangents[i*4+2] = tz;
        tangents[i*4+3] = handed;
      }

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const mkBuf = (loc, data, size) => {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
        return b;
      };

      mkBuf(0, new Float32Array(this.pos), 3);
      mkBuf(1, new Float32Array(this.norm), 3);
      mkBuf(2, tangents, 4);
      mkBuf(3, new Float32Array(this.uv), 2);
      mkBuf(4, new Float32Array(this.mat), 2);

      const ib = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
      const use32 = nVerts > 65535;
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, use32 ? new Uint32Array(this.idx) : new Uint16Array(this.idx), gl.STATIC_DRAW);

      gl.bindVertexArray(null);
      return { vao, count: this.idx.length, type: use32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
    }
  }

  // ============================================================================
  // 4. PROCEDURAL FORMULA 1 PROTOTYPE CAR ("PROTOTYPE X-01" GROUND-EFFECT SPEC)
  // ============================================================================
  function superellipseRing(x, yBot, yTop, halfW, expP = 2.6, segs = 32, topNarrow = 0.88, bottomPinch = 1.0) {
    const yMid = 0.5 * (yBot + yTop);
    const hY = Math.max(0.004, 0.5 * (yTop - yBot));
    const ring = [];
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      const sgnC = ca >= 0 ? 1 : -1;
      const sgnS = sa >= 0 ? 1 : -1;
      const u = sgnC * Math.pow(Math.abs(ca), 2.0 / expP);
      const v = sgnS * Math.pow(Math.abs(sa), 2.0 / expP);
      const widthMod = v >= 0 ? lerp(1.0, topNarrow, v) : lerp(1.0, bottomPinch, -v);
      ring.push([x, yMid + v * hY, u * halfW * widthMod]);
    }
    return ring;
  }

  // Helper to evaluate cambered airfoil section (chord runs along X, camber along Y)
  function airfoilRingAtSpan(z, xLead, yLead, chord, pitchRad, camber, thickRatio, segs = 28) {
    const cp = Math.cos(pitchRad), sp = Math.sin(pitchRad);
    const ring = [];
    for (let s = 0; s <= segs; s++) {
      const a = (s / segs) * TAU;
      const u = 0.5 * (1.0 - Math.cos(a)); // 0 at leading edge, 1 at trailing edge
      const upper = Math.sin(a) >= 0 ? 1 : -1;
      // Parabolic camber line (inverted for downforce when camber < 0!)
      const yc = camber * 4.0 * u * (1.0 - u);
      const dyc = camber * 4.0 * (1.0 - 2.0 * u);
      const yt = 5.0 * thickRatio * (0.2969 * Math.sqrt(Math.max(u, 1e-5)) - 0.126 * u - 0.3516 * u * u + 0.2843 * u * u * u - 0.1015 * u * u * u * u);
      const normL = Math.hypot(1.0, dyc);
      const lx = (u - upper * yt * dyc / normL) * chord;
      const ly = (yc + upper * yt / normL) * chord;
      const wx = xLead + lx * cp - ly * sp;
      const wy = yLead + lx * sp + ly * cp;
      ring.push([wx, wy, z]);
    }
    return ring;
  }

  function buildF1CarStatic(mb) {
    // ------------------------------------------------------------------------
    // A. SCULPTED NOSE CONE, MONOCOQUE, ENGINE COVER & COKE-BOTTLE SPINE
    // ------------------------------------------------------------------------
    const monoStations = [
      // [x, yBot, yTop, halfW, expP, topNarrow, bottomPinch]
      [-2.86, 0.162, 0.192, 0.048, 2.2, 0.92, 0.95],
      [-2.74, 0.166, 0.232, 0.088, 2.4, 0.90, 0.95],
      [-2.48, 0.174, 0.292, 0.128, 2.6, 0.88, 0.94],
      [-2.15, 0.188, 0.382, 0.175, 2.9, 0.86, 0.92],
      [-1.75, 0.195, 0.515, 0.225, 3.2, 0.86, 0.90], // Front axle bulkhead
      [-1.35, 0.155, 0.585, 0.255, 3.3, 0.88, 0.84],
      [-0.95, 0.085, 0.625, 0.278, 3.4, 0.90, 0.80],
      [-0.62, 0.055, 0.635, 0.292, 3.2, 0.90, 0.82], // Cockpit front cowl
      [-0.35, 0.052, 0.605, 0.305, 3.0, 0.84, 0.88], // Cockpit mid (headrest wraps above)
      [-0.02, 0.052, 0.635, 0.298, 3.0, 0.82, 0.90],
      [+0.18, 0.055, 0.720, 0.275, 2.7, 0.68, 0.92], // Behind cockpit -> rising to roll hoop
      [+0.36, 0.060, 0.945, 0.250, 2.4, 0.44, 0.94], // Airbox peak
      [+0.68, 0.062, 0.865, 0.235, 2.4, 0.42, 0.92],
      [+1.08, 0.068, 0.745, 0.215, 2.4, 0.40, 0.88],
      [+1.48, 0.085, 0.615, 0.185, 2.3, 0.42, 0.82],
      [+1.82, 0.185, 0.510, 0.145, 2.3, 0.55, 0.78], // Rear axle coke-bottle spine
      [+2.14, 0.265, 0.465, 0.095, 2.2, 0.72, 0.80],
      [+2.30, 0.290, 0.435, 0.068, 2.1, 0.82, 0.85]
    ];

    // Smooth Catmull-Rom upsampling along X so bodywork curves are liquid smooth!
    const monoRings = [];
    const monoSub = 4;
    for (let i = 0; i < monoStations.length - 1; i++) {
      const s0 = monoStations[Math.max(0, i - 1)];
      const s1 = monoStations[i];
      const s2 = monoStations[i + 1];
      const s3 = monoStations[Math.min(monoStations.length - 1, i + 2)];
      const steps = i === monoStations.length - 2 ? monoSub + 1 : monoSub;
      for (let k = 0; k < steps; k++) {
        const t = k / monoSub;
        const t2 = t * t, t3 = t2 * t;
        const cr = (idx) => 0.5 * (
          (2 * s1[idx]) +
          (-s0[idx] + s2[idx]) * t +
          (2*s0[idx] - 5*s1[idx] + 4*s2[idx] - s3[idx]) * t2 +
          (-s0[idx] + 3*s1[idx] - 3*s2[idx] + s3[idx]) * t3
        );
        monoRings.push(superellipseRing(cr(0), cr(1), cr(2), cr(3), cr(4), 36, cr(5), cr(6)));
      }
    }
    mb.addLoft(monoRings, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, true);
    mb.addCap(monoRings[0], [-1, 0, 0], MAT_CARBON_GLOSS, 0.0, true);
    mb.addCap(monoRings[monoRings.length - 1], [1, 0, 0], MAT_DARK_CAVITY, 0.0, false);

    // Subtle prototype metallic-ice pinstripe spear along nose & chassis shoulder (original prototype trim, zero logos)
    for (const side of [-1, 1]) {
      const trimPts = [];
      for (let i = 0; i <= 26; i++) {
        const f = i / 26;
        const x = lerp(-2.72, -0.55, f);
        const y = lerp(0.198, 0.618, Math.pow(f, 0.82));
        const z = side * lerp(0.052, 0.258, Math.pow(f, 0.72));
        trimPts.push([x, y, z]);
      }
      mb.addTube(trimPts, 0.0085, MAT_ACCENT_AERO, 0.0, 10, 0.45);
    }

    // Nose tip driver-cooling slot aperture + Twin Nose Aero/Optical Camera Pods + Aero Wing Mirrors!
    mb.addBox(-2.862, 0.177, 0.0, 0.012, 0.012, 0.058, MAT_DARK_CAVITY);
    for (const side of [-1, 1]) {
      // Nose-mounted F1 aero sensor / optical pod
      mb.addAirfoilStrut([-2.28, 0.305, side * 0.135], [-2.28, 0.315, side * 0.235], 0.085, 0.016, MAT_CARBON_SATIN, 0.0, [1, 0, 0]);
      const podR = [
        superellipseRing(-2.34, 0.302, 0.328, 0.014, 2.2, 12).map(p => [p[0], p[1], side * 0.242 + p[2]]),
        superellipseRing(-2.21, 0.304, 0.326, 0.012, 2.2, 12).map(p => [p[0], p[1], side * 0.242 + p[2]])
      ];
      mb.addLoft(podR, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, true);

      // Sculpted Aero Wing Mirror Housing + Twin Carbon Stalks flanking Cockpit
      mb.addAirfoilStrut([-0.54, 0.605, side * 0.275], [-0.46, 0.665, side * 0.455], 0.052, 0.008, MAT_CARBON_SATIN, 0.0, [1, 0, 0]);
      mb.addAirfoilStrut([-0.44, 0.575, side * 0.485], [-0.45, 0.660, side * 0.475], 0.042, 0.007, MAT_CARBON_SATIN, 0.0, [1, 0, 0]);
      const mirR = [
        superellipseRing(-0.52, 0.648, 0.692, 0.052, 2.6, 16).map(p => [p[0], p[1], side * 0.475 + p[2]]),
        superellipseRing(-0.41, 0.645, 0.695, 0.058, 2.8, 16).map(p => [p[0], p[1], side * 0.475 + p[2]])
      ];
      mb.addLoft(mirR, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, true);
      mb.addCap(mirR[0], [-1, 0, 0], MAT_CARBON_GLOSS, 0.0, true);
      mb.addCap(mirR[1], [1, 0, 0], MAT_VISOR_GLOSS, 0.0, false); // Reflective mirror glass facing aft!
    }

    // ------------------------------------------------------------------------
    // B. COCKPIT COLLAR, DARK TUB INTERIOR, STEERING WHEEL & DRIVER HELMET
    // ------------------------------------------------------------------------
    // Recessed dark cockpit tub bowl at top of monocoque (x: -0.56 .. +0.10)
    const cockRings = [];
    for (let r = 0; r <= 12; r++) {
      const f = r / 12;
      const x = lerp(-0.56, +0.10, f);
      const w = 0.215 * Math.sin(Math.pow(f, 0.75) * Math.PI * 0.92 + 0.12);
      const ring = [];
      for (let s = 0; s <= 18; s++) {
        const u = (s / 18) * 2.0 - 1.0;
        const yRim = 0.635 - 0.02 * Math.cos(f * Math.PI);
        const y = yRim + 0.032 * (u * u);
        ring.push([x, y, u * w]);
      }
      cockRings.push(ring);
    }
    mb.addLoft(cockRings, MAT_DARK_CAVITY, 0.0, false, 1.0, 1.0, null, true);

    // Sculpted carbon cockpit padding / headrest collar around cockpit rim
    for (const side of [-1, 1]) {
      const padPts = [];
      for (let i = 0; i <= 16; i++) {
        const f = i / 16;
        const x = lerp(-0.54, +0.12, f);
        const z = side * (0.218 * Math.sin(f * Math.PI * 0.86 + 0.2));
        const y = lerp(0.635, 0.695, smoothstep(0.25, 0.95, f));
        padPts.push([x, y, z]);
      }
      mb.addTube(padPts, [0.028, 0.022], MAT_CARBON_SATIN, 0.0, 14);
    }

    // Driver Aero-Test Helmet (essential in F1 wind tunnel models for accurate airbox/halo flow!)
    const helmRings = [];
    const hx0 = -0.11, hy0 = 0.705;
    for (let r = 0; r <= 18; r++) {
      const phi = (r / 18) * Math.PI;
      const sp = Math.sin(phi), cp = Math.cos(phi);
      const ring = [];
      for (let s = 0; s <= 24; s++) {
        const th = (s / 24) * TAU;
        // Elongated aero helmet shell with rear spoiler lip
        let lx = -cp * 0.155;
        let ly = Math.sin(th) * sp * 0.132;
        let lz = Math.cos(th) * sp * 0.122;
        if (lx > 0.02 && ly > 0) lx += 0.035 * (ly / 0.132); // Rear aero spoiler duckbill
        ring.push([hx0 + lx, hy0 + ly, lz]);
      }
      helmRings.push(ring);
    }
    mb.addLoft(helmRings, MAT_CARBON_GLOSS, 1.0, true, 1.0, 1.0, null, false);

    // Dark chrome helmet visor band facing forward (-X)
    const visorRings = [];
    for (let r = 0; r <= 6; r++) {
      const v = (r / 6) - 0.5;
      const ring = [];
      for (let s = 0; s <= 16; s++) {
        const a = lerp(-1.12, 1.12, s / 16);
        const rad = 0.126 - 0.012 * v * v;
        ring.push([
          hx0 - Math.cos(a) * 0.156,
          hy0 + 0.022 + v * 0.068,
          Math.sin(a) * rad
        ]);
      }
      visorRings.push(ring);
    }
    mb.addLoft(visorRings, MAT_VISOR_GLOSS, 0.0, false, 1.0, 1.0, null, true);

    // Steering wheel with telemetry shift LEDs
    mb.addBox(-0.39, 0.635, 0.0, 0.022, 0.085, 0.145, MAT_CARBON_SATIN);
    mb.addBox(-0.376, 0.672, 0.0, 0.006, 0.008, 0.075, MAT_EMISSIVE, 2.0); // cyan-green shift LEDs

    // ------------------------------------------------------------------------
    // C. OVERHEAD ROLL-HOOP AIRBOX INTAKE & AERO SHARK FIN
    // ------------------------------------------------------------------------
    // Sculpted roll-hoop airbox scoop sitting above helmet (x: +0.08 .. +0.48) with hollow recessed carbon duct!
    const airboxOuter = [
      [+0.09, 0.805, 0.975, 0.112],
      [+0.15, 0.795, 0.992, 0.132],
      [+0.28, 0.780, 0.978, 0.135],
      [+0.48, 0.750, 0.935, 0.118]
    ].map(([ax, yb, yt, hw]) => superellipseRing(ax, yb, yt, hw, 2.3, 28, 0.74, 0.85));
    mb.addLoft(airboxOuter, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, true);
    // Hollow inward-curving carbon lip bezel -> recessed dark airbox throat!
    const airboxInner = [
      airboxOuter[0],
      superellipseRing(+0.082, 0.815, 0.966, 0.100, 2.3, 28, 0.74, 0.85),
      superellipseRing(+0.115, 0.822, 0.958, 0.088, 2.3, 28, 0.74, 0.85),
      superellipseRing(+0.220, 0.828, 0.948, 0.075, 2.3, 28, 0.74, 0.85)
    ];
    mb.addLoft(airboxInner, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, false);
    mb.addCap(airboxInner[3], [-1, 0, 0], MAT_DARK_CAVITY, 2.0, true); // Deep recessed splitter/filter mesh!
    // Overhead T-cam aero transponder winglet atop roll hoop (iconic F1 silhouette detail!)
    mb.addAirfoilStrut([+0.14, 0.988, 0.0], [+0.17, 1.055, 0.0], 0.055, 0.012, MAT_CARBON_SATIN, 0.0, [1, 0, 0]);
    mb.addBox(+0.165, 1.060, 0.0, 0.085, 0.014, 0.185, MAT_CARBON_GLOSS);

    // Razor-sharp Engine Cover Aero Shark Fin (x: +0.34 .. +1.72)
    const finRings = [];
    for (let r = 0; r <= 14; r++) {
      const f = r / 14;
      const x = lerp(0.34, 1.72, f);
      const yBot = lerp(0.90, 0.54, f);
      const yTop = lerp(0.985, 0.755, Math.pow(f, 0.85));
      const ring = [
        [x, yBot, -0.007],
        [x, yTop, -0.004],
        [x, yTop + 0.003, 0.0],
        [x, yTop, +0.004],
        [x, yBot, +0.007]
      ];
      finRings.push(ring);
    }
    mb.addLoft(finRings, MAT_CARBON_GLOSS, 0.0, false, 1.0, 1.0, null, true);

    // ------------------------------------------------------------------------
    // D. SCULPTED HALO TITANIUM/CARBON COCKPIT PROTECTION STRUCTURE
    // ------------------------------------------------------------------------
    // Central front Halo pylon with aero teardrop fairing
    mb.addAirfoilStrut([-0.50, 0.625, 0.0], [-0.39, 0.835, 0.0], 0.072, 0.026, MAT_CARBON_SATIN, 0.0, [1, 0, 0], 8, 16);
    // Sweeping Halo side arches
    for (const side of [-1, 1]) {
      const haloPts = [];
      const haloRads = [];
      for (let i = 0; i <= 20; i++) {
        const f = i / 20;
        const x = lerp(-0.40, +0.16, f);
        const z = side * (0.238 * Math.sin(Math.pow(f, 0.62) * Math.PI * 0.76));
        const y = lerp(0.836, 0.742, Math.pow(f, 1.35)) + 0.012 * Math.sin(f * Math.PI);
        haloPts.push([x, y, z]);
        haloRads.push([0.024, 0.028]);
      }
      mb.addTube(haloPts, haloRads, MAT_CARBON_SATIN, 0.0, 16);
    }

    // ------------------------------------------------------------------------
    // E. DOWNWASHING GROUND-EFFECT SIDEPODS WITH DEEP FRONT UNDERCUT
    // ------------------------------------------------------------------------
    for (const side of [-1, 1]) {
      const spRings = [];
      const nX = 28, nS = 28;
      for (let r = 0; r <= nX; r++) {
        const f = r / nX;
        const x = lerp(-0.58, +1.72, f);
        // Coke-bottle outer width profile: wide shoulder ahead, sweeping tightly inward aft
        const shoulderEnv = Math.sin(Math.pow(clamp(f * 1.15 + 0.12, 0, 1), 0.65) * Math.PI * 0.88);
        const zInner = 0.16;
        const zOuter = lerp(0.68, 0.18, Math.pow(f, 1.25)) * (0.85 + 0.18 * shoulderEnv);
        // Deep front undercut! At f=0 (inlet at x=-0.58), bottom of inlet sits high at y=0.35,
        // then drops smoothly toward floor further back while top slopes down ("waterslide" ramp)
        const yTopOuter = lerp(0.585, 0.215, Math.pow(f, 0.92));
        const yTopInner = lerp(0.605, 0.455, Math.pow(f, 1.05));
        const undercutFactor = Math.exp(-f * 4.2); // Strong undercut near front of sidepod
        const yBotBase = lerp(0.065, 0.095, f) + 0.265 * undercutFactor;

        const ring = [];
        for (let s = 0; s <= nS; s++) {
          const a = (s / nS) * TAU;
          const ca = Math.cos(a), sa = Math.sin(a);
          // Map angle around cross-section
          const u = 0.5 + 0.5 * Math.sign(ca) * Math.pow(Math.abs(ca), 0.72); // 0 inner, 1 outer
          const v = 0.5 + 0.5 * Math.sign(sa) * Math.pow(Math.abs(sa), 0.72); // 0 bottom, 1 top
          let zMag = lerp(zInner, zOuter, u);
          // Carve deep undercut inward on lower-outer face near front!
          if (sa < 0) {
            zMag -= undercutFactor * 0.22 * (-sa) * Math.pow(u, 0.8);
          }
          // Waterslide gully depression along mid-top of sidepod aft of x = -0.1
          const gully = Math.sin(u * Math.PI) * smoothstep(0.15, 0.75, f) * (1.0 - 0.35 * f) * 0.055;
          const yTop = lerp(yTopInner, yTopOuter, Math.pow(u, 0.85)) - gully;
          const y = lerp(yBotBase, yTop, v);
          ring.push([x, y, side * zMag]);
        }
        spRings.push(ring);
      }
      mb.addLoft(spRings, MAT_CARBON_GLOSS, 2.0, true, 1.0, 1.0, null, side > 0);
      // Hollow inward-curving carbon sidepod mouth + deep recessed angled radiator core mesh!
      const mouthOuter = spRings[0];
      const mouthMid = mouthOuter.map(p => [
        p[0] - 0.012,
        lerp(0.475, p[1], 0.86),
        lerp(side * 0.42, p[2], 0.88)
      ]);
      const mouthDeep = mouthOuter.map(p => [
        p[0] + 0.16,
        lerp(0.465, p[1], 0.76),
        lerp(side * 0.40, p[2], 0.78)
      ]);
      mb.addLoft([mouthOuter, mouthMid, mouthDeep], MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, side < 0);
      mb.addCap(mouthDeep, [-1, 0.15, 0], MAT_DARK_CAVITY, 2.0, side > 0); // Angled aluminum radiator louvers deep inside duct!

      // Sidepod overbite carbon upper lip accent
      const lipPts = [];
      for (let i = 0; i <= 12; i++) {
        const u = i / 12;
        lipPts.push([-0.602 + 0.022 * u * u, lerp(0.594, 0.578, u), side * lerp(0.25, 0.66, u)]);
      }
      mb.addTube(lipPts, [0.011, 0.006], MAT_ACCENT_AERO, 0.0, 12);
    }

    // ------------------------------------------------------------------------
    // F. VENTURI FLOOR, T-TRAY SPLITTER, FLOOR EDGE WINGS & REAR DIFFUSER
    // ------------------------------------------------------------------------
    // Front T-tray / bib splitter (x: -1.36 .. -0.75, y: 0.028)
    const bibRings = [
      superellipseRing(-1.36, 0.026, 0.040, 0.13, 3.5, 20),
      superellipseRing(-1.15, 0.027, 0.046, 0.24, 3.8, 20),
      superellipseRing(-0.75, 0.029, 0.055, 0.32, 3.8, 20)
    ];
    mb.addLoft(bibRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, true);
    // Splitter metal stay rod
    mb.addTube([[-1.24, 0.04, 0.0], [-1.20, 0.19, 0.0]], 0.005, MAT_METAL_CNC, 0.0, 8);

    // Main Sculpted Ground-Effect Floor & Upswept Rear Diffuser (x: -0.86 .. +2.28)
    for (const side of [-1, 1]) {
      const flRings = [];
      const nF = 26;
      for (let r = 0; r <= nF; r++) {
        const f = r / nF;
        const x = lerp(-0.86, +2.28, f);
        // Floor outer width tapers ahead of rear tire (x > 1.32)
        let wOuter = 0.79;
        if (x > 1.25) wOuter = lerp(0.79, 0.52, smoothstep(1.25, 1.62, x));
        // Diffuser kick starts at x = 1.48 and sweeps steeply up to y = 0.31 at x = 2.28!
        const diffT = smoothstep(1.45, 2.28, x);
        const yTunnelRoof = 0.032 + 0.024 * Math.sin(clamp((x + 0.86) / 2.3, 0, 1) * Math.PI) + 0.275 * Math.pow(diffT, 1.45);
        const yEdge = x < 1.48 ? 0.030 : lerp(0.030, 0.145, diffT);

        const ring = [];
        const segsW = 14;
        for (let s = 0; s <= segsW; s++) {
          const u = s / segsW; // 0 = centerline, 1 = outer floor edge
          const z = side * u * wOuter;
          // Venturi tunnel arch in mid-span (u around 0.45) + curled outer scroll lip
          const arch = Math.sin(u * Math.PI) * (x < 1.48 ? 0.028 : 0.055);
          const scrollCurl = Math.pow(Math.max(0, (u - 0.84) / 0.16), 2.0) * (x < 1.42 ? 0.036 : 0.01);
          const yBot = lerp(0.030 + 0.22 * Math.pow(diffT, 1.6), yEdge, Math.pow(u, 1.6)) + arch + scrollCurl;
          ring.push([x, yBot, z]);
        }
        // Return along top thickness of floor slab so both top and underside render cleanly
        for (let s = segsW; s >= 0; s--) {
          const p = ring[s];
          ring.push([p[0], p[1] + 0.014, p[2]]);
        }
        flRings.push(ring);
      }
      mb.addLoft(flRings, MAT_CARBON_SATIN, 0.0, false, 1.0, 1.0, null, side > 0);

      // Floor entrance Venturi fences (3 curved vertical strakes under front of floor)
      for (const zFence of [0.34, 0.52, 0.69]) {
        const fRings = [];
        for (let r = 0; r <= 6; r++) {
          const f = r / 6;
          const x = lerp(-0.85, -0.38, f);
          const z = side * (zFence + 0.045 * f * f);
          fRings.push([
            [x, 0.028, z - 0.004],
            [x, 0.095, z - 0.004],
            [x, 0.095, z + 0.004],
            [x, 0.028, z + 0.004]
          ]);
        }
        mb.addLoft(fRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, true);
      }

      // Rear Diffuser vertical strakes & outer diffuser wall (visible from rear!)
      for (const zStrake of [0.18, 0.35, 0.51]) {
        const dRings = [];
        for (let r = 0; r <= 8; r++) {
          const f = r / 8;
          const x = lerp(1.56, 2.27, f);
          const yTop = 0.05 + 0.255 * Math.pow(f, 1.4);
          const yBot = lerp(0.032, 0.135, Math.pow(f, 1.2));
          const z = side * zStrake;
          dRings.push([
            [x, yBot, z - 0.0045],
            [x, yTop, z - 0.0045],
            [x, yTop, z + 0.0045],
            [x, yBot, z + 0.0045]
          ]);
        }
        mb.addLoft(dRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, true);
      }

      // Longitudinal Floor Edge Wing + metallic slot brackets
      const ewRings = [];
      for (let r = 0; r <= 10; r++) {
        const f = r / 10;
        const x = lerp(-0.35, 1.18, f);
        ewRings.push(airfoilRingAtSpan(side * 0.815, x, 0.052, 0.055, -0.18, -0.05, 0.14, 14).map(p => [x, p[1], side * (0.805 + (p[0] - x) * 0.45)]));
      }
      // Clean scrolled edge wing blade along z = ±0.815
      const bladePts = [];
      for (let i = 0; i <= 14; i++) {
        const f = i / 14;
        bladePts.push([lerp(-0.38, 1.20, f), 0.052 + 0.01 * Math.sin(f * Math.PI), side * 0.818]);
      }
      mb.addTube(bladePts, [0.022, 0.006], MAT_CARBON_GLOSS, 0.0, 12);
    }

    // ------------------------------------------------------------------------
    // G. MULTI-ELEMENT FRONT WING (4 SLOTTED CAMBERED ELEMENTS + CURVED ENDPLATES)
    // ------------------------------------------------------------------------
    const fwElements = [
      // [xOffset, yOffset, chordCenter, chordTip, pitchCenter, pitchTip, camber]
      [-2.82, 0.088, 0.205, 0.175, -0.05, -0.11, -0.055], // Mainplane
      [-2.62, 0.106, 0.155, 0.145, -0.16, -0.24, -0.065], // Flap 1
      [-2.47, 0.138, 0.135, 0.130, -0.28, -0.38, -0.070], // Flap 2
      [-2.35, 0.182, 0.118, 0.115, -0.40, -0.50, -0.075]  // Upper Slotted Flap 3
    ];

    const fwSpanSegs = 44;
    for (let e = 0; e < fwElements.length; e++) {
      const [x0, y0, cCen, cTip, pCen, pTip, cam] = fwElements[e];
      const rings = [];
      for (let i = 0; i <= fwSpanSegs; i++) {
        const u = (i / fwSpanSegs) * 2.0 - 1.0; // -1 .. +1
        const z = u * 0.955;
        const az = Math.abs(u);
        // Authentic F1 spoon central dip + mid-span arch + swept back tips
        const sweepX = 0.16 * Math.pow(az, 1.55);
        const spoonY = -0.024 * Math.exp(-az * az * 14.0) + 0.032 * Math.sin(az * Math.PI) - 0.018 * Math.pow(az, 3.0);
        // Central FIA neutral section on upper flap tapers smoothly near |z| < 0.12
        const centerNeutral = e >= 2 ? smoothstep(0.06, 0.22, az) : 1.0;
        const chord = lerp(cCen * (0.72 + 0.28 * centerNeutral), cTip, az);
        const pitch = lerp(pCen * (0.5 + 0.5 * centerNeutral), pTip, az);
        rings.push(airfoilRingAtSpan(z, x0 + sweepX, y0 + spoonY, chord, pitch, cam, 0.115, 24));
      }
      const mat = e === 3 ? MAT_ACCENT_AERO : MAT_CARBON_GLOSS;
      mb.addLoft(rings, mat, 0.0, true, 1.0, 1.0, null, false);
    }

    // Front Wing Curved Ground-Effect Endplates + Diveplane Canards + Nose Pylons
    for (const side of [-1, 1]) {
      // Twin Nose-to-Mainplane Aero Pylons
      mb.addAirfoilStrut(
        [-2.58, 0.19, side * 0.088],
        [-2.62, 0.085, side * 0.095],
        0.16, 0.016, MAT_CARBON_SATIN, 0.0, [1, 0, 0]
      );

      // Curved integrated endplate rolling smoothly upward at z = ±0.958
      const epRings = [];
      for (let r = 0; r <= 16; r++) {
        const f = r / 16; // 0 bottom wing join -> 1 top tip
        const y = lerp(0.082, 0.375, f);
        const xLead = lerp(-2.66, -2.42, Math.pow(f, 0.85));
        const chord = lerp(0.56, 0.26, Math.pow(f, 0.75));
        const zCurve = side * (0.952 + 0.022 * Math.sin(f * Math.PI * 0.85) - 0.018 * f * f);
        const ring = airfoilRingAtSpan(zCurve, xLead, y, chord, 0.0, side * 0.015, 0.055, 20);
        // Rotate airfoil thickness axis from Y to Z so it's a vertical endplate!
        const vRing = ring.map(p => [p[0], y, zCurve + (p[1] - y)]);
        epRings.push(vRing);
      }
      mb.addLoft(epRings, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, side < 0);
      mb.addCap(epRings[epRings.length - 1], [0, 1, 0], MAT_ACCENT_AERO, 0.0, side > 0);

      // Outboard S-curved diveplane canard on outer face of front wing endplate
      const dpPts = [];
      for (let i = 0; i <= 10; i++) {
        const f = i / 10;
        dpPts.push([lerp(-2.52, -2.18, f), lerp(0.175, 0.248, Math.pow(f, 0.75)), side * (0.985 + 0.012 * Math.sin(f * Math.PI))]);
      }
      mb.addTube(dpPts, [0.026, 0.005], MAT_CARBON_SATIN, 0.0, 10);

      // Slot-gap separator tabs across front wing flaps
      for (const zSep of [0.32, 0.68]) {
        mb.addBox(-2.46, 0.155, side * zSep, 0.22, 0.045, 0.005, MAT_METAL_CNC);
      }
    }

    // ------------------------------------------------------------------------
    // H. REAR WING (SPOON MAINPLANE, DRS FLAP, SWAN-NECK PYLONS, ENDPLATES & BEAM WING)
    // ------------------------------------------------------------------------
    // Dual Beam Wing above diffuser exit (z: -0.49 .. +0.49)
    const bwSpecs = [
      [+2.08, 0.345, 0.145, -0.22, -0.075],
      [+2.21, 0.398, 0.125, -0.38, -0.085]
    ];
    for (const [bx, by, bc, bp, bcam] of bwSpecs) {
      const bwRings = [];
      for (let i = 0; i <= 26; i++) {
        const u = (i / 26) * 2.0 - 1.0;
        const z = u * 0.495;
        const arch = 0.018 * Math.cos(u * Math.PI * 0.5);
        bwRings.push(airfoilRingAtSpan(z, bx + 0.025 * u * u, by + arch, bc, bp, bcam, 0.12, 22));
      }
      mb.addLoft(bwRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, false);
    }

    // Main Rear Wing Spoon Mainplane + High-Camber Slotted DRS Upper Flap (z: -0.51 .. +0.51)
    const rwMainRings = [], rwFlapRings = [];
    for (let i = 0; i <= 32; i++) {
      const u = (i / 32) * 2.0 - 1.0;
      const z = u * 0.512;
      const az = Math.abs(u);
      const spoonDrop = -0.032 * Math.cos(az * Math.PI * 0.5); // Spoon lower center, higher tips
      const sweep = 0.035 * az * az;
      rwMainRings.push(airfoilRingAtSpan(z, 2.22 + sweep, 0.775 + spoonDrop, 0.265, -0.19, -0.075, 0.125, 24));
      rwFlapRings.push(airfoilRingAtSpan(z, 2.465 + sweep, 0.845 + spoonDrop * 0.5, 0.165, -0.52, -0.085, 0.115, 24));
    }
    mb.addLoft(rwMainRings, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, false);
    mb.addLoft(rwFlapRings, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, false);

    // DRS Central Actuator Pod on Rear Wing
    const drsRings = [
      superellipseRing(2.34, 0.785, 0.825, 0.016, 2.2, 16),
      superellipseRing(2.43, 0.790, 0.885, 0.024, 2.4, 16),
      superellipseRing(2.55, 0.855, 0.925, 0.018, 2.2, 16)
    ];
    mb.addLoft(drsRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, true);

    // Twin Swan-Neck Rear Wing Pylons (arching over top suction side of mainplane!)
    for (const side of [-1, 1]) {
      const snPts = [
        [1.92, 0.48, side * 0.052],
        [2.05, 0.62, side * 0.056],
        [2.16, 0.79, side * 0.058],
        [2.24, 0.835, side * 0.058],
        [2.33, 0.775, side * 0.058]
      ];
      mb.addTube(snPts, [[0.008, 0.042], [0.008, 0.038], [0.007, 0.034], [0.007, 0.030], [0.007, 0.026]], MAT_CARBON_SATIN, 0.0, 14);

      // Rear Wing Endplates extending from beam wing height (y=0.38) to upper tip (y=0.95)
      const rweRings = [];
      for (let r = 0; r <= 18; r++) {
        const f = r / 18;
        const y = lerp(0.365, 0.945, f);
        // Characteristic rear lower cutout step above beam wing
        const xLead = lerp(2.08, 2.21, smoothstep(0.15, 0.65, f));
        const chord = lerp(0.30, 0.455, smoothstep(0.25, 0.70, f)) * (1.0 - 0.12 * Math.pow(f, 4.0));
        const zPos = side * (0.502 + 0.014 * smoothstep(0.3, 0.75, f) - 0.008 * Math.pow(f, 3.0));
        const baseR = airfoilRingAtSpan(zPos, xLead, y, chord, 0.0, 0.0, 0.042, 20);
        rweRings.push(baseR.map(p => [p[0], y, zPos + (p[1] - y)]));
      }
      mb.addLoft(rweRings, MAT_CARBON_GLOSS, 0.0, true, 1.0, 1.0, null, side < 0);
    }

    // Rear Crash Structure / Attenuator + Glowing Ruby FIA Rain Light + Titanium Exhaust
    const crashRings = [
      superellipseRing(2.12, 0.23, 0.365, 0.068, 2.6, 18),
      superellipseRing(2.38, 0.245, 0.355, 0.052, 2.8, 18),
      superellipseRing(2.53, 0.255, 0.345, 0.038, 3.0, 18)
    ];
    mb.addLoft(crashRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, true);
    mb.addCap(crashRings[2], [1, 0, 0], MAT_CARBON_SATIN, 0.0, false);
    // Bright ruby FIA rear rain/test LED cluster
    mb.addBox(2.536, 0.300, 0.0, 0.012, 0.072, 0.046, MAT_EMISSIVE, 1.0);

    // Central Titanium Exhaust Tailpipe + Wastegate Pipe
    const exRings = [];
    for (let r = 0; r <= 8; r++) {
      const x = lerp(2.14, 2.41, r / 8);
      const y = 0.435 + 0.012 * (r / 8);
      exRings.push(superellipseRing(x, y - 0.052, y + 0.052, 0.052, 2.0, 22));
    }
    mb.addLoft(exRings, MAT_METAL_CNC, 1.0, true, 1.0, 1.0, null, true); // aux=1.0 -> heat-blued titanium!
    // Dark inner exhaust bore
    const exInRings = [
      superellipseRing(2.30, 0.435 - 0.045, 0.435 + 0.045, 0.045, 2.0, 18),
      superellipseRing(2.412, 0.447 - 0.046, 0.447 + 0.046, 0.046, 2.0, 18)
    ];
    mb.addLoft(exInRings, MAT_DARK_CAVITY, 0.0, true, 1.0, 1.0, null, false);
    mb.addCap(exInRings[0], [1, 0, 0], MAT_DARK_CAVITY, 0.0, false);

    // ------------------------------------------------------------------------
    // I. DOUBLE-WISHBONE CARBON SUSPENSION, PUSHRODS, BRAKE DUCTS & WHEEL WINGLETS
    // ------------------------------------------------------------------------
    for (const side of [-1, 1]) {
      // --- FRONT SUSPENSION (Axle at x = -1.74, z = ±0.820, hub y = 0.360) ---
      const fHubU = [FRONT_AXLE_X, 0.485, side * 0.645];
      const fHubL = [FRONT_AXLE_X, 0.225, side * 0.655];
      // Upper Wishbone (front & rear airfoil legs)
      mb.addAirfoilStrut([-1.96, 0.475, side * 0.215], fHubU, 0.068, 0.014, MAT_CARBON_SATIN);
      mb.addAirfoilStrut([-1.50, 0.495, side * 0.230], fHubU, 0.072, 0.014, MAT_CARBON_SATIN);
      // Lower Wishbone
      mb.addAirfoilStrut([-1.98, 0.215, side * 0.195], fHubL, 0.075, 0.015, MAT_CARBON_SATIN);
      mb.addAirfoilStrut([-1.46, 0.205, side * 0.225], fHubL, 0.078, 0.015, MAT_CARBON_SATIN);
      // Steering Track Rod
      mb.addAirfoilStrut([-1.84, 0.365, side * 0.215], [FRONT_AXLE_X - 0.07, 0.365, side * 0.640], 0.052, 0.012, MAT_CARBON_SATIN);
      // Pushrod (diagonal from lower hub up to top chassis rocker)
      mb.addAirfoilStrut(fHubL, [-1.66, 0.515, side * 0.210], 0.045, 0.013, MAT_CARBON_SATIN);

      // Front Stationary Carbon Brake Drum + Cooling Scoop + Over-Wheel Eyebrow Winglet!
      const fDrumRings = [
        superellipseRing(FRONT_AXLE_X, 0.360 - 0.195, 0.360 + 0.195, 0.195, 2.0, 24).map(p => [FRONT_AXLE_X + p[2], p[1], side * 0.642]),
        superellipseRing(FRONT_AXLE_X, 0.360 - 0.202, 0.360 + 0.202, 0.202, 2.0, 24).map(p => [FRONT_AXLE_X + p[2], p[1], side * 0.688])
      ];
      mb.addLoft(fDrumRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, side > 0);
      mb.addCap(fDrumRings[0], [0, 0, -side], MAT_CARBON_SATIN, 0.0, side > 0);
      // Front brake cooling intake scoop
      mb.addBox(FRONT_AXLE_X - 0.14, 0.39, side * 0.625, 0.12, 0.14, 0.055, MAT_CARBON_SATIN);
      mb.addBox(FRONT_AXLE_X - 0.201, 0.39, side * 0.625, 0.01, 0.11, 0.042, MAT_DARK_CAVITY);

      // Signature Modern F1 Curved Over-Wheel Deflector Winglet (controls front tire wake!)
      const owPts = [];
      for (let i = 0; i <= 14; i++) {
        const f = i / 14;
        const ang = lerp(2.15, 0.72, f); // wraps from front-top over top-rear of inner tire shoulder
        const r = 0.405;
        owPts.push([
          FRONT_AXLE_X - Math.cos(ang) * r * 0.92,
          0.360 + Math.sin(ang) * r,
          side * lerp(0.635, 0.775, Math.sin(f * Math.PI * 0.85))
        ]);
      }
      mb.addTube(owPts, [0.048, 0.007], MAT_CARBON_GLOSS, 0.0, 12);

      // --- REAR SUSPENSION (Axle at x = +1.80, z = ±0.790, hub y = 0.360) ---
      const rHubU = [REAR_AXLE_X, 0.485, side * 0.565];
      const rHubL = [REAR_AXLE_X, 0.225, side * 0.575];
      // Swept Rear Upper Wishbone
      mb.addAirfoilStrut([+1.46, 0.495, side * 0.165], rHubU, 0.072, 0.015, MAT_CARBON_SATIN);
      mb.addAirfoilStrut([+1.98, 0.465, side * 0.125], rHubU, 0.076, 0.015, MAT_CARBON_SATIN);
      // Swept Rear Lower Wishbone + Driveshaft Fairing
      mb.addAirfoilStrut([+1.48, 0.225, side * 0.165], rHubL, 0.078, 0.016, MAT_CARBON_SATIN);
      mb.addAirfoilStrut([+2.04, 0.245, side * 0.105], rHubL, 0.085, 0.016, MAT_CARBON_SATIN);
      mb.addAirfoilStrut([+1.79, 0.355, side * 0.145], [REAR_AXLE_X, 0.358, side * 0.570], 0.092, 0.024, MAT_CARBON_SATIN); // Driveshaft shroud
      // Rear Pullrod
      mb.addAirfoilStrut([REAR_AXLE_X - 0.04, 0.475, side * 0.555], [+1.55, 0.235, side * 0.155], 0.044, 0.013, MAT_CARBON_SATIN);

      // Rear Brake Drum + Multi-Winglets
      const rDrumRings = [
        superellipseRing(REAR_AXLE_X, 0.360 - 0.198, 0.360 + 0.198, 0.198, 2.0, 24).map(p => [REAR_AXLE_X + p[2], p[1], side * 0.562]),
        superellipseRing(REAR_AXLE_X, 0.360 - 0.205, 0.360 + 0.205, 0.205, 2.0, 24).map(p => [REAR_AXLE_X + p[2], p[1], side * 0.605])
      ];
      mb.addLoft(rDrumRings, MAT_CARBON_SATIN, 0.0, true, 1.0, 1.0, null, side > 0);
      mb.addCap(rDrumRings[0], [0, 0, -side], MAT_CARBON_SATIN, 0.0, side > 0);
      for (let w = 0; w < 3; w++) {
        mb.addBox(REAR_AXLE_X + 0.16, 0.23 + w * 0.045, side * 0.545, 0.14, 0.006, 0.065, MAT_CARBON_SATIN);
      }
    }
  }

  // Build a single high-detail 18-inch F1 Wheel + Slick Tire + Aero Wheel Cover centered at (0,0,0)
  // Rendered 4 times (with per-wheel model/axle transform + live spin + world-space contact patch!)
  function buildSingleWheelMesh(gl, width, isOuterPositiveZ = true) {
    const mb = new MeshBuilder();
    const halfW = width * 0.5;
    const R_outer = TIRE_RADIUS;  // 0.360 m
    const R_rim   = 0.229;        // 18-inch rim (0.2286 m radius)
    const segsTheta = 72;

    // Cross-section profile of tire from inner rim bead (s = -1) -> inner shoulder -> flat crown -> outer shoulder -> outer rim bead (s = +1)
    const profilePts = [];
    const nProf = 34;
    for (let p = 0; p <= nProf; p++) {
      const s = (p / nProf) * 2.0 - 1.0; // -1 .. +1
      const as = Math.abs(s);
      let r, z;
      if (as <= 0.56) {
        // Tread contact crown with subtle authentic F1 shoulder camber roll-off
        const u = as / 0.56;
        z = Math.sign(s) * u * (halfW * 0.89);
        r = R_outer - 0.008 * Math.pow(u, 3.2);
      } else {
        // Sculpted sidewall bulge + rim-protector lip near R_rim
        const u = (as - 0.56) / 0.44; // 0 at shoulder -> 1 at rim lip
        const shoulderZ = halfW * 0.89;
        const rimZ = halfW * 0.82;
        const bulge = Math.sin(u * Math.PI) * (halfW * 0.115);
        const rimLip = Math.exp(-Math.pow((u - 0.92) * 14.0, 2.0)) * 0.007;
        z = Math.sign(s) * (lerp(shoulderZ, rimZ, Math.pow(u, 1.35)) + bulge + rimLip);
        r = lerp(R_outer - 0.008, R_rim, Math.pow(u, 0.82));
      }
      profilePts.push([r, z, s]);
    }

    const tireRings = [];
    for (let t = 0; t <= segsTheta; t++) {
      const ang = (t / segsTheta) * TAU;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const ring = [];
      for (let p = 0; p <= nProf; p++) {
        const [r, z] = profilePts[p];
        ring.push([ca * r, sa * r, z]);
      }
      tireRings.push(ring);
    }

    // Pass [theta/(2*PI), meridianS (-1..+1)] in UV so fragment shader renders exact tread wear & sidewall ribs!
    mb.addLoft(
      tireRings, MAT_TIRE_RUBBER, 1.0, false, 1.0, 1.0,
      (r, s) => [r / segsTheta, profilePts[s][2]],
      true
    );

    // Outer & Inner Metallic Rim Lip Rings + Recessed Aero Carbon Wheel Cover + Center Locknut
    for (const side of [-1, 1]) {
      const rimZ = side * (halfW * 0.82);
      const dishZ = side * (halfW * 0.72);
      const hubZ  = side * (halfW * 0.77);

      const coverProfile = [
        [R_rim + 0.005, rimZ, MAT_ACCENT_AERO],
        [R_rim - 0.012, rimZ + side * 0.006, MAT_ACCENT_AERO],
        [R_rim - 0.022, dishZ, MAT_CARBON_SATIN],
        [0.145, dishZ - side * 0.018, MAT_CARBON_SATIN],
        [0.072, hubZ, MAT_CARBON_SATIN],
        [0.055, hubZ + side * 0.016, MAT_METAL_CNC],
        [0.032, hubZ + side * 0.022, MAT_METAL_CNC],
        [0.026, dishZ - side * 0.012, MAT_DARK_CAVITY],
        [0.001, dishZ - side * 0.012, MAT_DARK_CAVITY]
      ];

      for (let seg = 0; seg < coverProfile.length - 1; seg++) {
        const [r0, z0, m0] = coverProfile[seg];
        const [r1, z1] = coverProfile[seg + 1];
        const cRings = [];
        for (let t = 0; t <= 56; t++) {
          const a = (t / 56) * TAU;
          const ca = Math.cos(a), sa = Math.sin(a);
          cRings.push([
            [ca * r0, sa * r0, z0],
            [ca * r1, sa * r1, z1]
          ]);
        }
        mb.addLoft(
          cRings, m0, 1.0, false, 1.0, 1.0,
          (tIdx, sIdx) => [tIdx / 56, sIdx === 0 ? r0 : r1],
          side > 0
        );
      }

      // Sculpted rotational aero vanes on outer wheel cover + internal carbon brake rotor & caliper glimpse!
      if (side === (isOuterPositiveZ ? 1 : -1)) {
        // Internal drilled carbon-ceramic brake disc & metallic caliper visible inside rim depth
        const rotorZ = dishZ - side * 0.032;
        const rDisc = [
          [0.188, rotorZ, MAT_METAL_CNC],
          [0.105, rotorZ, MAT_METAL_CNC]
        ];
        const discRings = [];
        for (let t = 0; t <= 40; t++) {
          const a = (t / 40) * TAU;
          discRings.push([
            [Math.cos(a) * rDisc[0][0], Math.sin(a) * rDisc[0][0], rotorZ],
            [Math.cos(a) * rDisc[1][0], Math.sin(a) * rDisc[1][0], rotorZ]
          ]);
        }
        mb.addLoft(discRings, MAT_METAL_CNC, 0.0, false, 1.0, 1.0, null, side > 0);

        const nVanes = 10;
        for (let v = 0; v < nVanes; v++) {
          const baseA = (v / nVanes) * TAU;
          const pIn = [Math.cos(baseA) * 0.078, Math.sin(baseA) * 0.078, dishZ + side * 0.004];
          const pOut = [Math.cos(baseA + 0.34) * 0.212, Math.sin(baseA + 0.34) * 0.212, rimZ - side * 0.002];
          mb.addAirfoilStrut(pIn, pOut, 0.028, 0.009, MAT_CARBON_SATIN, 1.0, [0, 0, side], 3, 10);
        }
      }
    }

    return mb.compile(gl);
  }

  // Build the Giant Downstream 12-Blade Axial Wind Tunnel Fan (rotates around X axis at x=12.4, y=2.25, z=0)
  function buildTunnelFanMesh(gl) {
    const mb = new MeshBuilder();
    const nBlades = 12;
    for (let b = 0; b < nBlades; b++) {
      const a0 = (b / nBlades) * TAU;
      const ca = Math.cos(a0), sa = Math.sin(a0);
      // Twisted aero fan blade from r=0.88m to r=4.65m
      const bRings = [];
      for (let r = 0; r <= 8; r++) {
        const f = r / 8;
        const rad = lerp(0.86, 4.65, f);
        const chord = lerp(0.58, 0.34, f);
        const twist = lerp(0.65, 0.28, f);
        const localRing = airfoilRingAtSpan(rad, -0.18, 0.0, chord, twist, 0.04, 0.09, 16);
        // Map (x, tangential, radial) around X axis!
        bRings.push(localRing.map(p => {
          const tang = p[1];
          const py = sa * rad + ca * tang;
          const pz = ca * rad - sa * tang;
          return [p[0], py, pz];
        }));
      }
      mb.addLoft(bRings, MAT_CARBON_SATIN, 0.0, true, 0.5, 0.5, null, false);
    }
    return mb.compile(gl);
  }

  // Add tiny brass/steel smoke emission nozzles on the upstream rake at exact streamline seed positions
  function addSmokeNozzlesToTunnel(mb, seeds) {
    for (const s of seeds) {
      if (!s.primary) continue;
      mb.addTube([[s.x - 0.10, s.y, s.z], [s.x + 0.02, s.y, s.z]], 0.0055, MAT_METAL_CNC, 0.0, 8);

  }

  // ============================================================================
  // 6. 3D AERODYNAMIC POTENTIAL FLOW + BOUND VORTEX + WAKE TURBULENCE SOLVER
  // ============================================================================
  function smin(a, b, k) {
    const h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return lerp(b, a, h) - k * h * (1.0 - h);
  }
  function sdBox(px, py, pz, cx, cy, cz, hx, hy, hz, rad = 0.02) {
    const dx = Math.abs(px - cx) - hx;
    const dy = Math.abs(py - cy) - hy;
    const dz = Math.abs(pz - cz) - hz;
    const ox = Math.max(dx, 0), oy = Math.max(dy, 0), oz = Math.max(dz, 0);
    return Math.hypot(ox, oy, oz) + Math.min(Math.max(dx, Math.max(dy, dz)), 0.0) - rad;
  }
  function sdCapsuleX(px, py, pz, x0, y0, z0, x1, y1, z1, r0, r1) {
    const bax = x1 - x0, bay = y1 - y0, baz = z1 - z0;
    const pax = px - x0, pay = py - y0, paz = pz - z0;
    const h = clamp((pax*bax + pay*bay + paz*baz) / (bax*bax + bay*bay + baz*baz), 0.0, 1.0);
    const r = lerp(r0, r1, h);
    return Math.hypot(pax - bax*h, pay - bay*h, paz - baz*h) - r;
  }
  function sdWheelZ(px, py, pz, wx, wy, wz, radius, halfW) {
    const dRad = Math.hypot(px - wx, py - wy) - radius;
    const dZ = Math.abs(pz - wz) - halfW;
    return Math.hypot(Math.max(dRad, 0), Math.max(dZ, 0)) + Math.min(Math.max(dRad, dZ), 0) - 0.015;
  }

  // Composite Signed Distance Field of the F1 Car (symmetric in |z|) for exact streamline bending & collision-free flow!
  function carSDF(x, y, zInput) {
    const z = Math.abs(zInput);
    // Quick broadphase AABB check
    if (x < -3.05 || x > 2.85 || y > 1.25 || z > 1.18) {
      return Math.max(
        Math.max(-3.00 - x, x - 2.80),
        Math.max(y - 1.15, z - 1.10)
      );
    }

    // 1. Nose + Monocoque + Roll Hoop + Engine Cover Spine
    let d = sdCapsuleX(x, y, z, -2.85, 0.180, 0.0, -1.75, 0.355, 0.0, 0.062, 0.215);
    d = smin(d, sdCapsuleX(x, y, z, -1.75, 0.355, 0.0, -0.25, 0.365, 0.0, 0.215, 0.285), 0.09);
    // Helmet + Halo + Airbox dome
    d = smin(d, sdCapsuleX(x, y, z, -0.35, 0.68, 0.0, +0.28, 0.86, 0.0, 0.145, 0.155), 0.10);
    // Tapering Engine Cover Spine
    d = smin(d, sdCapsuleX(x, y, z, +0.28, 0.56, 0.0, +2.05, 0.36, 0.0, 0.24, 0.10), 0.10);

    // 2. Sculpted Sidepod (preserving deep front undercut below y=0.33 near x=-0.55!)
    if (x > -0.72 && x < 1.85) {
      const f = clamp((x + 0.58) / 2.25, 0.0, 1.0);
      const zOut = lerp(0.66, 0.19, Math.pow(f, 1.2));
      const yTop = lerp(0.57, 0.23, Math.pow(f, 0.9));
      const yBot = lerp(0.33, 0.08, smoothstep(0.0, 0.45, f));
      const dSp = sdBox(x, y, z, x, 0.5*(yTop+yBot), 0.5*(0.15+zOut), 0.09, Math.max(0.02, 0.5*(yTop-yBot)), Math.max(0.02, 0.5*(zOut-0.15)), 0.045);
      if (x >= -0.59 && x <= 1.70) d = smin(d, dSp, 0.075);
    }

    // 3. Floor Slab (thin slab around y = 0.05..0.075 so flow under y < 0.045 passes through Venturi & rises in diffuser!)
    if (x > -0.90 && x < 2.28 && z < 0.80) {
      const diffT = smoothstep(1.45, 2.28, x);
      const ySlab = 0.058 + 0.235 * Math.pow(diffT, 1.45);
      const wMax = x > 1.25 ? lerp(0.79, 0.52, smoothstep(1.25, 1.62, x)) : 0.79;
      if (z <= wMax) {
        const dFl = Math.abs(y - ySlab) - 0.016;
        d = smin(d, Math.max(dFl, Math.max(-0.86 - x, x - 2.26)), 0.025);
      }
    }

    // 4. Front Wing Slotted Cascade + Endplates
    if (x > -2.92 && x < -2.12 && z < 1.02) {
      const az = clamp(z / 0.955, 0.0, 1.0);
      const xWing = -2.56 + 0.15 * Math.pow(az, 1.5);
      const yWing = 0.125 + 0.04 * ((x - xWing) / 0.25);
      const dFw = sdBox(x, y, z, xWing, yWing, 0.48, 0.23, 0.025, 0.48, 0.02);
      const dEp = sdBox(x, y, z, -2.44, 0.225, 0.958, 0.21, 0.145, 0.014, 0.015);
      d = smin(d, smin(dFw, dEp, 0.025), 0.03);
    }

    // 5. Rear Wing, Beam Wing & Endplates
    if (x > 2.00 && x < 2.74 && z < 0.60) {
      const dRw = sdBox(x, y, z, 2.43, 0.825 + 0.18 * (x - 2.43), 0.0, 0.22, 0.032, 0.51, 0.02);
      const dBw = sdBox(x, y, z, 2.16, 0.385 + 0.16 * (x - 2.16), 0.0, 0.13, 0.022, 0.49, 0.015);
      const dRe = sdBox(x, y, z, 2.38, 0.655, 0.512, 0.21, 0.285, 0.014, 0.015);
      d = smin(d, smin(dRw, smin(dBw, dRe, 0.02), 0.02), 0.025);
    }

    // 6. Front & Rear Wheels
    d = smin(d, sdWheelZ(x, y, z, FRONT_AXLE_X, TIRE_RADIUS, FRONT_TRACK_Z, TIRE_RADIUS + 0.010, 0.158), 0.03);
    d = smin(d, sdWheelZ(x, y, z, REAR_AXLE_X,  TIRE_RADIUS, REAR_TRACK_Z,  TIRE_RADIUS + 0.010, 0.208), 0.03);

    return d;
  }

  class AeroFlowField {
    constructor() {
      // Half-symmetric grid covering x: [-4.8, +6.6], y: [0.0, +2.25], z: [0.0, +1.85]
      this.xMin = -4.80; this.xMax = +6.60; this.nx = 136;
      this.yMin =  0.00; this.yMax = +2.25; this.ny = 46;
      this.zMin =  0.00; this.zMax = +1.85; this.nz = 38;
      this.dx = (this.xMax - this.xMin) / (this.nx - 1);
      this.dy = (this.yMax - this.yMin) / (this.ny - 1);
      this.dz = (this.zMax - this.zMin) / (this.nz - 1);

      const total = this.nx * this.ny * this.nz;
      this.sdf = new Float32Array(total);
      this.vx  = new Float32Array(total);
      this.vy  = new Float32Array(total);
      this.vz  = new Float32Array(total);
      this.turb = new Float32Array(total); // Local aerodynamic wake turbulence intensity [0..1]

      this.solvePotentialAndVortices();
    }

    idx(ix, iy, iz) {
      return (ix * this.ny + iy) * this.nz + iz;
    }

    solvePotentialAndVortices() {
      const { nx, ny, nz, dx, dy, dz, xMin, yMin, zMin, sdf } = this;
      const total = nx * ny * nz;
      const phi = new Float32Array(total);
      const solid = new Uint8Array(total);

      // 1. Evaluate car SDF and initialize perturbation potential phi (total potential = U*x + phi)
      for (let ix = 0; ix < nx; ix++) {
        const x = xMin + ix * dx;
        for (let iy = 0; iy < ny; iy++) {
          const y = yMin + iy * dy;
          for (let iz = 0; iz < nz; iz++) {
            const z = zMin + iz * dz;
            const id = (ix * ny + iy) * nz + iz;
            const d = carSDF(x, y, z);
            sdf[id] = d;
            solid[id] = d <= 0.012 ? 1 : 0;
            phi[id] = 0.0;
          }
        }
      }

      // 2. Solve 3D Laplace equation for perturbation potential with Neumann body-obstruction BC (-dPhi/dn = U_inf * nx)
      const invDx2 = 1.0 / (dx * dx), invDy2 = 1.0 / (dy * dy), invDz2 = 1.0 / (dz * dz);
      const omegaSOR = 1.62;

      for (let iter = 0; iter < 38; iter++) {
        for (let ix = 1; ix < nx - 1; ix++) {
          for (let iy = 0; iy < ny - 1; iy++) {
            for (let iz = 0; iz < nz - 1; iz++) {
              const id = (ix * ny + iy) * nz + iz;
              if (solid[id]) continue;

              let sum = 0.0, weight = 0.0, rhs = 0.0;

              // -X neighbor
              const idXm = ((ix - 1) * ny + iy) * nz + iz;
              if (solid[idXm]) rhs -= dx * 1.0 * invDx2;
              else { sum += phi[idXm] * invDx2; weight += invDx2; }

              // +X neighbor
              const idXp = ((ix + 1) * ny + iy) * nz + iz;
              if (solid[idXp]) rhs += dx * 1.0 * invDx2;
              else { sum += phi[idXp] * invDx2; weight += invDx2; }

              // -Y neighbor (floor y=0 has no-penetration dPhi/dy = 0!)
              if (iy > 0) {
                const idYm = (ix * ny + (iy - 1)) * nz + iz;
                if (!solid[idYm]) { sum += phi[idYm] * invDy2; weight += invDy2; }
              }
              // +Y neighbor
              const idYp = (ix * ny + (iy + 1)) * nz + iz;
              if (!solid[idYp]) { sum += phi[idYp] * invDy2; weight += invDy2; }

              // -Z neighbor (symmetry plane z=0 has dPhi/dz = 0!)
              if (iz > 0) {
                const idZm = (ix * ny + iy) * nz + (iz - 1);
                if (!solid[idZm]) { sum += phi[idZm] * invDz2; weight += invDz2; }
              }
              // +Z neighbor
              const idZp = (ix * ny + iy) * nz + (iz + 1);
              if (!solid[idZp]) { sum += phi[idZp] * invDz2; weight += invDz2; }

              if (weight > 1e-8) {
                const target = (sum - rhs) / weight;
                phi[id] += omegaSOR * (target - phi[id]);
              }
            }
          }
        }
      }

      // 3. Differentiate potential + superpose authentic F1 bound downforce circulation,
      //    sidepod downwash, Venturi suction, diffuser upwash, & trailing wingtip helical vortices!
      for (let ix = 0; ix < nx; ix++) {
        const x = xMin + ix * dx;
        for (let iy = 0; iy < ny; iy++) {
          const y = yMin + iy * dy;
          for (let iz = 0; iz < nz; iz++) {
            const z = zMin + iz * dz;
            const id = (ix * ny + iy) * nz + iz;

            const ixm = Math.max(0, ix - 1), ixp = Math.min(nx - 1, ix + 1);
            const iym = Math.max(0, iy - 1), iyp = Math.min(ny - 1, iy + 1);
            const izm = Math.max(0, iz - 1), izp = Math.min(nz - 1, iz + 1);

            let ux = 1.0 + (phi[(ixp*ny + iy)*nz + iz] - phi[(ixm*ny + iy)*nz + iz]) / ((ixp - ixm) * dx);
            let uy = (phi[(ix*ny + iyp)*nz + iz] - phi[(ix*ny + iym)*nz + iz]) / ((iyp - iym) * dy);
            let uz = iz === 0 ? 0.0 : (phi[(ix*ny + iy)*nz + izp] - phi[(ix*ny + iy)*nz + izm]) / ((izp - izm) * dz);

            // A. Front Wing upwash/outwash & endplate vortex (x > -2.55)
            if (x > -2.65 && x < -1.10) {
              // Upward kick behind inverted cambered front wing (creating front downforce!)
              if (z < 0.96) {
                const fwW = Math.exp(-Math.pow((x + 2.28) / 0.45, 2.0)) * Math.exp(-Math.pow((y - 0.18) / 0.16, 2.0));
                uy += 0.22 * fwW;
                uz += 0.18 * fwW * smoothstep(0.35, 0.92, z); // Outwash around front tire!
              }
              // Front wing endplate outwash vortex core at (y ~ 0.22, z ~ 0.97)
              const dyE = y - 0.23, dzE = z - 0.97;
              const r2E = dyE * dyE + dzE * dzE;
              const gamE = 0.048 * smoothstep(-2.55, -2.20, x) * Math.exp(-(x + 2.20) * 0.65) * (1.0 - Math.exp(-r2E / 0.008)) / (r2E + 0.006);
              uy +=  dzE * gamE;
              uz += -dyE * gamE;
            }

            // B. Sidepod undercut inwash & downwash waterslide ramp (-0.5 < x < +1.75)
            if (x > -0.55 && x < 1.85 && z > 0.18 && z < 0.78) {
              const spEnv = smoothstep(-0.50, -0.10, x) * (1.0 - smoothstep(1.35, 1.85, x));
              // Coanda downwash hugging sloped upper sidepod toward beam wing & coke-bottle floor
              if (y > 0.22 && y < 0.72) {
                uy -= 0.23 * spEnv * Math.exp(-Math.pow((y - lerp(0.54, 0.30, (x + 0.5) / 2.2)) / 0.20, 2.0));
                uz -= 0.16 * spEnv * smoothstep(0.2, 1.4, x); // Coke-bottle inward sweep!
              }
            }

            // C. Venturi Underfloor Suction + Strong Rear Diffuser Upwash Plume
            if (x > -1.0 && x < 1.55 && y < 0.09 && z < 0.75) {
              ux += 0.38 * (1.0 - y / 0.09); // Bernoulli acceleration under ground-effect floor!
            }
            if (x > 1.48 && z < 0.68) {
              const dfEnv = smoothstep(1.48, 2.15, x) * Math.exp(-Math.max(0, x - 2.35) * 0.32);
              const yCore = 0.16 + 0.22 * Math.max(0, x - 1.85);
              uy += 0.34 * dfEnv * Math.exp(-Math.pow((y - yCore) / 0.34, 2.0)) * (1.0 - Math.pow(z / 0.68, 2.0));
            }

            // D. Rear Wing & Beam Wing Strong Upwash ("Rooster-Tail" Downforce Reaction!) + Helical Wingtip Vortices
            if (x > 2.10) {
              const rwSpan = smoothstep(0.68, 0.38, z);
              const yWake = 0.76 + 0.21 * Math.max(0, x - 2.45);
              const rwUp = 0.42 * rwSpan * smoothstep(2.10, 2.58, x) * Math.exp(-Math.max(0, x - 2.65) * 0.18) * Math.exp(-Math.pow((y - yWake) / 0.48, 2.0));
              uy += rwUp;

              // Counter-rotating Trailing Rear-Wingtip Helical Vortex!
              // High-pressure outboard/lower air curls UP outboard of z=0.51 and INWARD over top of rear wingtip!
              if (x > 2.40) {
                const dxW = Math.max(0, x - 2.46);
                const yVort = 0.90 + 0.185 * dxW;
                const zVort = Math.max(0.35, 0.505 - 0.018 * dxW);
                const dyV = y - yVort;
                const dzV = z - zVort;
                const r2V = dyV * dyV + dzV * dzV;
                const coreR2 = 0.0038 + 0.0042 * dxW;
                const circ = 0.165 * smoothstep(2.40, 2.60, x) * Math.exp(-dxW * 0.10) * (1.0 - Math.exp(-r2V / coreR2)) / (r2V + 0.0026);
                uy +=  dzV * circ;
                uz += -dyV * circ;
              }
            }

            // E. Local Wake Deficit & Turbulence Intensity Map (strictly zero upstream for pure laminar entry!)
            let wakeT = 0.0;
            // Front wheel wake (only behind front tire x > FRONT_AXLE_X + 0.08)
            if (x > FRONT_AXLE_X + 0.08) {
              const dxF = x - (FRONT_AXLE_X + 0.08);
              const rF = Math.hypot((y - 0.35) / 0.36, (z - FRONT_TRACK_Z) / 0.21);
              const wF = Math.exp(-rF * rF * (1.0 / (1.0 + 0.22 * dxF))) * smoothstep(0.0, 0.45, dxF) * Math.exp(-dxF * 0.26);
              wakeT = Math.max(wakeT, 0.42 * wF);
              ux *= (1.0 - 0.24 * wF);
            }
            // Rear wheel wake
            if (x > REAR_AXLE_X + 0.05) {
              const dxR = x - (REAR_AXLE_X + 0.05);
              const rR = Math.hypot((y - 0.38) / 0.44, (z - REAR_TRACK_Z) / 0.26);
              const wR = Math.exp(-rR * rR * (1.0 / (1.0 + 0.28 * dxR))) * smoothstep(0.0, 0.40, dxR) * Math.exp(-dxR * 0.14);
              wakeT = Math.max(wakeT, 0.80 * wR);
              ux *= (1.0 - 0.32 * wR);
            }
            // Main car diffuser + rear wing turbulent wake cone (x > +2.02)
            if (x > 2.02) {
              const dxC = Math.max(0, x - 2.18);
              const yCenter = 0.48 + 0.19 * dxC;
              const spreadY = 0.45 + 0.16 * dxC;
              const spreadZ = 0.66 + 0.14 * dxC;
              const rC = Math.hypot((y - yCenter) / spreadY, z / spreadZ);
              const wC = Math.exp(-rC * rC * 1.15) * smoothstep(2.02, 2.58, x);
              wakeT = Math.max(wakeT, 0.96 * wC);
              ux *= (1.0 - 0.28 * wC * Math.exp(-dxC * 0.22));
            }

            // Enforce symmetry & floor boundary
            if (iz === 0) uz = 0.0;
            if (iy === 0 && uy < 0.0) uy = 0.0;

            // Project velocity tangent to car SDF boundary if very close to body surface
            const dSurf = sdf[id];
            if (dSurf < 0.11 && dSurf > -0.05) {
              const gx = (sdf[(ixp*ny + iy)*nz + iz] - sdf[(ixm*ny + iy)*nz + iz]) / ((ixp - ixm) * dx);
              const gy = (sdf[(ix*ny + iyp)*nz + iz] - sdf[(ix*ny + iym)*nz + iz]) / ((iyp - iym) * dy);
              const gz = iz === 0 ? 0.0 : (sdf[(ix*ny + iy)*nz + izp] - sdf[(ix*ny + iy)*nz + izm]) / ((izp - izm) * dz);
              const gl = Math.hypot(gx, gy, gz);
              if (gl > 1e-5) {
                const nxS = gx / gl, nyS = gy / gl, nzS = gz / gl;
                const vn = ux * nxS + uy * nyS + uz * nzS;
                const blend = smoothstep(0.11, 0.018, dSurf);
                if (vn < 0.02) {
                  ux += (0.02 - vn) * nxS * blend;
                  uy += (0.02 - vn) * nyS * blend;
                  uz += (0.02 - vn) * nzS * blend;
                }
              }
            }

            this.vx[id] = ux * WIND_SPEED;
            this.vy[id] = uy * WIND_SPEED;
            this.vz[id] = uz * WIND_SPEED;
            this.turb[id] = wakeT;
          }
        }
      }

      // 4. 1-Pass 3D Fluid Velocity Smoothing outside solid cells so streamline curvature is C2-silky!
      const vxCopy = new Float32Array(this.vx);
      const vyCopy = new Float32Array(this.vy);
      const vzCopy = new Float32Array(this.vz);
      for (let ix = 1; ix < nx - 1; ix++) {
        for (let iy = 1; iy < ny - 1; iy++) {
          for (let iz = 0; iz < nz - 1; iz++) {
            const id = (ix * ny + iy) * nz + iz;
            if (sdf[id] < 0.02) continue;
            const izm = Math.max(0, iz - 1), izp = iz + 1;
            const ixm = ((ix - 1) * ny + iy) * nz + iz, ixp = ((ix + 1) * ny + iy) * nz + iz;
            const iym = (ix * ny + (iy - 1)) * nz + iz, iyp = (ix * ny + (iy + 1)) * nz + iz;
            const kzm = (ix * ny + iy) * nz + izm,      kzp = (ix * ny + iy) * nz + izp;
            this.vx[id] = 0.52 * vxCopy[id] + 0.08 * (vxCopy[ixm] + vxCopy[ixp] + vxCopy[iym] + vxCopy[iyp] + vxCopy[kzm] + vxCopy[kzp]);
            this.vy[id] = 0.52 * vyCopy[id] + 0.08 * (vyCopy[ixm] + vyCopy[ixp] + vyCopy[iym] + vyCopy[iyp] + vyCopy[kzm] + vyCopy[kzp]);
            this.vz[id] = iz === 0 ? 0.0 : (0.52 * vzCopy[id] + 0.08 * (vzCopy[ixm] + vzCopy[ixp] + vzCopy[iym] + vzCopy[iyp] + vzCopy[kzm] + vzCopy[kzp]));
          }
        }
      }
    }

    // Fast trilinear lookup of velocity + SDF + wake turbulence at any 3D world point (x, y, z)
    sample(x, y, z, out) {
      const signZ = z < 0.0 ? -1.0 : 1.0;
      const az = Math.abs(z);
      const fx = clamp((x - this.xMin) / this.dx, 0.0, this.nx - 1.001);
      const fy = clamp((y - this.yMin) / this.dy, 0.0, this.ny - 1.001);
      const fz = clamp((az - this.zMin) / this.dz, 0.0, this.nz - 1.001);

      const ix = fx | 0, iy = fy | 0, iz = fz | 0;
      const tx = fx - ix, ty = fy - iy, tz = fz - iz;
      const ny = this.ny, nz = this.nz;

      const i000 = (ix * ny + iy) * nz + iz;
      const i100 = ((ix + 1) * ny + iy) * nz + iz;
      const i010 = (ix * ny + (iy + 1)) * nz + iz;
      const i110 = ((ix + 1) * ny + (iy + 1)) * nz + iz;
      const i001 = i000 + 1, i101 = i100 + 1, i011 = i010 + 1, i111 = i110 + 1;

      const w000 = (1 - tx) * (1 - ty) * (1 - tz);
      const w100 = tx * (1 - ty) * (1 - tz);
      const w010 = (1 - tx) * ty * (1 - tz);
      const w110 = tx * ty * (1 - tz);
      const w001 = (1 - tx) * (1 - ty) * tz;
      const w101 = tx * (1 - ty) * tz;
      const w011 = (1 - tx) * ty * tz;
      const w111 = tx * ty * tz;

      out[0] = this.vx[i000]*w000 + this.vx[i100]*w100 + this.vx[i010]*w010 + this.vx[i110]*w110 +
               this.vx[i001]*w001 + this.vx[i101]*w101 + this.vx[i011]*w011 + this.vx[i111]*w111;
      out[1] = this.vy[i000]*w000 + this.vy[i100]*w100 + this.vy[i010]*w010 + this.vy[i110]*w110 +
               this.vy[i001]*w001 + this.vy[i101]*w101 + this.vy[i011]*w011 + this.vy[i111]*w111;
      out[2] = signZ * (
               this.vz[i000]*w000 + this.vz[i100]*w100 + this.vz[i010]*w010 + this.vz[i110]*w110 +
               this.vz[i001]*w001 + this.vz[i101]*w101 + this.vz[i011]*w011 + this.vz[i111]*w111);
      out[3] = this.turb[i000]*w000 + this.turb[i100]*w100 + this.turb[i010]*w010 + this.turb[i110]*w110 +
               this.turb[i001]*w001 + this.turb[i101]*w101 + this.turb[i011]*w011 + this.turb[i111]*w111;
      out[4] = this.sdf[i000]*w000 + this.sdf[i100]*w100 + this.sdf[i010]*w010 + this.sdf[i110]*w110 +
               this.sdf[i001]*w001 + this.sdf[i101]*w101 + this.sdf[i011]*w011 + this.sdf[i111]*w111;
      return out;
    }
  }
