<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<title>Wildfire Ridge</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c0f14;color:#e5e0d9;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{position:relative;width:100%;height:100%;isolation:isolate}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas.dragging{cursor:grabbing}
.controls{position:absolute;bottom:max(21px,env(safe-area-inset-bottom));right:max(23px,env(safe-area-inset-right));display:flex;align-items:center;gap:4px;transition:opacity 1.5s;color:#e3dfd6}
body.resting .controls{opacity:0;pointer-events:none}
.controls:focus-within,body.resting .controls:hover{opacity:1;pointer-events:auto}
.hint{font-size:11px;letter-spacing:.025em;color:#d7d4cf;text-shadow:0 1px 5px #070706;margin-right:9px;user-select:none}
button{border:1px solid #c5b49d3d;background:#19191bc4;color:inherit;backdrop-filter:blur(8px);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;padding:7px;cursor:pointer}
button:hover,button:focus-visible{border-color:#ded1c3b0;color:white}
button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
#notice{position:absolute;inset:0;display:grid;place-content:center;line-height:1.6;font-size:15px;padding:28px;text-align:center}
#notice[hidden],.controls[hidden]{display:none}
@media(max-width:600px){.controls{bottom:max(13px,env(safe-area-inset-bottom));right:14px}.hint{font-size:10px}button{width:32px;height:32px}}
</style>
</head>
<body>

<button id="full" aria-label="Enter fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4m6 0h4v4m0 6v4h-4m-6 0H3v-4"/></svg></button>
</div>
<div id="notice" role="status" hidden></div>
</main>

const screenVertex=`#version 300 es
