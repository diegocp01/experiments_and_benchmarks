  if(!stepping && rawDt > 0 && rawDt < 0.12) ftAvg = mix(ftAvg, rawDt * 1000, 0.04);
  if(frozen) dt = 0;
  simT += dt; nowT = (now - startNow) / 1000; frames++;
  const t = simT; G.time = t;
  if(!hintShown && nowT > 2.0){ hintShown = true; hint.style.opacity = '1'; setTimeout(hideHint, 9000); }
  if(frames === 1) veil.style.opacity = '0';

  probes.poll();
  updateShip(dt, t);
  updateCamera(dt, t);
  updateLightning(t);
  updateLights(t);
  const gust = 1 + 0.18 * Math.sin(t * 0.41) * Math.sin(t * 0.17 + 2);
  const windNow = v3.scale(WIND, gust);
  SKYSTATE.cloudOff = [-WIND[0] * t * 0.55, -WIND[2] * t * 0.55];
  SKYSTATE.scudOff = [-WIND[0] * t * 1.05, -WIND[2] * t * 1.05];
  SKYSTATE.cloudAmb = BASE.amb; G.fogCol = BASE.fog; G.moonCol = BASE.moon;

  // ---- simulation passes
  ocean.update(t, Math.max(dt, 1 / 240));
  ocean.bind(); bindGlobalNoise();
  updateProbePositions(); probes.request(probeXZ);
  spray.update(dt, windNow, ship);
  // ---- environment
  sky.renderPano();
  bindTex(UNIT.SHADOW, null);
  shipR.renderShadow(G.shadowMat);
  bindTex(UNIT.SHADOW, shipR.shadowTex);
  sky.render();
  // ---- opaque
  bindFBO(post.opaque);
  gl.depthMask(true); gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
  sky.composite();
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
  oceanR.draw();
  shipR.draw(ship);
  gl.disable(gl.DEPTH_TEST);
  // ---- screen-space lighting
  if(DBG.ssr) post.ssr(); else { bindFBO(post.ssrF); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); }
  const bowP = m4Pt(G.shipMat, [33, 3 + Math.max(0, ship.waterBow), 0]);
  if(DBG.vol) post.vol(0.00014, (ship.spray || 0) * 0.006, bowP); else { bindFBO(post.volF); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); }
  post.combine();
  // ---- transparent
  bindFBO(post.trans);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(false); gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.ONE, gl.ONE, gl.ZERO, gl.ONE);
  if(DBG.bolt) bolts.draw(t, bolts.intensityOf);
  const rainV = [windNow[0] * 0.92, -8.6, windNow[2] * 0.92];
  if(DBG.rain) fxA.drawRain(rainV, cam.vel);
  if(DBG.splash) fxA.drawSplash();
  gl.blendFuncSeparate(gl.ONE, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE);
  if(DBG.spin) fxA.drawSpin([windNow[0], windNow[2]]);
  if(DBG.spray) spray.draw(cam.vel);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  // ---- output
  post.bloomPass();
  const lvl = LIGHTNING.level;
  const target = 9.0 / (1 + lvl * 0.35);
  expo = target < expo ? mix(expo, target, 1 - Math.exp(-dt * 14)) : mix(expo, target, 1 - Math.exp(-dt * 1.3));
  post.final(expo * DBG.expo, clamp(nowT / 2.5, 0, 1), lvl);

  // adaptive resolution
  resTimer += dt;
  if(resTimer > 2.5 && frames > 120 && !QS.get('pix')){
    resTimer = 0;
    if(ftAvg > 30 && pixBudget > 0.6e6){ pixBudget *= 0.82; resize(); }
    else if(ftAvg < 18 && pixBudget < (LOWQ ? 1.2e6 : 2.3e6) && renderScale < 1){ pixBudget = Math.min(LOWQ ? 1.2e6 : 2.3e6, pixBudget * 1.12); resize(); }
  }
}
let expo = 9.0;
requestAnimationFrame(frame);

window.storm = {
  view(y, p, f){ cam.tYaw = cam.yaw = y * D2R; cam.tPitch = cam.pitch = p * D2R; if(f) cam.tFov = cam.fov = f * D2R; cam.last = nowT + 1e6; },
  release(){ cam.last = nowT - 10; },
  flash(type, rel, dist){ return spawnLightning(simT, type || 'cg', rel, dist); },
  spray(s){ spray.burst(s || 1, {R:ship.R, pos:ship.pos, vel:ship.vel}, ship.waterBow, 1500); },
  freeze(f){ frozen = f !== false; }, time(t){ simT = t; },
  step(sec, fps){ fps = fps || 30; const n = Math.round(sec * fps); if(probes.pending){ gl.deleteSync(probes.sync); probes.pending = false; } probes.syncMode = true; stepping = true; for(let i = 0; i < n; i++){ tick(lastNow + 1000 / fps); } stepping = false; probes.syncMode = false; return this.stats(); },
  stats(){ return {ms:ftAvg, res:[post.W, post.H], spray:spray.n, Hs:ocean.Hs, ship:{heave:ship.heave, pitch:ship.pitch / D2R, roll:ship.roll / D2R, bowR:ship.bowR}}; },
  DBG
};
}
// let the loading veil paint before the heavy GPU set-up runs
requestAnimationFrame(() => setTimeout(boot, 30));
})();
</script>
