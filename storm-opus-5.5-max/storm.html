<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Night Storm at Sea</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;cursor:grab;touch-action:none;outline:none}
  canvas.drag{cursor:grabbing}
  #hint{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);color:rgba(214,224,236,.72);
        font:500 11px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;
        pointer-events:none;transition:opacity 2.2s ease;text-shadow:0 1px 10px #000;white-space:nowrap;opacity:0;max-width:94vw;text-align:center}
  @media (max-width:560px){#hint{white-space:normal;letter-spacing:.16em;font-size:10px;line-height:1.8}}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#c8d0dc;background:#05070a;
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:40px;text-align:center}
  #err pre{max-width:90vw;max-height:70vh;overflow:auto;text-align:left;font-size:11px;white-space:pre-wrap;color:#e9a}
  #veil{position:fixed;inset:0;background:#000;pointer-events:none;transition:opacity 2.5s ease;display:flex;align-items:center;justify-content:center}
  #veil span{color:rgba(200,212,226,.55);font:500 11px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="veil"><span>Gathering the storm</span></div>
<div id="hint">Drag to look around &nbsp;·&nbsp; Scroll or pinch to zoom</div>

  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y); }

vec2 panoUV(vec3 d){ return vec2(atan(d.z, d.x)*(0.5/PI)+0.5, asin(clamp(d.y, 0., 1.))*(2./PI)); }
vec3 skyEnv(vec3 d, float lod){
  vec3 c = textureLod(uPano, panoUV(d), lod).rgb;
  return d.y < 0. ? c*mix(1.0, 0.25, clamp(-d.y*3., 0., 1.)) : c;
}
vec3 fogColor(vec3 rd){
  vec2 h = normalize(rd.xz + vec2(1e-5));
  float m = max(dot(h, normalize(uMoonDir.xz)), 0.);
  vec3 c = uFogCol*(1.0 + 1.6*pow(m, 5.0));
  c += uFlashCol*uFlashFog*(0.3 + 0.7*pow(max(dot(rd, uFlashDir), 0.), 2.0));
  return c;
}
vec3 applyFog(vec3 col, float dist, vec3 rd){
  float f = 1. - exp(-dist*uFogDen);
  return mix(col, fogColor(rd), f);
}
float D_GGX(float NoH, float a){ float a2 = a*a; float d = NoH*NoH*(a2-1.)+1.; return a2/(PI*d*d + 1e-7); }
float V_Smith(float NoV, float NoL, float a){ float k = a*0.5; return 0.25/max((NoV*(1.-k)+k)*(NoL*(1.-k)+k), 1e-4); }
float F_Schlick(float f0, float c){ float x = 1.-c; float x2 = x*x; return f0 + (1.-f0)*x2*x2*x; }
float shadow0(vec3 P){
  vec4 sc = uShadowMat*vec4(P, 1.);
  if(sc.w <= 0.) return 1.;
  vec3 s = sc.xyz/sc.w*0.5 + 0.5;
  if(s.x < 0. || s.y < 0. || s.x > 1. || s.y > 1. || s.z > 1.) return 1.;
  vec2 t = vec2(0.75/1024.);
  s.z -= 0.0004;
  return 0.25*(texture(uShadowMap, vec3(s.xy + vec2(-t.x, -t.y), s.z)) + texture(uShadowMap, vec3(s.xy + vec2(t.x, -t.y), s.z))
             + texture(uShadowMap, vec3(s.xy + vec2(-t.x, t.y), s.z)) + texture(uShadowMap, vec3(s.xy + vec2(t.x, t.y), s.z)));
}
// radiance arriving from local light i at P (no cosine), L = direction to light
vec3 lightIn(int i, vec3 P, out vec3 L, out float dist){
  vec3 lv = uLightPos[i].xyz - P; float d2 = dot(lv, lv); dist = sqrt(d2); L = lv/max(dist, 1e-4);
  float rr = dist/uLightPos[i].w; float win = clamp(1. - rr*rr*rr*rr, 0., 1.); win *= win;
  float cone = uLightDir[i].w < -1.5 ? 1. : smoothstep(uLightDir[i].w, uLightCol[i].w, dot(-L, uLightDir[i].xyz));
  return uLightCol[i].rgb*(win*cone/(d2 + 0.35));
}
vec3 viewRay(vec2 uv){ vec4 p = uInvViewProj*vec4(uv*2. - 1., 1., 1.); return normalize(p.xyz/p.w - uCamPos); }
vec2 octEnc(vec3 n){ n /= (abs(n.x) + abs(n.y) + abs(n.z)); vec2 e = n.z >= 0. ? n.xy : (1. - abs(n.yx))*vec2(n.x >= 0. ? 1. : -1., n.y >= 0. ? 1. : -1.); return e*0.5 + 0.5; }
vec3 octDec(vec2 e){ e = e*2. - 1.; vec3 n = vec3(e, 1. - abs(e.x) - abs(e.y)); float t = max(-n.z, 0.); n.x += n.x >= 0. ? -t : t; n.y += n.y >= 0. ? -t : t; return normalize(n); }
`;
// ============================================================================
//  PROCEDURAL NOISE TEXTURES (generated on the GPU at start-up)
//   noise3D : 64^3 tileable  r = perlin-worley, g = worley fbm, b = high worley, a = fine fbm
//   foamTex : 512^2 tileable r = foam patches, g = bubble network, b = streak noise, a = fine noise
// ============================================================================
const NOISE_LIB = `
vec3 h33(vec3 p){ p = fract(p*vec3(.1031,.1030,.0973)); p += dot(p, p.yxz+33.33); return fract((p.xxy+p.yxx)*p.zyx); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float worley3(vec3 p, float per){
  vec3 id = floor(p), f = fract(p); float md = 1.;
  for(int z=-1; z<=1; z++) for(int y=-1; y<=1; y++) for(int x=-1; x<=1; x++){
    vec3 o = vec3(x,y,z); vec3 r = h33(mod(id+o, per)); vec3 d = o + r - f; md = min(md, dot(d,d)); }
  return sqrt(md);
}
float grad3(vec3 p, float per){
  vec3 i = floor(p), f = fract(p); vec3 u = f*f*f*(f*(f*6.-15.)+10.);
  #define GC(c) dot(h33(mod(i+c, per))*2.-1., f-c)
  float n = mix(mix(mix(GC(vec3(0,0,0)), GC(vec3(1,0,0)), u.x), mix(GC(vec3(0,1,0)), GC(vec3(1,1,0)), u.x), u.y),
                mix(mix(GC(vec3(0,0,1)), GC(vec3(1,0,1)), u.x), mix(GC(vec3(0,1,1)), GC(vec3(1,1,1)), u.x), u.y), u.z);
  #undef GC
  return n;
}
float fbm3(vec3 p, float per, int oct){ float a = 0.5, s = 0., w = 0.; for(int i=0;i<8;i++){ if(i>=oct) break; s += a*grad3(p, per); w += a; p *= 2.; per *= 2.; a *= 0.5; } return s/w; }
vec2 worley2(vec2 p, float per){ // returns F1, F2
  vec2 id = floor(p), f = fract(p); float d1 = 8., d2 = 8.;
  for(int y=-2; y<=2; y++) for(int x=-2; x<=2; x++){
    vec2 o = vec2(x,y); vec2 r = h22(mod(id+o, per)); vec2 d = o + r - f; float dd = dot(d,d);
    if(dd < d1){ d2 = d1; d1 = dd; } else if(dd < d2) d2 = dd; }
  return sqrt(vec2(d1, d2));
}
float grad2(vec2 p, float per){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*f*(f*(f*6.-15.)+10.);
  #define G2(c) dot(h22(mod(i+c, per))*2.-1., f-c)
  float n = mix(mix(G2(vec2(0,0)), G2(vec2(1,0)), u.x), mix(G2(vec2(0,1)), G2(vec2(1,1)), u.x), u.y);
  #undef G2
  return n;
}
float fbm2(vec2 p, float per, int oct){ float a = 0.5, s = 0., w = 0.; for(int i=0;i<8;i++){ if(i>=oct) break; s += a*grad2(p, per); w += a; p *= 2.; per *= 2.; a *= 0.5; } return s/w; }
float remap(float v, float a, float b, float c, float d){ return c + (v-a)/(b-a)*(d-c); }
`;
const NOISE3D_FS = NOISE_LIB + `
uniform float uZ; in vec2 vUv; out vec4 o;
void main(){
  vec3 p = vec3(vUv, uZ);
  float pf = fbm3(p*4., 4., 6)*0.5 + 0.5;
  float w1 = 1. - worley3(p*4., 4.), w2 = 1. - worley3(p*8., 8.), w3 = 1. - worley3(p*16., 16.), w4 = 1. - worley3(p*32., 32.);
  float wf = w1*0.625 + w2*0.25 + w3*0.125;
  float pw = clamp(remap(pf, wf - 1.0, 1.0, 0.0, 1.0), 0., 1.);
  pw = clamp((pw - 0.25)/0.75, 0., 1.);
  float hf = w2*0.5 + w3*0.3 + w4*0.2;
  float fine = fbm3(p*16., 16., 3)*0.5 + 0.5;
  o = vec4(pw, wf, hf, fine);
}`;
const FOAM_FS = NOISE_LIB + `
in vec2 vUv; out vec4 o;
void main(){
  vec2 p = vUv;
  // large patches
  float patches = fbm2(p*6., 6., 5)*0.5 + 0.5;
  // bubbly network: cell borders at two scales
  vec2 wa = worley2(p*24., 24.), wb = worley2(p*58., 58.);
  float netA = smoothstep(0.0, 0.22, wa.y - wa.x);
  float netB = smoothstep(0.0, 0.18, wb.y - wb.x);
  float holes = smoothstep(0.15, 0.55, wa.x)*0.6 + smoothstep(0.1, 0.5, wb.x)*0.4;
  float bubbles = clamp(1. - (holes*(0.55 + 0.45*netA)*(0.6 + 0.4*netB)), 0., 1.);
  // streaky lace (anisotropic along u)
  float st = fbm2(vec2(p.x*4., p.y*40.), 4., 4)*0.5 + 0.5;
  float fine = fbm2(p*96., 96., 3)*0.5 + 0.5;
  o = vec4(patches, bubbles, st, fine);
}`;

let noise3D = null, foamTex = null;
function initNoise(){
  const S = 64;
  gl.activeTexture(gl.TEXTURE0 + SCRATCH_UNIT);
  noise3D = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D, noise3D);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, S, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  for(const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, p, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const pr = program(FS_VS, NOISE3D_FS, 'noise3d');
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  use(pr);
  gl.viewport(0, 0, S, S);
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  for(let z = 0; z < S; z++){
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, noise3D, 0, z);
    u1f('uZ', (z + 0.5) / S);
    drawFS();
  }
  mipmap(noise3D, gl.TEXTURE_3D);

  const FS = 512;
  foamTex = tex2D(FS, FS, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, {wrap:gl.REPEAT});
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, foamTex, 0);
  use(program(FS_VS, FOAM_FS, 'foamtex'));
  gl.viewport(0, 0, FS, FS);
  drawFS();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0 + SCRATCH_UNIT);
  gl.bindTexture(gl.TEXTURE_2D, foamTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  if(extAniso) gl.texParameterf(gl.TEXTURE_2D, extAniso.TEXTURE_MAX_ANISOTROPY_EXT, 8);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.deleteFramebuffer(f);
}
function bindGlobalNoise(){ bindTex(UNIT.NOISE, noise3D, gl.TEXTURE_3D); bindTex(UNIT.FOAM, foamTex); }
// ============================================================================
//  OCEAN SIMULATION: Tessendorf FFT, 3 cascades, JONSWAP wind sea + cross swell,
//  choppy displacement, Jacobian whitecaps with persistent foam, GPU probes.
// ============================================================================
const OCEAN = {
  N:256, L:[1213, 197, 37.7], chop:1.42,
  windSeaHs:10.2, windSeaTp:10.4, swellHs:3.8, swellTp:14.5,
  waveAngle:0.96 - Math.PI,      // wind sea travels toward port-aft (wind from ~55 deg off the starboard bow)
  swellAngle:1.55 - Math.PI,     // cross swell from the starboard beam
  omega0:2 * Math.PI / 600,      // dispersion quantum => exact 600 s loop, no precision loss
};
const OCEAN_GLSL = `
uniform sampler2D uDisp0, uDisp1, uDisp2, uDer0, uDer1, uDer2;
uniform vec3 uCasL;
vec3 oceanDispLod(vec2 xz, vec3 lod){
  return textureLod(uDisp0, xz/uCasL.x, lod.x).xyz + textureLod(uDisp1, xz/uCasL.y, lod.y).xyz + textureLod(uDisp2, xz/uCasL.z, lod.z).xyz;
}
vec3 oceanDispCoarse(vec2 xz){ return textureLod(uDisp0, xz/uCasL.x, 0.).xyz + textureLod(uDisp1, xz/uCasL.y, 1.5).xyz; }
`;
const FFT_SPEC_FS = `
uniform sampler2D uH0; uniform float uT, uL, uOmega0;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec2 k = (vec2(c) - 128.)*(6.28318531/uL);
  float kl = length(k); float ik = kl > 1e-6 ? 1./kl : 0.;
  float w = floor(sqrt(9.81*kl)/uOmega0)*uOmega0;
  vec4 h0 = texelFetch(uH0, c, 0);
  float ph = w*uT; vec2 e = vec2(cos(ph), sin(ph));
  vec2 h = cmul(h0.xy, vec2(e.x, -e.y)) + cmul(h0.zw, e);
  vec2 ih = vec2(-h.y, h.x);
  vec2 Dx = ih*k.x*ik, Dz = ih*k.y*ik, hx = ih*k.x, hz = ih*k.y;
  vec2 Dxx = -h*k.x*k.x*ik, Dzz = -h*k.y*k.y*ik, Dxz = -h*k.x*k.y*ik;
  o0 = vec4(h.x - Dx.y, h.y + Dx.x, Dz.x - hx.y, Dz.y + hx.x);
  o1 = vec4(hz.x - Dxx.y, hz.y + Dxx.x, Dzz.x - Dxz.y, Dzz.y + Dxz.x);
}`;
const FFT_BFLY_FS = `
uniform sampler2D uSrc0, uSrc1, uBfly; uniform int uStage, uDir;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  int x = uDir == 0 ? c.x : c.y;
  vec4 b = texelFetch(uBfly, ivec2(x, uStage), 0);
  ivec2 p1 = uDir == 0 ? ivec2(int(b.z), c.y) : ivec2(c.x, int(b.z));
  ivec2 p2 = uDir == 0 ? ivec2(int(b.w), c.y) : ivec2(c.x, int(b.w));
  vec4 a0 = texelFetch(uSrc0, p1, 0), b0 = texelFetch(uSrc0, p2, 0);
  vec4 a1 = texelFetch(uSrc1, p1, 0), b1 = texelFetch(uSrc1, p2, 0);
  o0 = vec4(a0.xy + cmul(b.xy, b0.xy), a0.zw + cmul(b.xy, b0.zw));
  o1 = vec4(a1.xy + cmul(b.xy, b1.xy), a1.zw + cmul(b.xy, b1.zw));
}`;
const FFT_FINAL_FS = `
uniform sampler2D uSrc0, uSrc1, uPrev; uniform float uChop, uDecay, uFoamBias, uFoamGain;
layout(location=0) out vec4 oDisp; layout(location=1) out vec4 oDer;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  float s = ((c.x + c.y) & 1) == 0 ? 1. : -1.;
  vec4 t0 = texelFetch(uSrc0, c, 0)*s, t1 = texelFetch(uSrc1, c, 0)*s;
  float Dxx = uChop*t1.y, Dzz = uChop*t1.z, Dxz = uChop*t1.w;
  float J = (1. + Dxx)*(1. + Dzz) - Dxz*Dxz;
  float prev = texelFetch(uPrev, c, 0).a;
  float inj = clamp((uFoamBias - J)*uFoamGain, 0., 1.);
  float foam = max(prev*uDecay, inj);
  foam = min(foam + inj*0.08, 1.5);
  oDisp = vec4(uChop*t0.y, t0.x, uChop*t0.z, foam);
  oDer = vec4(t0.w, t1.x, Dxx, Dzz);
}`;

const ocean = {
  cas:[], t:0,
  init(){
    const N = OCEAN.N, g = 9.81;
    // ---- spectrum (CPU) ----
    const jonswap = (w, wp, gam) => { const sg = w <= wp ? 0.07 : 0.09; const r = Math.exp(-((w - wp) ** 2) / (2 * sg * sg * wp * wp));
      return g * g / Math.pow(w, 5) * Math.exp(-1.25 * Math.pow(wp / w, 4)) * Math.pow(gam, r); };
    const spreadN = s => { let a = 0; for(let i = 0; i < 2000; i++){ const th = -Math.PI + (i + 0.5) * 2 * Math.PI / 2000; a += Math.pow(Math.abs(Math.cos(th / 2)), 2 * s) * 2 * Math.PI / 2000; } return 1 / a; };
    const sw = 7, ss = 24, nw = spreadN(sw), ns = spreadN(ss);
    const wpW = 2 * Math.PI / OCEAN.windSeaTp, wpS = 2 * Math.PI / OCEAN.swellTp;
    const angDiff = (a, b) => { let d = a - b; while(d > Math.PI) d -= 2 * Math.PI; while(d < -Math.PI) d += 2 * Math.PI; return d; };
    const specK = (kx, kz, which) => {
      const k = Math.hypot(kx, kz); if(k < 1e-6) return 0;
      const w = Math.sqrt(g * k), dwdk = g / (2 * w), th = Math.atan2(kz, kx);
      const damp = Math.exp(-k * k * 0.02 * 0.02);
      let S;
      if(which === 0) S = jonswap(w, wpW, 3.3) * nw * Math.pow(Math.abs(Math.cos(angDiff(th, OCEAN.waveAngle) / 2)), 2 * sw) * (1 + 1.2 * clamp((w / wpW - 1.4) / 2.5, 0, 1));
      else S = jonswap(w, wpS, 7.0) * ns * Math.pow(Math.abs(Math.cos(angDiff(th, OCEAN.swellAngle) / 2)), 2 * ss);
      return S * dwdk / k * damp;
    };
    const bounds = OCEAN.L.map((L, i) => i === 0 ? 0 : 2 * Math.PI / L * 6);
    bounds.push(1e9);
    // integrate energies to normalise to target Hs
    const E = [0, 0];
    for(let c = 0; c < 3; c++){
      const L = OCEAN.L[c], dk = 2 * Math.PI / L;
      for(let n = 0; n < N; n++) for(let m = 0; m < N; m++){
        const kx = (m - N / 2) * dk, kz = (n - N / 2) * dk, k = Math.hypot(kx, kz);
        if(k < bounds[c] || k >= bounds[c + 1]) continue;
        E[0] += specK(kx, kz, 0) * dk * dk; E[1] += specK(kx, kz, 1) * dk * dk;
      }
    }
    const scW = (OCEAN.windSeaHs / 4) ** 2 / E[0], scS = (OCEAN.swellHs / 4) ** 2 / E[1];
    const rnd = mulberry32(90210);
    let variance = 0;
    for(let c = 0; c < 3; c++){
      const L = OCEAN.L[c], dk = 2 * Math.PI / L;
      const h0 = new Float32Array(N * N * 2);
      for(let n = 0; n < N; n++) for(let m = 0; m < N; m++){
        const kx = (m - N / 2) * dk, kz = (n - N / 2) * dk, k = Math.hypot(kx, kz);
        const g1 = gauss(rnd), g2 = gauss(rnd);
        if(k < bounds[c] || k >= bounds[c + 1] || k < 1e-6) continue;
        const S = specK(kx, kz, 0) * scW + specK(kx, kz, 1) * scS;
        const a = Math.sqrt(S * dk * dk / 2) / Math.SQRT2;
        h0[(n * N + m) * 2] = g1 * a; h0[(n * N + m) * 2 + 1] = g2 * a;
      }
      const data = new Float32Array(N * N * 4);
      for(let n = 0; n < N; n++) for(let m = 0; m < N; m++){
        const i = n * N + m, j = ((N - n) % N) * N + ((N - m) % N);
        data[i * 4] = h0[i * 2]; data[i * 4 + 1] = h0[i * 2 + 1];
        data[i * 4 + 2] = h0[j * 2]; data[i * 4 + 3] = -h0[j * 2 + 1];
        const re = h0[i * 2] + h0[j * 2], im = h0[i * 2 + 1] - h0[j * 2 + 1];
        variance += re * re + im * im;
      }
      const cas = {L};
      cas.h0 = texRGBA32F(N, N, {data});
      const mk = () => texRGBA32F(N, N);
      cas.A = [mk(), mk()]; cas.B = [mk(), mk()];
      cas.fA = makeFBO(cas.A); cas.fB = makeFBO(cas.B);
      const dOpt = {mip:true, wrap:gl.REPEAT, aniso:8};
      cas.disp = [texRGBA16F(N, N, dOpt), texRGBA16F(N, N, dOpt)];
      cas.der = texRGBA16F(N, N, dOpt);
      cas.fOut = [makeFBO([cas.disp[0], cas.der]), makeFBO([cas.disp[1], cas.der])];
      cas.cur = 0;
      this.cas.push(cas);
    }
    this.Hs = 4 * Math.sqrt(variance);
    console.log('ocean: synthesized Hs =', this.Hs.toFixed(2), 'm');
    // ---- butterfly table ----
    const logN = Math.log2(N), bd = new Float32Array(logN * N * 4);
    const rev = i => { let r = 0; for(let b = 0; b < logN; b++) r |= ((i >> b) & 1) << (logN - 1 - b); return r; };
    for(let s = 0; s < logN; s++){
      const span = 1 << s, block = span * 2;
      for(let x = 0; x < N; x++){
        const k = (x * (N / block)) % N, ang = 2 * Math.PI * k / N, top = (x % block) < span;
        let i1, i2;
        if(s === 0){ if(top){ i1 = rev(x); i2 = rev(x + 1); } else { i1 = rev(x - 1); i2 = rev(x); } }
        else { if(top){ i1 = x; i2 = x + span; } else { i1 = x - span; i2 = x; } }
        bd.set([Math.cos(ang), Math.sin(ang), i1, i2], (s * N + x) * 4);
      }
    }
    this.bfly = texRGBA32F(N, logN, {data:bd});
    this.logN = logN;
    this.pSpec = program(FS_VS, FFT_SPEC_FS, 'fft-spectrum');
    this.pBfly = program(FS_VS, FFT_BFLY_FS, 'fft-butterfly');
    this.pFinal = program(FS_VS, FFT_FINAL_FS, 'fft-final');
  },
  update(t, dt){
    const N = OCEAN.N;
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
    const tl = t % 600;
    for(const c of this.cas){
      bindFBO(c.fA); use(this.pSpec);
      bindTex(0, c.h0); u1i('uH0', 0); u1f('uT', tl); u1f('uL', c.L); u1f('uOmega0', OCEAN.omega0);
      drawFS();
      use(this.pBfly); bindTex(2, this.bfly); u1i('uBfly', 2); u1i('uSrc0', 0); u1i('uSrc1', 1);
      let src = c.A, dstF = c.fB, dst = c.B;
      for(let dir = 0; dir < 2; dir++) for(let s = 0; s < this.logN; s++){
        bindFBO(dstF); bindTex(0, src[0]); bindTex(1, src[1]);
        u1i('uStage', s); u1i('uDir', dir); drawFS();
        const ts = src; src = dst; dst = ts; dstF = dstF === c.fB ? c.fA : c.fB;
      }
      // result in src (== c.A after an even number of passes)
      const prev = c.disp[c.cur]; c.cur ^= 1;
      bindFBO(c.fOut[c.cur]); use(this.pFinal);
      bindTex(0, src[0]); bindTex(1, src[1]); bindTex(2, prev);
      u1i('uSrc0', 0); u1i('uSrc1', 1); u1i('uPrev', 2);
      u1f('uChop', OCEAN.chop); u1f('uDecay', Math.exp(-dt / 2.6)); u1f('uFoamBias', 0.86); u1f('uFoamGain', 2.4);
      drawFS();
      mipmap(c.disp[c.cur]); mipmap(c.der);
    }
    void N;
  },
  bind(){
    const c = this.cas;
    bindTex(UNIT.DISP0, c[0].disp[c[0].cur]); bindTex(UNIT.DISP1, c[1].disp[c[1].cur]); bindTex(UNIT.DISP2, c[2].disp[c[2].cur]);
    bindTex(UNIT.DER0, c[0].der); bindTex(UNIT.DER1, c[1].der); bindTex(UNIT.DER2, c[2].der);
  },
  setL(){ u3f('uCasL', OCEAN.L[0], OCEAN.L[1], OCEAN.L[2]); }
};

// ---------------------------------------------------------------------------
//  Probes: exact water height at points (inverse-displacement iteration),
//  read back asynchronously through a PBO + fence so the ship rides the
//  very same surface that is rendered.
// ---------------------------------------------------------------------------
const PROBE_FS = OCEAN_GLSL + `
uniform vec2 uP[16]; out vec4 o;
void main(){
  int i = int(gl_FragCoord.x);
  vec2 x = uP[i], p = x;
  for(int k = 0; k < 5; k++){ vec3 d = oceanDispCoarse(p); p = x - d.xz; }
  vec3 dc = oceanDispCoarse(p);
  vec2 q = x;
  for(int k = 0; k < 4; k++){ vec3 d = oceanDispLod(q, vec3(0.)); q = x - d.xz; }
  vec3 df = oceanDispLod(q, vec3(0.));
  o = vec4(dc.y, df.y, 0., 1.);
}`;
const probes = {
  n:16, coarse:new Float32Array(16), fine:new Float32Array(16), ready:false, pending:false,
  init(){
    this.tex = texRGBA32F(16, 1);
    this.fbo = makeFBO([this.tex]);
    this.prog = program(FS_VS, PROBE_FS, 'probe');
    this.pbo = gl.createBuffer();
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, this.pbo);
    gl.bufferData(gl.PIXEL_PACK_BUFFER, 16 * 4 * 4, gl.STREAM_READ);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    this.buf = new Float32Array(64);
  },
  poll(){
    if(!this.pending) return;
    const st = gl.clientWaitSync(this.sync, 0, 0);
    if(st === gl.TIMEOUT_EXPIRED) return;
    gl.deleteSync(this.sync); this.pending = false;
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, this.pbo);
    gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, this.buf);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    for(let i = 0; i < 16; i++){ this.coarse[i] = this.buf[i * 4]; this.fine[i] = this.buf[i * 4 + 1]; }
    this.ready = true;
  },
  request(xz){ // xz: Float32Array(32)
    if(this.pending) return;
    bindFBO(this.fbo); use(this.prog); ocean.setL();
    u2v('uP', xz);
    drawFS();
    if(this.syncMode){
      gl.readPixels(0, 0, 16, 1, gl.RGBA, gl.FLOAT, this.buf);
      for(let i = 0; i < 16; i++){ this.coarse[i] = this.buf[i * 4]; this.fine[i] = this.buf[i * 4 + 1]; }
      this.ready = true; return;
    }
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, this.pbo);
    gl.readPixels(0, 0, 16, 1, gl.RGBA, gl.FLOAT, 0);
    gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
    this.sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
    this.pending = true;
  }
};
// ============================================================================
//  OCEAN RENDERING: camera-centred polar grid, per-pixel cascade normals,
//  Fresnel sky reflection, sub-surface glow, whitecaps, wind streaks,
//  hull-contact foam and green water, local light glints.
// ============================================================================
const OCEAN_VS = COMMON + OCEAN_GLSL + `
in vec2 aOff; uniform vec2 uCenter; uniform float uRingK;
out vec3 vWorld; out vec2 vXZ; out float vSp;
void main(){
  vec2 xz = uCenter + aOff;
  float r = length(aOff);
  float sp = max(r*uRingK, 0.02);
  vec3 lod = max(vec3(0.), log2(sp*1.4/(uCasL/256.)));
  vec3 d = oceanDispLod(xz, lod);
  d *= 1. - smoothstep(9000., 22000., r);
  vec3 wp = vec3(xz.x + d.x, d.y, xz.y + d.z);
  vWorld = wp; vXZ = xz; vSp = sp;
  gl_Position = uViewProj*vec4(wp, 1.);
}`;
const OCEAN_FS = () => COMMON + OCEAN_GLSL + HULL_GLSL + `
in vec3 vWorld; in vec2 vXZ; in float vSp;
layout(location=0) out vec4 oCol; layout(location=1) out vec4 oG;
uniform sampler2D uFoamTex;
uniform float uSprayWet; uniform float uDbg;
void main(){
  vec2 xz = vXZ;
  vec2 uv0 = xz/uCasL.x, uv1 = xz/uCasL.y, uv2 = xz/uCasL.z;
  vec4 D = texture(uDer0, uv0) + texture(uDer1, uv1) + texture(uDer2, uv2);
  float fA = texture(uDisp0, uv0).a, fB = texture(uDisp1, uv1).a, fC = texture(uDisp2, uv2).a;
  vec3 V = uCamPos - vWorld; float dist = length(V); V /= dist;
  vec3 N = normalize(vec3(-D.x/max(1. + D.z, 0.25), 1., -D.y/max(1. + D.w, 0.25)));
  // keep normals sane at grazing angles (avoid back-facing micro normals)
  float NoV0 = dot(N, V);
  if(NoV0 < 0.02) N = normalize(N + V*(0.02 - NoV0)*1.5);
  float NoV = max(dot(N, V), 1e-3);
  float J = max(1. + D.z, 0.)*max(1. + D.w, 0.);

  // ------------------------------------------------------------ foam ----
  vec2 wd = normalize(uWind + vec2(1e-4));
  vec2 sx = vec2(dot(xz, wd), dot(xz, vec2(-wd.y, wd.x)));
  float persist = fA*0.7 + fB*0.42 + fC*0.18;
  float cap = clamp((0.74 - J)*2.2, 0., 1.);
  vec4 t1 = texture(uFoamTex, xz*0.061 + vec2(0.0, uTime*0.004));
  vec4 t2 = texture(uFoamTex, xz*0.23 + vec2(0.37, 0.11));
  float lace = t1.g*0.55 + t2.g*0.45;
  float cov = clamp(persist*0.55 + cap*1.1, 0., 1.);
  float foam = smoothstep(1. - cov, 1. - cov + 0.22, lace*0.78 + t1.r*0.3);
  float strA = texture(uFoamTex, vec2(sx.x*0.0042 - uTime*0.0021, sx.y*0.026)).b;
  float strB = texture(uFoamTex, vec2(sx.x*0.011 + 0.5 - uTime*0.0047, sx.y*0.071 + 0.3)).b;
  float streak = smoothstep(0.56, 0.86, strA*0.6 + strB*0.4)*(0.35 + 0.65*clamp(persist*2.5 + 0.2, 0., 1.));
  foam = max(foam, streak*0.55*smoothstep(0.25, 0.7, lace + 0.25));
  foam *= mix(1., 0.55, smoothstep(250., 2500., dist));
  foam *= mix(1., smoothstep(0.2, 0.8, t2.r + 0.25), smoothstep(150., 900., dist));

  // hull interaction, bow wash, water on deck
  vec3 lp = (uShipInv*vec4(vWorld, 1.)).xyz;
  float hb = hullWL(lp.x);
  float dz = abs(lp.z) - hb;
  float inX = smoothstep(-37.5, -35.5, lp.x)*smoothstep(37.5, 35.0, lp.x);
  float bowF = smoothstep(14., 33., lp.x);
  float contact = inX*exp(-max(dz, 0.)*(0.55 - 0.3*bowF));
  float wash = contact*(0.45 + 0.55*bowF)*smoothstep(0.2, 0.75, lace + 0.3*t2.r);
  float inside = inX*step(dz, -0.05);
  float onDeck = inside*smoothstep(deckY(lp.x) - 0.35, deckY(lp.x) + 0.05, lp.y);
  foam = max(foam, wash);
  foam = max(foam, onDeck*(0.65 + 0.35*lace));
  // stern wake trail
  float wake = smoothstep(-36., -60., lp.x)*smoothstep(-400., -60., lp.x)*exp(-abs(lp.z)/(4. + (-36. - lp.x)*0.12))*smoothstep(0.3, 0.8, lace);
  foam = max(foam, wake*0.7);
  foam = clamp(foam, 0., 1.);

  // ------------------------------------------------------------ light ----
  float F = F_Schlick(0.02, NoV);
  float rough = mix(0.045, 0.2, clamp(dist/1800., 0., 1.)) + vSp*0.0006;
  vec3 R = reflect(-V, N);
  R.y = abs(R.y)*0.85 + 0.02; R = normalize(R);
  vec3 refl = skyEnv(R, clamp(rough*9., 0., 6.));
  vec3 skyUp = skyEnv(vec3(0., 1., 0.), 6.);
  vec3 spec = vec3(0.), dif = vec3(0.);
  float sh0 = shadow0(vWorld + N*0.05);
  for(int i = 0; i < 8; i++){
    if(i >= uNumLights) break;
    vec3 L; float ld; vec3 Li = lightIn(i, vWorld, L, ld);
    if(i == 0) Li *= sh0;
    float NoL = max(dot(N, L), 0.);
    vec3 H = normalize(L + V);
    float a = max(rough, 0.06) + 0.08;
    float aL = min(a + 0.09/max(ld, 0.1), 1.); float en = (a/aL)*(a/aL);
    spec += Li*NoL*D_GGX(max(dot(N, H), 0.), aL)*en*V_Smith(NoV, NoL, aL)*F_Schlick(0.02, max(dot(V, H), 0.));
    dif += Li*clamp(dot(N, L)*0.5 + 0.5, 0., 1.);
  }
  // lightning as a broad directional source
  vec3 Lf = uFlashDir;
  vec3 Hf = normalize(Lf + V);
  spec += uFlashCol*max(dot(N, Lf), 0.)*D_GGX(max(dot(N, Hf), 0.), 0.25)*0.25*F;
  dif += uFlashCol*clamp(dot(N, Lf)*0.5 + 0.5, 0., 1.);

  // sub-surface: light entering thin crests and leaving towards the viewer
  vec3 deep = vec3(0.0010, 0.0050, 0.0062);
  vec3 sssCol = vec3(0.012, 0.075, 0.068);
  float crest = clamp(vWorld.y*0.11 + 0.25, 0., 1.);
  vec3 fh = normalize(vec3(uFlashDir.x, 0.2, uFlashDir.z));
  float back = pow(clamp(dot(V, -fh), 0., 1.), 3.)*crest*crest;
  vec3 mh = normalize(vec3(uMoonDir.x, 0.1, uMoonDir.z));
  float backM = pow(clamp(dot(V, -mh), 0., 1.), 4.)*crest*crest;
  vec3 body = deep*(skyUp*2.2 + dif*0.05);
  body += sssCol*(uFlashCol*back*0.35 + uMoonCol*backM*0.6 + skyUp*crest*0.18 + dif*crest*0.02);

  vec3 water = body*(1. - F) + refl*F + spec;
  // foam: rough diffuse, slightly translucent
  vec3 foamAlb = vec3(0.82, 0.86, 0.88);
  float moonK = max(dot(N, uMoonDir), 0.)*0.55 + 0.25;
  vec3 foamL = foamAlb*(skyUp*1.05 + skyEnv(N, 6.)*0.4 + uMoonCol*moonK*0.5 + dif*0.3183 + uFlashCol*0.05);
  body += sssCol*uMoonCol*moonK*crest*0.05;
  vec3 col = mix(water, foamL, foam*0.92);
  if(uDbg > 0.5) col = vec3(foam, persist*0.5, cap)*0.05;
  if(uDbg > 1.5) col = vec3(t1.r, t1.g, t2.g)*0.05;
  col = applyFog(min(col, vec3(20000.)), dist, -V);
  oCol = vec4(col, dist);
  oG = vec4(octEnc(N), rough, 0.);
}`;

const oceanR = {
  init(){
    const M = 384, K = 2 * Math.PI / M * 1.15, q = 1 + K;
    const rings = [];
    for(let r = 0.6; r < 26000; r *= q) rings.push(r);
    const R = rings.length, verts = new Float32Array(R * M * 2);
    for(let j = 0; j < R; j++) for(let i = 0; i < M; i++){
      const a = (i + (j & 1) * 0.5) / M * Math.PI * 2;
      verts[(j * M + i) * 2] = Math.cos(a) * rings[j]; verts[(j * M + i) * 2 + 1] = Math.sin(a) * rings[j];
    }
    const idx = new Uint32Array((R - 1) * M * 6);
    let k = 0;
    for(let j = 0; j < R - 1; j++) for(let i = 0; i < M; i++){
      const i1 = (i + 1) % M, a = j * M + i, b = j * M + i1, c = (j + 1) * M + i, d = (j + 1) * M + i1;
      if(j & 1){ idx[k++] = a; idx[k++] = c; idx[k++] = d; idx[k++] = a; idx[k++] = d; idx[k++] = b; }
      else { idx[k++] = a; idx[k++] = c; idx[k++] = b; idx[k++] = b; idx[k++] = c; idx[k++] = d; }
    }
    this.count = k; this.ringK = K;
    this.prog = program(OCEAN_VS, OCEAN_FS(), 'ocean');
    this.mesh = makeVAO([{loc:gl.getAttribLocation(this.prog.p, 'aOff'), size:2, data:verts}], idx);
  },
  draw(){
    use(this.prog); ocean.setL();
    const s = 0.5;
    u2f('uCenter', Math.round(G.camPos[0] / s) * s, Math.round(G.camPos[2] / s) * s);
    u1f('uRingK', this.ringK); u1f('uDbg', DBG.ocean);
    gl.bindVertexArray(this.mesh.vao);
    gl.drawElements(gl.TRIANGLES, this.count, gl.UNSIGNED_INT, 0);
  }
};
// ============================================================================
//  SKY: ray-marched storm clouds (scud layer + main deck), lit by a diffuse
//  moon through the overcast and by lightning flashing *inside* the cloud.
//  Rendered at half resolution for the view and into a 512x128 panorama
//  (mip-mapped) that every surface uses for reflections and ambient light.
// ============================================================================
const CLOUD_GLSL = `
uniform sampler3D uNoise;
uniform vec2 uCloudOff, uScudOff;
uniform vec4 uFlashP[3];
uniform vec3 uFlashC;
uniform vec3 uCloudAmb;
float hgPhase(float mu, float g){ float g2 = g*g; return (1. - g2)/(4.*PI*pow(1. + g2 - 2.*g*mu, 1.5)); }
float cloudDen(vec3 p, out float h){
  float den = 0.; h = 0.;
  float moonGap = smoothstep(0.8, 0.99, dot(normalize(p - uCamPos), uMoonDir));
  if(p.y > 420. && p.y < 3600.){
    h = (p.y - 420.)/3180.;
    vec3 q = vec3(p.x + uCloudOff.x, p.y, p.z + uCloudOff.y);
    vec4 n = textureLod(uNoise, q*vec3(1./5200., 1./2600., 1./5200.), 0.);
    float base = n.r*0.7 + n.g*0.3;
    float cov = 0.8 - 0.3*moonGap*smoothstep(0.25, 0.75, n.g);
    float prof = smoothstep(0., 0.04, h)*smoothstep(1., 0.4, h);
    float s = clamp((base - (1. - cov))/cov, 0., 1.)*prof;
    if(s > 0.){
      vec4 d = textureLod(uNoise, q/940. + vec3(0., uTime*0.004, 0.), 0.);
      float er = d.b*0.7 + d.a*0.3;
      s = clamp((s - er*0.45*(1. - 0.5*h))/(1. - er*0.45), 0., 1.);
    }
    den = s;
  }
  if(p.y > 150. && p.y < 470.){
    float hs = (p.y - 150.)/320.;
    vec3 q = vec3(p.x + uScudOff.x, p.y*1.3, p.z + uScudOff.y);
    float n = textureLod(uNoise, q*vec3(1./1700., 1./650., 1./1700.), 0.).r;
    float s = clamp((n - 0.5)*2.6, 0., 1.)*smoothstep(0., 0.35, hs)*smoothstep(1., 0.45, hs);
    if(s > 0.) s = clamp(s - textureLod(uNoise, q/230., 0.).b*0.6, 0., 1.);
    if(s*0.75 > den){ den = s*0.75; h = 0.02; }
  }
  return den;
}
vec3 flashAt(vec3 p){
  vec3 fl = vec3(0.);
  for(int k = 0; k < 3; k++){
    if(uFlashP[k].w <= 0.) continue;
    float r = length(p - uFlashP[k].xyz);
    fl += uFlashP[k].w*(exp(-r/320.)*2.4 + exp(-r/950.)*0.3 + exp(-r/3200.)*0.018);
  }
  return fl*uFlashC;
}
vec3 skyBackground(vec3 rd){
  float mu = max(dot(rd, uMoonDir), 0.);
  return vec3(0.0009, 0.0012, 0.002) + uMoonCol*(1.2*pow(mu, 2500.) + 0.3*pow(mu, 90.) + 0.1*pow(mu, 10.) + 0.03*pow(mu, 3.));
}
vec3 skyColor(vec3 ro, vec3 rd, int steps, float jit){
  if(rd.y < 0.002) return fogColor(rd);
  float yb = 150., yt = 3600.;
  float t0 = max((yb - ro.y)/rd.y, 0.);
  float t1 = min((yt - ro.y)/rd.y, t0 + 11000.);
  if(t0 > 42000.) return fogColor(rd);
  vec3 col = vec3(0.); float T = 1.;
  float mu = dot(rd, uMoonDir);
  float ph = 0.6*hgPhase(mu, 0.6) + 0.4*hgPhase(mu, -0.2);
  float fs = float(steps);
  float tPrev = t0;
  float firstHit = -1.;
  for(int i = 0; i < 96; i++){
    if(i >= steps) break;
    float s = (float(i) + jit)/fs;
    float t = t0 + (t1 - t0)*s*s;
    float dt = t - tPrev; tPrev = t;
    vec3 p = ro + rd*t;
    float h; float den = cloudDen(p, h);
    if(den > 0.003){
      if(firstHit < 0.) firstHit = t;
      float sig = den*0.03;
      float tr = exp(-sig*max(dt, 8.));
      float thin = exp(-den*2.2);
      float leak = 0.55 + 0.9*textureLod(uNoise, vec3(p.xz*0.00004 + uCloudOff*0.00002, 0.37), 0.).r;
      vec3 amb = uCloudAmb*(0.14 + 0.86*h*h)*(1. - 0.5*den)*leak;
      float mg = max(dot(rd, uMoonDir), 0.);
      vec3 moon = uMoonCol*(ph*thin*(0.15 + 0.85*h)*1.4 + thin*(0.5*pow(mg, 12.) + 2.6*pow(mg, 110.)) + 0.25*pow(mg, 30.));
      vec3 Ls = amb + moon + flashAt(p);
      col += T*(1. - tr)*Ls;
      T *= tr;
      if(T < 0.012) break;
    }
  }
  vec3 res = col + T*skyBackground(rd);
  float fd = firstHit > 0. ? firstHit : t0;
  float fogAmt = 1. - exp(-fd*uFogDen*0.85);
  return mix(res, fogColor(rd), fogAmt);
}
`;
const SKY_FS = COMMON + CLOUD_GLSL + `
in vec2 vUv; out vec4 o;
uniform float uPanoMode; uniform int uSteps; uniform float uFrame;
void main(){
  vec3 rd;
  if(uPanoMode > 0.5){
    float az = (vUv.x - 0.5)*2.*PI, el = vUv.y*0.5*PI;
    rd = vec3(cos(el)*cos(az), sin(el), cos(el)*sin(az));
  } else rd = viewRay(vUv);
  float jit = fract(ign(gl_FragCoord.xy) + uFrame*0.618034);
  o = vec4(skyColor(uCamPos, rd, uSteps, jit), 1.);
}`;
// sky composite into the opaque HDR target: color + "distance" (far) + empty gbuffer
const SKYCOMP_FS = COMMON + `
in vec2 vUv; uniform sampler2D uSky;
layout(location=0) out vec4 oCol; layout(location=1) out vec4 oG;
void main(){
  vec3 c = texture(uSky, vUv).rgb;
  // light 3x3 tent to hide the half-res jitter
  vec2 px = 1./vec2(textureSize(uSky, 0));
  c = c*0.4 + 0.15*(texture(uSky, vUv + vec2(px.x, 0.)).rgb + texture(uSky, vUv - vec2(px.x, 0.)).rgb
                  + texture(uSky, vUv + vec2(0., px.y)).rgb + texture(uSky, vUv - vec2(0., px.y)).rgb);
  oCol = vec4(c, 30000.);
  oG = vec4(0.5, 0.5, 1., 0.);
}`;

const sky = {
  panoW:512, panoH:128, frame:0,
  init(){
    this.prog = program(FS_VS, SKY_FS, 'sky');
    this.comp = program(FS_VS, SKYCOMP_FS, 'skycomp');
    this.pano = texRGBA16F(this.panoW, this.panoH, {mip:true, wrap:gl.REPEAT, wrapT:gl.CLAMP_TO_EDGE});
    this.panoFBO = makeFBO([this.pano]);
    this.panoMaxLod = Math.log2(this.panoW);

  resize(w, h){

    this.tex = texRGBA16F(Math.max(1, w >> 1), Math.max(1, h >> 1));

  },
  setUniforms(){
    u2v('uCloudOff', SKYSTATE.cloudOff); u2v('uScudOff', SKYSTATE.scudOff);

  },
  renderPano(){

    u1f('uPanoMode', 1); u1i('uSteps', 30); u1f('uFrame', this.frame);
    bindGlobalNoise();
    drawFS();
    mipmap(this.pano);
    bindTex(UNIT.PANO, this.pano);
  },
  render(){
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
    bindFBO(this.fbo); use(this.prog); this.setUniforms();
    u1f('uPanoMode', 0); u1i('uSteps', LOWQ ? 40 : 64); u1f('uFrame', this.frame++);
    drawFS();
  },
  composite(){
    use(this.comp); bindTex(0, this.tex); u1i('uSky', 0); drawFS();
  }
};
const SKYSTATE = {cloudOff:[0, 0], scudOff:[0, 0], flashP:new Float32Array(12), flashC:[0.75, 0.82, 1.0], cloudAmb:[0, 0, 0]};
// ============================================================================
//  SHIP GEOMETRY (part A): hull definition, mesh builder, primitives,
//  lofted hull with flared bow and bulwark, cambered deck, railings.
//  Ship-local frame: +x bow, +y up, +z starboard, waterline at y = 0.
// ============================================================================
function deckY(x){
  if(x > 6) return 3.4 + 2.6 * Math.pow(Math.min((x - 6) / 30, 1.1), 1.8);
  if(x < -24){ const u = (-24 - x) / 12; return 3.4 + 0.8 * u * u; }
  return 3.4;
}
const stemX = y => y >= 0 ? 34 + 2.2 * Math.min(y / 6, 1.3) : 34 - 4 * Math.pow(Math.min(-y / 5, 1), 1.5);
const sternX = y => y >= 0.5 ? -36 : -36 + 8 * Math.pow(Math.min((0.5 - y) / 5.5, 1), 1.5);
const hbMid = y => { if(y >= -3.5) return 7.0; const d = -3.5 - y; return 5.5 + Math.sqrt(Math.max(0, 2.25 - d * d)); };
function hullHB(x, y){
  let hb = hbMid(y);
  if(x > 8){
    const u = (x - 8) / (stemX(y) - 8); if(u >= 1) return 0;
    hb *= 1 - Math.pow(Math.max(u, 0), mix(1.7, 2.7, clamp((y + 5) / 11, 0, 1)));
  }
  if(x < -22){
    const xt = sternX(y), v = (-22 - x) / (-22 - xt);
    if(y >= 0.5) hb *= 1 - 0.3 * Math.min(v, 1) ** 2;
    else { if(v >= 1) return 0; hb *= 1 - Math.pow(v, 1.6); }
  }
  return hb;
}
const bulwarkH = x => 0.55 * smooth(13, 16, x);
const deckHB = x => hullHB(x, deckY(x));
const camber = (x, z) => { const hb = Math.max(deckHB(x), 0.01); return 0.16 * Math.max(0, 1 - (z / hb) ** 2); };
const deckAt = (x, z) => deckY(x) + camber(x, z);
const HULL_GLSL = `
float deckY(float x){ if(x > 6.) return 3.4 + 2.6*pow(min((x - 6.)/30., 1.1), 1.8); if(x < -24.){ float u = (-24. - x)/12.; return 3.4 + 0.8*u*u; } return 3.4; }
float hullWL(float x){
  float hb = 7.0;
  if(x > 8.){ float u = (x - 8.)/26.; if(u >= 1.) return 0.; hb *= 1. - pow(max(u, 0.), 2.1545); }
  if(x < -22.){ float v = (-22. - x)/13.78; if(v >= 1.) return 0.; hb *= 1. - pow(v, 1.6); }
  return hb;
}
float deckHB(float x){
  float y = deckY(x); float hb = 7.0;
  if(x > 8.){ float xs = 34. + 2.2*min(y/6., 1.3); float u = (x - 8.)/(xs - 8.); if(u >= 1.) return 0.;
    hb *= 1. - pow(max(u, 0.), mix(1.7, 2.7, clamp((y + 5.)/11., 0., 1.))); }
  if(x < -22.){ float v = min((-22. - x)/14., 1.); hb *= 1. - 0.3*v*v; }
  return hb;
}
float deckSurf(float x, float z){ float hb = max(deckHB(x), 0.01); return deckY(x) + 0.16*max(0., 1. - (z/hb)*(z/hb)); }
`;

// material = [roughness, metalness, emissive, type]
// types: 0 paint, 1 deck, 2 hull, 3 lit window, 4 lamp, 5 dark metal/chain, 6 bridge glass, 7 rubber/black, 8 bulwark-inner paint
class MB {
  constructor(){ this.P = []; this.N = []; this.C = []; this.M = []; this.I = []; }
  v(p, n, c, m){ this.P.push(p[0], p[1], p[2]); this.N.push(n[0], n[1], n[2]); this.C.push(c[0], c[1], c[2]); this.M.push(m[0], m[1], m[2], m[3]); return this.P.length / 3 - 1; }
  tri(a, b, c){ this.I.push(a, b, c); }
  quad(a, b, c, d){ this.I.push(a, b, c, a, c, d); }
  // planar quad with explicit corners (any orientation), normal from winding
  face(p0, p1, p2, p3, c, m){
    const n = v3.norm(v3.cross(v3.sub(p1, p0), v3.sub(p3, p0)));
    const a = this.v(p0, n, c, m), b = this.v(p1, n, c, m), d = this.v(p2, n, c, m), e = this.v(p3, n, c, m);
    this.quad(a, b, d, e);
  }
  // oriented box: center, half extents, basis (ex, ey, ez unit vectors)
  obox(ctr, h, ex, ey, ez, c, m, skip){
    const P = (sx, sy, sz) => [ctr[0] + ex[0] * h[0] * sx + ey[0] * h[1] * sy + ez[0] * h[2] * sz,
      ctr[1] + ex[1] * h[0] * sx + ey[1] * h[1] * sy + ez[1] * h[2] * sz, ctr[2] + ex[2] * h[0] * sx + ey[2] * h[1] * sy + ez[2] * h[2] * sz];
    skip = skip || '';
    if(!skip.includes('+x')) this.face(P(1, -1, -1), P(1, 1, -1), P(1, 1, 1), P(1, -1, 1), c, m);
    if(!skip.includes('-x')) this.face(P(-1, -1, 1), P(-1, 1, 1), P(-1, 1, -1), P(-1, -1, -1), c, m);
    if(!skip.includes('+y')) this.face(P(-1, 1, -1), P(-1, 1, 1), P(1, 1, 1), P(1, 1, -1), c, m);
    if(!skip.includes('-y')) this.face(P(-1, -1, -1), P(1, -1, -1), P(1, -1, 1), P(-1, -1, 1), c, m);
    if(!skip.includes('+z')) this.face(P(-1, -1, 1), P(1, -1, 1), P(1, 1, 1), P(-1, 1, 1), c, m);
    if(!skip.includes('-z')) this.face(P(1, -1, -1), P(-1, -1, -1), P(-1, 1, -1), P(1, 1, -1), c, m);
  }
  box(x0, y0, z0, x1, y1, z1, c, m, skip){
    this.obox([(x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2], [(x1 - x0) / 2, (y1 - y0) / 2, (z1 - z0) / 2], [1, 0, 0], [0, 1, 0], [0, 0, 1], c, m, skip);
  }
  // cylinder / cone frustum between two points
  cyl(p0, p1, r0, r1, seg, c, m, caps){
    const ax = v3.norm(v3.sub(p1, p0));
    const t = Math.abs(ax[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const u = v3.norm(v3.cross(ax, t)), w = v3.cross(ax, u);
    const L = v3.len(v3.sub(p1, p0)), slope = (r0 - r1) / Math.max(L, 1e-4);
    const base = this.P.length / 3;
    for(let i = 0; i <= seg; i++){
      const a = i / seg * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const d = [u[0] * ca + w[0] * sa, u[1] * ca + w[1] * sa, u[2] * ca + w[2] * sa];
      const n = v3.norm(v3.add(d, v3.scale(ax, slope)));
      this.v(v3.add(p0, v3.scale(d, r0)), n, c, m); this.v(v3.add(p1, v3.scale(d, r1)), n, c, m);
    }
    for(let i = 0; i < seg; i++){ const a = base + i * 2; this.quad(a, a + 2, a + 3, a + 1); }
    if(caps !== false){
      for(const [p, r, s] of [[p0, r0, -1], [p1, r1, 1]]){
        if(r <= 0.0005) continue;
        const n = v3.scale(ax, s), ci = this.v(p, n, c, m), b2 = this.P.length / 3;
        for(let i = 0; i <= seg; i++){ const a = i / seg * Math.PI * 2;
          this.v(v3.add(p, v3.add(v3.scale(u, Math.cos(a) * r), v3.scale(w, Math.sin(a) * r))), n, c, m); }
        for(let i = 0; i < seg; i++) this.tri(ci, b2 + i, b2 + i + 1);
      }
    }
  }
  // tube swept along a polyline (smooth)
  tube(pts, r, seg, c, m){
    const n = pts.length; if(n < 2) return;
    const base = this.P.length / 3;
    let prevU = null;
    for(let i = 0; i < n; i++){
      const t = v3.norm(v3.sub(pts[Math.min(i + 1, n - 1)], pts[Math.max(i - 1, 0)]));
      let u = prevU ? v3.norm(v3.sub(prevU, v3.scale(t, v3.dot(prevU, t)))) : v3.norm(v3.cross(t, Math.abs(t[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
      prevU = u; const w = v3.cross(t, u);
      for(let j = 0; j <= seg; j++){
        const a = j / seg * Math.PI * 2, d = v3.add(v3.scale(u, Math.cos(a)), v3.scale(w, Math.sin(a)));
        this.v(v3.add(pts[i], v3.scale(d, r)), d, c, m);
      }
    }
    for(let i = 0; i < n - 1; i++) for(let j = 0; j < seg; j++){
      const a = base + i * (seg + 1) + j, b = a + seg + 1; this.quad(a, b, b + 1, a + 1);
    }
  }
  ellipsoid(ctr, rad, c, m, su, sv){
    su = su || 20; sv = sv || 12; const base = this.P.length / 3;
    for(let j = 0; j <= sv; j++){ const th = j / sv * Math.PI, st = Math.sin(th), ct = Math.cos(th);
      for(let i = 0; i <= su; i++){ const ph = i / su * Math.PI * 2;
        const d = [Math.cos(ph) * st, ct, Math.sin(ph) * st];
        this.v([ctr[0] + d[0] * rad[0], ctr[1] + d[1] * rad[1], ctr[2] + d[2] * rad[2]], v3.norm([d[0] / rad[0], d[1] / rad[1], d[2] / rad[2]]), c, m); } }
    for(let j = 0; j < sv; j++) for(let i = 0; i < su; i++){ const a = base + j * (su + 1) + i, b = a + su + 1; this.quad(a, a + 1, b + 1, b); }
  }
  torus(ctr, ax, R, r, su, sv, colFn, m, stretch){
    const t = Math.abs(ax[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    const u = v3.norm(v3.cross(ax, t)), w = v3.cross(ax, u); stretch = stretch || 1;
    const base = this.P.length / 3;
    for(let i = 0; i <= su; i++){ const a = i / su * Math.PI * 2;
      const d = v3.add(v3.scale(u, Math.cos(a) * stretch), v3.scale(w, Math.sin(a)));
      const dn = v3.norm(v3.add(v3.scale(u, Math.cos(a) / stretch), v3.scale(w, Math.sin(a))));
      for(let j = 0; j <= sv; j++){ const b = j / sv * Math.PI * 2;
        const n = v3.norm(v3.add(v3.scale(dn, Math.cos(b)), v3.scale(ax, Math.sin(b))));
        const p = v3.add(ctr, v3.add(v3.scale(d, R), v3.scale(n, r)));
        this.v(p, n, typeof colFn === 'function' ? colFn(i / su) : colFn, m); } }
    for(let i = 0; i < su; i++) for(let j = 0; j < sv; j++){ const a = base + i * (sv + 1) + j, b = a + sv + 1; this.quad(a, b, b + 1, a + 1); }
  }
}

const COL = {
  hull:[0.022, 0.026, 0.032], deck:[0.036, 0.046, 0.04], white:[0.52, 0.53, 0.5], rail:[0.5, 0.5, 0.47],
  machine:[0.07, 0.11, 0.085], dark:[0.03, 0.03, 0.03], orange:[0.75, 0.2, 0.03], yellow:[0.7, 0.5, 0.05],
  red:[0.45, 0.04, 0.03], steel:[0.18, 0.18, 0.18], bulwark:[0.34, 0.35, 0.33], blue:[0.04, 0.09, 0.2], green:[0.05, 0.15, 0.07]
};
const MAT = {paint:[0.42, 0, 0, 0], deck:[0.55, 0, 0, 1], hull:[0.35, 0, 0, 2], dark:[0.5, 0.6, 0, 5], rubber:[0.8, 0, 0, 7],
  bulw:[0.42, 0, 0, 8], glass:[0.03, 0, 0, 6]};
const lamp = e => [0.2, 0, e, 4];
const win = e => [0.05, 0, e, 3];

function buildHull(b){
  const xs = [];
  for(let x = -36; x < 36.4; x += x > 20 ? 0.45 : 0.9) xs.push(Math.min(x, 36.35));
  xs.push(36.42);
  const NJ = 26, NB = 3; // hull rows below deck, bulwark rows
  const rows = NJ + NB + 1;
  const grid = [];
  for(const x of xs){
    const dy = deckY(x), bw = bulwarkH(x), col = [];
    for(let j = 0; j < rows; j++){
      let y;
      if(j <= NJ){ const s = j / NJ; y = -5.2 + (dy + 5.2) * (1 - Math.pow(1 - s, 1.25)); }
      else y = dy + bw * (j - NJ) / NB;
      let hb = hullHB(Math.min(x, stemX(y)), y);
      if(x >= stemX(y) - 0.01) hb = 0;
      col.push([Math.max(Math.min(x, stemX(y)), sternX(y)), y, hb]);
    }
    grid.push(col);
  }
  const NI = xs.length;
  // normals (starboard): cross(dP/di, dP/dj)
  const nrm = [];
  for(let i = 0; i < NI; i++){ nrm.push([]); for(let j = 0; j < rows; j++){
    const a = grid[Math.max(i - 1, 0)][j], c = grid[Math.min(i + 1, NI - 1)][j];
    const d = grid[i][Math.max(j - 1, 0)], e = grid[i][Math.min(j + 1, rows - 1)];
    let n = v3.cross(v3.sub(c, a), v3.sub(e, d));
    if(v3.len(n) < 1e-6) n = [1, 0, 0.3];
    nrm[i].push(v3.norm(n)); } }
  for(const side of [1, -1]){
    const base = b.P.length / 3;
    for(let i = 0; i < NI; i++) for(let j = 0; j < rows; j++){
      const p = grid[i][j], n = nrm[i][j];
      b.v([p[0], p[1], p[2] * side], [n[0], n[1], n[2] * side], COL.hull, MAT.hull);
    }
    for(let i = 0; i < NI - 1; i++) for(let j = 0; j < rows - 1; j++){
      const a = base + i * rows + j, c = base + (i + 1) * rows + j;
      if(side > 0) b.quad(a, c, c + 1, a + 1); else b.quad(a, a + 1, c + 1, c);
    }
  }
  // transom (flat stern plate)
  const tr = grid[0];
  for(let j = 0; j < rows - 1; j++){
    const p = tr[j], q = tr[j + 1];
    if(p[1] < 0.45) continue;
    b.face([p[0], p[1], -p[2]], [p[0], p[1], p[2]], [q[0], q[1], q[2]], [q[0], q[1], -q[2]], COL.hull, MAT.hull);
  }
  // bulwark inner face + cap
  const inner = [], top = [];
  for(let i = 0; i < NI; i++){
    const x = xs[i]; if(bulwarkH(x) < 0.02 || x > 36.2) continue;
    const pt = grid[i][rows - 1], pd = grid[i][NJ];
    inner.push({x, yt:pt[1], zt:Math.max(pt[2] - 0.07, 0), yd:pd[1], zd:Math.max(pd[2] - 0.07, 0), zo:pt[2]});
  }
  for(const side of [1, -1]){
    for(let k = 0; k < inner.length - 1; k++){
      const A = inner[k], B = inner[k + 1];
      if(side > 0){
        b.face([A.x, A.yd, A.zd], [A.x, A.yt, A.zt], [B.x, B.yt, B.zt], [B.x, B.yd, B.zd], COL.bulwark, MAT.bulw);
        b.face([A.x, A.yt, A.zt], [A.x, A.yt + 0.002, A.zo], [B.x, B.yt + 0.002, B.zo], [B.x, B.yt, B.zt], COL.rail, MAT.paint);
      } else {
        b.face([B.x, B.yd, -B.zd], [B.x, B.yt, -B.zt], [A.x, A.yt, -A.zt], [A.x, A.yd, -A.zd], COL.bulwark, MAT.bulw);
        b.face([B.x, B.yt, -B.zt], [B.x, B.yt + 0.002, -B.zo], [A.x, A.yt + 0.002, -A.zo], [A.x, A.yt, -A.zt], COL.rail, MAT.paint);
      }
    }
  }
  void top;
}

function buildDeck(b){
  const NZ = 16, xs = [];
  for(let x = -35.95; x < 36.3; x += x > 18 ? 0.35 : 0.8) xs.push(x);
  const base = b.P.length / 3;
  for(const x of xs){
    const hb = Math.max(deckHB(x) - (bulwarkH(x) > 0.02 ? 0.07 : 0), 0);
    for(let k = 0; k <= NZ; k++){
      const z = -hb + 2 * hb * k / NZ, y = deckAt(x, z);
      const e = 0.05, dydx = (deckAt(x + e, z) - deckAt(x - e, z)) / (2 * e);
      const dydz = hb > 0.05 ? -0.32 * z / (hb * hb) : 0;
      b.v([x, y + 0.004, z], v3.norm([-dydx, 1, -dydz]), COL.deck, MAT.deck);
    }
  }
  for(let i = 0; i < xs.length - 1; i++) for(let k = 0; k < NZ; k++){
    const a = base + i * (NZ + 1) + k, c = a + NZ + 1; b.quad(a, a + 1, c + 1, c);
  }
}

function railSide(side){ // base/top polylines along one side from stern to stem
  const pts = [];
  for(let x = -35.5; ; x += 0.5){
    const xe = Math.min(x, 35.55);
    const bw = bulwarkH(xe), dy = deckY(xe);
    let hb = bw > 0.02 ? hullHB(xe, dy + bw) - 0.035 : deckHB(xe) - 0.1;
    hb = Math.max(hb, 0);
    const yb = dy + bw, yt = dy + 1.12 + 0.05 * smooth(20, 36, xe);
    pts.push({x:xe, z:hb * side, yb, yt});
    if(xe >= 35.55) break;
  }
  const tipX = stemX(deckY(36) + 0.5) - 0.12, tdy = deckY(36);
  pts.push({x:tipX, z:0, yb:tdy + bulwarkH(36), yt:tdy + 1.2});
  return pts;
}
function buildRailings(b){
  const RM = [0.35, 0.1, 0, 0];
  for(const side of [1, -1]){
    const s = railSide(side);
    const top = s.map(p => [p.x, p.yt, p.z]);
    b.tube(top, 0.03, 8, COL.rail, RM);
    for(const f of [0.36, 0.69]) b.tube(s.map(p => [p.x, mix(p.yb, p.yt, p.yb > deckY(p.x) + 0.05 ? f * 0.8 + 0.1 : f), p.z]), 0.017, 6, COL.rail, RM);
    let acc = 0;
    for(let i = 1; i < s.length; i++){
      acc += Math.hypot(s[i].x - s[i - 1].x, s[i].z - s[i - 1].z);
      if(acc > 1.45 || i === s.length - 1){ acc = 0;
        const p = s[i]; b.cyl([p.x, p.yb - 0.02, p.z], [p.x, p.yt, p.z], 0.022, 0.022, 6, COL.rail, RM, false); }
    }
  }
  // stern rail across the transom
  const ys = deckY(-35.5), hb = deckHB(-35.5) - 0.1;
  for(const f of [0.36, 0.69, 1]) b.tube([[-35.5, ys + 1.12 * f, -hb], [-35.5, ys + 1.12 * f, hb]].map((p, i, a) => p), f === 1 ? 0.03 : 0.017, 6, COL.rail, RM);
}

function buildSuper(b){
  const W = COL.white, P = MAT.paint, rnd = mulberry32(77);
  const FR = [0.16, 0.17, 0.17], FM = [0.4, 0.3, 0, 0];
  const frameX = (x, yc, zc, w, h, dir) => { const t = 0.07, xx = x + dir * 0.03;
    b.box(Math.min(x, xx), yc + h / 2, zc - w / 2 - t, Math.max(x, xx), yc + h / 2 + t, zc + w / 2 + t, FR, FM);
    b.box(Math.min(x, xx), yc - h / 2 - t, zc - w / 2 - t, Math.max(x, xx), yc - h / 2, zc + w / 2 + t, FR, FM);
    b.box(Math.min(x, xx), yc - h / 2, zc - w / 2 - t, Math.max(x, xx), yc + h / 2, zc - w / 2, FR, FM);
    b.box(Math.min(x, xx), yc - h / 2, zc + w / 2, Math.max(x, xx), yc + h / 2, zc + w / 2 + t, FR, FM); };
  const frameZ = (z, xc, yc, w, h, dir) => { const t = 0.07, zz = z + dir * 0.03, z0 = Math.min(z, zz), z1 = Math.max(z, zz);
    b.box(xc - w / 2 - t, yc + h / 2, z0, xc + w / 2 + t, yc + h / 2 + t, z1, FR, FM);
    b.box(xc - w / 2 - t, yc - h / 2 - t, z0, xc + w / 2 + t, yc - h / 2, z1, FR, FM);
    b.box(xc - w / 2 - t, yc - h / 2, z0, xc - w / 2, yc + h / 2, z1, FR, FM);
    b.box(xc + w / 2, yc - h / 2, z0, xc + w / 2 + t, yc + h / 2, z1, FR, FM); };
  // deck-edge trims (darker drip strips) between levels
  b.box(-10.05, 6.55, -5.65, 14.05, 6.72, 5.65, [0.22, 0.23, 0.22], P);
  b.box(-8.05, 9.35, -5.35, 12.45, 9.5, 5.35, [0.22, 0.23, 0.22], P);
  // external ladders on the house sides

function buildShip(){

  buildHull(b); buildDeck(b); buildRailings(b); buildSuper(b); buildFore(b); buildAft(b);

layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNor; layout(location=2) in vec3 aCol; layout(location=3) in vec4 aMat;
uniform mat4 uModel; uniform mat4 uLocal;
out vec3 vW; out vec3 vN; out vec3 vL; out vec3 vLN; out vec3 vCol; out vec4 vMat;
void main(){
  vec4 lp = uLocal*vec4(aPos, 1.);
  vec4 wp = uModel*lp;
  vW = wp.xyz; vL = lp.xyz; vLN = mat3(uLocal)*aNor; vN = mat3(uModel)*vLN; vCol = aCol; vMat = aMat;
  gl_Position = uViewProj*wp;
}`;
const SHIP_FS = () => COMMON + HULL_GLSL + `
in vec3 vW; in vec3 vN; in vec3 vL; in vec3 vLN; in vec3 vCol; in vec4 vMat;
layout(location=0) out vec4 oCol; layout(location=1) out vec4 oG;
uniform sampler2D uFoamTex; uniform sampler3D uNoise;
uniform float uBowWet; uniform float uRainAmt;
vec2 ripple(vec2 p, float t, float scale, float seed){
  vec2 q = p*scale + seed; vec2 id = floor(q); vec2 f = fract(q) - 0.5;
  float h = hash12(id + seed*17.1);
  float ph = fract(t*(0.9 + h*0.6) + h);
  vec2 c = (hash21(h*93.7 + seed) - 0.5)*0.5;
  vec2 d = f - c; float r = length(d);
  float rad = ph*0.48;
  float env = (1. - ph)*(1. - ph)*smoothstep(0.5, 0.3, r);
  float w = cos((r - rad)*70.)*exp(-pow((r - rad)*16., 2.));
  return d/max(r, 1e-3)*w*env;
}
void main(){
  int type = int(vMat.w + 0.5);
  vec3 V = uCamPos - vW; float dist = length(V); V /= dist;
  vec3 Ng = normalize(cross(dFdx(vW), dFdy(vW))); if(dot(Ng, V) < 0.) Ng = -Ng;
  vec3 N = normalize(vN); if(dot(N, Ng) < 0.) N = -N;
  vec3 LN = normalize(vLN);
  vec3 alb = vCol; float rough = vMat.x, metal = vMat.y; vec3 emis = vec3(0.);
  float up = clamp(LN.y, 0., 1.);
  float film = 1.;                 // water film coverage
  vec3 nPert = vec3(0.);
  if(type == 4){ // lamp: pure emission
    vec3 c = vCol*vMat.z;
    oCol = vec4(applyFog(c, dist, -V), dist); oG = vec4(octEnc(N), 1., 0.); return;
  }
  if(type == 1){ // deck: non-skid paint, worn walkway, puddles with rain ripples, draining green water
    vec4 n1 = texture(uFoamTex, vL.xz*0.37), n2 = texture(uFoamTex, vL.xz*1.9 + 0.3);
    alb *= 0.75 + 0.5*n2.a;
    float walk = smoothstep(1.4, 0.9, abs(vL.z))*smoothstep(13.5, 15.5, vL.x)*0.35;
    alb = mix(alb, alb*1.6 + 0.02, walk*n1.r);
    float hb = max(deckHB(vL.x), 0.5);
    float edge = smoothstep(0.55, 0.98, abs(vL.z)/hb);
    float pud = smoothstep(0.52, 0.7, n1.r*0.7 + n1.a*0.3 + edge*0.35 - 0.05);
    rough = mix(0.16 + 0.12*n2.a, 0.018, pud);
    film = 1.;
    vec2 rp = ripple(vL.xz, uTime, 3.1, 0.) + ripple(vL.xz, uTime*1.13, 4.7, 3.7) + ripple(vL.xz, uTime*0.87, 6.3, 9.1);
    nPert.xz += rp*(0.12 + 0.25*pud)*uRainAmt;
    // micro bumps of the non-skid coating outside puddles
    nPert.xz += (n2.gb - 0.5)*0.12*(1. - pud);
    // green water draining aft: aerated foam sheets
    vec2 fp = vec2(vL.x*0.22 + uTime*0.55, vL.z*0.35);
    float flow = texture(uFoamTex, fp).g*0.6 + texture(uFoamTex, fp*2.3 + 0.4).g*0.4;
    float wash = uBowWet*smoothstep(0.45 - 0.25*uBowWet, 0.85, flow)*smoothstep(12., 20., vL.x);
    alb = mix(alb, vec3(0.75, 0.8, 0.82), wash);
    rough = mix(rough, 0.35, wash);
  } else if(type == 2){ // hull: black topsides, red antifouling, rust weeping from scuppers/plates
    float boot = smoothstep(0.35, 0.2, vL.y);
    alb = mix(alb, vec3(0.2, 0.03, 0.025), boot);
    float r = texture(uFoamTex, vec2(vL.x*0.6, vL.y*0.06)).b;
    float rust = smoothstep(0.62, 0.85, r)*smoothstep(-0.5, 2.5, vL.y)*0.8;
    alb = mix(alb, vec3(0.12, 0.05, 0.025), rust);
    rough = mix(0.28, 0.5, rust);
  } else if(type == 3){ // lit window: warm light behind wet glass
    emis = vCol*vMat.z*(0.75 + 0.25*texture(uFoamTex, vL.xy*0.8 + vL.z).a);
    alb = vec3(0.01); rough = 0.05;
  } else if(type == 6){ alb = vCol; rough = 0.025; }
  // running water on vertical surfaces
  float vert = 1. - abs(LN.y);
  if(type != 1){
    vec2 sp = vec2((vL.x + vL.z)*2.3, vL.y*0.07 + uTime*0.18);
    float st = texture(uFoamTex, sp).b;
    float streak = smoothstep(0.5, 0.8, st)*vert;
    rough = mix(rough, rough*0.55 + 0.05, 0.8);
    rough = mix(rough, 0.045, streak*0.6);
    nPert += vec3(0., (st - 0.5)*0.06, 0.)*vert;
    // grime and rust weeping from edges and fittings on painted steel
    if(type == 0 || type == 8){
      float g = texture(uFoamTex, vec2((vL.x + vL.z)*0.35, vL.y*0.045)).b;
      float rr = smoothstep(0.7, 0.92, g)*vert;
      alb = mix(alb, alb*vec3(0.62, 0.45, 0.33), rr*0.75);
      float dirt = texture(uFoamTex, vL.xz*0.11 + vL.y*0.07).r;
      alb *= 0.82 + 0.3*dirt;
    }
    rough = mix(rough, 0.07, up*0.8);
  }
  if(type != 3 && type != 6) alb *= mix(1., 0.6, film);
  // perturb normal (in local frame -> world)
  vec3 Nl = normalize(LN + nPert);
  vec3 Nw = normalize(mat3(uShipMat)*Nl);
  if(dot(Nw, Ng) < 0.05) Nw = N;
  N = Nw;

  float NoV = max(dot(N, V), 1e-3);
  float a = max(rough*rough, 0.002);
  float f0 = mix(0.04, 0.6, metal);
  vec3 dif = vec3(0.), spec = vec3(0.);
  float sh0 = shadow0(vW + Ng*0.035);
  for(int i = 0; i < 8; i++){
    if(i >= uNumLights) break;
    vec3 L; float ld; vec3 Li = lightIn(i, vW, L, ld);
    if(i == 0) Li *= sh0;
    float NoL = max(dot(N, L), 0.);
    if(NoL <= 0.) continue;
    vec3 H = normalize(L + V);
    float aa = max(a, 0.0025);
    float aL = min(aa + 0.09/max(ld, 0.1), 1.);   // lamp radius ~0.18 m (Karis sphere-light widening)
    float en = (aa/aL)*(aa/aL);
    spec += Li*NoL*D_GGX(max(dot(N, H), 0.), aL)*en*V_Smith(NoV, NoL, aL)*F_Schlick(f0, max(dot(V, H), 0.));
    dif += Li*NoL;
  }
  // lightning
  float NoLf = max(dot(N, uFlashDir), 0.);
  vec3 Hf = normalize(uFlashDir + V);
  dif += uFlashCol*(NoLf*0.8 + 0.2);
  spec += uFlashCol*NoLf*D_GGX(max(dot(N, Hf), 0.), max(a, 0.02))*0.25*F_Schlick(f0, max(dot(V, Hf), 0.));
  // ambient from the sky panorama
  vec3 amb = skyEnv(N, 6.5)*(0.6 + 0.4*N.y) + skyEnv(vec3(0., 1., 0.), 7.)*0.15;
  vec3 R = reflect(-V, N);
  float Fr = F_Schlick(f0, NoV);
  Fr = mix(Fr, f0, clamp(rough*1.3, 0., 0.9));
  float so = clamp(R.y*3. + 0.6, 0.15, 1.);
  vec3 env = skyEnv(R, clamp(rough*9., 0., 7.))*so;
  vec3 kd = alb*(1. - metal)*(1. - Fr);
  vec3 col = kd*(dif*0.3183 + amb*0.85) + spec + env*Fr + emis;
  col = min(col, vec3(20000.));
  oCol = vec4(applyFog(col, dist, -V), dist);
  oG = vec4(octEnc(N), rough, Fr*so*(type == 1 ? 1. : 0.65));
}`;

//  FX (part A, GPU-only/stateless): wind-driven rain streaks (two layers),
//  rain splashes on the foredeck, spindrift blown off breaking crests.

const FX_COMMON = `
float hgP(float mu, float g){ float g2 = g*g; return (1. - g2)/pow(1. + g2 - 2.*g*mu, 1.5); }
vec3 particleLight(vec3 P, vec3 V, float g, float shadowed){
  vec3 c = vec3(0.);
  for(int i = 0; i < 8; i++){
    if(i >= uNumLights) break;
    vec3 L; float ld; vec3 Li = lightIn(i, P, L, ld);
    if(i == 0 && shadowed > 0.5) Li *= shadow0(P);
    c += Li*(0.45 + 0.55*hgP(dot(-L, V), g));
  }
  c += uFlashCol*(0.35 + 0.65*hgP(dot(-uFlashDir, V), g)*0.5);
  return c*0.3183;
}
// expands a screen-aligned quad around segment a->b; returns clip pos, writes across-coordinate and pixel width
vec4 lineQuad(vec3 a, vec3 b, float width, int vid, out vec2 q, out float wpx, out float lpx){
  vec4 ca = uViewProj*vec4(a, 1.), cb = uViewProj*vec4(b, 1.);
  q = vec2(0.); wpx = 0.; lpx = 0.;
  if(ca.w < 0.05 || cb.w < 0.05) return vec4(0., 0., -2., 1.);
  float side = (vid & 1) == 0 ? -1. : 1.;
  bool tail = (vid >> 1) != 0;
  vec2 sa = ca.xy/ca.w, sb = cb.xy/cb.w;
  vec2 d = (sb - sa)*uRes*0.5;
  lpx = length(d);
  vec2 dir = lpx > 1e-3 ? d/lpx : vec2(0., 1.);
  vec2 n = vec2(-dir.y, dir.x);
  vec4 c = tail ? cb : ca;
  // projected width in pixels (y focal length = length of the second row of the view-projection)
  wpx = width*0.5*uRes.y*length(vec3(uViewProj[0][1], uViewProj[1][1], uViewProj[2][1]))/c.w;
  float wd = max(wpx, 1.0);
  vec2 off = (n*side*wd*0.5 + dir*(tail ? 0.75 : -0.75))/(uRes*0.5);
  q = vec2(side, tail ? 1. : 0.);
  return vec4(c.xy + off*c.w, c.z, c.w);
}
`;
const RAIN_VS = COMMON + FX_COMMON + `
uniform vec3 uBoxC; uniform float uBox; uniform vec3 uRainV; uniform vec3 uCamVel; uniform float uExpo; uniform float uLayer; uniform float uBright;
out vec2 vQ; out vec3 vC; out float vA;
void main(){
  float id = float(gl_InstanceID) + uLayer*100003.;
  vec3 h = hash31(id*1.37 + 0.5), h2 = hash31(id*7.13 + 3.1);
  float spd = 0.82 + 0.36*h2.x;
  vec3 vel = uRainV*spd + vec3(0., -1.5*h2.y, 0.);
  vec3 bmin = uBoxC - uBox*0.5;
  vec3 p = bmin + mod(h*uBox + vel*uTime - bmin, vec3(uBox));
  vec3 vr = vel - uCamVel;
  vec3 tail = p - vr*uExpo;
  vec2 q; float wpx, lpx;
  gl_Position = lineQuad(p, tail, 0.0011 + 0.0009*h2.z, gl_VertexID, q, wpx, lpx);
  vQ = q;
  vec3 V = normalize(uCamPos - p);
  vec3 rel = (p - uBoxC)/uBox;
  float edge = 1. - smoothstep(0.38, 0.5, max(max(abs(rel.x), abs(rel.y)), abs(rel.z)));
  float dc = length(uCamPos - p);
  float near = smoothstep(0.25, 1.2, dc);
  vec3 L = particleLight(p, V, 0.55, 1.) + skyEnv(vec3(0., 1., 0.), 7.)*0.6;
  float cover = clamp(wpx, 0., 1.)*clamp(4./(lpx + 4.), 0.05, 1.)*clamp(lpx/4., 0.4, 1.);
  vC = L*uBright;
  vA = edge*near*cover;
}`;
const RAIN_FS = COMMON + `
in vec2 vQ; in vec3 vC; in float vA; out vec4 o;
void main(){
  float across = exp(-vQ.x*vQ.x*3.);
  float along = smoothstep(0., 0.18, vQ.y)*smoothstep(1., 0.7, vQ.y);
  float a = vA*across*along;
  o = vec4(vC*a, 0.);
}`;

const SPLASH_VS = COMMON + HULL_GLSL + FX_COMMON + `
uniform float uBright;
out vec2 vQ; out vec3 vC; out float vA; out float vLife;
void main(){
  float id = float(gl_InstanceID);
  vec3 h = hash31(id*3.17 + 11.);
  float cyc = uTime*(0.9 + h.z*0.8) + h.x*17.;
  float ci = floor(cyc), ph = fract(cyc);
  vec2 r = hash21(id*13.7 + ci*7.31);
  float x = mix(12.8, 35.6, sqrt(r.x));
  float hb = max(deckHB(x) - 0.12, 0.);
  float z = (r.y*2. - 1.)*hb;
  vec3 lp = vec3(x, deckSurf(x, z) + 0.01, z);
  float life = ph/0.16;
  vLife = life;
  if(life > 1.){ gl_Position = vec4(0., 0., -2., 1.); vA = 0.; vC = vec3(0.); vQ = vec2(0.); return; }
  vec3 wp = (uShipMat*vec4(lp, 1.)).xyz;
  vec3 upv = normalize(mat3(uShipMat)*vec3(0., 1., 0.));
  vec3 V = normalize(uCamPos - wp);
  vec3 right = normalize(cross(upv, V));
  float s = 0.018 + 0.03*life;
  vec2 q = vec2((gl_VertexID & 1) == 0 ? -1. : 1., (gl_VertexID >> 1) == 0 ? 0. : 1.);
  wp += right*q.x*s + upv*q.y*s*1.4;
  gl_Position = uViewProj*vec4(wp, 1.);
  vQ = q;
  vec3 L = particleLight(wp, V, 0.3, 1.) + skyEnv(vec3(0., 1., 0.), 7.)*0.5;
  float dc = length(uCamPos - wp);
  vC = L*uBright;
  vA = (1. - life)*smoothstep(18., 4., dc)*0.6;
}`;
const SPLASH_FS = COMMON + `
in vec2 vQ; in vec3 vC; in float vA; in float vLife; out vec4 o;
void main(){

  vec2 d = vQ - vec2(0., 0.2 + 0.25*vLife);

const SPIN_VS = COMMON + OCEAN_GLSL + FX_COMMON + `
uniform float uBright; uniform vec2 uWind2;
out vec2 vQ; out vec3 vC; out float vA; out float vSeed;
void main(){
  float id = float(gl_InstanceID);
  vec3 h = hash31(id*5.31 + 2.);
  float T = 2.2 + h.x*1.8;
  float cyc = uTime/T + h.y*13.;
  float ci = floor(cyc), ph = fract(cyc);
  vec3 r = hash31(id*1.91 + ci*3.77);
  float rad = 14. + 520.*r.x*r.x;
  float ang = r.y*6.2832;
  vec2 spawn = uCamPos.xz + vec2(cos(ang), sin(ang))*rad;
  vec2 base = spawn + uWind2*ph*T*0.75;
  vec3 d = oceanDispLod(base, vec3(0., 0., 1.));
  vec4 D = textureLod(uDer0, base/uCasL.x, 0.) + textureLod(uDer1, base/uCasL.y, 0.);
  float J = (1. + D.z)*(1. + D.w);
  float crest = smoothstep(0.62, 0.25, J);
  vec3 P = vec3(base.x + d.x, d.y + 0.6 + ph*(2.5 + 3.*r.z), base.y + d.z);
  vec3 V = uCamPos - P; float dist = length(V); V /= dist;
  vec3 right = normalize(cross(vec3(0., 1., 0.), V)), upv = cross(V, right);
  float s = (1.6 + 3.5*r.z)*(0.6 + ph*1.2);
  vec2 q = vec2((gl_VertexID & 1) == 0 ? -1. : 1., (gl_VertexID >> 1) == 0 ? -1. : 1.);
  float ca = cos(h.z*6.28), sa = sin(h.z*6.28);
  vec2 qr = vec2(q.x*ca - q.y*sa, q.x*sa + q.y*ca);
  vec3 wd = normalize(vec3(uWind2.x, 0., uWind2.y));
  vec3 wp = P + right*qr.x*s*1.6 + upv*qr.y*s*0.7 + wd*qr.x*s*0.6;
  gl_Position = uViewProj*vec4(wp, 1.);
  vQ = q; vSeed = h.z*37. + ci;
  vec3 L = particleLight(P, V, 0.4, 0.) + skyEnv(vec3(0., 1., 0.), 7.)*1.1;
  vC = applyFog(L, dist, -V)*uBright;
  vA = crest*sin(ph*3.1416)*smoothstep(8., 30., dist)*exp(-dist*uFogDen*0.5);
}`;
const SPIN_FS = COMMON + `
uniform sampler2D uScene; uniform sampler2D uFoamTex;
in vec2 vQ; in vec3 vC; in float vA; in float vSeed; out vec4 o;
void main(){
  float r2 = dot(vQ, vQ);
  if(r2 > 1.) discard;
  float n = texture(uFoamTex, vQ*0.22 + vec2(vSeed*0.137, vSeed*0.071)).r;

  float pd = 1./gl_FragCoord.w;
  a *= clamp((sd - pd)/3., 0., 1.);
  o = vec4(vC*a, a);
}`;

const SPRAY_VS = COMMON + FX_COMMON + `
layout(location=0) in vec4 iA; layout(location=1) in vec4 iB;
uniform vec3 uCamVel; uniform float uExpo;
out vec2 vQ; out vec3 vC; out float vA; flat out int vKind; out float vSeed; out float vAge;
void main(){

const post = {
  scale:1, frame:0,
  init(){
    this.pSSR = program(FS_VS, SSR_FS, 'ssr');

    this.pComb = program(FS_VS, COMBINE_FS, 'combine');
    this.pDown = program(FS_VS, DOWN_FS, 'bloom-down');
    this.pUp = program(FS_VS, UP_FS, 'bloom-up');

  },
  resize(W, H){

    this.bloom = [];

      const bt = t(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT); this.bloom.push({t:bt, f:f([bt]), w, h});
    }

  },
  ssr(){
    bindFBO(this.ssrF); use(this.pSSR);
    bindTex(0, this.hdrA); bindTex(1, this.gbuf); u1i('uScene', 0); u1i('uG', 1); u1f('uFrame', this.frame);
    drawFS();
  },
  vol(den, sprayFog, bowP){

    bindTex(0, this.hdrA); u1i('uScene', 0); u1f('uFrame', this.frame); u1f('uDen', den); u1f('uSprayFog', sprayFog);
    u3v('uBowP', bowP); u1i('uVolLights', 4);

  },
  combine(){

    bindTex(0, this.hdrA); bindTex(1, this.ssrT); bindTex(2, this.volT);

      u2f('uTexel', 1 / sw, 1 / sh); u1f('uFirst', i === 0 ? 1 : 0); drawFS();

  },
  final(exposure, fade, flashVeil){

  }

//  MAIN: ship dynamics on the simulated sea, camera & input, lightning,

const QS = new URLSearchParams(location.search);
const DBG = {vol:1, rain:1, spray:1, spin:1, splash:1, bolt:1, ssr:1, bloom:1, expo:1, ocean:0};
function boot(){
initNoise(); ocean.init(); probes.init(); oceanR.init(); sky.init(); shipR.init(); fxA.init(); spray.init(); bolts.init(); post.init();

// ------------------------------------------------------------ resolution ----
let pixBudget = +(QS.get('pix') || (LOWQ ? 0.9e6 : 2.3e6)), renderScale = 1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(2, Math.floor(innerWidth * dpr)); canvas.height = Math.max(2, Math.floor(innerHeight * dpr));
  renderScale = Math.min(1, Math.sqrt(pixBudget / (canvas.width * canvas.height)));

resize();
addEventListener('resize', resize);
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fail('The graphics context was lost. Reload the page to restart the storm.'); });

// -------------------------------------------------------------- weather ----
const WIND_SPEED = 24;
const WIND = [Math.cos(OCEAN.waveAngle) * WIND_SPEED, 0, Math.sin(OCEAN.waveAngle) * WIND_SPEED];
G.wind = [WIND[0], WIND[2]];
G.moonDir = v3.norm([Math.cos(0.5) * Math.cos(0.45), Math.sin(0.45), Math.sin(0.5) * Math.cos(0.45)]);
G.fogDen = 1 / 2300;
const BASE = {fog:[0.0055, 0.0068, 0.0083], amb:[0.0052, 0.0062, 0.0080], moon:[0.075, 0.083, 0.1]};

// ----------------------------------------------------------------- ship ----
const ship = {x:0, z:0, psi:0, speed:2.6, heave:0, heaveV:0, pitch:0, pitchV:0, roll:0, rollV:0,
  R:[1, 0, 0, 0, 1, 0, 0, 0, 1], pos:[0, 0, 0], vel:[0, 0, 0], q:[0, 0, 0, 1], init:false, bowR:0, bowRV:0, bowWet:0, slamCool:0, waterBow:0};
const PROBE_L = [];
for(const x of [-28, -14, 0, 14, 28]) for(const z of [-6, 0, 6]) PROBE_L.push([x, z]);
PROBE_L.push([34.2, 0]);
const probeXZ = new Float32Array(32);
function updateProbePositions(){
  const c = Math.cos(ship.psi), s = Math.sin(ship.psi);
  for(let i = 0; i < 16; i++){
    const [lx, lz] = PROBE_L[i];
    probeXZ[i * 2] = ship.x + c * lx + s * lz; probeXZ[i * 2 + 1] = ship.z - s * lx + c * lz;
  }
}
function updateShip(dt, t){
  ship.psi = 0.04 * Math.sin(t * 0.21) + 0.022 * Math.sin(t * 0.097 + 1.3) - ship.roll * 0.12;
  const fx = Math.cos(ship.psi), fz = -Math.sin(ship.psi);
  ship.x += fx * ship.speed * dt; ship.z += fz * ship.speed * dt;
  if(probes.ready){
    const h = probes.coarse;
    let mean = 0, sx = 0, sz = 0;
    for(let i = 0; i < 15; i++){ mean += h[i]; sx += PROBE_L[i][0] * h[i]; sz += PROBE_L[i][1] * h[i]; }
    mean /= 15; const b = sx / 5880, c = sz / 360;
    const tH = mean, tP = Math.atan(b * 0.92), tR = -Math.atan(c * 0.85) - 0.035;
    if(!ship.init){ ship.heave = tH; ship.pitch = tP; ship.roll = tR; ship.init = true; }
    const sub = 4, h2 = dt / sub;
    const wH = 2 * Math.PI / 7.2, zH = 0.34, wP = 2 * Math.PI / 6.4, zP = 0.3, wR = 2 * Math.PI / 12.2, zR = 0.15;
    for(let k = 0; k < sub; k++){
      ship.heaveV += (wH * wH * (tH - ship.heave) - 2 * zH * wH * ship.heaveV) * h2;
      ship.pitchV += (wP * wP * (tP - ship.pitch) - 2 * zP * wP * ship.pitchV) * h2;
      ship.rollV += (wR * wR * (tR - ship.roll) - 2 * zR * wR * ship.rollV) * h2;
      ship.heave += ship.heaveV * h2; ship.pitch += ship.pitchV * h2; ship.roll += ship.rollV * h2;
    }
  }
  ship.q = qMul(qMul(qAxis(0, 1, 0, ship.psi), qAxis(0, 0, 1, ship.pitch)), qAxis(1, 0, 0, ship.roll));
  ship.R = qToM3(ship.q);
  ship.pos = [ship.x, ship.heave, ship.z];
  ship.vel = [fx * ship.speed, ship.heaveV, fz * ship.speed];
  G.shipMat = m4FromRT(ship.R, ship.pos);
  G.shipInv = m4Inv(G.shipMat);
  // bow-water relative motion => slamming, spray, green water
  if(probes.ready){
    const bowW = v3.add(ship.pos, m3v(ship.R, [34.2, 0, 0]));
    const r = bowW[1] - probes.fine[15];
    const rv = (r - ship.bowR) / Math.max(dt, 1e-3);
    ship.bowRV = mix(ship.bowRV, rv, 1 - Math.exp(-dt * 12));
    ship.bowR = r; ship.waterBow = -r;
    const slam = Math.max(0, -ship.bowRV - 1.0) * smooth(2.0, -1.0, r);
    const imm = smooth(0.8, -3.2, r);
    const strength = clamp(slam * 0.22 + imm * 0.32, 0, 1);
    ship.spray = strength;
    ship.slamCool -= dt;
    // angular velocity (world) for point velocities
    const omega = m3v(ship.R, [ship.rollV, 0, ship.pitchV]);
    const bowVel = v3.add(ship.vel, v3.cross(omega, m3v(ship.R, [33, 2, 0])));
    const sp = {R:ship.R, pos:ship.pos, vel:bowVel};
    spray.burst(strength, sp, ship.waterBow, strength * 1400 * dt);
    if(slam > 1.4 && ship.slamCool < 0){ spray.burst(clamp(slam * 0.3, 0.5, 1), sp, ship.waterBow, 900 + 1400 * clamp(slam * 0.25, 0, 1)); ship.slamCool = 1.2; }
    const green = ship.waterBow - (deckY(34) - 0.3);
    if(green > 0) ship.bowWet = Math.min(1, ship.bowWet + green * dt * 1.5);
    ship.bowWet = Math.max(0, ship.bowWet - dt / 7);
  }
}

// --------------------------------------------------------------- camera ----
const D2R = Math.PI / 180;
const EYE = [20.6, deckAt(20.6, -2.7) + 1.74, -2.7];
const cam = {yaw:10 * D2R, pitch:-5 * D2R, fov:66 * D2R, tYaw:10 * D2R, tPitch:-5 * D2R, tFov:66 * D2R, last:-100, def:{yaw:10 * D2R, pitch:-5 * D2R, fov:66 * D2R},
  pos:[0, 0, 0], prevPos:null, vel:[0, 0, 0], R:null};
if(QS.get('view')){ const v = QS.get('view').split(',').map(Number); cam.def = {yaw:(v[0] || 0) * D2R, pitch:(v[1] || 0) * D2R, fov:(v[2] || 64) * D2R};
  cam.yaw = cam.tYaw = cam.def.yaw; cam.pitch = cam.tPitch = cam.def.pitch; cam.fov = cam.tFov = cam.def.fov; }
const angWrap = a => { while(a > Math.PI) a -= 2 * Math.PI; while(a < -Math.PI) a += 2 * Math.PI; return a; };
let nowT = 0;
function noteInput(){ cam.last = nowT; hideHint(); }
const ptrs = new Map(); let pinchD = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  canvas.classList.add('drag'); noteInput();
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if(!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  noteInput();
  if(ptrs.size === 1){
    const k = cam.tFov / Math.max(innerHeight, 1);
    cam.tYaw += dx * k; cam.tPitch = clamp(cam.tPitch + dy * k, -86 * D2R, 86 * D2R);
  } else if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if(pinchD > 0 && d > 0) cam.tFov = clamp(cam.tFov * pinchD / d, 16 * D2R, 100 * D2R);
    pinchD = d;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if(!ptrs.size) canvas.classList.remove('drag'); pinchD = 0;
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); } noteInput(); };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); noteInput();
  const dy = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  cam.tFov = clamp(cam.tFov * Math.exp(clamp(dy, -120, 120) * 0.0009), 16 * D2R, 100 * D2R);
}, {passive:false});
['gesturestart', 'gesturechange'].forEach(n => document.addEventListener(n, e => e.preventDefault()));

function updateCamera(dt, t){
  if(nowT - cam.last > 4.0 && !ptrs.size){
    const k = 1 - Math.exp(-dt * 0.9);
    cam.tYaw = cam.tYaw + angWrap(cam.def.yaw - cam.tYaw) * k;
    cam.tPitch = mix(cam.tPitch, cam.def.pitch, k); cam.tFov = mix(cam.tFov, cam.def.fov, k);
  }

  // body sway on the moving deck (small, low frequency)
  const sway = [0.025 * Math.sin(t * 0.7) + 0.012 * Math.sin(t * 1.9), 0.02 * Math.sin(t * 1.1 + 1), 0.03 * Math.sin(t * 0.53 + 2)];
  const eye = v3.add(EYE, sway);
  cam.pos = v3.add(ship.pos, m3v(ship.R, eye));
  if(cam.prevPos && dt > 0) cam.vel = v3.lerp(cam.vel, v3.scale(v3.sub(cam.pos, cam.prevPos), 1 / dt), 1 - Math.exp(-dt * 20));
  cam.prevPos = cam.pos;

  const hand = qMul(qAxis(1, 0, 0, 0.004 * Math.sin(t * 1.3) + 0.003 * Math.sin(t * 2.9)), qAxis(0, 1, 0, 0.004 * Math.sin(t * 0.9 + 2)));

  q = qMul(q, qAxis(0, 1, 0, -Math.PI / 2));
  q = qMul(q, qAxis(1, 0, 0, cam.pitch));

// ------------------------------------------------------------ lightning ----
const LRND = mulberry32(2718);
const LIGHTNING = {next:+(QS.get('flash') || 3.0), events:[], level:0};
function spawnLightning(t, forceType, relDeg, distF){
  const r = LRND;
  const type = forceType || (r() < 0.5 ? 'cg' : 'ic');
  let rel = r() < 0.7 ? (r() - 0.5) * 2.4 : r() * Math.PI * 2;
  if(relDeg !== undefined) rel = relDeg * D2R;
  const a = ship.psi + rel;
  let dist = type === 'cg' ? 1700 + r() * 3600 : 1800 + r() * 6500;
  if(distF) dist = distF;
  const dir = [Math.cos(a), 0, -Math.sin(a)];
  const px = ship.x + dir[0] * dist, pz = ship.z + dir[2] * dist;
  const strokes = []; let st = 0;
  const n = type === 'cg' ? 2 + Math.floor(r() * 3) : 3 + Math.floor(r() * 5);
  for(let i = 0; i < n; i++){ strokes.push({t:st, a:(i === 0 ? 1 : 0.35 + r() * 0.65)}); st += type === 'cg' ? 0.05 + r() * 0.11 : 0.04 + r() * 0.16; }
  const e = {type, pos:[px, type === 'cg' ? 620 : 750 + r() * 900, pz], t0:t, strokes, I:type === 'cg' ? 0.8 + r() * 0.7 : 0.4 + r() * 0.8};
  LIGHTNING.events.push(e);
  if(type === 'cg') bolts.strike([px, 520, pz], [px + (r() - 0.5) * 500, 0, pz + (r() - 0.5) * 500], t, strokes);
  return e;
}
function flashIntensity(e, t){
  const d = t - e.t0; if(d < 0) return 0;
  let I = 0;
  for(const s of e.strokes){ const x = d - s.t; if(x >= 0) I += s.a * Math.exp(-x / 0.05); }
  I += 0.22 * Math.exp(-d / 0.4);
  if(e.type === 'ic') I *= 0.6 + 0.4 * Math.sin(d * 63 + e.t0) * Math.sin(d * 29);
  return Math.max(I, 0) * e.I;
}
function updateLightning(t){
  if(t >= LIGHTNING.next){ spawnLightning(t); LIGHTNING.next = t + 2.5 + LRND() * 8.5; }
  LIGHTNING.events = LIGHTNING.events.filter(e => t - e.t0 < 2.0);
  const fp = SKYSTATE.flashP; fp.fill(0);
  let dir = [0, 0, 0], tot = 0, fog = 0;
  LIGHTNING.events.slice(-3).forEach((e, k) => {
    const I = flashIntensity(e, t);
    fp[k * 4] = e.pos[0]; fp[k * 4 + 1] = e.pos[1]; fp[k * 4 + 2] = e.pos[2]; fp[k * 4 + 3] = I * 2.4;
    const v = v3.sub(e.pos, G.camPos), d = v3.len(v);
    const att = I / (1 + (d / 2600) ** 2);
    dir = v3.add(dir, v3.scale(v3.norm(v), att)); tot += att; fog += I / (1 + (d / 4000) ** 2);
  });
  G.flashDir = tot > 1e-5 ? v3.norm(dir) : [0, 1, 0];
  G.flashCol = v3.scale([0.72, 0.8, 1.0], tot * 0.9);
  G.flashFog = 0.06;
  LIGHTNING.level = tot;
  bolts.intensityOf = b => { const e = LIGHTNING.events.find(x => x.t0 === b.t0); return e ? flashIntensity(e, t) : 0; };
}

// ---------------------------------------------------------------- lights ----
function updateLights(t){
  const L = SHIP_LIGHTS;
  G.numLights = L.length;
  for(let i = 0; i < L.length; i++){
    const l = L[i], p = m4Pt(G.shipMat, l.p);
    const flick = 1 + 0.015 * Math.sin(t * 60 + i);
    G.lightPos.set([p[0], p[1], p[2], l.range], i * 4);
    if(l.t){
      const d = m3v(ship.R, v3.norm(v3.sub(l.t, l.p)));
      G.lightDir.set([d[0], d[1], d[2], Math.cos(l.outer * D2R)], i * 4);
      G.lightCol.set([l.col[0] * l.I * flick, l.col[1] * l.I * flick, l.col[2] * l.I * flick, Math.cos(l.inner * D2R)], i * 4);
    } else {
      G.lightDir.set([0, -1, 0, -2], i * 4);
      G.lightCol.set([l.col[0] * l.I, l.col[1] * l.I, l.col[2] * l.I, 1], i * 4);
    }
  }
  const l0 = L[0], lp = m4Pt(G.shipMat, l0.p), ld = m3v(ship.R, v3.norm(v3.sub(l0.t, l0.p)));
  const upv = m3v(ship.R, [1, 0, 0]);
  const lview = m4LookAt(lp, v3.add(lp, ld), upv);
  G.shadowMat = m4Mul(m4Persp(2 * (l0.outer + 8) * D2R, 1, 0.25, 75), lview);

// ------------------------------------------------------------ hint/veil ----
const hint = document.getElementById('hint'), veil = document.getElementById('veil');
if(matchMedia('(pointer: coarse)').matches) hint.innerHTML = 'Drag to look around &nbsp;·&nbsp; Pinch to zoom';
let hintShown = false, hintHidden = false;
function hideHint(){ if(hintShown && !hintHidden){ hintHidden = true; hint.style.opacity = '0'; } }

// --------------------------------------------------------------- frame ----
let simT = +(QS.get('t') || 0), lastNow = performance.now(), frozen = false, frames = 0, ftAvg = 16, resTimer = 0;

let stepping = false;
function tick(now){
