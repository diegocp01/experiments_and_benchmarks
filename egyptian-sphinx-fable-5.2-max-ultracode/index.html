<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Sphinx</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9c9a8; }
  body { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: #3b2a17; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .caption { position: fixed; left: 28px; bottom: 24px; pointer-events: none; user-select: none; }
  .caption h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.04em; }
  .caption p { margin: 4px 0 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.62; }
  .hint { position: fixed; right: 28px; bottom: 26px; font: 12px/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          text-align: right; opacity: 0.7; pointer-events: none; user-select: none; transition: opacity 1.2s; }
  .hint b { font-weight: 600; }
  .hint.dim { opacity: 0.32; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #e2d2b0; transition: opacity 0.7s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading span { font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.7; }
  @media (max-width: 560px) { .hint { display: none; } .caption { left: 16px; bottom: 16px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="caption">
  <h1>The Great Sphinx of Giza</h1>
  <p>Voxel study &middot; 1 cube &asymp; 33 cm</p>
</div>
<div class="hint" id="hint">
  <b>Drag</b> to orbit 360&deg; &middot; <b>Scroll</b> to zoom<br>
  <b>Right-drag</b> to pan &middot; <b>Double-click</b> to reset
</div>
<div id="loading"><span id="loadingText">Carving limestone&hellip;</span></div>

<script src="js/core.js"></script>
<script src="js/sphinx.js"></script>
<script src="js/head.js"></script>
<script src="js/terrain.js"></script>
<script src="js/light.js"></script>
<script src="js/mesh.js"></script>
<script src="js/far.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
