  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: grab; outline: none; }
  canvas.drag { cursor: grabbing; }
  #hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    font: 500 11px/1.4 ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 228, 196, .5);
    pointer-events: none; transition: opacity 1.8s ease; white-space: nowrap; }
  #hint.hide { opacity: 0; }
  #err { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2em;
    color: #e8d2b8; font: 15px/1.5 ui-sans-serif, -apple-system, Arial, sans-serif; text-align: center; }
</style>

<canvas id="c" tabindex="0"></canvas>

<script type="x-shader" id="common">
// ===== Shared scene description: glass, ice, whiskey (units: cm, table at y = 0) =====
uniform float uTime;
uniform float uMelt;          // 0 fresh ice .. 1 well melted
uniform float uLevel;         // whiskey surface height
uniform vec3  uIceP[3];       // cube centres
uniform mat3  uIceR[3];       // world -> cube-local rotation
uniform vec4  uIceS[3];       // half extents xyz, edge radius w
uniform vec4  uRip[4];        // ripple sources: x, z, start time, amplitude
uniform vec3  uLightPos;

#define PI  3.14159265359
#define TAU 6.28318530718
#define EPS 0.0015

// heavy-based rocks glass
const float G_H = 9.2;        // height
const float G_R0 = 4.05;      // outer radius at the foot
const float G_TAPER = 0.035;  // radius growth per cm of height
const float G_T = 0.30;       // wall thickness
const float G_BASE = 1.55;    // inner floor height
const float G_RB = 0.32;      // outer foot rounding
const float G_RF = 0.70;      // inner floor fillet
const float B_R = 4.48;       // bounding cylinder
const float B_H = 9.32;

const int M_AIR = 0, M_GLASS = 1, M_WHISKEY = 2, M_ICE = 3;
const int K_GLASS = 0, K_ICE = 1, K_LIQ = 2;

// absorption per cm
const vec3 SIG_GLASS   = vec3(0.016, 0.005, 0.011);
const vec3 SIG_ICE     = vec3(0.010, 0.0035, 0.0012);
const vec3 SIG_WHISKEY = vec3(0.085, 0.29, 0.78);

// ---------- hashing / noise ----------
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3) { p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash32(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y);
}
float vnoise3(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = mix(hash13(i), hash13(i + vec3(1, 0, 0)), f.x), b = mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), f.x);
  float c = mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), f.x), d = mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), f.x);
  return mix(mix(a, b, f.y), mix(c, d, f.y), f.z);
}
float fbm2(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1; a *= 0.5; }
  return s / 0.9375;
}

// ray vs vertical cylinder r<R, y0<y<y1 ; returns (tnear, tfar)
vec2 iCylY(vec3 ro, vec3 rd, float R, float y0, float y1) {
  float a = dot(rd.xz, rd.xz), b = dot(ro.xz, rd.xz), c = dot(ro.xz, ro.xz) - R * R;
  float t0, t1;
  if (a < 1e-9) { if (c > 0.0) return vec2(1e9, -1e9); t0 = -1e9; t1 = 1e9; }
  else { float h = b * b - a * c; if (h < 0.0) return vec2(1e9, -1e9); h = sqrt(h); t0 = (-b - h) / a; t1 = (-b + h) / a; }
  float ry = abs(rd.y) < 1e-7 ? 1e-7 : rd.y;
  float ta = (y0 - ro.y) / ry, tb = (y1 - ro.y) / ry;
  return vec2(max(t0, min(ta, tb)), min(t1, max(ta, tb)));
}

// ---------- glass ----------
float sdRB2(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r; }

// x: glass solid, y: inner cavity (both negative inside)
vec2 glassSD(vec3 p) {
  float rr = length(p.xz) - G_TAPER * p.y;
  float htop = G_H - G_T * 0.5;
  float dO = max(sdRB2(vec2(rr, p.y - (htop + 2.0) * 0.5), vec2(G_R0, (htop + 2.0) * 0.5), G_RB), p.y - htop);
  float dC = sdRB2(vec2(rr, p.y - (G_BASE + 30.0)), vec2(G_R0 - G_T, 30.0), G_RF);
  float dT = length(vec2(rr - (G_R0 - G_T * 0.5), p.y - htop)) - G_T * 0.5;   // rounded rim
  return vec2(min(max(dO, -dC), dT), dC);
}

// ---------- ice ----------
float iceBump(vec3 q, float s) {
  float a = 0.016 + 0.05 * uMelt;
  return a * sin(q.x * 2.1 + s) * sin(q.y * 2.6 + s * 1.7) * sin(q.z * 2.3 + s * 2.9)
       + a * 0.5 * sin(q.x * 4.3 + q.z * 3.1 + s * 4.1) * sin(q.y * 3.7 - s);
}
float sdIceI(vec3 p, int i) {
  vec3 q = uIceR[i] * (p - uIceP[i]);
  vec4 s = uIceS[i];
  vec3 d = abs(q) - (s.xyz - s.w);
  float b = length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0) - s.w;
  if (b > 0.2) return (b - 0.1) * 0.9;            // far: the melt bumps (|bump| < 0.1) cannot matter
  return (b + iceBump(q, float(i) * 2.7)) * 0.9;
}
float sdIce(vec3 p, out int id) {
  float d = 1e5; id = 0;
  for (int i = 0; i < 3; i++) {
    float bs = length(p - uIceP[i]) - length(uIceS[i].xyz) - 0.08;   // bounding sphere
    float di = bs > 0.25 ? bs : sdIceI(p, i);
    if (di < d) { d = di; id = i; }
  }
  return d;
}

// ---------- whiskey surface ----------
float liquidH(vec3 p) {
  float r = length(p.xz);
  float ri = G_R0 - G_T + G_TAPER * uLevel;
  float h = uLevel + 0.10 * exp(-max(ri - r, 0.0) * 7.5);            // meniscus on the glass
  int id; float di = sdIce(vec3(p.x, uLevel, p.z), id);
  h += 0.055 * exp(-max(di, 0.0) * 10.0);                            // meniscus on the ice
  for (int k = 0; k < 4; k++) {                                       // ripples from shifting cubes
    vec4 R = uRip[k];
    float age = uTime - R.z;
    if (age < 0.0 || age > 4.0) continue;
    float x = length(p.xz - R.xy) - age * 6.5;
    h += R.w * exp(-age * 1.1) * exp(-x * x * 0.7) * cos(x * 5.5);                          // ring
    h += R.w * 1.6 * exp(-age * 0.8) * sin(age * 15.0) * dot(p.xz, normalize(R.xy + 1e-3)) / 3.8; // slosh
  }
  h += 0.003 * sin(p.x * 2.9 + uTime * 1.3) * sin(p.z * 3.3 - uTime * 1.05);
  return h;
}

// ---------- media & interfaces ----------
int mediumAt(vec3 p) {
  vec2 gc = glassSD(p);
  if (gc.x < 0.0) return M_GLASS;
  if (gc.y > 0.0) return M_AIR;
  int id;
  if (sdIce(p, id) < 0.0) return M_ICE;
  return p.y < uLevel ? M_WHISKEY : M_AIR;
}

// distance (along the ray) to the nearest optical interface of any kind.
// The whiskey surface is intersected as an exact plane; meniscus and ripples live in its normal.
float sdInterfaces(vec3 p, vec3 rd, out int kind, out int iceId) {
  vec2 gc = glassSD(p);
  float d = abs(gc.x);
  kind = K_GLASS; iceId = 0;
  if (gc.y < 0.2) {
    int id; float di = sdIce(p, id);
    if (abs(di) < d) { d = abs(di); kind = K_ICE; iceId = id; }
    float dy = uLevel - p.y;
    float dl = dy * rd.y > 0.0 ? dy / rd.y : 1e5;
    dl = max(dl, max(gc.y, -di));
    if (dl < d) { d = dl; kind = K_LIQ; }
  }
  return d;
}

// medium on the far side of an interface, inferred from what was hit (cheaper than mediumAt)
int otherMedium(vec3 p, vec3 rd, int kind, int med) {
  if (kind == K_LIQ) return med == M_WHISKEY ? M_AIR : M_WHISKEY;
  vec3 q = p + rd * (EPS * 3.0);
  if (kind == K_ICE) return med != M_ICE ? (sdIceI(q, 0) < 0.0 || sdIceI(q, 1) < 0.0 || sdIceI(q, 2) < 0.0 ? M_ICE : med)
                                         : (q.y < uLevel ? M_WHISKEY : M_AIR);
  vec2 gc = glassSD(q);
  if (gc.x < 0.0) return M_GLASS;
  return gc.y < 0.0 ? (q.y < uLevel ? M_WHISKEY : M_AIR) : M_AIR;
}

vec3 interfaceNormal(vec3 p, int kind, int iceId) {
  const vec2 k = vec2(1.0, -1.0);
  const float h = 0.002;
  if (kind == K_GLASS)
    return normalize(k.xyy * glassSD(p + k.xyy * h).x + k.yyx * glassSD(p + k.yyx * h).x +
                     k.yxy * glassSD(p + k.yxy * h).x + k.xxx * glassSD(p + k.xxx * h).x);
  if (kind == K_ICE)
    return normalize(k.xyy * sdIceI(p + k.xyy * h, iceId) + k.yyx * sdIceI(p + k.yyx * h, iceId) +
                     k.yxy * sdIceI(p + k.yxy * h, iceId) + k.xxx * sdIceI(p + k.xxx * h, iceId));
  const float e = 0.004;
  float hx = liquidH(p + vec3(e, 0, 0)) - liquidH(p - vec3(e, 0, 0));
  float hz = liquidH(p + vec3(0, 0, e)) - liquidH(p - vec3(0, 0, e));
  return normalize(vec3(-hx, 2.0 * e, -hz));
}

float iorOf(int m) { return m == M_GLASS ? 1.52 : m == M_WHISKEY ? 1.36 : m == M_ICE ? 1.31 : 1.0; }
vec3 sigmaOf(int m) { return m == M_GLASS ? SIG_GLASS : m == M_WHISKEY ? SIG_WHISKEY : m == M_ICE ? SIG_ICE : vec3(0.0); }

// unpolarised dielectric Fresnel, eta = n1 / n2
float fresnel(float cosi, float eta) {
  cosi = clamp(cosi, 0.0, 1.0);
  float st2 = eta * eta * (1.0 - cosi * cosi);
  if (st2 >= 1.0) return 1.0;
  float ct = sqrt(1.0 - st2);
  float rs = (eta * cosi - ct) / (eta * cosi + ct);
  float rp = (cosi - eta * ct) / (cosi + eta * ct);
  return 0.5 * (rs * rs + rp * rp);
}
</script>
<script type="x-shader" id="scene">
// ===== Main ray tracer, part A: lighting, environment, bar top, condensation =====
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform mat3 uCamRot;
uniform float uTanHalf;
uniform sampler2D uCaustic;
uniform float uCausHalf;
uniform sampler2D uEnv;
uniform sampler2D uCond;
uniform float uPixAng;
uniform vec2 uJitter;
out vec4 outColor;

const vec3 LIGHT_COL = vec3(1.0, 0.66, 0.38);   // ~2700K tungsten
const float LIGHT_POW = 5200.0;
const float LIGHT_R = 2.2;                      // emitter radius (soft highlights)

vec3 lightAt(vec3 p, out vec3 L, out float dist) {
  vec3 d = uLightPos - p; dist = length(d); L = d / dist;
  vec3 axis = normalize(vec3(0.0, 2.5, 0.0) - uLightPos);
  float spot = smoothstep(0.86, 0.985, dot(-L, axis));
  return LIGHT_COL * (LIGHT_POW * spot / (dist * dist));
}

// GGX specular for a spherical light: returns BRDF * cos / F (multiply by F and irradiance)
float ggxSpec(vec3 n, vec3 v, vec3 l, float rough, float dist) {
  float a = clamp(rough * rough + LIGHT_R / (2.0 * dist), 1e-3, 1.0);
  vec3 h = normalize(v + l);
  float nh = max(dot(n, h), 0.0), nl = max(dot(n, l), 0.0), nv = max(dot(n, v), 1e-3);
  float a2 = a * a, dd = nh * nh * (a2 - 1.0) + 1.0;
  float k = a * 0.5;
  float G = nl / (nl * (1.0 - k) + k) * nv / (nv * (1.0 - k) + k);
  return a2 / (PI * dd * dd) * G / (4.0 * nv);
}

// ---------- background (baked once into a mipmapped equirect map) ----------
vec3 envColor(vec3 d, float blur) {
  vec2 uv = vec2(atan(d.z, d.x) / TAU + 0.5, asin(clamp(d.y, -1.0, 1.0)) / PI + 0.5);
  return textureLod(uEnv, uv, log2(1.0 + blur * 60.0)).rgb;
}

// ---------- caustic + shadow map lookup ----------
vec3 causticAt(vec2 x) {
  vec2 uv = x / (2.0 * uCausHalf) + 0.5;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) return vec3(1.0);
  float r = length(x);
  float b = (0.035 + 0.022 * max(r - G_R0, 0.0)) / (2.0 * uCausHalf);
  vec3 c = texture(uCaustic, uv).rgb * 0.36;
  c += (texture(uCaustic, uv + vec2(b, 0)).rgb + texture(uCaustic, uv - vec2(b, 0)).rgb +
        texture(uCaustic, uv + vec2(0, b)).rgb + texture(uCaustic, uv - vec2(0, b)).rgb) * 0.16;
  return c;
}

// ---------- bar top: dark varnished walnut, wet ring, stray drops ----------
struct TableS { vec3 col; vec3 n; float F; float rough; };

vec3 woodAlbedo(vec2 x, float lod, out float rough, out vec2 slope) {
  float pw = 24.0;
  float zz = x.y + 11.0;
  float pid = floor(zz / pw);
  float pz = zz - pid * pw;
  vec2 q = vec2(x.x + pid * 37.0, pz + pid * 11.0);
  float big = fbm2(q * vec2(0.022, 0.11));
  float warp = fbm2(q * vec2(0.035, 0.30) + 3.0);
  float depth = 5.5 + 2.8 * sin(q.x * 0.045 + pid * 1.7) + 1.6 * sin(q.x * 0.11 + pid);
  float rings = length(vec2(q.y - pw * 0.5 + (warp - 0.5) * 3.0, depth)) * 1.1 + warp * 1.6;
  rings += 0.35 * sin(rings * 0.9 + big * 4.0);                       // uneven growth years
  float rf = fract(rings);
  float late = smoothstep(0.45, 0.9, rf) * smoothstep(1.0, 0.9, rf) * (0.55 + 0.45 * vnoise(vec2(q.x * 0.08, rings * 0.7)));
  float fine = mix(vnoise(vec2(q.x * 0.30, q.y * 21.0)), 0.5, smoothstep(0.03, 0.09, lod));
  float pores = smoothstep(0.70, 0.92, vnoise(vec2(q.x * 1.6, q.y * 46.0))) * (1.0 - smoothstep(0.015, 0.05, lod));
  vec3 dark = vec3(0.020, 0.0095, 0.005), mid = vec3(0.070, 0.035, 0.018), lite = vec3(0.13, 0.068, 0.034);
  vec3 col = mix(mid, lite, smoothstep(0.25, 0.8, big));
  col = mix(col, dark, late * 0.55);
  col *= 0.9 + 0.2 * fine;
  col = mix(col, dark, pores * 0.55);
  float seam = min(pz, pw - pz);
  col = mix(col, vec3(0.006, 0.003, 0.0015), 1.0 - smoothstep(0.015, 0.05, seam));
  rough = 0.16 + 0.08 * fine + 0.1 * late;
  // varnish orange-peel + seam bevel
  slope = vec2(vnoise(x * 2.2) - 0.5, vnoise(x * 2.2 + 9.0) - 0.5) * 0.012;
  slope.y += (pz < pw * 0.5 ? 1.0 : -1.0) * 0.35 * (1.0 - smoothstep(0.02, 0.11, seam));
  return col;
}

// water ring left by condensation running off the glass, plus a few stray drops
float wetAt(vec2 x, out vec2 slope) {
  float r = length(x), a = atan(x.y, x.x);
  float w = 0.22 + 0.20 * vnoise(vec2(a * 2.4, 1.3)) + 0.12 * vnoise(vec2(a * 6.5, 4.0));
  float outer = G_R0 + w;
  float m = smoothstep(outer + 0.02, outer - 0.05, r);
  float edge = exp(-pow((r - outer + 0.05) / 0.05, 2.0));
  slope = -normalize(x + 1e-5) * edge * 0.6;
  for (int i = 0; i < 6; i++) {
    vec3 h = hash32(vec2(float(i) * 7.3, 2.1));
    float ang = h.x * TAU, rad = G_R0 + 0.7 + h.y * 2.6;
    vec2 c = vec2(cos(ang), sin(ang)) * rad;
    float dr = 0.07 + 0.13 * h.z;
    vec2 dv = x - c; float dd = length(dv);
    if (dd < dr) {
      float s = sqrt(max(dr * dr - dd * dd, 1e-5));
      slope += -dv / s * 0.45 * smoothstep(dr, dr * 0.7, dd);
      m = max(m, smoothstep(dr, dr * 0.85, dd));
    }
  }
  return m;
}

TableS shadeTable(vec3 p, vec3 rd, float fp) {
  TableS T;
  float rough; vec2 sl;
  vec3 alb = woodAlbedo(p.xz, fp, rough, sl);
  vec2 ws; float wet = wetAt(p.xz, ws);
  alb *= mix(1.0, 0.55, wet);
  rough = mix(rough, 0.015, wet);
  sl = mix(sl, ws, wet);
  vec3 n = normalize(vec3(-sl.x, 1.0, -sl.y));
  vec3 L; float dl; vec3 E = lightAt(p, L, dl);
  vec3 ca = causticAt(p.xz);
  float r = length(p.xz);
  float ao = r < G_R0 ? 0.55 : 1.0 - 0.6 * exp(-(r - G_R0) * 1.1);
  vec3 amb = vec3(0.020, 0.014, 0.010) * ao;
  float nl = max(dot(n, L), 0.0);
  vec3 v = -rd;
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
  float Fl = 0.04 + 0.96 * pow(1.0 - max(dot(normalize(L + v), v), 0.0), 5.0);
  T.col = alb / PI * (E * ca * nl + amb) * (1.0 - F) + E * ca * Fl * ggxSpec(n, v, L, rough, dl);
  T.n = n; T.F = F * mix(0.75, 1.0, wet); T.rough = rough;
  return T;
}

// ---------- condensation on the outer wall (rendered each frame into uCond) ----------
vec4 condense(vec3 p, float lod) {
  return textureLod(uCond, vec2(atan(p.z, p.x) / TAU + 0.5, p.y / G_H), lod);
}
// ===== Main ray tracer, part B: path through glass / whiskey / ice =====
const int END_ENV = 0, END_TABLE = 1;

struct Path { vec3 col; vec3 thr; vec3 p; vec3 rd; int end; float depth; bool glass; };

float erfA(float x) { float a = abs(x), t = 1.0 / (1.0 + 0.47047 * a); return sign(x) * (1.0 - t * (0.3480242 + t * (-0.0958798 + t * 0.7478556)) * exp(-a * a)); }
float phaseHG(float c, float g) { float g2 = g * g; return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5)); }

bool isOuterWall(vec3 p) { return glassSD(p).y > 0.1 && p.y > 0.3 && p.y < G_H - 0.2; }

vec3 reflEnvTable(vec3 p, vec3 dir, float blur) {
  if (dir.y < -0.002) {
    float t = -p.y / dir.y;
    vec3 q = p + dir * t;
    TableS ts = shadeTable(q, dir, 0.05 + t * 0.01);
    return ts.col + ts.F * envColor(reflect(dir, ts.n), 0.5);
  }
  return envColor(dir, blur);
}

// absorption, single scattering and cloudy ice cores along one straight segment
void segment(inout Path P, int med, int iceCur, vec3 p, vec3 rd, float t, bool primary) {
  if (med == M_AIR || t <= 0.0) return;
  if (med == M_GLASS) { P.thr *= exp(-SIG_GLASS * t); return; }
  vec3 mid = p + rd * (t * 0.5);
  vec3 L; float dl; vec3 E = lightAt(mid, L, dl);
  if (med == M_WHISKEY) {
    int id; float di = sdIce(mid, id);
    float dil = uMelt * 0.55 * exp(-max(di, 0.0) * 1.2) * (0.6 + 0.6 * sin(mid.x * 1.9 + 1.3 * sin(mid.y * 2.3 + uTime * 0.05)) * sin(mid.z * 1.7 + 1.1 * sin(mid.x * 2.1 - uTime * 0.04)));
    dil += 0.22 * uMelt * smoothstep(uLevel - 1.4, uLevel, mid.y);           // lighter meltwater layer on top
    vec3 sig = SIG_WHISKEY * (1.0 - min(dil, 0.75));
    vec3 Tv = exp(-sig * t);
    float lp = max(uLevel - mid.y, 0.0) / max(L.y, 0.3) + 0.4;
    vec3 sc = 0.010 * E * exp(-sig * lp) * phaseHG(dot(rd, L), 0.55);
    P.col += P.thr * sc * (1.0 - Tv) / max(sig, vec3(1e-3));
    P.thr *= Tv;
    return;
  }
  // ice: cloudy freezer core as a Gaussian ellipsoid (integrated in closed form) + one internal fracture plane
  P.thr *= exp(-SIG_ICE * t);
  if (!primary) return;
  vec3 q0 = uIceR[iceCur] * (p - uIceP[iceCur]);
  vec3 qd = uIceR[iceCur] * rd;
  float sz = uIceS[iceCur].x;
  float under = step(mid.y, uLevel);
  vec3 Li = E * mix(vec3(1.0), exp(-SIG_WHISKEY * 1.6), under) * phaseHG(dot(rd, L), 0.3) * 1.3 + vec3(0.02, 0.016, 0.013);
  vec3 inv = 1.0 / (sz * vec3(0.52, 0.40, 0.52));
  vec3 a3 = qd * inv, b3 = q0 * inv;
  float A = dot(a3, a3), m = dot(a3, b3) / A, Cc = dot(b3, b3);
  float sa = sqrt(A);
  float I = 0.886227 / sa * exp(min(m * m * A - Cc, 0.0)) * (erfA(sa * (t + m)) - erfA(sa * m));
  vec3 qc = q0 + qd * clamp(-m, 0.0, t);
  float veil = 0.45 + 1.1 * vnoise3(qc * vec3(2.2, 4.5, 2.2) + float(iceCur) * 7.0);
  float Tr = exp(-1.5 * (1.0 - 0.55 * uMelt) * veil * I);
  P.col += P.thr * (1.0 - Tr) * Li * 0.35;
  P.thr *= Tr;
  vec3 cn = normalize(vec3(0.6, 0.3, -0.7) + vec3(0.5, -0.4, 0.6) * float(iceCur));
  float den = dot(qd, cn);
  float tp = (0.12 * sz - dot(q0, cn)) / (abs(den) < 1e-4 ? 1e-4 : den);
  if (tp > 0.0 && tp < t) {
    vec3 qp = q0 + qd * tp;
    float fr = smoothstep(0.9, 0.35, length(qp / sz)) * (0.55 + 0.45 * vnoise3(qp * 3.1 + float(iceCur) * 3.0));
    float k = fr * clamp(0.1 / max(abs(den), 0.06), 0.0, 1.0);       // fractures flash silver at grazing angles
    P.col += P.thr * k * (Li * 0.6 + envColor(transpose(uIceR[iceCur]) * reflect(qd, cn), 0.2) * 0.5);
    P.thr *= 1.0 - 0.12 * k;
  }
}

Path tracePath(vec3 ro, vec3 rd, int maxB, int maxS, bool primary) {
  Path P;
  P.col = vec3(0.0); P.thr = vec3(1.0); P.end = END_ENV; P.depth = 1e4; P.glass = false;
  float tTab = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  vec2 tb = iCylY(ro, rd, B_R, 0.0, B_H);
  bool enter = tb.x < tb.y && tb.y > 0.0 && tb.x < tTab;
  vec3 p = enter ? ro + rd * max(tb.x, 0.0) : ro;
  float tAcc = enter ? max(tb.x, 0.0) : 0.0;
  int med = M_AIR, iceCur = 0, steps = 0, nTir = 0;
  vec3 rfP = vec3(0.0), rfD = vec3(0.0), rfW = vec3(0.0); float rfBlur = 0.0;
  if (enter) {
    for (int b = 0; b < 16; b++) {
      if (b >= maxB) break;
      float tmax = 30.0;
      if (med == M_AIR) { vec2 e = iCylY(p, rd, B_R, -1.0, B_H); tmax = max(e.y, 0.0); }
      if (rd.y < 0.0) tmax = min(tmax, -p.y / rd.y);
      int kind = 0, iid = 0;
      float t = 0.0; bool hit = false;
      for (int i = 0; i < 160; i++) {
        if (steps >= maxS) break;
        steps++;
        float d = sdInterfaces(p + rd * t, rd, kind, iid);
        if (d < EPS) { hit = true; break; }
        t += d;
        if (t >= tmax) { t = tmax; break; }
      }
      segment(P, med, iceCur, p, rd, t, primary);
      p += rd * t;
      if (!hit) break;
      if (primary && P.depth > 1e3) P.depth = tAcc + t;
      if (max(P.thr.r, max(P.thr.g, P.thr.b)) < 0.012) { P.thr = vec3(0.0); break; }
      tAcc += t;

      vec3 n = interfaceNormal(p, kind, iid);
      if (dot(n, rd) > 0.0) n = -n;
      int other = otherMedium(p, rd, kind, med);
      if (other == med) { p += rd * (EPS * 4.0); continue; }
      P.glass = true;

      float eta = iorOf(med) / iorOf(other);
      vec3 ns = n;
      float fog = 0.0;
      bool outer = kind == K_GLASS && (med == M_AIR || other == M_AIR) && isOuterWall(p);
      if (outer) {
        vec4 cd = condense(p, log2(max((tAcc + 1.0) * uPixAng / 0.0124, 1.0)));
        vec3 N0 = normalize(vec3(p.x, 0.0, p.z));
        vec3 Tg = vec3(-N0.z, 0.0, N0.x);
        float s = sign(dot(n, N0));
        fog = cd.z;
        ns = normalize(n - s * (cd.x * Tg + cd.y * vec3(0.0, 1.0, 0.0)));
      }
      else if (kind == K_ICE) {
        vec3 q = uIceR[iid] * (p - uIceP[iid]);
        float fr = (1.0 - uMelt) * step(liquidH(p), p.y);                        // frosty where dry
        vec3 q3 = q * 3.0 + float(iid) * 7.0, q11 = q * 11.0;
        vec3 bn = (vec3(vnoise3(q3), vnoise3(q3 + 5.1), vnoise3(q3 + 9.7)) - 0.5) * 0.12
                + (vec3(vnoise3(q11), vnoise3(q11 + 3.3), vnoise3(q11 + 6.6)) - 0.5) * (0.02 + 0.06 * fr);
        ns = normalize(n + bn);
      }
      float cosi = -dot(rd, ns);
      if (cosi < 0.03) { ns = n; cosi = -dot(rd, n); }
      float F = fresnel(cosi, eta);
      vec3 rr = reflect(rd, ns);
      vec3 rt = refract(rd, ns, eta);

      if (med == M_AIR) {                                          // key-light glint
        vec3 L; float dl; vec3 E = lightAt(p, L, dl);
        float rough = outer ? mix(0.02, 0.3, fog) : (kind == K_ICE ? 0.08 : 0.015);
        float Fh = fresnel(dot(normalize(L - rd), L), eta);
        P.col += P.thr * E * Fh * ggxSpec(ns, -rd, L, rough, dl);
      }
      if (dot(rt, rt) < 1e-6) {                                     // total internal reflection
        if (++nTir > 3) { P.thr *= 0.6; break; }                   // light trapped in the base: stop chasing it
        rd = rr; p += n * (EPS * 2.0); continue;
      }

      if (b == 0 && primary && med == M_AIR) { rfP = p; rfD = rr; rfW = P.thr * F; rfBlur = fog * 0.8; }   // shaded after the loop
      else P.col += P.thr * F * (med == M_AIR ? envColor(rr, 0.3) : envColor(rr, 0.4) * exp(-sigmaOf(med) * 2.0));
      P.thr *= 1.0 - F;

      if (fog > 0.0) {                                             // frosted micro-droplets scatter light
        vec3 L; float dl; vec3 E = lightAt(p, L, dl);
        vec3 N0 = normalize(vec3(p.x, 0.0, p.z));
        float wrap = max(dot(N0, L) * 0.6 + 0.4, 0.0);
        P.col += P.thr * fog * (E * wrap * 0.010 + vec3(0.003, 0.0025, 0.0022));
        P.thr *= 1.0 - 0.3 * fog;
      }

      rd = rt;
      p -= n * (EPS * 2.0);
      if (other == M_ICE) iceCur = iid;
      if (other == M_WHISKEY && uMelt > 0.02) {                  // schlieren where meltwater mixes in
        vec3 w = sin(p.zxy * 2.1 + 1.4 * sin(p.yzx * 1.7 + uTime * 0.05)) * 0.5;
        rd = normalize(rd + w * 0.05 * uMelt);
      }
      med = other;
    }
  }
  if (rfW.r + rfW.g + rfW.b > 0.0) P.col += rfW * reflEnvTable(rfP, rfD, rfBlur);
  P.p = p; P.rd = rd;
  if (rd.y < 0.0) {
    float t = -p.y / rd.y;
    P.p = p + rd * t;
    P.end = END_TABLE;
    if (primary && P.depth > 1e3) P.depth = tAcc + t;
  }
  return P;
}

void main() {
  vec2 ndc = (2.0 * (gl_FragCoord.xy + uJitter) - uRes) / uRes.y;
  vec3 rd = normalize(uCamRot * vec3(ndc * uTanHalf, -1.0));
  Path P = tracePath(uCamPos, rd, 9, 220, true);
  vec3 col = P.col;
  if (P.end == END_TABLE) {
    float dist = length(P.p - uCamPos);
    float fp = dist * 2.0 * uTanHalf / uRes.y / max(abs(P.rd.y), 0.08);
    TableS ts = shadeTable(P.p, P.rd, fp);
    vec3 rr = reflect(P.rd, ts.n);
    vec3 R;
    if (!P.glass) {
      Path Q = tracePath(P.p + vec3(0.0, EPS * 2.0, 0.0), rr, 6, 90, false);
      R = Q.col + Q.thr * (Q.end == END_TABLE ? shadeTable(Q.p, Q.rd, 0.1).col : envColor(Q.rd, ts.rough * 2.0));
    } else {
      R = envColor(rr, ts.rough * 2.0);
    }
    col += P.thr * (ts.col + ts.F * R);
  } else {
    col += P.thr * envColor(P.rd, 0.0);
  }
  outColor = vec4(max(col, 0.0), P.depth);
}
</script>
<script type="x-shader" id="caustics-trace">
// ===== Caustics pass 1: trace one light ray per texel through the drink onto the bar =====
uniform int uGridN;
uniform float uCausHalf;
layout(location = 0) out vec4 oHit;   // landing x, z, valid
layout(location = 1) out vec4 oCol;   // transmittance

void main() {
  int ix = int(gl_FragCoord.x), iz = int(gl_FragCoord.y);
  vec2 g = (vec2(ix, iz) / float(uGridN - 1) * 2.0 - 1.0) * uCausHalf;
  vec3 ro = uLightPos;
  vec3 rd = normalize(vec3(g.x, 0.0, g.y) - ro);
  vec3 thr = vec3(1.0);
  float valid = 1.0;
  int fails = 0;
  vec2 hitXZ = g;
  vec2 tb = iCylY(ro, rd, B_R, 0.0, B_H);
  if (tb.x < tb.y && tb.y > 0.0) {
    vec3 p = ro + rd * max(tb.x, 0.0);
    int med = M_AIR, steps = 0;
    fails = 0;
    for (int b = 0; b < 12; b++) {
      float tmax = 30.0;
      if (med == M_AIR) { vec2 e = iCylY(p, rd, B_R, -1.0, B_H); tmax = max(e.y, 0.0); }
      if (rd.y < 0.0) tmax = min(tmax, -p.y / rd.y);
      int kind = 0, iid = 0;
      float t = 0.0; bool hit = false;
      for (int i = 0; i < 96; i++) {
        if (steps >= 150) break;
        steps++;
        float d = sdInterfaces(p + rd * t, rd, kind, iid);
        if (d < EPS) { hit = true; break; }
        t += d;
        if (t >= tmax) { t = tmax; break; }
      }
      thr *= exp(-sigmaOf(med) * t);
      p += rd * t;
      if (!hit) { if (med != M_AIR) fails = 1; break; }
      if (b == 11) fails = 2;
      vec3 n = interfaceNormal(p, kind, iid);
      if (dot(n, rd) > 0.0) n = -n;
      int other = otherMedium(p, rd, kind, med);
      if (other == med) { p += rd * (EPS * 4.0); continue; }
      float eta = iorOf(med) / iorOf(other);
      vec3 rt = refract(rd, n, eta);
      if (dot(rt, rt) < 1e-6) { rd = reflect(rd, n); p += n * (EPS * 2.0); continue; }
      thr *= 1.0 - fresnel(-dot(rd, n), eta);
      rd = rt; p -= n * (EPS * 2.0); med = other;
    }
    if (rd.y > -1e-4 || fails > 0) { valid = 0.0; }
    else { hitXZ = (p + rd * (-p.y / rd.y)).xz; }
  }
  oHit = vec4(hitXZ, valid, 0.0);
  oCol = vec4(thr, 1.0);
}

<script type="x-shader" id="caustics-vs">
// ===== Caustics pass 2: splat the traced grid as a mesh (attribute-less) =====
uniform int uGridN;
uniform float uCausHalf;
uniform highp sampler2D uRayHit;
uniform highp sampler2D uRayCol;
out vec2 vOld;
out vec2 vNew;
out vec3 vCol;
out float vValid;
void main() {
  ivec2 id = ivec2(gl_VertexID % uGridN, gl_VertexID / uGridN);
  vec4 h = texelFetch(uRayHit, id, 0);
  vOld = (vec2(id) / float(uGridN - 1) * 2.0 - 1.0) * uCausHalf;
  vNew = h.xy;
  vValid = h.z;
  vCol = texelFetch(uRayCol, id, 0).rgb;
  gl_Position = vec4(h.xy / uCausHalf, 0.0, 1.0);
}
</script>
<script type="x-shader" id="caustics-fs">
// energy conservation: a grid cell's light lands on the area its rays now cover
in vec2 vOld;
in vec2 vNew;
in vec3 vCol;
in float vValid;
out vec4 o;
void main() {
  if (vValid < 0.999) discard;
  float oldA = abs(determinant(mat2(dFdx(vOld), dFdy(vOld))));
  float newA = abs(determinant(mat2(dFdx(vNew), dFdy(vNew))));
  float ratio = oldA / max(newA, 1e-14);
  if (ratio < 0.015) discard;                 // degenerate sliver across a discontinuity
  o = vec4(vCol * min(ratio, 40.0), 1.0);
}
</script>
<script type="x-shader" id="taa">
// ===== Temporal anti-aliasing: reproject last frame through the first-hit depth, clamp, blend =====
uniform sampler2D uCur;      // jittered scene (rgb, a = first-hit distance)
uniform sampler2D uHist;     // previous TAA output
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform mat3 uCamRot;
uniform vec3 uPrevPos;
uniform mat3 uPrevRot;
uniform float uTanHalf;
uniform float uReset;
out vec4 o;
vec3 toY(vec3 c) { return vec3(dot(c, vec3(0.25, 0.5, 0.25)), dot(c, vec3(0.5, 0.0, -0.5)), dot(c, vec3(-0.25, 0.5, -0.25))); }
vec3 fromY(vec3 y) { return vec3(y.x + y.y - y.z, y.x + y.z, y.x - y.y - y.z); }
void main() {
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec4 c = texelFetch(uCur, ip, 0);
  // neighbourhood statistics in YCoCg (tonemapped to tame fireflies)
  vec3 m1 = vec3(0.0), m2 = vec3(0.0), lo = vec3(1e9), hi = vec3(-1e9);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec3 s = texelFetch(uCur, clamp(ip + ivec2(i, j), ivec2(0), ivec2(uRes) - 1), 0).rgb;
    vec3 y = toY(s / (1.0 + dot(s, vec3(0.299, 0.587, 0.114))));
    m1 += y; m2 += y * y; lo = min(lo, y); hi = max(hi, y);
  }
  m1 /= 9.0; m2 /= 9.0;
  vec3 sd = sqrt(max(m2 - m1 * m1, 0.0));
  lo = max(lo, m1 - 1.25 * sd); hi = min(hi, m1 + 1.25 * sd);
  // reproject
  vec2 ndc = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  vec3 P = uCamPos + normalize(uCamRot * vec3(ndc * uTanHalf, -1.0)) * min(c.a, 5000.0);
  vec3 lp = transpose(uPrevRot) * (P - uPrevPos);
  vec2 pn = lp.xy / max(-lp.z, 1e-4) / uTanHalf;
  vec2 puv = (pn * uRes.y + uRes) * 0.5 / uRes;
  vec3 cy = toY(c.rgb / (1.0 + dot(c.rgb, vec3(0.299, 0.587, 0.114))));
  float alpha = 0.1;
  vec3 hy = cy;
  if (uReset < 0.5 && lp.z < 0.0 && all(greaterThan(puv, vec2(0.0))) && all(lessThan(puv, vec2(1.0)))) {
    vec3 h = texture(uHist, puv).rgb;
    hy = clamp(toY(h / (1.0 + dot(h, vec3(0.299, 0.587, 0.114)))), lo, hi);
    float motion = length((puv - gl_FragCoord.xy / uRes) * uRes);
    alpha = mix(0.1, 0.25, smoothstep(0.5, 6.0, motion));
  } else alpha = 1.0;
  vec3 y = mix(hy, cy, alpha);
  vec3 rgb = fromY(y);
  rgb /= max(1.0 - dot(rgb, vec3(0.299, 0.587, 0.114)), 1e-3);     // undo the tonemap
  o = vec4(max(rgb, 0.0), c.a);
}

<script type="x-shader" id="dof">
// ===== Depth of field: scatter-as-gather bokeh (alpha carries depth) =====
uniform sampler2D uScene;
uniform vec2 uTexel;
uniform float uFocus;
uniform float uAperture;   // CoC in px at infinity
uniform float uMaxCoc;
out vec4 o;
float coc(float z) { return min(uAperture * abs(z - uFocus) / max(z, 1e-3), uMaxCoc); }
void main() {
  vec2 uv = gl_FragCoord.xy * uTexel;
  vec4 c0 = texture(uScene, uv);
  float cz = c0.a, cs = coc(cz);
  vec3 acc = c0.rgb; float tot = 1.0;
  float radius = 0.8;
  vec3 hp = fract(vec3(gl_FragCoord.xyx) * 0.1031); hp += dot(hp, hp.yzx + 33.33);
  float rot = fract((hp.x + hp.y) * hp.z) * 6.2831853;            // per-pixel spiral rotation: no star patterns
  for (int i = 0; i < 120; i++) {
    if (radius >= uMaxCoc) break;
    float ang = float(i) * 2.39996323 + rot;
    vec4 s = texture(uScene, uv + vec2(cos(ang), sin(ang)) * uTexel * radius);
    float ss = coc(s.a);
    if (s.a > cz) ss = min(ss, cs * 2.0);
    float m = smoothstep(radius - 0.5, radius + 0.5, ss);
    acc += mix(acc / tot, s.rgb, m);
    tot += 1.0;
    radius += 1.6 / radius;
  }
  o = vec4(acc / tot, 1.0);
}

<script type="x-shader" id="final">
// ===== Bloom, filmic tone map, grade, vignette, grain =====
uniform sampler2D uImg;
uniform vec2 uRes;
uniform float uTime;
uniform float uExposure;
out vec4 o;
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 tap4(vec2 uv, float lod) {
  vec2 d = exp2(lod) / uRes;
  return 0.25 * (textureLod(uImg, uv + vec2(d.x, d.y), lod).rgb + textureLod(uImg, uv + vec2(-d.x, d.y), lod).rgb +
                 textureLod(uImg, uv + vec2(d.x, -d.y), lod).rgb + textureLod(uImg, uv - d, lod).rgb);
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 cc = uv - 0.5;
  float ca = dot(cc, cc) * 0.006;
  vec3 c = vec3(texture(uImg, uv - cc * ca).r, texture(uImg, uv).g, texture(uImg, uv + cc * ca).b);
  vec2 px = 1.0 / vec2(textureSize(uImg, 0));                          // gentle unsharp mask at scene resolution
  vec3 nb = 0.25 * (texture(uImg, uv + vec2(px.x, 0)).rgb + texture(uImg, uv - vec2(px.x, 0)).rgb +
                    texture(uImg, uv + vec2(0, px.y)).rgb + texture(uImg, uv - vec2(0, px.y)).rgb);
  c = max(c + (c - nb) * 0.35 / (1.0 + dot(abs(c - nb), vec3(0.33))), 0.0);
  vec3 bl = tap4(uv, 2.0) * 0.45 + tap4(uv, 4.0) * 0.35 + textureLod(uImg, uv, 6.0).rgb * 0.2;
  c += max(bl - 0.02, 0.0) * 0.14 * vec3(1.0, 0.85, 0.7);
  c *= uExposure;
  c = aces(c);
  c = pow(c, vec3(1.0 / 2.2));
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(c, c * vec3(1.03, 1.0, 0.94), smoothstep(0.2, 0.9, lum));        // warm highlights
  c = mix(vec3(lum), c, 1.06);
  c *= 1.0 - 0.55 * pow(length(cc * vec2(1.0, 0.85)) * 1.25, 2.6);          // vignette
  float gr = hash12(gl_FragCoord.xy + fract(uTime * 7.31) * 913.0) - 0.5;
  c += gr * 0.022;
  o = vec4(clamp(c, 0.0, 1.0), 1.0);
}

<script type="x-shader" id="env">
// ===== Background bake: a dim back bar seen far out of focus (equirect, rendered once) =====
uniform vec2 uSize;
out vec4 o;
vec3 bokehPal(float h) {
  if (h < 0.45) return vec3(1.0, 0.56, 0.22);
  if (h < 0.72) return vec3(1.0, 0.74, 0.44);
  if (h < 0.90) return vec3(0.95, 0.32, 0.12);
  return vec3(0.35, 0.60, 0.78);
}
vec3 bokehLayer(float az, float el, float cells, float elMin, float elMax, float seed, float dens) {
  vec2 g = vec2(az * cells, el * cells / TAU);
  vec2 id = floor(g), f = fract(g);
  vec3 acc = vec3(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 cid = id + vec2(i, j);
    float elc = (cid.y + 0.5) * TAU / cells;
    if (elc < elMin || elc > elMax) continue;
    vec2 wid = vec2(mod(cid.x, cells), cid.y);
    vec3 h = hash32(wid + seed);
    if (h.z > dens) continue;
    vec2 dv = vec2(i, j) + 0.5 + (h.xy - 0.5) * 0.7 - f;
    float dd = length(dv);
    float rad = 0.18 + 0.22 * hash12(wid + seed + 7.0);
    float disk = smoothstep(rad, rad * 0.9, dd);
    float rim = 1.0 + 0.6 * smoothstep(rad * 0.4, rad * 0.97, dd);
    float tex = 0.92 + 0.08 * vnoise(dv * 9.0 + h.xy * 50.0);
    float b = 0.05 + 0.95 * pow(hash12(wid + seed + 5.0), 4.0);
    acc += disk * rim * tex * b * bokehPal(hash12(wid + seed + 3.0));
  }
  return acc;
}
// back-lit shelves with bottles standing in front of the strip light (all far out of focus)
vec3 shelves(float az, float el) {
  vec3 c = vec3(0.0);
  for (int k = 0; k < 2; k++) {
    float y0 = k == 0 ? 0.075 : 0.215, w = k == 0 ? 0.034 : 0.028;
    float band = exp(-pow((el - y0) / w, 2.0));
    if (band < 1e-3) continue;
    float n = 95.0 + 30.0 * float(k);
    float x = az * n + float(k) * 17.0 + 0.35 * sin(az * 23.0 + float(k));   // uneven spacing
    float id = floor(x), f = fract(x);
    vec3 h = hash32(vec2(id, 5.0 + float(k)));
    float hw = 0.18 + 0.22 * h.z;                                     // bottle half-width (cell units)

// ===== Condensation map: drops, runners and fog unrolled around the glass (u: angle, v: height) =====
// output xy: height-field slope (along circumference, up), z: fog density, w: drop coverage
uniform vec2 uSize;
out vec4 o;

const float CIRC = TAU * G_R0;

// one layer of randomly placed drops (spherical caps); the tallest cap under the texel wins
void drops(vec2 uv, float cs0, float seed, float dens, float r0, float r1, inout float best, inout vec2 slope, inout float clear) {
  float N = floor(CIRC / cs0), cs = CIRC / N;
  vec2 g = uv / cs, id = floor(g);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 c = id + vec2(i, j);
    vec2 wc = vec2(mod(c.x, N), c.y);
    vec3 h = hash32(wc * 1.731 + seed);
    float cl = vnoise(wc * cs * 0.9 + seed) * 1.6;              // clustered, not gridded
    if (h.z > dens * cl) continue;
    vec2 ctr = (c + 0.5 + (h.xy - 0.5) * 0.9) * cs;
    float r = mix(r0, r1, h.x * h.x * h.y);
    vec2 dv = uv - ctr; float dd = length(dv);
    clear = max(clear, smoothstep(r * 1.9, r * 1.2, dd));
    if (dd < r) {
      float ht = sqrt(r * r - dd * dd) * 0.62;
      if (ht > best) { best = ht; slope = -dv / sqrt(max(r * r - dd * dd, r * r * 0.02)) * 0.62; }
    }
  }
}

vec4 condenseUV(vec2 uv) {
  float y = uv.y;
  float cold = smoothstep(uLevel + 0.9, uLevel - 0.25, y);
  float above = 0.12 * smoothstep(G_H - 0.9, uLevel + 1.0, y);
  float grow = smoothstep(-25.0, 55.0, uTime);
  float age = 1.0 + 0.8 * smoothstep(30.0, 400.0, uTime);       // drops keep growing
  float dens = (cold * 0.85 + above) * (0.35 + 0.65 * grow);
  vec2 slope = vec2(0.0); float best = 0.0, clear = 0.0, dummy = 0.0;

  drops(uv, 0.075, 0.37, dens * 0.9, 0.008, 0.030 * age, best, slope, dummy);
  drops(uv, 0.15, 4.10, dens * 0.6, 0.020, 0.060 * age, best, slope, dummy);
  drops(uv, 0.36, 9.30, dens * 0.55 * grow, 0.045, 0.13 * age, best, slope, clear);

  // runners: a heavy drop breaks loose, slides down in stick-slip jerks and wipes a trail through the fog
  {
    float N = floor(CIRC / 0.8), cw = CIRC / N;
    float col = floor(uv.x / cw), cx = (fract(uv.x / cw) - 0.5) * cw;
    float wc = mod(col, N);
    vec3 h = hash32(vec2(wc, 7.7));
    float period = 26.0 + 34.0 * h.x;
    float tt = uTime + h.y * period;
    float cyc = floor(tt / period), lt = tt - cyc * period;
    vec3 h2 = hash32(vec2(wc, cyc + 3.0));
    float live = step(h2.z, 0.42) * smoothstep(25.0, 60.0, uTime);
    float y0 = mix(uLevel - 0.7, uLevel + 0.4, h2.x);
    float dur = 5.0 + 7.0 * h2.y;
    float t0 = 4.0 + fract(h2.z * 7.13) * (period - dur - 8.0);
    float s = clamp((lt - t0) / dur, 0.0, 1.0);
    float prog = s - sin(s * TAU * 3.0) / (TAU * 3.0) * 0.85;      // stick-slip
    float yd = mix(y0, 0.4, prog);
    float xo = (h2.y - 0.5) * 0.4 * cw + 0.06 * sin(y * 2.3 + h2.x * 6.0) + 0.03 * sin(y * 5.1 + h2.y * 9.0);
    float rr = (0.10 + 0.06 * fract(h2.x * 5.3)) * smoothstep(t0 - 5.0, t0, lt) * live;
    vec2 dv = vec2(cx - xo, y - yd);
    dv.y *= dv.y > 0.0 ? 0.78 : 1.3;                                // teardrop, heavy at the bottom
    float dd = length(dv);
    if (dd < rr) {
      float ht = sqrt(rr * rr - dd * dd) * 0.62;
      if (ht > best) { best = ht; slope = -dv / sqrt(max(rr * rr - dd * dd, rr * rr * 0.02)) * 0.66; }
    }
    // trail: cleared where the drop passed, re-fogging over ~12 s
    float passT = t0 + dur * clamp((y0 - y) / max(y0 - 0.4, 0.1), 0.0, 1.0);
    float fresh = smoothstep(12.0, 0.0, lt - passT) * step(passT, lt);
    float tw = (0.55 + 0.35 * vnoise(vec2(y * 3.0, wc))) * rr;
    float trail = smoothstep(tw, tw * 0.5, abs(cx - xo)) * step(yd, y) * step(y, y0 + 0.05) * fresh * live;
    clear = max(clear, trail);
    float by = floor(y / 0.19);
    vec3 hb = hash32(vec2(wc * 3.1 + by, cyc));
    vec2 bv = vec2(cx - xo - (hb.x - 0.5) * tw, (fract(y / 0.19) - 0.5) * 0.19);
    float br = 0.015 + 0.03 * hb.y, bd = length(bv);
    if (trail > 0.4 && hb.z < 0.5 && bd < br) {
      float ht = sqrt(br * br - bd * bd) * 0.62;
      if (ht > best) { best = ht; slope = -bv / sqrt(max(br * br - bd * bd, br * br * 0.02)) * 0.6; }
    }
  }
  float sm = length(slope);
  if (sm > 2.6) slope *= 2.6 / sm;
  float cover = best > 0.0 ? 1.0 : 0.0;
  float fog = cold * grow * (1.0 - clear) * (1.0 - cover) * mix(0.22, 0.42, smoothstep(G_BASE - 0.2, G_BASE + 0.6, y));
  vec2 fz = vec2(vnoise(vec2(uv.x * 14.8, y * 15.0)), vnoise(vec2(uv.x * 14.8 + 7.0, y * 15.0 + 3.0))) - 0.5;
  slope += fz * fog * 0.5;                                          // micro-droplet frosting
  return vec4(slope, fog, cover);
}

void main() {
  vec2 f = gl_FragCoord.xy / uSize;
  o = condenseUV(vec2(f.x * CIRC, f.y * G_H));
}

<script>
'use strict';
// ===== WebGL2 plumbing: programs, render targets, passes =====
const $ = id => document.getElementById(id);
const canvas = $('c');

const COMMON = src('common');

  caus: program(HEAD + src('caustics-vs'), HEAD + src('caustics-fs'), 'caustics'),
  taa: program(VS_TRI, HEAD + src('taa'), 'taa'),

function makeTarget(w, h, mip) {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST); return t; };
  const hit = mk(gl.RGBA32F), col = mk(gl.RGBA16F), fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);

  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, col, 0);

for (let z = 0, k = 0; z < GRID - 1; z++) for (let x = 0; x < GRID - 1; x++) {
  const a = z * GRID + x, b = a + 1, c = a + GRID, d = c + 1;

const condT = makeTarget(2048, 768, true);
gl.bindTexture(gl.TEXTURE_2D, condT.tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);

  gl.bindFramebuffer(gl.FRAMEBUFFER, condT.fb);
  gl.viewport(0, 0, condT.w, condT.h);

gl.bindTexture(gl.TEXTURE_2D, envT.tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);

  gl.bindFramebuffer(gl.FRAMEBUFFER, envT.fb);
  gl.viewport(0, 0, envT.w, envT.h);
  const p = progs.env; gl.useProgram(p);
  gl.uniform2f(p.u('uSize'), envT.w, envT.h);
  gl.bindVertexArray(vaoTri);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindTexture(gl.TEXTURE_2D, envT.tex);
  gl.generateMipmap(gl.TEXTURE_2D);

// ---- sizing / dynamic resolution ----
const view = { w: 1, h: 1, scale: qn('scale', 0.75), fixed: Q.has('scale'), scene: null, dof: null, hist: [], hi: 0, reset: true, taaOut: null };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(2, Math.round(canvas.clientWidth * dpr)), h = Math.max(2, Math.round(canvas.clientHeight * dpr));
  if (w !== canvas.width || h !== canvas.height) { canvas.width = w; canvas.height = h; }
  const sw = Math.max(2, Math.round(w * view.scale)), sh = Math.max(2, Math.round(h * view.scale));
  if (!view.scene || view.scene.w !== sw || view.scene.h !== sh) {

function setCommon(p, st) {

  const T = view.scene;
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb);
  gl.viewport(0, 0, T.w, T.h);
  const p = progs.scene; gl.useProgram(p);
  setCommon(p, st);
  gl.uniform2f(p.u('uRes'), T.w, T.h);
  gl.uniform3fv(p.u('uCamPos'), cam.pos);

  gl.uniform1f(p.u('uCausHalf'), CAUS_HALF);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, caus.tex);
  gl.uniform1i(p.u('uCaustic'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, envT.tex);
  gl.uniform1i(p.u('uEnv'), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, condT.tex);
  gl.uniform1i(p.u('uCond'), 2);
  gl.uniform1f(p.u('uPixAng'), 2 * cam.tanHalf / T.h);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindVertexArray(vaoTri);

function renderPost(st, cam) { renderTAA(cam); postDof(cam); postMip(); postFinal(st); }

  gl.bindFramebuffer(gl.FRAMEBUFFER, W.fb);
  gl.viewport(0, 0, W.w, W.h);

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, R.tex); gl.uniform1i(p.u('uHist'), 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.tex); gl.uniform1i(p.u('uCur'), 0);
  gl.uniform2f(p.u('uRes'), S.w, S.h);

  gl.uniformMatrix3fv(p.u('uCamRot'), false, cam.rot);
  gl.uniform3fv(p.u('uPrevPos'), cam.prevPos);
  gl.uniformMatrix3fv(p.u('uPrevRot'), false, cam.prevRot);

  gl.viewport(0, 0, D.w, D.h);
  const p = progs.dof; gl.useProgram(p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.tex);
  gl.uniform1i(p.u('uScene'), 0);
  gl.uniform2f(p.u('uTexel'), 1 / S.w, 1 / S.h);
  gl.uniform1f(p.u('uFocus'), cam.focus);
  gl.uniform1f(p.u('uAperture'), cam.aperture * S.h);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, view.dof.tex);
  gl.generateMipmap(gl.TEXTURE_2D);
}
function postFinal(st) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, view.w, view.h);
  const p = progs.final; gl.useProgram(p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, view.dof.tex);
  gl.uniform1i(p.u('uImg'), 0);
  gl.uniform2f(p.u('uRes'), view.w, view.h);
  gl.uniform1f(p.u('uTime'), st.time);
  gl.uniform1f(p.u('uExposure'), qn('exposure', 5.0));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
// ===== Ice simulation, camera, main loop =====
const TAU = Math.PI * 2;
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// rotation (local -> world) as 3 column axes: Ry(yaw) * Rx(ax) * Rz(az)
function axesFrom(yaw, ax, az) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(ax), sx = Math.sin(ax), cz = Math.cos(az), sz = Math.sin(az);
  const Ry = v => [cy * v[0] + sy * v[2], v[1], -sy * v[0] + cy * v[2]];
  const Rx = v => [v[0], cx * v[1] - sx * v[2], sx * v[1] + cx * v[2]];
  const Rz = v => [cz * v[0] - sz * v[1], sz * v[0] + cz * v[1], v[2]];
  return [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map(e => Ry(Rx(Rz(e))));
}

// separating-axis overlap of two boxes: returns penetration depth (0 if apart)
function boxPen(ca, A, ea, cb, B, eb) {
  const axes = [...A, ...B];
  for (const a of A) for (const b of B) { const c = V.cross(a, b), l = Math.hypot(...c); if (l > 1e-3) axes.push(V.mul(c, 1 / l)); }
  const d = V.sub(cb, ca);
  let pen = Infinity;
  for (const L of axes) {
    const ra = ea[0] * Math.abs(V.dot(A[0], L)) + ea[1] * Math.abs(V.dot(A[1], L)) + ea[2] * Math.abs(V.dot(A[2], L));
    const rb = eb[0] * Math.abs(V.dot(B[0], L)) + eb[1] * Math.abs(V.dot(B[1], L)) + eb[2] * Math.abs(V.dot(B[2], L));
    const p = ra + rb - Math.abs(V.dot(d, L));
    if (p <= 0) return 0;
    pen = Math.min(pen, p);
  }
  return pen;
}

const ICE = [
  { th: 0.25, rho: 1.95, s: [1.21, 1.17, 1.19], lift: 0.30, rx: 0.10, rz: -0.30, yaw: 0.20 },
  { th: 2.35, rho: 1.90, s: [1.12, 1.10, 1.13], lift: 0.62, rx: -0.34, rz: 0.12, yaw: -0.45 },
  { th: 4.30, rho: 1.92, s: [1.08, 1.07, 1.10], lift: 0.18, rx: 0.05, rz: 0.08, yaw: 0.65 },
].map(c => ({ ...c, pos: null, ox: 0, oz: 0, ol: 0, tx: 0, tz: 0, tl: 0 }));

const st = {
  time: 0, melt: 0, level: 4.55,
  iceP: new Float32Array(9), iceR: new Float32Array(27), iceS: new Float32Array(12), rip: new Float32Array(16).fill(-100),
};
let ripIdx = 0, nextSettle = 6 + rnd() * 6;

function simulate(t, dt) {
  st.time = t;
  const m = Q.has('melt') ? clamp(qn('melt', 0), 0, 1) : 1 - Math.exp(-t / 240);
  st.melt = m;
  st.level = 4.55 + 0.12 * m;
  const k = 1 - 0.24 * m;
  const spin = 0.006 * t;

  if (t > nextSettle && dt > 0) {                      // a cube slips and settles
    nextSettle = t + 8 + rnd() * 13;
    const c = ICE[(rnd() * 3) | 0];
    c.tx = clamp(c.tx + (rnd() - 0.5) * 0.28, -0.2, 0.2);
    c.tz = clamp(c.tz + (rnd() - 0.5) * 0.28, -0.2, 0.2);
    c.tl = clamp(c.tl + (rnd() - 0.5) * 0.16, -0.1, 0.12);
    if (c.pos) { st.rip.set([c.pos[0], c.pos[2], t, 0.018 + rnd() * 0.012], ripIdx * 4); ripIdx = (ripIdx + 1) % 4; }
  }
  const ease = 1 - Math.exp(-dt * 2.6);
  const boxes = ICE.map((c, i) => {
    c.ox += (c.tx - c.ox) * ease; c.oz += (c.tz - c.oz) * ease; c.ol += (c.tl - c.ol) * ease;
    const th = c.th + spin + 0.03 * Math.sin(t * 0.11 + i * 2.0);
    const rho = c.rho * (1 - 0.05 * m);
    const e = c.s.map(v => v * k);
    const bob = 0.022 * Math.sin(t * 0.8 + i * 1.7) + 0.012 * Math.sin(t * 1.9 + i);
    const target = [rho * Math.cos(th), st.level - e[1] * 0.8 + (c.lift + c.ol) * k + bob, rho * Math.sin(th)];
    const A = axesFrom(-th + c.yaw + 0.02 * Math.sin(t * 0.37 + i), c.rx + c.ox + 0.015 * Math.sin(t * 0.53 + i * 3.0), c.rz + c.oz);
    if (!c.pos) c.pos = target.slice();
    const f = 1 - Math.exp(-dt * 3.0);
    c.pos = dt > 0 ? V.add(c.pos, V.mul(V.sub(target, c.pos), f)) : target.slice();
    return { c, A, e, r: Math.min(0.14 + 0.42 * m, 0.7 * Math.min(...e)) };
  });
  for (let it = 0; it < 4; it++) {                      // keep cubes apart and inside the glass
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
      const a = boxes[i], b = boxes[j];
      const pen = boxPen(a.c.pos, a.A, a.e.map(v => v * 0.97), b.c.pos, b.A, b.e.map(v => v * 0.97));
      if (pen > 0) {
        const d = V.norm([b.c.pos[0] - a.c.pos[0], 0, b.c.pos[2] - a.c.pos[2]]);
        a.c.pos = V.add(a.c.pos, V.mul(d, -pen * 0.5 - 0.004));
        b.c.pos = V.add(b.c.pos, V.mul(d, pen * 0.5 + 0.004));
      }
    }
    for (const b of boxes) {
      const p = b.c.pos, rh = Math.hypot(p[0], p[2]) || 1e-6, n = [p[0] / rh, 0, p[2] / rh];
      const sup = rh + b.e[0] * Math.abs(V.dot(b.A[0], n)) + b.e[1] * Math.abs(V.dot(b.A[1], n)) + b.e[2] * Math.abs(V.dot(b.A[2], n));
      const lim = 3.75 + 0.035 * p[1] - 0.07;
      if (sup > lim) b.c.pos = V.add(p, V.mul(n, lim - sup));
    }
  }
  boxes.forEach((b, i) => {
    st.iceP.set(b.c.pos, i * 3);
    const [a0, a1, a2] = b.A;                         // world->local = transpose, column-major
    st.iceR.set([a0[0], a1[0], a2[0], a0[1], a1[1], a2[1], a0[2], a1[2], a2[2]], i * 9);
    st.iceS.set([b.e[0], b.e[1], b.e[2], b.r], i * 4);
  });
}

// ---------- camera: orbit, drag to look, wheel / pinch to zoom, auto-orbit resumes when idle ----------
const cam = {
  az: qn('az', 0.75), el: qn('el', 0.07), dist: qn('dist', 25), distT: qn('dist', 25), fov: qn('fov', 30),
  T: [0, 4.3, 0], vAz: 0, vEl: 0, auto: Q.has('still') ? 0 : 1, last: -1e9,
  pos: new Float32Array(3), rot: new Float32Array(9), tanHalf: 0.27, focus: 20, aperture: qn('aperture', 0.02),
  prevPos: new Float32Array(3), prevRot: new Float32Array(9), jitter: new Float32Array(2),
};
const EL0 = cam.el, AUTO = TAU / 80, IDLE = 3.0;
const elMin = d => Math.asin(clamp((0.8 - cam.T[1]) / d, -1, 1));
const pointers = new Map();
let pinch0 = 0, pinchD = 0, nowS = 0, lastMove = 0;
const hint = $('hint');
let hintHidden = false;
function touched() {
  cam.last = nowS;
  if (!hintHidden) { hintHidden = true; setTimeout(() => hint.classList.add('hide'), 1200); }
}
const pinchLen = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic or already-released pointer */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { pinch0 = pinchLen(); pinchD = cam.distT; }
  cam.vAz = cam.vEl = 0;
  canvas.classList.add('drag'); touched();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    const k = 3.0 / Math.max(canvas.clientHeight, 320);
    cam.az += dx * k; cam.el += dy * k * 0.8;
    const dtm = Math.max(nowS - lastMove, 1 / 120); lastMove = nowS;
    cam.vAz = cam.vAz * 0.5 + 0.5 * clamp(dx * k / dtm, -6, 6);
    cam.vEl = cam.vEl * 0.5 + 0.5 * clamp(dy * k * 0.8 / dtm, -4, 4);
  } else if (pointers.size === 2) {
    cam.distT = cam.dist = clamp(pinchD * pinch0 / pinchLen(), 9, 70);
  }
  touched();
});
const release = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch0 = 0;
  if (pointers.size === 0) canvas.classList.remove('drag');
  else cam.vAz = cam.vEl = 0;
  if (nowS - lastMove > 0.08) cam.vAz = cam.vEl = 0;
  touched();
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  cam.distT = clamp(cam.distT * Math.exp(dy * 0.0012), 9, 70);
  touched();
}, { passive: false });

function updateCamera(dt) {
  const idle = pointers.size === 0 && nowS - cam.last > IDLE && !Q.has('still');
  cam.auto = clamp(cam.auto + (idle ? dt / 2.5 : -dt * 4), 0, 1);
  const a = cam.auto * cam.auto * (3 - 2 * cam.auto);
  if (pointers.size === 0) {                            // inertia after a flick
    cam.az += cam.vAz * dt; cam.el += cam.vEl * dt;
    const damp = Math.exp(-dt * 3.5); cam.vAz *= damp; cam.vEl *= damp;
  }
  cam.az += AUTO * a * dt;
  cam.el += (EL0 - cam.el) * (1 - Math.exp(-dt * 0.35)) * a;
  cam.dist += (cam.distT - cam.dist) * (1 - Math.exp(-dt * 8));
  const breathe = a * Math.sin(nowS * 0.21) * 0.5;
  const d = cam.dist + breathe;
  cam.el = clamp(cam.el, elMin(cam.dist), 1.25);
  const el = Math.max(cam.el + a * 0.01 * Math.sin(nowS * 0.29), elMin(d));
  const T = cam.T, ce = Math.cos(el);
  const pos = [T[0] + d * ce * Math.cos(cam.az), T[1] + d * Math.sin(el), T[2] + d * ce * Math.sin(cam.az)];
  const f = V.norm(V.sub(T, pos)), r = V.norm(V.cross(f, [0, 1, 0])), u = V.cross(r, f);
  cam.pos.set(pos);
  cam.rot.set([r[0], r[1], r[2], u[0], u[1], u[2], -f[0], -f[1], -f[2]]);
  cam.tanHalf = Math.tan(cam.fov * Math.PI / 360);
  cam.focus = Math.max(d - 1.0, 3);
}

// ---------- main loop ----------
const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
let simT = qn('t', 0), speed = qn('speed', 1), frameNo = 0, last = 0, ema = 16, adaptT = 0;
const still = Q.has('still');
// dynamic resolution with hysteresis: drop fast when struggling, creep up slowly, remember the ceiling
let slowFor = 0, fastFor = 0, ceil = 1;
function adapt(dt) {
  if (view.fixed || dt <= 0) return;
  ema += (dt * 1000 - ema) * 0.08;
  slowFor = ema > 23 ? slowFor + dt : 0;
  fastFor = ema < 17.6 ? fastFor + dt : 0;
  ceil = Math.min(1, ceil + dt * 0.004);
  let s = view.scale;
  if (slowFor > 0.8) { ceil = Math.max(0.35, s * 0.97); s *= ema > 40 ? 0.8 : 0.9; slowFor = 0; }
  else if (fastFor > 2.5 && s < ceil) { s = Math.min(ceil, s * 1.06); fastFor = 0; }
  s = clamp(s, 0.35, 1);
  if (Math.abs(s - view.scale) > 0.01) { view.scale = s; resize(); }
}
function frame(ms) {
  const dt = last ? Math.min((ms - last) / 1000, 0.1) : 0;
  last = ms; nowS = ms / 1000;
  if (!still) simT += dt * speed;
  resize();
  simulate(simT, still ? 0 : dt);
  cam.prevPos.set(cam.pos); cam.prevRot.set(cam.rot);
  updateCamera(dt);
  if (frameNo === 0) { cam.prevPos.set(cam.pos); cam.prevRot.set(cam.rot); }
  cam.jitter[0] = halton(frameNo % 16 + 1, 2) - 0.5; cam.jitter[1] = halton(frameNo % 16 + 1, 3) - 0.5;
  adapt(dt);
  if (frameNo % 3 === 0) renderCaustics(st);
  if (frameNo % 2 === 0) renderCond(st);
  renderScene(st, cam);
  renderPost(st, cam);
  frameNo++;
  requestAnimationFrame(frame);
}
function waitReady() {
  if (!Object.values(progs).every(p => p.ready())) { requestAnimationFrame(waitReady); return; }
  Object.values(progs).forEach(p => p.check());
  bakeEnv();
  hint.textContent = hint.dataset.text;
  setTimeout(() => { if (!hintHidden) hint.classList.add('hide'); }, 9000);
  requestAnimationFrame(frame);
}
hint.dataset.text = hint.innerHTML.replace(/&nbsp;/g, ' ');
hint.textContent = 'Pouring…';
window.__ice = { cam, view, st, get fps() { return 1000 / ema; }, get frames() { return frameNo; }, setTime: t => { simT = t; } };
requestAnimationFrame(waitReady);
</script>
