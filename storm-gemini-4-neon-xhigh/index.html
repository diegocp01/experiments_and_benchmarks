  `;

  // --- 12C. PHOTOREALISTIC GERSTNER STORM OCEAN SHADER ---
  const oceanVS = `#version 300 es
    layout(location=0) in vec3 aGrid;

    uniform mat4 uVP;
    uniform vec4 uWaveA[16];
    uniform vec4 uWaveB[16];

    out vec3 vWorldPos;
    out vec3 vNormal;
    out vec2 vBaseXZ;
    out float vFoamCrest;
    out float vCrestHeight;

    void main() {
      vec2 xz = aGrid.xy;
      float distFade = 1.0 - smoothstep(450.0, 2200.0, length(xz));

      vec3 pos = vec3(xz.x, 0.0, xz.y);
      vec3 tX = vec3(1.0, 0.0, 0.0);
      vec3 tZ = vec3(0.0, 0.0, 1.0);

      for (int i = 0; i < 16; i++) {
        vec4 wa = uWaveA[i];
        vec4 wb = uWaveB[i];
        float wFade = (i >= 10) ? distFade : 1.0;
        float amp = wa.w * wFade;
        float qAmp = wb.x * wFade;
        float k = wa.z;
        float qKA = wb.w * wFade;

        float th = k * (wa.x * xz.x + wa.y * xz.y) + wb.y;
        float s = sin(th);
        float c = cos(th);

        pos.x += qAmp * wa.x * c;
        pos.z += qAmp * wa.y * c;
        pos.y += amp * s;

        float kaC = k * amp * c;
        tX.x -= qKA * wa.x * wa.x * s;
        tX.z -= qKA * wa.x * wa.y * s;
        tX.y += kaC * wa.x;

        tZ.x -= qKA * wa.y * wa.x * s;
        tZ.z -= qKA * wa.y * wa.y * s;
        tZ.y += kaC * wa.y;
      }

      float J = tX.x * tZ.z - tX.z * tZ.x;
      vFoamCrest = clamp(1.0 - J, 0.0, 1.5);
      vCrestHeight = pos.y;
      vWorldPos = pos;
      vBaseXZ = xz;
      vNormal = normalize(cross(tZ, tX));

      gl_Position = uVP * vec4(pos, 1.0);
    }
  `;

  const oceanFS = `#version 300 es
    precision highp float;
    in vec3 vWorldPos;
    in vec3 vNormal;
    in vec2 vBaseXZ;
    in float vFoamCrest;
    in float vCrestHeight;
    out vec4 fragColor;

    uniform mat4 uShipInv;
    uniform float uShipTravelZ;
    uniform sampler2D uNoiseTex;
    uniform sampler2D uWaveNormalTex;
    ${COMMON_LIGHTING_GLSL}

    float hullHalfBeamGLSL(float z, float y) {
      if (z < -31.1 || z > 29.1) return 0.0;
      float t;
      if (z < -6.0) {
        t = clamp((z + 31.0) / 25.0, 0.0, 1.0);
        t = pow(t, 0.58);
      } else if (z < 17.0) {
        t = 1.0;
      } else {
        float u = clamp((z - 17.0) / 12.0, 0.0, 1.0);
        t = 1.0 - 0.24 * u * u;
      }
      float maxB = 5.65 * t;
      float yNorm = clamp((y + 3.6) / 8.3, 0.001, 1.35);
      float prof = pow(clamp(yNorm, 0.001, 1.0), 0.36);
      if (y > 4.70) {
        float bowF = smoothstep(-10.0, -30.5, z);
        prof += (y - 4.70) * (0.04 + 0.14 * bowF);
      }
      return maxB * prof;
    }

    vec3 sampleNightSkyRefl(vec3 r) {
      float up = max(r.y, 0.0);
      vec3 sky = mix(vec3(0.032, 0.062, 0.102), vec3(0.009, 0.020, 0.042), pow(up, 0.55));
      vec2 wind = vec2(0.74, 0.67) * uTime * 0.018;
      vec2 cuv = r.xz / (up + 0.22) * 0.16 - wind;
      float cld = texture(uNoiseTex, cuv).g;
      sky *= mix(0.55, 1.45, cld);

      vec3 moonDir = normalize(vec3(-0.32, 0.28, -0.90));
      float mCos = max(dot(r, moonDir), 0.0);
      sky += vec3(0.38, 0.54, 0.76) * pow(mCos, 7.0) * 0.34;
      sky += vec3(0.88, 0.95, 1.0) * pow(mCos, 85.0) * 0.65;

      if (uLightningInt0 > 0.01) {
        float lCos = max(dot(r, uLightningDir0), 0.0);
        sky += vec3(0.44, 0.66, 1.0) * (0.06 + pow(lCos, 6.0) * 0.85 + pow(lCos, 45.0) * 2.2) * uLightningInt0 * (0.55 + 0.65 * cld);
      }
      if (uLightningInt1 > 0.01) {
        float lCos = max(dot(r, uLightningDir1), 0.0);
        sky += vec3(0.42, 0.62, 1.0) * (0.05 + pow(lCos, 6.0) * 0.75 + pow(lCos, 45.0) * 1.9) * uLightningInt1 * (0.55 + 0.65 * cld);
      }
      return sky;
    }

    float ggxSpec(vec3 N, vec3 V, vec3 L, float rough) {
      vec3 H = normalize(V + L);
      float ndh = max(dot(N, H), 0.0);
      float a = rough * rough;
      float a2 = a * a;
      float denom = ndh * ndh * (a2 - 1.0) + 1.0;
      return (a2 / (3.14159 * denom * denom + 0.0001)) * max(dot(N, L), 0.0);
    }

    void main() {
      vec3 sp = (uShipInv * vec4(vWorldPos, 1.0)).xyz;
      float hb = hullHalfBeamGLSL(sp.z, sp.y);
      float hullDist = 99.0;
      if (sp.z > -32.0 && sp.z < 30.0) {
        if (abs(sp.x) < hb - 0.14 && sp.y < 6.45) {
          discard;
        }
        float dx = max(abs(sp.x) - hb, 0.0);
        float dz = max(max(-31.0 - sp.z, sp.z - 29.0), 0.0);
        hullDist = length(vec2(dx, dz));
      }

      vec3 V = normalize(uCamPos - vWorldPos);
      float camDist = length(uCamPos - vWorldPos);

      vec2 worldUV = vBaseXZ + vec2(0.0, -uShipTravelZ);
      vec2 windDir = vec2(0.74, 0.67);
      vec2 crossWind = vec2(-windDir.y, windDir.x);

      vec2 uvA = worldUV * 0.055 - windDir * uTime * 0.24;
      vec2 uvB = (mat2(0.82, -0.57, 0.57, 0.82) * worldUV) * 0.145 - windDir * uTime * 0.44;
      vec2 uvC = (mat2(0.45, 0.89, -0.89, 0.45) * worldUV) * 0.36 - windDir * uTime * 0.72;

      vec2 gA = (texture(uWaveNormalTex, uvA).rg * 2.0 - 1.0);
      vec2 gB = (texture(uWaveNormalTex, uvB).rg * 2.0 - 1.0);
      vec2 gC = (texture(uWaveNormalTex, uvC).rg * 2.0 - 1.0);

      float detailAtten = 1.0 - smoothstep(55.0, 880.0, camDist);
      vec2 microGrad = (gA * 0.34 + gB * 0.26 + gC * 0.18 * detailAtten);
      vec3 N = normalize(vNormal + vec3(microGrad.x, 0.0, microGrad.y) * 0.64);
      if (dot(N, V) < 0.0) N = normalize(N - V * (dot(N, V) - 0.02));

      float ndv = max(dot(N, V), 0.001);
      float fresnel = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);

      // Rich deep-abyssal indigo troughs -> glowing cold sea-green crests!
      vec3 deepWater = vec3(0.004, 0.016, 0.028);
      vec3 shallowTeal = vec3(0.015, 0.072, 0.074);
      vec3 waterBody = mix(deepWater, shallowTeal, smoothstep(-0.8, 4.0, vCrestHeight));

      // Subsurface Scattering in backlit thin storm crests
      vec3 moonDir = normalize(vec3(-0.32, 0.28, -0.90));
      float crestThin = smoothstep(0.5, 4.4, vCrestHeight) * smoothstep(0.30, 1.0, 1.0 - N.y + vFoamCrest * 0.55);
      float sssMoon = pow(clamp(dot(V, -moonDir + N * 0.45), 0.0, 1.0), 3.0) * 0.38 + 0.20;
      float sssLight0 = (0.35 + 0.65 * pow(clamp(dot(V, -uLightningDir0 + N * 0.4), 0.0, 1.0), 2.5)) * uLightningInt0;
      float sssLight1 = (0.35 + 0.65 * pow(clamp(dot(V, -uLightningDir1 + N * 0.4), 0.0, 1.0), 2.5)) * uLightningInt1;
      vec3 sssCol = vec3(0.032, 0.26, 0.23) * crestThin * (sssMoon * 0.60 + (sssLight0 + sssLight1) * 0.95);

      vec3 R = reflect(-V, N);
      R.y = max(R.y, 0.01);
      vec3 skyRefl = sampleNightSkyRefl(R);

      vec3 waterCol = mix(waterBody + sssCol, skyRefl, clamp(fresnel * 1.18, 0.02, 0.96));

      float specRough = mix(0.10, 0.25, smoothstep(80.0, 900.0, camDist));
      waterCol += vec3(0.58, 0.76, 0.98) * ggxSpec(N, V, moonDir, specRough + 0.05) * 0.18;
      if (uLightningInt0 > 0.01) {
        waterCol += vec3(0.76, 0.90, 1.0) * ggxSpec(N, V, uLightningDir0, specRough) * uLightningInt0 * 1.25;
      }
      if (uLightningInt1 > 0.01) {
        waterCol += vec3(0.72, 0.86, 1.0) * ggxSpec(N, V, uLightningDir1, specRough) * uLightningInt1 * 1.10;
      }

      // Practical ship lights casting warm/red/green trails across dark rolling waves!
      vec3 toFL = uFloodLPos - vWorldPos;
      float attFL = spotAtten(-toFL, uFloodDir, 60.0);
      vec3 lFL = normalize(toFL);
      waterCol += vec3(1.0, 0.66, 0.32) * (ggxSpec(N, V, lFL, 0.20) * 1.4 + max(dot(N, lFL), 0.0) * 0.12) * attFL * 1.5;

      vec3 toFR = uFloodRPos - vWorldPos;
      float attFR = spotAtten(-toFR, uFloodDir, 60.0);
      vec3 lFR = normalize(toFR);
      waterCol += vec3(1.0, 0.66, 0.32) * (ggxSpec(N, V, lFR, 0.20) * 1.4 + max(dot(N, lFR), 0.0) * 0.12) * attFR * 1.5;

      vec3 toBow = uBowLampPos - vWorldPos;
      float attBow = pointAtten(length(toBow), 28.0);
      vec3 lBow = normalize(toBow);
      waterCol += vec3(1.0, 0.80, 0.52) * (ggxSpec(N, V, lBow, 0.22) * 1.0 + max(dot(N, lBow), 0.0) * 0.14) * attBow * 1.15;

      vec3 toP = uPortNavPos - vWorldPos;
      float attP = pointAtten(length(toP), 38.0) * smoothstep(2.0, -4.0, sp.x);
      waterCol += vec3(1.0, 0.10, 0.04) * (ggxSpec(N, V, normalize(toP), 0.22) * 1.25 + 0.10) * attP * 1.45;

      vec3 toS = uStbdNavPos - vWorldPos;
      float attS = pointAtten(length(toS), 38.0) * smoothstep(-2.0, 4.0, sp.x);
      waterCol += vec3(0.05, 1.0, 0.38) * (ggxSpec(N, V, normalize(toS), 0.22) * 1.25 + 0.10) * attS * 1.45;

      // WHITECAPS, LACY BREAKING CRESTS, PROMINENT WIND-BLOWN FOAM STREAKS & BOW BOIL!
      vec2 windSpace = vec2(dot(worldUV, windDir), dot(worldUV, crossWind));
      vec2 warp = (texture(uNoiseTex, worldUV * 0.015).rg - 0.5) * 0.28;
      // 7:1 wind-stretched Langmuir / spindrift foam streaks streaming downwind across waves!
      vec2 streakUV1 = vec2(windSpace.x * 0.009 - uTime * 0.055, windSpace.y * 0.082) + warp;
      vec2 streakUV2 = vec2(windSpace.x * 0.022 - uTime * 0.088, windSpace.y * 0.175 + 0.37) + warp * 0.6;
      float sN1 = texture(uNoiseTex, streakUV1).r;
      float sN2 = texture(uNoiseTex, streakUV2).a;

      float laceA = texture(uNoiseTex, worldUV * 0.088 - windDir * uTime * 0.04).a;
      float laceB = texture(uNoiseTex, worldUV * 0.25 - windDir * uTime * 0.065).a;
      float foamLace = clamp(laceA * 0.62 + laceB * 0.56, 0.0, 1.0);

      // (a) Thick, frothy breaking whitecaps tearing off steep storm crests
      float crestMask = smoothstep(0.24, 0.80, vFoamCrest + smoothstep(1.1, 4.2, vCrestHeight) * 0.42);
      float whitecap = smoothstep(0.18, 0.68, crestMask * (0.58 + 0.82 * foamLace));

      // (b) Prominent wind-driven spindrift foam streaks streaming down wave backs & troughs
      float streakRibbons = smoothstep(0.46, 0.80, sN1 * 0.68 + sN2 * 0.50);
      float foamStreaks = streakRibbons * (0.38 + 0.72 * foamLace) * (0.52 + 0.48 * smoothstep(-1.2, 3.0, vCrestHeight));

      // (c) Churning white bow wave & foaming hull wake
      float hullFoamMask = exp(-hullDist * 0.38) * smoothstep(32.0, -30.0, sp.z);
      float wakeSpread = max(0.0, sp.z - 26.0) * 0.18;
      float sternWake = smoothstep(25.0, 32.0, sp.z) * exp(-max(0.0, abs(sp.x) - (3.8 + wakeSpread)) * 0.30) * exp(-max(0.0, sp.z - 29.0) * 0.018);
      float shipFoam = clamp((hullFoamMask * 1.25 + sternWake * 0.80) * (0.48 + 0.75 * foamLace), 0.0, 1.0);

      float totalFoam = clamp(max(whitecap, foamStreaks * 0.82) + shipFoam, 0.0, 1.0);
      totalFoam *= mix(1.0, 0.62, smoothstep(260.0, 1600.0, camDist));

      if (totalFoam > 0.005) {
        float nUp = 0.55 + 0.45 * max(N.y, 0.0);
        vec3 foamLight = vec3(0.095, 0.140, 0.195) * nUp;
        foamLight += vec3(0.48, 0.65, 0.88) * max(dot(N, moonDir), 0.0) * 0.22;
        foamLight += vec3(0.76, 0.90, 1.0) * (0.45 + 0.55 * max(dot(N, uLightningDir0), 0.0)) * uLightningInt0 * 0.95;
        foamLight += vec3(0.72, 0.86, 1.0) * (0.45 + 0.55 * max(dot(N, uLightningDir1), 0.0)) * uLightningInt1 * 0.85;
        foamLight += vec3(1.0, 0.68, 0.35) * (attFL + attFR) * 1.45;
        foamLight += vec3(1.0, 0.82, 0.55) * attBow * 1.15;
        foamLight += vec3(1.0, 0.12, 0.05) * attP * 1.25;
        foamLight += vec3(0.08, 1.0, 0.40) * attS * 1.25;

        vec3 foamAlbedo = mix(vec3(0.64, 0.80, 0.84), vec3(0.96, 0.98, 1.0), totalFoam);
        waterCol = mix(waterCol, foamAlbedo * foamLight, totalFoam * 0.92);
      }

      float fogAmt = 1.0 - exp(-camDist * 0.00142);
      fogAmt = clamp(fogAmt + smoothstep(140.0, 950.0, camDist) * 0.20, 0.0, 0.97);
      vec3 fogCol = evalStormFogColor(-V);
      vec3 finalCol = mix(waterCol, fogCol, fogAmt);

      fragColor = vec4(finalCol, 1.0);
    }
  `;

  // --- 12D. WET SHIP & MIRROR-PUDDLE REFLECTIVE DECK PBR SHADER ---
  const shipVS = `#version 300 es
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNorm;
    layout(location=2) in vec2 aUv;
    layout(location=3) in vec4 aMat;

    uniform mat4 uModel;
    uniform mat4 uVP;

    out vec3 vWorldPos;
    out vec3 vLocalPos;
    out vec3 vNormal;
    out vec2 vUv;
    out vec4 vMat;

    void main() {
      vec4 wp = uModel * vec4(aPos, 1.0);
      vWorldPos = wp.xyz;
      vLocalPos = aPos;
      vNormal = normalize(mat3(uModel) * aNorm);
      vUv = aUv;
      vMat = aMat;
      gl_Position = uVP * wp;
    }
  `;

  const shipFS = `#version 300 es
    precision highp float;
    in vec3 vWorldPos;
    in vec3 vLocalPos;
    in vec3 vNormal;
    in vec2 vUv;
    in vec4 vMat;
    out vec4 fragColor;

    uniform float uIsReflectionPass;
    uniform float uClipDeckY;
    uniform vec2 uResolution;
    uniform sampler2D uNoiseTex;
    uniform sampler2D uWaveNormalTex;
    uniform sampler2D uReflTex;
    uniform float uBeaconPulse;
    ${COMMON_LIGHTING_GLSL}

    // Concentric expanding raindrop impact ripples on wet deck puddles!
    vec2 rainRippleGrad(vec2 p, float t) {
      vec2 grad = vec2(0.0);
      for (int layer = 0; layer < 2; layer++) {
        float scale = (layer == 0) ? 1.85 : 3.1;
        float speed = (layer == 0) ? 2.1 : 2.8;
        vec2 g = p * scale;
        vec2 cell = floor(g);
        vec2 f = fract(g);
        for (int dy = -1; dy <= 1; dy++) {
          for (int dx = -1; dx <= 1; dx++) {
            vec2 nb = vec2(float(dx), float(dy));
            vec2 id = cell + nb;
            vec3 rnd = fract(sin(vec3(dot(id, vec2(127.1, 311.7)), dot(id, vec2(269.5, 183.3)), dot(id, vec2(419.2, 371.9)))) * 43758.5453);
            float phase = fract(t * speed * (0.65 + 0.55 * rnd.z) + rnd.z * 7.0);
            vec2 center = nb + 0.15 + 0.70 * rnd.xy;
            vec2 d = f - center;
            float dist = length(d);
            float radius = phase * 0.70;
            float ringDist = dist - radius;
            float envelope = exp(-ringDist * ringDist * 130.0) * (1.0 - phase) * smoothstep(0.0, 0.08, phase);
            float wave = sin(ringDist * 38.0) * envelope;
            grad += (d / max(dist, 0.001)) * wave * 0.34;
          }
        }
      }
      return grad;
    }

    // Analytical contact ambient occlusion on the wet deck around hatch, windlass & deckhouse!
    float deckContactAO(vec2 xz) {
      float ao = 1.0;
      // Cargo hatch footprint: x in [-2.27, 2.27], z in [-11.72, -1.28]
      vec2 dHatch = max(abs(xz - vec2(0.0, -6.5)) - vec2(2.27, 5.22), 0.0);
      ao *= mix(0.22, 1.0, smoothstep(0.0, 0.72, length(dHatch)));
      // Windlass bedplate footprint: x in [-1.52, 1.52], z in [-25.42, -24.18]
      vec2 dWind = max(abs(xz - vec2(0.0, -24.8)) - vec2(1.52, 0.62), 0.0);
      ao *= mix(0.24, 1.0, smoothstep(0.0, 0.55, length(dWind)));
      // Superstructure forward bulkhead: x in [-4.38, 4.38], z > 4.72
      vec2 dHouse = max(abs(xz - vec2(0.0, 12.5)) - vec2(4.38, 7.78), 0.0);
      ao *= mix(0.20, 1.0, smoothstep(0.0, 0.95, length(dHouse)));
      return ao;
    }

    float ggxD(float ndh, float rough) {
      float a = max(rough * rough, 0.004);
      float a2 = a * a;
      float d = ndh * ndh * (a2 - 1.0) + 1.0;
      return a2 / (3.14159 * d * d + 0.0001);
    }

    vec3 pbrLight(vec3 N, vec3 V, vec3 L, vec3 lCol, vec3 albedo, float rough, float metal) {
      float ndl = max(dot(N, L), 0.0);
      if (ndl <= 0.0) return vec3(0.0);
      vec3 H = normalize(V + L);
      float ndh = max(dot(N, H), 0.0);
      float hdv = max(dot(H, V), 0.0);
      vec3 F0 = mix(vec3(0.035), albedo, metal);
      vec3 F = F0 + (1.0 - F0) * pow(1.0 - hdv, 5.0);
      float D = ggxD(ndh, rough);
      float G = 1.0 / (max(dot(N, V), 0.05) + ndl + 0.25);
      vec3 spec = D * F * G * 0.45;
      vec3 diff = (1.0 - F) * (1.0 - metal) * albedo / 3.14159;
      return (diff + spec) * lCol * ndl;
    }

    void main() {
      if (uIsReflectionPass > 0.5 && vLocalPos.y < uClipDeckY) {
        discard;
      }

      int matId = int(vMat.x + 0.5);
      float rough = vMat.y;
      float metal = vMat.z;
      float ao = vMat.w;

      // Material 6: Photographic nocturnal wheelhouse windows & portholes (corrected vertical/horizontal UV,
      // varied interior lighting per pane, dark ceiling overhang, helm silhouette, subtle cyan radar screens & wipers!)
      if (matId == 6) {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(uCamPos - vWorldPos);
        float glassFresnel = 0.05 + 0.95 * pow(1.0 - max(dot(N, V), 0.0), 4.0);
        float isPorthole = step(vLocalPos.y, 7.6);

        if (isPorthole > 0.5) {
          vec3 portholeCol = mix(vec3(0.95, 0.42, 0.09), vec3(1.0, 0.72, 0.32), 0.60);
          fragColor = vec4(portholeCol * 1.38, 1.0);
          return;
        }

        // addQuad maps vUv.x = vertical (0 bottom -> 1 top) and vUv.y = horizontal (0 left -> 1 right)!
        float wx = vUv.y;
        float wy = vUv.x;
        // Identify each of the 7 panes uniquely so no two windows look cloned!
        float paneId = floor((vLocalPos.x + 4.0) * 1.02);
        float paneRnd = fract(sin(paneId * 91.7 + 13.4) * 43758.5453);
        float centerBias = 1.0 - smoothstep(0.0, 3.8, abs(vLocalPos.x));

        // Crisp dark window mullion recess
        float frameMask = smoothstep(0.0, 0.07, wx) * smoothstep(1.0, 0.93, wx)
                        * smoothstep(0.0, 0.08, wy) * smoothstep(1.0, 0.92, wy);

        // Dark wheelhouse ceiling overhang in top 32%, warm ambient chartroom light in lower-middle!
        float ceilingShade = smoothstep(0.95, 0.48, wy);
        float lowerConsole = smoothstep(0.05, 0.34, wy);

        // Unique per-pane interior silhouettes (helmsman/compass near center, chart desk & bulkhead consoles off-center)
        float worldX = vLocalPos.x;
        float consoleH = 0.24 + 0.14 * sin(worldX * 1.7 + 0.5) + 0.08 * paneRnd;
        float consoleBlock = smoothstep(consoleH + 0.04, consoleH - 0.03, wy);
        // Subtle standing watch-officer / center helm binnacle silhouette in pane near x = -0.3..+0.4
        float watchSil = smoothstep(0.32, 0.12, abs(worldX - 0.12)) * smoothstep(0.76, 0.42, wy);

        // Vary luminance naturally across the 7 panes (warmer & brighter at center bridge console, dimmer at wings!)
        float paneBright = mix(0.42, 1.18, centerBias * 0.72 + paneRnd * 0.28);
        vec3 warmDark = vec3(0.24, 0.08, 0.02);
        vec3 warmAmber = vec3(1.00, 0.50, 0.14);
        vec3 interior = mix(warmDark, warmAmber, clamp(ceilingShade * (0.40 + 0.60 * lowerConsole), 0.0, 1.0));
        interior *= (1.0 - consoleBlock * 0.58) * (1.0 - watchSil * 0.65);

        // Subtle glowing cyan/emerald marine radar & ECDIS screens on panes 2 & 4 (not every pane!)
        float isRadarWin = step(0.5, abs(worldX)) * step(abs(worldX), 2.15);
        float screenBox = smoothstep(0.20, 0.26, wx) * smoothstep(0.62, 0.56, wx)
                        * smoothstep(0.16, 0.22, wy) * smoothstep(0.42, 0.36, wy);
        vec3 radarGlow = vec3(0.04, 0.58, 0.52) * screenBox * isRadarWin * 0.95;

        // Occasional subtle windshield wiper arm on center-ish panes (parked at realistic angles!)
        float hasWiper = step(abs(worldX), 2.2) * step(0.35, paneRnd);
        float wiperX = 0.78 - wy * 0.16;
        float wiperMask = 1.0 - 0.65 * hasWiper * smoothstep(0.028, 0.008, abs(wx - wiperX)) * step(0.10, wy) * step(wy, 0.86);

        float rainGloss = 0.90 + 0.16 * texture(uNoiseTex, vec2(wx * 5.0 + paneId * 0.3, wy * 1.4 + uTime * 0.38)).b;
        vec3 winCol = (interior * paneBright * 1.25 + radarGlow) * wiperMask * rainGloss;

        // Glossy night sky reflection on raked exterior glass
        vec3 reflSky = evalStormFogColor(reflect(-V, N)) * 1.45;
        winCol = mix(winCol, reflSky, glassFresnel * 0.42) * frameMask;
        fragColor = vec4(winCol, 1.0);
        return;
      }
      // Material 10: High-intensity halogen floodlight & bow steaming lamp lenses
      if (matId == 10) {
        fragColor = vec4(vec3(1.0, 0.84, 0.54) * 5.2, 1.0);
        return;
      }
      if (matId == 7) {
        float pulse = (vLocalPos.y > 18.0) ? uBeaconPulse : 1.0;
        fragColor = vec4(vec3(1.0, 0.10, 0.04) * 5.8 * pulse, 1.0);
        return;
      }
      if (matId == 8) {
        fragColor = vec4(vec3(0.06, 1.0, 0.40) * 5.8, 1.0);
        return;
      }

      vec3 N = normalize(vNormal);
      vec3 V = normalize(uCamPos - vWorldPos);
      if (dot(N, V) < 0.0) N = -N;

      vec4 texN = texture(uNoiseTex, vLocalPos.xz * 0.24 + vLocalPos.xy * 0.18);
      vec4 fineN = texture(uNoiseTex, vLocalPos.xz * 1.25 + vLocalPos.zy * 0.95);
      // Realistic vertical rainwater runoff streaks & welded hull/superstructure steel plate bands!
      float vertStreak = texture(uNoiseTex, vec2((vLocalPos.x + vLocalPos.z) * 0.85, vLocalPos.y * 0.14)).b;
      float vertRunoff = texture(uNoiseTex, vec2((vLocalPos.x + vLocalPos.z) * 2.1, vLocalPos.y * 0.22 + uTime * 0.22)).b;
      float wallSeamV = smoothstep(0.47, 0.495, abs(fract((vLocalPos.x + vLocalPos.z) * 0.38) - 0.5));
      float wallSeamH = smoothstep(0.47, 0.495, abs(fract(vLocalPos.y * 0.72) - 0.5));
      float wallSeam = max(wallSeamV, wallSeamH) * 0.35;

      vec3 albedo = vec3(0.12);
      if (matId == 0) {
        albedo = mix(vec3(0.020, 0.027, 0.036), vec3(0.038, 0.048, 0.060), texN.r);
      } else if (matId == 1) {
        albedo = mix(vec3(0.032, 0.048, 0.068), vec3(0.066, 0.090, 0.116), texN.r * 0.55 + vertStreak * 0.45);
        albedo *= (1.0 - wallSeam * 0.45);
      } else if (matId == 2) {
        // Weathered storm-drenched marine grey steel with welded plate panels, salt streaks & scupper rust hints!
        albedo = mix(vec3(0.095, 0.118, 0.142), vec3(0.195, 0.225, 0.260), texN.r * 0.48 + vertStreak * 0.52);
        albedo *= (1.0 - wallSeam * 0.40);
        // Subtle salt & iron-oxide rust wash near deck scuppers & bottom edges
        float rustBand = (1.0 - smoothstep(4.70, 5.25, vLocalPos.y)) * smoothstep(0.35, 0.78, fineN.b);
        albedo = mix(albedo, vec3(0.14, 0.075, 0.045), rustBand * 0.45);
        albedo *= mix(0.64, 1.0, smoothstep(4.70, 5.55, vLocalPos.y));
      } else if (matId == 3) {
        albedo = mix(vec3(0.042, 0.048, 0.056), vec3(0.115, 0.082, 0.060), fineN.b * 0.55);
      } else if (matId == 4) {
        albedo = mix(vec3(0.20, 0.24, 0.28), vec3(0.34, 0.38, 0.42), texN.r);
      } else if (matId == 5) {
        albedo = mix(vec3(0.42, 0.095, 0.04), vec3(0.64, 0.18, 0.06), texN.r);
      } else if (matId == 9) {
        // Distinguish coiled wet braided manila hawser on deck (y < 5.1) from dark wet teak cap rail!
        if (vLocalPos.y < 5.15) {
          float twist = 0.5 + 0.5 * sin(vUv.x * 160.0 + vUv.y * 18.85);
          float fibers = 0.7 + 0.3 * sin(vUv.x * 420.0 - vUv.y * 37.7);
          albedo = mix(vec3(0.085, 0.058, 0.032), vec3(0.21, 0.155, 0.095), twist * fibers);
          rough = mix(0.68, 0.34, twist);
        } else {
          albedo = mix(vec3(0.085, 0.055, 0.034), vec3(0.16, 0.108, 0.068), fineN.r);
        }
      }

      float puddleMask = 0.0;
      vec2 reflRipple = vec2(0.0);

      if (matId == 0) {
        ao *= deckContactAO(vLocalPos.xz);

        // Subtle realistic welded steel deck seams (soft, dark, non-distracting!)
        vec2 plateUV = vLocalPos.xz / vec2(1.95, 3.25);
        vec2 seamDist = abs(fract(plateUV) - 0.5);
        float seam = smoothstep(0.488, 0.499, max(seamDist.x, seamDist.y));
        albedo *= (1.0 - seam * 0.42);

        // Smooth, broad organic standing rainwater puddles (ZERO crusty/jagged transition!)
        float puddleNoise = texture(uWaveNormalTex, vLocalPos.xz * 0.055).a * 0.72
                          + texture(uNoiseTex, vLocalPos.xz * 0.11).r * 0.28;
        puddleMask = smoothstep(0.16, 0.68, puddleNoise + 0.16);

        // Smooth organic raindrop splash rings + gentle wind-driven water film ripples!
        // Keep windRip gentle so reflected straight rails & pipes stay natural and silky (ZERO jagged sawtooth wobble!)
        vec2 windRip = (texture(uWaveNormalTex, vLocalPos.xz * 0.34 - vec2(0.74, 0.67) * uTime * 0.42).rg * 2.0 - 1.0) * 0.042;
        vec2 dropRip = rainRippleGrad(vLocalPos.xz, uTime) * (0.42 + 0.58 * puddleMask);
        vec2 plateMicro = (texture(uWaveNormalTex, vLocalPos.xz * 1.65).rg * 2.0 - 1.0) * (1.0 - puddleMask) * 0.12;
        reflRipple = dropRip * 0.68 + windRip;

        vec3 shipUp = N;
        vec3 shipRight = normalize(cross(vec3(0.0, 0.0, 1.0), shipUp));
        vec3 shipFwd = normalize(cross(shipUp, shipRight));
        vec2 lightRip = reflRipple + plateMicro;
        N = normalize(shipUp + shipRight * lightRip.x * 0.28 + shipFwd * lightRip.y * 0.28);

        rough = mix(0.16, 0.048, puddleMask);
        ao *= (1.0 - seam * 0.22);
      } else {
        // Glossy vertical rainwater drip streaks running down painted bulkheads, railings & hardware!
        rough = mix(rough * 0.36, rough * 0.92, vertRunoff);
        // Subtle normal perturbation on vertical walls from welded plating & water streams
        N = normalize(N + vec3(vertRunoff - 0.5, 0.0, vertStreak - 0.5) * 0.055);
      }

      // --- DIRECT LIGHTING ---
      vec3 moonDir = normalize(vec3(-0.32, 0.28, -0.90));
      vec3 col = vec3(0.0);

      float hemi = 0.5 + 0.5 * N.y;
      vec3 ambSky = mix(vec3(0.012, 0.020, 0.034), vec3(0.054, 0.088, 0.136), hemi);
      // Keep ambient lightning fill restrained so lightning preserves dramatic dark shadows & bright directional glints!
      ambSky += vec3(0.22, 0.36, 0.62) * (uLightningInt0 + uLightningInt1) * 0.095 * hemi;
      col += albedo * ambSky * ao;

      col += pbrLight(N, V, moonDir, vec3(0.28, 0.42, 0.60), albedo, rough, metal) * ao;

      if (uLightningInt0 > 0.01) {
        col += pbrLight(N, V, uLightningDir0, vec3(0.76, 0.90, 1.0) * uLightningInt0 * 1.15, albedo, rough, metal) * ao;
      }
      if (uLightningInt1 > 0.01) {
        col += pbrLight(N, V, uLightningDir1, vec3(0.72, 0.86, 1.0) * uLightningInt1 * 1.00, albedo, rough, metal) * ao;
      }

      // Practical ship lights
      vec3 toFL = uFloodLPos - vWorldPos;
      float attFL = spotAtten(-toFL, uFloodDir, 46.0) + pointAtten(length(toFL), 14.0) * 0.35;
      col += pbrLight(N, V, normalize(toFL), vec3(1.0, 0.66, 0.30) * 4.2 * attFL, albedo, rough, metal) * ao;

      vec3 toFR = uFloodRPos - vWorldPos;
      float attFR = spotAtten(-toFR, uFloodDir, 46.0) + pointAtten(length(toFR), 14.0) * 0.35;
      col += pbrLight(N, V, normalize(toFR), vec3(1.0, 0.66, 0.30) * 4.2 * attFR, albedo, rough, metal) * ao;

      // Bow Lamp softly illuminates prow, anchor windlass & heavy iron anchor chains!
      vec3 toBow = uBowLampPos - vWorldPos;
      float attBow = pointAtten(length(toBow), 24.0);
      col += pbrLight(N, V, normalize(toBow), vec3(1.0, 0.80, 0.50) * 3.6 * attBow, albedo, rough, metal) * ao;

      vec3 toBr = uBridgeGlowPos - vWorldPos;
      float attBr = pointAtten(length(toBr), 28.0);
      col += pbrLight(N, V, normalize(toBr), vec3(1.0, 0.56, 0.18) * 2.8 * attBr, albedo, rough, metal) * ao;

      // Mask nav-light spill shadowed under the central cargo hatch overhang (prevents tiny pinpoint bleed!)
      float hatchShadow = mix(smoothstep(2.1, 2.9, abs(vLocalPos.x)), 1.0, smoothstep(5.35, 5.75, vLocalPos.y) + step(-1.0, vLocalPos.z));
      hatchShadow = clamp(hatchShadow, 0.0, 1.0);

      vec3 toP = uPortNavPos - vWorldPos;
      float attP = pointAtten(length(toP), 28.0) * smoothstep(3.0, -2.5, vLocalPos.x) * hatchShadow;
      col += pbrLight(N, V, normalize(toP), vec3(1.0, 0.10, 0.04) * 3.5 * attP, albedo, rough, metal) * ao;

      vec3 toS = uStbdNavPos - vWorldPos;
      float attS = pointAtten(length(toS), 28.0) * smoothstep(-3.0, 2.5, vLocalPos.x) * hatchShadow;
      col += pbrLight(N, V, normalize(toS), vec3(0.06, 1.0, 0.42) * 3.5 * attS, albedo, rough, metal) * ao;

      // Extra broad wet clear-coat specular streak lobe on the wet deck
      if (matId == 0) {
        float coatR = mix(0.28, 0.13, puddleMask);
        col += vec3(1.0, 0.64, 0.28) * ggxD(max(dot(N, normalize(V + normalize(toFL))), 0.0), coatR) * attFL * 0.14 * ao;
        col += vec3(1.0, 0.64, 0.28) * ggxD(max(dot(N, normalize(V + normalize(toFR))), 0.0), coatR) * attFR * 0.14 * ao;
        col += vec3(1.0, 0.56, 0.20) * ggxD(max(dot(N, normalize(V + normalize(toBr))), 0.0), coatR) * attBr * 0.12 * ao;
        col += vec3(1.0, 0.80, 0.50) * ggxD(max(dot(N, normalize(V + normalize(toBow))), 0.0), coatR) * attBow * 0.14 * ao;
        col += vec3(1.0, 0.12, 0.04) * ggxD(max(dot(N, normalize(V + normalize(toP))), 0.0), coatR) * attP * 0.10 * ao;
        col += vec3(0.08, 1.0, 0.42) * ggxD(max(dot(N, normalize(V + normalize(toS))), 0.0), coatR) * attS * 0.10 * ao;
      }

      // --- SILKY-SMOOTH PLANAR WET DECK REFLECTIONS (ZERO JAGGED PUDDLE CRUST!) ---
      float ndv = max(dot(N, V), 0.001);
      float wetFresnel = 0.04 + 0.96 * pow(1.0 - ndv, 4.0);

      if (matId == 0 && uIsReflectionPass < 0.5) {
        vec2 screenUV = gl_FragCoord.xy / uResolution;
        // Restrained silky raindrop & gentle wind-film ripple distortion (keeps reflected rails & pipes crisp & natural!)
        vec2 distort = vec2(reflRipple.x * 0.0075, reflRipple.y * 0.0125);
        vec2 reflUV = clamp(screenUV + distort, vec2(0.004), vec2(0.996));

        vec3 reflSharp = texture(uReflTex, reflUV).rgb;
        // Smooth vertically stretched blur for damp steel around glassier puddles
        vec2 px = vec2(3.6, 11.0) / uResolution;
        vec3 reflSoft = (
          texture(uReflTex, clamp(reflUV + vec2( px.x,  px.y), vec2(0.004), vec2(0.996))).rgb +
          texture(uReflTex, clamp(reflUV + vec2(-px.x,  px.y), vec2(0.004), vec2(0.996))).rgb +
          texture(uReflTex, clamp(reflUV + vec2( px.x, -px.y), vec2(0.004), vec2(0.996))).rgb +
          texture(uReflTex, clamp(reflUV + vec2(-px.x, -px.y), vec2(0.004), vec2(0.996))).rgb +
          texture(uReflTex, clamp(reflUV + vec2( 0.0,   px.y * 2.2), vec2(0.004), vec2(0.996))).rgb +
          texture(uReflTex, clamp(reflUV + vec2( 0.0,  -px.y * 2.2), vec2(0.004), vec2(0.996))).rgb
        ) / 6.0;

        vec3 planarRefl = mix(reflSoft, reflSharp, smoothstep(0.18, 0.88, puddleMask));
        float reflStrength = clamp(wetFresnel * mix(0.55, 1.00, puddleMask) + puddleMask * 0.28, 0.0, 0.90);
        col = mix(col, col * 0.28 + planarRefl * 1.12, reflStrength * ao);
      } else {
        vec3 R = reflect(-V, N);
        vec3 envRefl = evalStormFogColor(R) * (1.15 + (uLightningInt0 + uLightningInt1) * 0.32);
        col += envRefl * wetFresnel * (0.48 + 0.45 * metal) * ao;
      }

      float dist = length(uCamPos - vWorldPos);
      float haze = 1.0 - exp(-dist * 0.0052);
      col = mix(col, evalStormFogColor(-V), haze * 0.52);

      fragColor = vec4(col, 1.0);
    }
  `;

  // --- 12E. PHOTOREALISTIC BOW SPRAY PLUMES + VELOCITY-ALIGNED BALLISTIC DROPLETS ---
  const sprayVS = `#version 300 es
    layout(location=0) in vec2 aQuad;
    layout(location=1) in vec4 aPosSize; // xyz, size
    layout(location=2) in vec4 aVelAlpha;// vel.xyz, alpha
    layout(location=3) in vec4 aMeta;    // seed, type, age, pad

    uniform mat4 uVP;
    uniform vec3 uCamPos;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;

    out vec2 vUv;
    out vec3 vWorldPos;
    out vec4 vMeta; // alpha, seed, type, age

    void main() {
      float size = aPosSize.w;
      float seed = aMeta.x;
      float isDrop = aMeta.y;
      float age = aMeta.z;
      vec3 wp;

      if (isDrop > 0.5) {
        // Fine velocity-aligned flying water spray droplets (distance-clamped -> ZERO glowing white cigars!)
        vec3 vel = aVelAlpha.xyz;
        float spd = length(vel);
        vec3 dir = vel / max(spd, 0.001);
        vec3 toCamVec = uCamPos - aPosSize.xyz;
        float camDist = length(toCamVec);
        vec3 toCam = toCamVec / max(camDist, 0.001);
        vec3 side = normalize(cross(dir, toCam));
        float streakLen = clamp(spd * 0.017, 0.07, 0.30);
        float dropW = size * clamp(camDist * 0.16, 0.35, 1.25);
        wp = aPosSize.xyz + side * (aQuad.x * dropW) + dir * (aQuad.y * streakLen * 0.5);
      } else {
        // Billowing turbulent mist sheet slightly elongated along wind velocity!
        float ang = seed * 6.2831 + age * (fract(seed) - 0.5) * 1.4;
        float c = cos(ang), s = sin(ang);
        vec2 rot = vec2(aQuad.x * c - aQuad.y * s, aQuad.x * s + aQuad.y * c);
        vec2 stretched = rot * vec2(1.38, 0.88);
        wp = aPosSize.xyz + (uCamRight * stretched.x + uCamUp * stretched.y) * size;
      }

      vWorldPos = wp;
      vUv = aQuad * 0.5 + 0.5;
      vMeta = vec4(aVelAlpha.w, seed, isDrop, age);
      gl_Position = uVP * vec4(wp, 1.0);
    }
  `;

  const sprayFS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    in vec3 vWorldPos;
    in vec4 vMeta; // alpha, seed, isDrop, age
    out vec4 fragColor;

    uniform sampler2D uNoiseTex;
    ${COMMON_LIGHTING_GLSL}

    void main() {
      float isDrop = vMeta.z;
      float camDist = length(uCamPos - vWorldPos);
      // Smooth near-camera fade so mist NEVER blows out the lens into an opaque white veil!
      float nearFade = smoothstep(1.2, 4.2, camDist);
      if (nearFade < 0.01) discard;

      float alpha;
      if (isDrop > 0.5) {
        // Crisp fine glistening water droplet streak (clean near fade prevents close-up blobs!)
        float xFade = 1.0 - abs(vUv.x * 2.0 - 1.0);
        xFade = xFade * xFade;
        float yFade = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.55, vUv.y);
        alpha = xFade * yFade * vMeta.x * 0.56 * smoothstep(2.4, 5.2, camDist);
      } else {
        // PURE organic multi-octave fBm sea-mist wisp (ZERO Voronoi cellular webs!)
        vec2 p = vUv * 2.0 - 1.0;
        float r = length(p);
        if (r > 1.0) discard;
        float seed = vMeta.y;
        float age = vMeta.w;
        vec2 offA = vec2(fract(seed * 0.37), fract(seed * 0.71));
        vec2 offB = vec2(fract(seed * 0.53), fract(seed * 0.19));

        // Domain-warped double-octave soft Perlin mist
        vec2 nWarp = (texture(uNoiseTex, vUv * 0.55 + offA).rb - 0.5) * 0.32;
        float f1 = texture(uNoiseTex, vUv * 0.65 + offA + nWarp - vec2(age * 0.18, age * 0.10)).r;
        float f2 = texture(uNoiseTex, vUv * 1.35 + offB - nWarp * 0.6 + vec2(age * 0.24, -age * 0.14)).b;
        float mistTex = f1 * 0.62 + f2 * 0.38;

        // Irregular ragged feather falloff (completely hides quad/circle boundary!)
        float radial = pow(1.0 - smoothstep(0.0, 1.0, r), 1.45);
        float wisp = smoothstep(0.14, 0.78, mistTex * 1.25 - r * 0.32);
        alpha = radial * wisp * vMeta.x * 0.42 * nearFade;
      }

      if (alpha < 0.004) discard;

      // Physically restrained storm night lighting on translucent sea spray!
      vec3 col = vec3(0.15, 0.23, 0.31);
      col += vec3(0.76, 0.90, 1.0) * (uLightningInt0 + uLightningInt1) * 0.95;

      float attBow = pointAtten(length(uBowLampPos - vWorldPos), 20.0);
      float attFL  = spotAtten(vWorldPos - uFloodLPos, uFloodDir, 42.0);
      float attFR  = spotAtten(vWorldPos - uFloodRPos, uFloodDir, 42.0);
      float attP   = pointAtten(length(uPortNavPos - vWorldPos), 20.0);
      float attS   = pointAtten(length(uStbdNavPos - vWorldPos), 20.0);

      col += vec3(1.0, 0.78, 0.48) * attBow * 1.45;
      col += vec3(1.0, 0.66, 0.30) * (attFL + attFR) * 1.25;
      col += vec3(1.0, 0.12, 0.05) * attP * 1.05;
      col += vec3(0.08, 1.0, 0.42) * attS * 1.05;

      if (isDrop > 0.5) col *= 1.85; // Crisp glistening specular sparkle on flying water droplets!

      fragColor = vec4(col, alpha);
    }
  `;

  // --- 12F. 3D WIND-DRIVEN SIDEWAYS RAIN SHADER ---
  const rainVS = `#version 300 es
    layout(location=0) in vec2 aQuad;
    layout(location=1) in vec4 aSeed;

    uniform mat4 uVP;
    uniform vec3 uCamPos;
    uniform float uTime;
    uniform vec3 uWindRainVel;

    out vec2 vUv;
    out vec3 vWorldPos;
    out float vVar;

    void main() {
      vec3 box = vec3(34.0, 22.0, 34.0);
      float speedMult = 0.80 + aSeed.w * 0.46;
      vec3 vel = uWindRainVel * speedMult;

      vec3 localPos = fract(aSeed.xyz + (vel * uTime - uCamPos) / box) * box - box * 0.5;
      vec3 worldCenter = uCamPos + localPos;

      vec3 streakDir = normalize(vel);
      vec3 toCamVec = uCamPos - worldCenter;
      float camDist = length(toCamVec);
      vec3 toCam = toCamVec / max(camDist, 0.001);
      vec3 side = normalize(cross(streakDir, toCam));

      float streakLen = mix(0.65, 1.35, aSeed.w);
      // Distance-controlled gossamer-fine rain streaks (ZERO thick near-camera cigar blobs!)
      float streakWidth = mix(0.0026, 0.0052, aSeed.w) * clamp(camDist * 0.24, 0.38, 1.45);

      vec3 wp = worldCenter + side * (aQuad.x * streakWidth) + streakDir * (aQuad.y * streakLen * 0.5);
      vWorldPos = wp;
      vUv = aQuad * 0.5 + 0.5;
      vVar = aSeed.w;
      gl_Position = uVP * vec4(wp, 1.0);
    }
  `;

  const rainFS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    in vec3 vWorldPos;
    in float vVar;
    out vec4 fragColor;
    ${COMMON_LIGHTING_GLSL}

    void main() {
      float xFade = 1.0 - abs(vUv.x * 2.0 - 1.0);
      xFade = xFade * xFade;
      float yFade = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.65, vUv.y);
      float dist = length(uCamPos - vWorldPos);
      // Clean near fade so raindrops never turn into fat close-up pills!
      float distFade = smoothstep(2.2, 5.2, dist) * (1.0 - smoothstep(11.5, 17.0, dist));

      float shape = xFade * yFade * distFade;
      if (shape < 0.005) discard;

      vec3 col = vec3(0.24, 0.36, 0.50) * (0.45 + 0.45 * vVar);
      col += vec3(0.80, 0.92, 1.0) * (uLightningInt0 + uLightningInt1) * 1.10;

      float attFL  = spotAtten(vWorldPos - uFloodLPos, uFloodDir, 42.0);
      float attFR  = spotAtten(vWorldPos - uFloodRPos, uFloodDir, 42.0);
      float attBow = pointAtten(length(uBowLampPos - vWorldPos), 18.0);
      float attBr  = pointAtten(length(uBridgeGlowPos - vWorldPos), 20.0);
      float attP   = pointAtten(length(uPortNavPos - vWorldPos), 18.0);
      float attS   = pointAtten(length(uStbdNavPos - vWorldPos), 18.0);

      col += vec3(1.0, 0.70, 0.34) * (attFL + attFR) * 2.6;
      col += vec3(1.0, 0.82, 0.54) * attBow * 1.9;
      col += vec3(1.0, 0.64, 0.28) * attBr * 1.3;
      col += vec3(1.0, 0.14, 0.06) * attP * 1.9;
      col += vec3(0.08, 1.0, 0.44) * attS * 1.9;

      float alpha = shape * mix(0.16, 0.32, vVar);
      fragColor = vec4(col * alpha, alpha);
    }
  `;

  // --- 12G. VOLUMETRIC FLOODLIGHT CONE SHADER ---
  const coneVS = `#version 300 es
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNorm;
    layout(location=2) in float aAlong;
    uniform mat4 uModel;
    uniform mat4 uVP;
    out vec3 vWorldPos;
    out vec3 vNormal;
    out float vAlong;
    void main() {
      vec4 wp = uModel * vec4(aPos, 1.0);
      vWorldPos = wp.xyz;
      vNormal = normalize(mat3(uModel) * aNorm);
      vAlong = aAlong;
      gl_Position = uVP * wp;
    }
  `;

  const coneFS = `#version 300 es
    precision highp float;
    in vec3 vWorldPos;
    in vec3 vNormal;
    in float vAlong;
    uniform vec3 uCamPos;
    uniform vec3 uConeColor;
    uniform float uTime;
    uniform sampler2D uNoiseTex;
    out vec4 fragColor;
    void main() {
      vec3 V = normalize(uCamPos - vWorldPos);
      float rim = pow(abs(dot(normalize(vNormal), V)), 1.9);
      float alongFade = smoothstep(0.0, 0.08, vAlong) * pow(1.0 - vAlong, 1.9);
      float mist = 0.68 + 0.52 * texture(uNoiseTex, vWorldPos.xz * 0.08 - vec2(0.74, 0.67) * uTime * 0.45).r;
      float alpha = rim * alongFade * mist * 0.11;
      fragColor = vec4(uConeColor * alpha, 0.0);
    }
  `;

  // --- 12H. POST-PROCESS: BLOOM & FILMIC ACES COMPOSITE (CLEAN OPTICAL LENS!) ---
  const fsQuadVS = `#version 300 es
    out vec2 vUv;
    void main() {
      vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
      vUv = p;
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }
  `;

  const bloomExtractFS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    uniform sampler2D uTex;
    out vec4 fragColor;
    void main() {
      vec3 c = texture(uTex, vUv).rgb;
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float soft = smoothstep(0.72, 1.65, lum);
      fragColor = vec4(c * soft, 1.0);
    }
  `;

  const blurFS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    uniform sampler2D uTex;
    uniform vec2 uDir;
    out vec4 fragColor;
    void main() {
      vec3 sum = texture(uTex, vUv).rgb * 0.227027;
      sum += texture(uTex, vUv + uDir * 1.384615).rgb * 0.316216;
      sum += texture(uTex, vUv - uDir * 1.384615).rgb * 0.316216;
      sum += texture(uTex, vUv + uDir * 3.230769).rgb * 0.070270;
      sum += texture(uTex, vUv - uDir * 3.230769).rgb * 0.070270;
      fragColor = vec4(sum, 1.0);
    }
  `;

  const compositeFS = `#version 300 es
    precision highp float;
    in vec2 vUv;
    uniform sampler2D uSceneTex;
    uniform sampler2D uBloomTex;
    uniform vec2 uResolution;
    uniform float uTime;
    uniform float uLensSpray;
    out vec4 fragColor;

    // Pure optical refraction droplets (ZERO fake glowing donut rings!)
    // Only subtle water beads near outer corners & surging briefly when spray slams over bow!
    vec2 opticalLensDrops(vec2 uv, float aspect, float t, float sprayAmt) {
      vec2 centered = uv - 0.5;
      float cornerMask = smoothstep(0.42, 0.74, length(centered * vec2(1.0, 1.15))) * (0.28 + 0.72 * sprayAmt)
                       + sprayAmt * 0.25 * smoothstep(0.22, 0.55, length(centered));
      if (cornerMask < 0.01) return vec2(0.0);

      vec2 p = vec2(uv.x * aspect, uv.y) * 5.2;
      float colId = floor(p.x);
      float colRnd = fract(sin(colId * 127.1 + 19.3) * 43758.5453);
      // Gravity slide with intermittent stick-slip pause
      float slide = t * (0.12 + colRnd * 0.22);
      p.y += slide + sin(slide * 3.0) * 0.14;
      vec2 id = floor(p);
      vec2 f = fract(p) - 0.5;
      vec3 rnd = fract(sin(vec3(dot(id, vec2(127.1, 311.7)), dot(id, vec2(269.5, 183.3)), dot(id, vec2(419.2, 371.9)))) * 43758.5453);
      if (rnd.z < 0.68) return vec2(0.0);

      vec2 off = (rnd.xy - 0.5) * 0.45;
      vec2 d = f - off;
      d.y *= 0.72; // Teardrop elongation
      float r = length(d);
      float rad = 0.08 + 0.07 * rnd.x;
      if (r >= rad) return vec2(0.0);
      // Smooth convex-lens refraction offset (pure optical bend, zero additive ring!)
      float dome = sqrt(max(0.0, 1.0 - (r * r) / (rad * rad)));
      return -d * dome * 0.085 * cornerMask;
    }

    vec3 acesFilm(vec3 x) {
      const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    void main() {
      float aspect = uResolution.x / max(uResolution.y, 1.0);
      vec2 dropOff = opticalLensDrops(vUv, aspect, uTime, uLensSpray);
      vec2 uv = clamp(vUv + dropOff, vec2(0.001), vec2(0.999));

      vec2 fromCenter = uv - 0.5;
      float ca = dot(fromCenter, fromCenter) * 0.0035 + length(dropOff) * 0.12;
      vec3 col;
      col.r = texture(uSceneTex, clamp(uv + fromCenter * ca, vec2(0.001), vec2(0.999))).r;
      col.g = texture(uSceneTex, uv).g;
      col.b = texture(uSceneTex, clamp(uv - fromCenter * ca, vec2(0.001), vec2(0.999))).b;

      vec3 bloom = texture(uBloomTex, uv).rgb;
      col += bloom * 0.54;

      col *= 1.16;
      col = acesFilm(col);
      col = pow(col, vec3(1.0 / 2.2));
      col = mix(col, col * vec3(0.95, 0.99, 1.04), 0.20);

      float vig = 1.0 - dot(fromCenter * vec2(1.10, 1.04), fromCenter * vec2(1.10, 1.04)) * 0.52;
      col *= clamp(vig, 0.48, 1.0);

      float grain = (fract(sin(dot(gl_FragCoord.xy + fract(uTime) * 173.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.016;
      col = clamp(col + grain, 0.0, 1.0);

      fragColor = vec4(col, 1.0);
    }
  `;

  // =========================================================================
  // 13. FRAMEBUFFER PIPELINE
  // =========================================================================
  const hasHalfFloat = !!(gl.getExtension('EXT_color_buffer_half_float') || gl.getExtension('EXT_color_buffer_float'));
  gl.getExtension('OES_texture_half_float_linear');
  gl.getExtension('OES_texture_float_linear');

  function createRenderTarget(w, h, withDepth, tryHDR) {
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const useHalf = tryHDR && hasHalfFloat;
    const internalFmt = useHalf ? gl.RGBA16F : gl.RGBA8;
    const type = useHalf ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
    gl.texImage2D(gl.TEXTURE_2D, 0, internalFmt, w, h, 0, gl.RGBA, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

    let rbo = null;
    if (withDepth) {
      rbo = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, rbo);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rbo);
    }

    let status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (status !== gl.FRAMEBUFFER_COMPLETE && useHalf) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo, tex, rbo, w, h };
  }

  function destroyRenderTarget(rt) {
    if (!rt) return;
    gl.deleteFramebuffer(rt.fbo);
    gl.deleteTexture(rt.tex);
    if (rt.rbo) gl.deleteRenderbuffer(rt.rbo);
  }

  let rtScene = null, rtRefl = null, rtBloomA = null, rtBloomB = null;
  let viewW = 1, viewH = 1;

  function resizeTargets() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = Math.max(2, Math.floor(window.innerWidth * dpr));
    viewH = Math.max(2, Math.floor(window.innerHeight * dpr));
    canvas.width = viewW;
    canvas.height = viewH;

    destroyRenderTarget(rtScene);
    destroyRenderTarget(rtRefl);
    destroyRenderTarget(rtBloomA);
    destroyRenderTarget(rtBloomB);

    rtScene  = createRenderTarget(viewW, viewH, true, true);
    rtRefl   = createRenderTarget(Math.max(2, viewW >> 1), Math.max(2, viewH >> 1), true, true);
    rtBloomA = createRenderTarget(Math.max(2, viewW >> 2), Math.max(2, viewH >> 2), false, true);
    rtBloomB = createRenderTarget(Math.max(2, viewW >> 2), Math.max(2, viewH >> 2), false, true);
  }

  // =========================================================================
  // 14. INTERACTIVE CAMERA (360° DRAG, PINCH/SCROLL ZOOM, AUTO-RETURN)
  // =========================================================================
  const DEFAULT_YAW = 0.0;
  const DEFAULT_PITCH = -0.04;
  const DEFAULT_FOV = 60.0;

  const cam = {
    yaw: DEFAULT_YAW,
    pitch: DEFAULT_PITCH,
    fov: DEFAULT_FOV,
    targetYaw: DEFAULT_YAW,
    targetPitch: DEFAULT_PITCH,
    targetFov: DEFAULT_FOV,
    lastInputTime: -999,
    isInteracting: false,
    autoReturnDelay: 4.5,
    autoReturnActive: false,
    // Heroic eye-height on the wet forecastle deck looking cleanly over the sleek windlass & prow!
    localPos: [0.0, DECK_Y + 2.02, -19.2]
  };

  const hintEl = document.getElementById('hint');
  setTimeout(() => hintEl.classList.add('hidden'), 6500);

  function markInteraction(nowSec) {
    cam.lastInputTime = nowSec;
    cam.autoReturnActive = false;
    hintEl.classList.add('hidden');
  }

  const activePointers = new Map();
  let lastPinchDist = null;
  let lastDragX = 0, lastDragY = 0;

  function getPointerDist() {
    const pts = Array.from(activePointers.values());
    if (pts.length < 2) return null;
    return Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cam.isInteracting = true;
    markInteraction(performance.now() * 0.001);
    canvas.classList.add('dragging');
    if (activePointers.size === 1) {
      lastDragX = e.clientX;
      lastDragY = e.clientY;
    } else if (activePointers.size === 2) {
      lastPinchDist = getPointerDist();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    markInteraction(performance.now() * 0.001);

    if (activePointers.size === 1) {
      const dx = e.clientX - lastDragX;
      const dy = e.clientY - lastDragY;
      lastDragX = e.clientX;
      lastDragY = e.clientY;
      const sens = 0.0046 * (cam.fov / DEFAULT_FOV);
      cam.targetYaw += dx * sens;
      cam.targetPitch = clamp(cam.targetPitch - dy * sens, -1.26, 1.32);
    } else if (activePointers.size >= 2) {
      const dist = getPointerDist();
      if (dist !== null && lastPinchDist !== null && lastPinchDist > 5) {
        const ratio = lastPinchDist / dist;
        cam.targetFov = clamp(cam.targetFov * ratio, 25.0, 84.0);
      }
      lastPinchDist = dist;
    }
  });

  function endPointer(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size === 0) {
      cam.isInteracting = false;
      canvas.classList.remove('dragging');
      lastPinchDist = null;
      cam.lastInputTime = performance.now() * 0.001;
    } else if (activePointers.size === 1) {
      const rem = Array.from(activePointers.values())[0];
      lastDragX = rem.x;
      lastDragY = rem.y;
      lastPinchDist = null;
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    markInteraction(performance.now() * 0.001);
    const delta = clamp(e.deltaY, -120, 120);
    cam.targetFov = clamp(cam.targetFov + delta * 0.055, 25.0, 84.0);
  }, { passive: false });

  canvas.addEventListener('dblclick', () => {
    cam.targetYaw = Math.round(cam.yaw / TAU) * TAU + DEFAULT_YAW;
    cam.targetPitch = DEFAULT_PITCH;
    cam.targetFov = DEFAULT_FOV;
  });

  function updateCamera(dt, nowSec) {
    if (!cam.isInteracting && cam.lastInputTime > 0 && (nowSec - cam.lastInputTime) > cam.autoReturnDelay) {
      if (!cam.autoReturnActive) {
        cam.autoReturnActive = true;
        const wrappedYaw = ((cam.yaw % TAU) + TAU + Math.PI) % TAU - Math.PI;
        cam.yaw = wrappedYaw;
        cam.targetYaw = DEFAULT_YAW;
      }
      cam.targetYaw = DEFAULT_YAW;
      cam.targetPitch = DEFAULT_PITCH;
      cam.targetFov = DEFAULT_FOV;
    }

    const smoothRate = cam.autoReturnActive ? 1.85 : 10.5;
    const f = 1.0 - Math.exp(-smoothRate * dt);
    cam.yaw   = lerp(cam.yaw, cam.targetYaw, f);
    cam.pitch = lerp(cam.pitch, cam.targetPitch, f);
    cam.fov   = lerp(cam.fov, cam.targetFov, f);
  }

  // =========================================================================
  // 15. OPTIONAL PROCEDURAL WEB AUDIO STORM SOUNDSCAPE
  // =========================================================================
  let audioCtx = null, audioGain = null, audioPlaying = false;
  const audioBtn = document.getElementById('audio-btn');
  const iconMuted = document.getElementById('icon-muted');
  const iconSound = document.getElementById('icon-sound');

  function initStormAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    audioGain = audioCtx.createGain();
    audioGain.gain.value = 0.0;
    audioGain.connect(audioCtx.destination);

    const len = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.032;
        b2 = 0.950 * b2 + w * 0.048;
        data[i] = (b0 + b1 + b2 + w * 0.05) * 1.4;
      }
    }

    const oceanSrc = audioCtx.createBufferSource();
    oceanSrc.buffer = buf; oceanSrc.loop = true;
    const oceanFilter = audioCtx.createBiquadFilter();
    oceanFilter.type = 'lowpass'; oceanFilter.frequency.value = 185;
    const oceanGain = audioCtx.createGain(); oceanGain.gain.value = 0.55;
    oceanSrc.connect(oceanFilter).connect(oceanGain).connect(audioGain);
    oceanSrc.start();

    const windSrc = audioCtx.createBufferSource();
    windSrc.buffer = buf; windSrc.loop = true;
    const windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'bandpass'; windFilter.frequency.value = 460; windFilter.Q.value = 2.8;
    const windLfo = audioCtx.createOscillator();
    windLfo.frequency.value = 0.14;
    const windLfoGain = audioCtx.createGain(); windLfoGain.gain.value = 180;
    windLfo.connect(windLfoGain).connect(windFilter.frequency);
    const windGain = audioCtx.createGain(); windGain.gain.value = 0.24;
    windSrc.connect(windFilter).connect(windGain).connect(audioGain);
    windSrc.start(); windLfo.start();

    const rainSrc = audioCtx.createBufferSource();
    rainSrc.buffer = buf; rainSrc.loop = true;
    const rainFilter = audioCtx.createBiquadFilter();
    rainFilter.type = 'highpass'; rainFilter.frequency.value = 1750;
    const rainGain = audioCtx.createGain(); rainGain.gain.value = 0.14;
    rainSrc.connect(rainFilter).connect(rainGain).connect(audioGain);
    rainSrc.start();

    lightning.onStrikeSound = (peak, hasBolt) => {
      if (!audioPlaying || !audioCtx) return;
      const delay = hasBolt ? (0.45 + Math.random() * 0.9) : (1.2 + Math.random() * 1.6);
      const t0 = audioCtx.currentTime + delay;
      const thSrc = audioCtx.createBufferSource();
      thSrc.buffer = buf; thSrc.loop = true;
      const thFilt = audioCtx.createBiquadFilter();
      thFilt.type = 'lowpass';
      thFilt.frequency.setValueAtTime(hasBolt ? 280 : 140, t0);
      thFilt.frequency.exponentialRampToValueAtTime(48, t0 + 3.6);
      const thEnv = audioCtx.createGain();
      const vol = clamp(peak * 0.25, 0.15, 0.65);
      thEnv.gain.setValueAtTime(0.001, t0);
      thEnv.gain.linearRampToValueAtTime(vol, t0 + 0.12);
      thEnv.gain.exponentialRampToValueAtTime(vol * 0.35, t0 + 1.1);
      thEnv.gain.exponentialRampToValueAtTime(0.001, t0 + 4.2);
      thSrc.connect(thFilt).connect(thEnv).connect(audioGain);
      thSrc.start(t0);
      thSrc.stop(t0 + 4.4);
    };
  }

  audioBtn.addEventListener('click', () => {
    initStormAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audioPlaying = !audioPlaying;
    audioGain.gain.setTargetAtTime(audioPlaying ? 0.65 : 0.0, audioCtx.currentTime, 0.25);
    iconMuted.style.display = audioPlaying ? 'none' : 'block';
    iconSound.style.display = audioPlaying ? 'block' : 'none';
  });

  // =========================================================================
  // 16. INITIALIZE GPU RESOURCES & PROGRAMS
  // =========================================================================
  const { noiseTex, waveNormalTex } = createSeamlessNoiseTextures();
  const shipMeshes = buildShipMeshes();
  const oceanMesh = buildOceanMesh();
  const rainVao = buildRainVAO();
  const lightConeMesh = buildLightConeVAO();
  const emptyVao = gl.createVertexArray();
  initBoltGeometry();
  initSprayBuffers();

  const progSky          = createProgram(skyVS, skyFS);
  const progBolt         = createProgram(boltVS, boltFS);
  const progOcean        = createProgram(oceanVS, oceanFS);
  const progShip         = createProgram(shipVS, shipFS);
  const progSpray        = createProgram(sprayVS, sprayFS);
  const progRain         = createProgram(rainVS, rainFS);
  const progCone         = createProgram(coneVS, coneFS);
  const progBloomExtract = createProgram(fsQuadVS, bloomExtractFS);
  const progBlur         = createProgram(fsQuadVS, blurFS);
  const progComposite    = createProgram(fsQuadVS, compositeFS);

  resizeTargets();
  window.addEventListener('resize', resizeTargets);

  let simTime = 6.0;
  updateWavePhases(simTime);
  for (let i = 0; i < 60; i++) {
    simTime += 0.05;
    updateWavePhases(simTime);
    stepShipPhysics(0.05, simTime);
  }
  triggerBowSprayBurst(0.95);

  // =========================================================================
  // 17. SHARED UNIFORM UPLOAD & MAIN RENDER LOOP
  // =========================================================================
  const worldLights = {
    floodL: [0, 0, 0], floodR: [0, 0, 0], floodDir: [0, 0, -1],
    bowLamp: [0, 0, 0], portNav: [0, 0, 0], stbdNav: [0, 0, 0], bridge: [0, 0, 0],
    lDir0: [0, 0.3, -1], lDir1: [0.5, 0.3, -0.8]
  };

  function uploadCommonLighting(u, camWorldPos) {
    if (u.uCamPos) gl.uniform3f(u.uCamPos, camWorldPos[0], camWorldPos[1], camWorldPos[2]);
    if (u.uTime) gl.uniform1f(u.uTime, simTime);
    if (u.uLightningDir0) gl.uniform3fv(u.uLightningDir0, worldLights.lDir0);
    if (u.uLightningInt0) gl.uniform1f(u.uLightningInt0, lightning.slots[0].intensity);
    if (u.uLightningDir1) gl.uniform3fv(u.uLightningDir1, worldLights.lDir1);
    if (u.uLightningInt1) gl.uniform1f(u.uLightningInt1, lightning.slots[1].intensity);

    if (u.uFloodLPos) gl.uniform3fv(u.uFloodLPos, worldLights.floodL);
    if (u.uFloodRPos) gl.uniform3fv(u.uFloodRPos, worldLights.floodR);
    if (u.uFloodDir)  gl.uniform3fv(u.uFloodDir, worldLights.floodDir);
    if (u.uBowLampPos) gl.uniform3fv(u.uBowLampPos, worldLights.bowLamp);
    if (u.uPortNavPos) gl.uniform3fv(u.uPortNavPos, worldLights.portNav);
    if (u.uStbdNavPos) gl.uniform3fv(u.uStbdNavPos, worldLights.stbdNav);
    if (u.uBridgeGlowPos) gl.uniform3fv(u.uBridgeGlowPos, worldLights.bridge);
  }

  const matProj = new Float32Array(16);
  const matView = new Float32Array(16);
  const matVP = new Float32Array(16);
  const matInvVP = new Float32Array(16);
  const matReflView = new Float32Array(16);
  const matReflVP = new Float32Array(16);
  const matReflInvVP = new Float32Array(16);
  const matDeckReflect = new Float32Array(16);
  const matRadarModel = new Float32Array(16);
  const matConeL = new Float32Array(16);
  const matConeR = new Float32Array(16);

  {
    const tUp = m4Translate(0, 2 * DECK_Y, 0);
    const sY = m4Scale(1, -1, 1);
    m4Mul(tUp, sY, matDeckReflect);
  }

  let camWorldPos = [0, 0, 0];
  let camRight = [1, 0, 0], camUp = [0, 1, 0];

  function computeCameraMatrices() {
    const shakeAmp = shipState.slamShake * 0.045;
    const sx = Math.sin(shipState.slamPhase * 1.1) * shakeAmp;
    const sy = Math.cos(shipState.slamPhase * 1.7) * shakeAmp * 1.3;

    const eyeLocal = [cam.localPos[0] + sx, cam.localPos[1] + sy, cam.localPos[2]];
    m4TransformPoint(shipState.matrix, eyeLocal[0], eyeLocal[1], eyeLocal[2], camWorldPos);

    const rLookY = m4RotY(-cam.yaw);
    const rLookX = m4RotX(cam.pitch);
    const rLook = m4Mul(rLookY, rLookX);

    const rShip = m4Identity();
    for (let c = 0; c < 3; c++) {
      rShip[c * 4 + 0] = shipState.matrix[c * 4 + 0];
      rShip[c * 4 + 1] = shipState.matrix[c * 4 + 1];
      rShip[c * 4 + 2] = shipState.matrix[c * 4 + 2];
    }
    const camRotWorld = m4Mul(rShip, rLook);

    camRight = [camRotWorld[0], camRotWorld[1], camRotWorld[2]];
    camUp    = [camRotWorld[4], camRotWorld[5], camRotWorld[6]];

    const camToWorld = new Float32Array(camRotWorld);
    camToWorld[12] = camWorldPos[0];
    camToWorld[13] = camWorldPos[1];
    camToWorld[14] = camWorldPos[2];
    m4Invert(camToWorld, matView);

    const aspect = viewW / viewH;
    m4Perspective(cam.fov * Math.PI / 180, aspect, 0.22, 4200.0, matProj);
    m4Mul(matProj, matView, matVP);
    m4Invert(matVP, matInvVP);

    // Exact planar reflection across y_local = DECK_Y
    const tmp1 = m4Mul(shipState.matrix, matDeckReflect);
    const worldReflect = m4Mul(tmp1, shipState.invMatrix);
    m4Mul(matView, worldReflect, matReflView);
    m4Mul(matProj, matReflView, matReflVP);
    m4Invert(matReflVP, matReflInvVP);
  }

  function updateWorldLights() {
    m4TransformPoint(shipState.matrix, ...SHIP_LIGHTS_LOCAL.floodL, worldLights.floodL);
    m4TransformPoint(shipState.matrix, ...SHIP_LIGHTS_LOCAL.floodR, worldLights.floodR);
    m4TransformDir(shipState.matrix, 0.0, -0.34, -0.94, worldLights.floodDir);
    const fl = Math.hypot(...worldLights.floodDir) || 1;
    worldLights.floodDir[0] /= fl; worldLights.floodDir[1] /= fl; worldLights.floodDir[2] /= fl;

    m4TransformPoint(shipState.matrix, ...SHIP_LIGHTS_LOCAL.bowLamp, worldLights.bowLamp);
    m4TransformPoint(shipState.matrix, ...SHIP_LIGHTS_LOCAL.portNav, worldLights.portNav);
    m4TransformPoint(shipState.matrix, ...SHIP_LIGHTS_LOCAL.stbdNav, worldLights.stbdNav);
    m4TransformPoint(shipState.matrix, ...SHIP_LIGHTS_LOCAL.bridge,  worldLights.bridge);

    for (let i = 0; i < 2; i++) {
      const sl = lightning.slots[i];
      const ce = Math.cos(sl.elev);
      const dst = i === 0 ? worldLights.lDir0 : worldLights.lDir1;
      dst[0] = Math.sin(sl.az) * ce;
      dst[1] = Math.sin(sl.elev);
      dst[2] = -Math.cos(sl.az) * ce;
    }

    const rp = shipMeshes.radarPos;
    const tRad = m4Translate(rp[0], rp[1], rp[2]);
    const rRad = m4RotY(simTime * 2.4);
    m4Mul(shipState.matrix, m4Mul(tRad, rRad), matRadarModel);

    const pitchDown = m4RotX(-0.35);
    const coneScale = m4Scale(5.2, 5.2, 24.0);
    const coneLocal = m4Mul(pitchDown, coneScale);
    m4Mul(shipState.matrix, m4Mul(m4Translate(...SHIP_LIGHTS_LOCAL.floodL), coneLocal), matConeL);
    m4Mul(shipState.matrix, m4Mul(m4Translate(...SHIP_LIGHTS_LOCAL.floodR), coneLocal), matConeR);
  }

  function renderSkyAndBolts(vpMat, invVpMat, camPos) {
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.disable(gl.BLEND);
    gl.useProgram(progSky.program);
    gl.uniformMatrix4fv(progSky.u.uInvVP, false, invVpMat);
    uploadCommonLighting(progSky.u, camPos);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.uniform1i(progSky.u.uNoiseTex, 0);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const sl0 = lightning.slots[0];
    if (sl0.active && sl0.hasBolt && sl0.intensity > 0.08 && lightning.boltVertCount > 0) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.useProgram(progBolt.program);
      gl.uniformMatrix4fv(progBolt.u.uVP, false, vpMat);
      gl.uniform1f(progBolt.u.uBoltIntensity, clamp(sl0.intensity * 0.72, 0, 2.4));
      gl.bindVertexArray(lightning.boltMeshVao);
      gl.drawArrays(gl.TRIANGLES, 0, lightning.boltVertCount);
      gl.disable(gl.BLEND);
    }
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);
  }

  function renderShip(vpMat, camPos, isReflPass) {
    gl.useProgram(progShip.program);
    gl.uniformMatrix4fv(progShip.u.uVP, false, vpMat);
    gl.uniform1f(progShip.u.uIsReflectionPass, isReflPass ? 1.0 : 0.0);
    gl.uniform1f(progShip.u.uClipDeckY, DECK_Y + 0.02);
    gl.uniform2f(progShip.u.uResolution, viewW, viewH);
    const beaconPulse = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(simTime * 3.1), 4.0);
    gl.uniform1f(progShip.u.uBeaconPulse, beaconPulse);
    uploadCommonLighting(progShip.u, camPos);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.uniform1i(progShip.u.uNoiseTex, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, waveNormalTex);
    gl.uniform1i(progShip.u.uWaveNormalTex, 1);

    // CRITICAL: Never leave rtRefl.tex bound to TEXTURE2 while rendering INTO rtRefl.fbo!
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, isReflPass ? noiseTex : rtRefl.tex);
    gl.uniform1i(progShip.u.uReflTex, 2);

    gl.uniformMatrix4fv(progShip.u.uModel, false, shipState.matrix);
    gl.bindVertexArray(shipMeshes.ship.vao);
    gl.drawElements(gl.TRIANGLES, shipMeshes.ship.count, gl.UNSIGNED_INT, 0);

    gl.uniformMatrix4fv(progShip.u.uModel, false, matRadarModel);
    gl.bindVertexArray(shipMeshes.radar.vao);
    gl.drawElements(gl.TRIANGLES, shipMeshes.radar.count, gl.UNSIGNED_INT, 0);
  }

  function renderFrame(activeSprayCount) {
    // PASS 1: PLANAR WET-DECK REFLECTION FBO (Feedback-loop free!)
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, null);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtRefl.fbo);
    gl.viewport(0, 0, rtRefl.w, rtRefl.h);
    gl.clearColor(0.01, 0.02, 0.04, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.disable(gl.CULL_FACE);
    renderSkyAndBolts(matReflVP, matReflInvVP, camWorldPos);

    gl.enable(gl.CULL_FACE);
    gl.frontFace(gl.CW);
    renderShip(matReflVP, camWorldPos, true);
    gl.frontFace(gl.CCW);

    // PASS 2: MAIN HDR SCENE PASS
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fbo);
    gl.viewport(0, 0, rtScene.w, rtScene.h);
    gl.clearColor(0.01, 0.02, 0.04, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // 2a. Volumetric Storm Sky & Lightning
    gl.disable(gl.CULL_FACE);
    renderSkyAndBolts(matVP, matInvVP, camWorldPos);

    // 2b. Huge Gerstner Storm Ocean
    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(progOcean.program);
    gl.uniformMatrix4fv(progOcean.u.uVP, false, matVP);
    gl.uniform4fv(progOcean.u.uWaveA, uWaveA);
    gl.uniform4fv(progOcean.u.uWaveB, uWaveB);
    gl.uniformMatrix4fv(progOcean.u.uShipInv, false, shipState.invMatrix);
    gl.uniform1f(progOcean.u.uShipTravelZ, shipTravelZ);
    uploadCommonLighting(progOcean.u, camWorldPos);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.uniform1i(progOcean.u.uNoiseTex, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, waveNormalTex);
    gl.uniform1i(progOcean.u.uWaveNormalTex, 1);

    gl.bindVertexArray(oceanMesh.vao);
    gl.drawElements(gl.TRIANGLES, oceanMesh.count, gl.UNSIGNED_INT, 0);

    // 2c. Full 360° Wet Ship & Mirror-Puddle Deck
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    renderShip(matVP, camWorldPos, false);

    // 2d. Volumetric Floodlight Cones
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    gl.useProgram(progCone.program);
    gl.uniformMatrix4fv(progCone.u.uVP, false, matVP);
    gl.uniform3fv(progCone.u.uCamPos, camWorldPos);
    gl.uniform3f(progCone.u.uConeColor, 1.0, 0.70, 0.34);
    gl.uniform1f(progCone.u.uTime, simTime);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.uniform1i(progCone.u.uNoiseTex, 0);
    gl.bindVertexArray(lightConeMesh.vao);
    gl.uniformMatrix4fv(progCone.u.uModel, false, matConeL);
    gl.drawArrays(gl.TRIANGLES, 0, lightConeMesh.count);
    gl.uniformMatrix4fv(progCone.u.uModel, false, matConeR);
    gl.drawArrays(gl.TRIANGLES, 0, lightConeMesh.count);

    // 2e. Photorealistic Bow Spray Plumes & Velocity-Aligned Ballistic Water Droplets
    if (activeSprayCount > 0) {
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(progSpray.program);
      gl.uniformMatrix4fv(progSpray.u.uVP, false, matVP);
      gl.uniform3fv(progSpray.u.uCamRight, camRight);
      gl.uniform3fv(progSpray.u.uCamUp, camUp);
      uploadCommonLighting(progSpray.u, camWorldPos);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, noiseTex);
      gl.uniform1i(progSpray.u.uNoiseTex, 0);
      gl.bindVertexArray(sprayVao);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, activeSprayCount);
    }

    // 2f. 6,800 Crisp 3D Wind-Driven Sideways Rain Streaks
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progRain.program);
    gl.uniformMatrix4fv(progRain.u.uVP, false, matVP);
    // Strong sideways gale cross-wind tilting rain unmistakably across the bow & deck!
    const gust = 1.0 + 0.22 * Math.sin(simTime * 0.85) + 0.14 * Math.sin(simTime * 2.1);
    const rainVX = WIND_DIR[0] * 31.0 * gust;
    const rainVY = -16.8;
    const rainVZ = WIND_DIR[1] * 17.5 * gust + SHIP_SPEED;
    gl.uniform3f(progRain.u.uWindRainVel, rainVX, rainVY, rainVZ);
    uploadCommonLighting(progRain.u, camWorldPos);
    gl.bindVertexArray(rainVao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, RAIN_COUNT);

    gl.depthMask(true);
    gl.disable(gl.BLEND);

    // PASS 3: QUARTER-RES HDR BLOOM
    gl.disable(gl.DEPTH_TEST);
    gl.bindVertexArray(emptyVao);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomA.fbo);
    gl.viewport(0, 0, rtBloomA.w, rtBloomA.h);
    gl.useProgram(progBloomExtract.program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
    gl.uniform1i(progBloomExtract.u.uTex, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(progBlur.program);
    gl.uniform1i(progBlur.u.uTex, 0);
    for (let pass = 0; pass < 2; pass++) {
      const spread = pass === 0 ? 1.0 : 2.1;
      gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomB.fbo);
      gl.viewport(0, 0, rtBloomB.w, rtBloomB.h);
      gl.bindTexture(gl.TEXTURE_2D, rtBloomA.tex);
      gl.uniform2f(progBlur.u.uDir, spread / rtBloomA.w, 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.bindFramebuffer(gl.FRAMEBUFFER, rtBloomA.fbo);
      gl.viewport(0, 0, rtBloomA.w, rtBloomA.h);
      gl.bindTexture(gl.TEXTURE_2D, rtBloomB.tex);
      gl.uniform2f(progBlur.u.uDir, 0.0, spread / rtBloomA.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // PASS 4: FILMIC ACES COMPOSITE + OPTICAL LENS DROPLETS + FILM GRAIN
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, viewW, viewH);
    gl.useProgram(progComposite.program);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
    gl.uniform1i(progComposite.u.uSceneTex, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtBloomA.tex);
    gl.uniform1i(progComposite.u.uBloomTex, 1);
    gl.uniform2f(progComposite.u.uResolution, viewW, viewH);
    gl.uniform1f(progComposite.u.uTime, simTime);
    gl.uniform1f(progComposite.u.uLensSpray, lensSprayImpulse);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // =========================================================================
  // 18. MAIN ANIMATION LOOP
  // =========================================================================
  let lastTs = performance.now();

  function tick(ts) {
    requestAnimationFrame(tick);
    const dt = Math.min((ts - lastTs) * 0.001, 0.05);
    lastTs = ts;
    simTime += dt;

    updateWavePhases(simTime);
    stepShipPhysics(dt, simTime);
    updateLightning(dt);
    const activeSpray = updateSpray(dt, simTime);
    updateCamera(dt, ts * 0.001);
    computeCameraMatrices();
    updateWorldLights();
    renderFrame(activeSpray);
  }

  requestAnimationFrame(tick);
})();
</script>
