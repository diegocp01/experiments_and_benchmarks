<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokyo Alley — Rain</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;cursor:grab}
  canvas:active{cursor:grabbing}
  #hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:#cfd3e0;font-size:11px;letter-spacing:.22em;
        text-transform:uppercase;opacity:.75;transition:opacity 2.5s;pointer-events:none;text-shadow:0 0 8px #000}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#f88;white-space:pre-wrap;
       font:12px/1.4 ui-monospace,monospace;padding:30px;background:#000}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">click for sound &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; space pause &nbsp;·&nbsp; F fullscreen</div>
<div id="err"></div>
<script>
"use strict";
/* =====================================================================
   Rainy neon Tokyo alley — everything is generated in code.
   - Scene: signed-distance-field raymarch of an endless procedural alley
   - Signs: kanji/kana light boxes + neon drawn to a canvas atlas
   - Wet ground: traced, roughness-jittered reflections + rect-light lobes
   - Volumetrics: jittered fog march with steam plumes lit by the signs
   - Rain: world-anchored streak shells lit by nearby lights, puddle ripples
   - Post: reprojection TAA, dual-filter bloom, ACES, CA, grain, vignette
   ===================================================================== */

const VS = `#version 300 es
void main(){ vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2)); gl_Position=vec4(p*2.-1.,0.,1.); }`;

const FS_SCENE = `#version 300 es
precision highp float;
precision highp int;
layout(location=0) out vec4 oCol;
layout(location=1) out vec4 oRain;
uniform vec2 uRes; uniform float uTime; uniform float uFrame;
uniform vec3 uPos; uniform mat3 uCam; uniform float uFocal; uniform vec2 uJit;
uniform sampler2D uAtlas; uniform vec3 uVCol[16]; uniform vec3 uHCol[16];

const float W=1.7;
const float CELL=7.0;
const float FAR=95.;
const float SIGN_I=4.5;
const float LG=1.6;
float uPx;

float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float h31(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
vec4 h14(float p){ vec4 p4=fract(vec4(p)*vec4(.1031,.1030,.0973,.1099)); p4+=dot(p4,p4.wzxy+33.33); return fract((p4.xxyz+p4.yzzw)*p4.zywx); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+17.1; a*=.5; } return s; }
float vnoise3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1.,0.,0.)),f.x),mix(h31(i+vec3(0.,1.,0.)),h31(i+vec3(1.,1.,0.)),f.x),f.y),
             mix(mix(h31(i+vec3(0.,0.,1.)),h31(i+vec3(1.,0.,1.)),f.x),mix(h31(i+vec3(0.,1.,1.)),h31(i+vec3(1.,1.,1.)),f.x),f.y),f.z); }
float fbm3(vec3 p){ return .55*vnoise3(p)+.3*vnoise3(p*2.1+5.3)+.15*vnoise3(p*4.3+9.1); }

struct Cell{ float off; float H; float vOn; float vz; float vy; float vh; float sz; float sT; float hOn;
  float vend; float vendZ; float lant; float awn; float tone; float ac; float crate; int vi; int hi; vec3 shopCol; vec3 lantCol; };

Cell getCell(float ci,float s){
  vec4 a=h14(ci*7.31+s*19.7+3.1), b=h14(ci*3.17-s*5.3+71.9), c=h14(ci*1.93+s*2.9+13.3);
  Cell C;
  C.off=floor(a.x*4.)*.07;
  C.H=8.+a.y*8.;
  C.vOn=step(.1,a.z);
  C.vz=(a.w-.5)*4.2;
  C.vy=4.+b.x*1.5; C.vh=.9+b.y*.5;
  C.vi=int(b.z*15.99);
  C.sz=(b.w-.5)*1.2;
  C.sT=c.x;
  C.hOn=step(.22,c.y);
  C.hi=int(c.z*15.99);
  C.vend=step(.74,c.w);
  C.vendZ=(fract(a.x*7.7)>.5?1.:-1.)*2.72;
  float lh=fract(c.w*7.3);
  C.lant=(C.sT>.4&&C.sT<.65)?step(.25,lh):step(.7,lh);
  C.awn=(C.sT<.4)?step(.5,fract(a.y*5.7)):0.;
  C.tone=fract(a.z*9.1);
  C.ac=step(.45,fract(b.x*4.3));
  C.crate=step(.5,fract(b.y*6.1));
  vec3 warm=vec3(1.,.6,.28)*1.7, cool=vec3(.7,.88,1.)*1.4;
  C.shopCol=C.sT<.4?mix(warm,cool,step(.6,fract(c.x*23.))):(C.sT<.65?vec3(1.,.5,.2)*2.2:vec3(0.));
  C.lantCol=fract(c.y*11.)>.35?vec3(1.,.13,.04)*3.5:vec3(1.,.7,.4)*3.;
  return C;
}

float flick(float sd){
  float h=h11(sd*1.37+.7); float f=1.;
  if(h>.8){ float n=h11(floor(uTime*14.)+sd*3.); f=mix(1.,.2,step(.7,n)*step(.35,sin(uTime*.7+sd*5.)*.5+.5)); }
  return f*(.97+.03*sin(uTime*47.+sd*9.));
}
vec3 vColF(Cell C,float ci,float s){ return uVCol[C.vi]*SIGN_I*flick(ci*2.+s); }
vec3 hColF(Cell C,float ci,float s){ return uHCol[C.hi]*SIGN_I*flick(ci*2.+s+100.); }

float sdBox(vec3 p,vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
vec2 opU(vec2 a,float d,float m){ return d<a.x?vec2(d,m):a; }

vec2 mapRaw(vec3 p){
  float ci=floor(p.z/CELL), zl=p.z-(ci+.5)*CELL, s=p.x<0.?-1.:1., ax=abs(p.x);
  Cell C=getCell(ci,s);
  float wx=W+C.off, u=wx-ax;
  vec2 r=vec2(p.y,1.);
  r=opU(r,max(u,p.y-C.H),2.);
  // kerb
  { vec2 q=abs(vec2(u-.12,p.y-.03))-vec2(.13,.05); r=opU(r,length(max(q,0.))+min(max(q.x,q.y),0.)-.01,11.); }
  if(C.vOn>.5){
    r=opU(r,sdBox(vec3(u-.44,p.y-C.vy,zl-C.vz),vec3(.3,C.vh,.055))-.008,3.);
    r=opU(r,sdBox(vec3(u-.07,abs(p.y-C.vy)-C.vh*.7,zl-C.vz),vec3(.08,.025,.025)),8.);
  }
  float zs=zl-C.sz;
  if(C.hOn>.5) r=opU(r,sdBox(vec3(u-.07,p.y-2.78,zs),vec3(.06,.3,1.25)),4.);
  if(C.awn>.5){ vec3 q=vec3(u-.45,p.y-2.32,zs); r=opU(r,sdBox(vec3(q.x,q.y+q.x*.3,q.z),vec3(.45,.018,1.32))*.93,5.); }
  if(C.vend>.5) r=opU(r,sdBox(vec3(u-.36,p.y-.93,zl-C.vendZ),vec3(.33,.92,.5))-.012,6.);
  if(C.lant>.5){ float zr=zs-.85*clamp(round(zs/.85),-1.,1.); vec3 q=vec3(u-.62,p.y-2.,zr);
    r=opU(r,(length(q/vec3(.15,.2,.15))-1.)*.15,7.);
    r=opU(r,max(length(q.xz)-.006,abs(p.y-2.3)-.12),9.); }
  if(C.ac>.5){ r=opU(r,sdBox(vec3(u-.24,p.y-3.3,zl+C.vendZ),vec3(.22,.28,.38))-.01,8.); }
  if(C.crate>.5){
    r=opU(r,sdBox(vec3(u-.34,p.y-.17,zl+C.vendZ),vec3(.2,.155,.27))-.008,10.);
    r=opU(r,sdBox(vec3(u-.32,p.y-.5,zl+C.vendZ-.04),vec3(.2,.155,.27))-.008,10.);
  }
  r=opU(r,max(length(vec2(u-.07,zl-3.3))-.045,p.y-C.H),8.);
  // overhead cables
  float sag=1.-zl*zl/12.25;
  float dc=length(vec2(p.x+1.05,p.y-6.3+.3*sag));
  dc=min(dc,length(vec2(p.x-.35,p.y-6.9+.42*sag)));
  dc=min(dc,length(vec2(p.x-1.15,p.y-5.75+.25*sag)));
  r=opU(r,dc-.018,9.);
  return r;
}
vec2 map(vec3 p){
  vec2 r=mapRaw(p);
  float ci=floor(p.z/CELL), zl=p.z-(ci+.5)*CELL;
  r.x=min(r.x,min(abs(p.x)+.95,3.5-abs(zl)+.06));
  return r;
}
float march(vec3 ro,vec3 rd,float tmax,int steps,out float m){
  float t=.02; m=0.;
  for(int i=0;i<steps;i++){ vec2 h=map(ro+rd*t); if(h.x<.0012*t+.0006){ m=h.y; return t; } t+=h.x; if(t>tmax) break; }
  return tmax;
}
vec3 calcN(vec3 p,float t){ vec2 e=vec2(1.,-1.)*(.0008+.0004*t);
  return normalize(e.xyy*mapRaw(p+e.xyy).x+e.yyx*mapRaw(p+e.yyx).x+e.yxy*mapRaw(p+e.yxy).x+e.xxx*mapRaw(p+e.xxx).x); }
float ao(vec3 p,vec3 n){ float a=0.,sc=1.; for(int i=1;i<=4;i++){ float h=.02+.03*float(i*i); a+=(h-mapRaw(p+n*h).x)*sc; sc*=.6; } return clamp(1.-2.*a,0.,1.); }

// ---------------- lights ----------------
void rectL(inout vec3 dif,inout vec3 spc,vec3 p,vec3 n,vec3 r,float k,vec3 c,vec3 ln,vec3 e1,vec3 e2,vec3 col,float two){
  vec3 L=c-p; float d2=dot(L,L); vec3 l=L*inversesqrt(d2);
  float cl=dot(ln,-l); cl=two>1.5?1.:(two>.5?abs(cl):max(cl,0.));
  if(cl<=0.) return;
  float area=4.*length(e1)*length(e2);
  float nl=max(dot(n,l)*.85+.15,0.);
  dif+=col*(area*nl*cl/(d2+area));
  float dn=dot(r,ln); vec3 rep=c;
  if(two<1.5){ float tp=dot(L,ln)/(abs(dn)>1e-4?dn:1e-4);
    if(tp>0.){ vec3 h=p+r*tp-c; rep=c+e1*clamp(dot(h,e1)/dot(e1,e1),-1.,1.)+e2*clamp(dot(h,e2)/dot(e2,e2),-1.,1.); } }
  vec3 sl=normalize(rep-p);
  float rs=max(dot(r,sl),0.);
  float om=area*cl/d2;
  spc+=col*pow(rs,k)*min(1.,om*(k+2.)*.3)*step(0.,dot(n,sl));
}
void lights(vec3 p,vec3 n,vec3 r,float k,out vec3 dif,out vec3 spc){
  dif=vec3(0.); spc=vec3(0.);
  float c0=floor(p.z/CELL);
  for(int i=-1;i<=1;i++){ float ci=c0+float(i); float zc=(ci+.5)*CELL;
    for(int j=0;j<2;j++){ float s=j==0?-1.:1.; Cell C=getCell(ci,s); float wx=s*(W+C.off);
      if(C.vOn>.5) rectL(dif,spc,p,n,r,k,vec3(wx-s*.44,C.vy,zc+C.vz),vec3(0.,0.,1.),vec3(.3,0.,0.),vec3(0.,C.vh,0.),vColF(C,ci,s),1.);
      if(C.hOn>.5) rectL(dif,spc,p,n,r,k,vec3(wx-s*.14,2.78,zc+C.sz),vec3(-s,0.,0.),vec3(0.,0.,1.25),vec3(0.,.3,0.),hColF(C,ci,s),0.);
      if(C.sT<.65) rectL(dif,spc,p,n,r,k,vec3(wx-s*.01,1.25,zc+C.sz),vec3(-s,0.,0.),vec3(0.,0.,C.sT<.4?1.15:.7),vec3(0.,.95,0.),C.shopCol*(C.sT<.4?.55:.4),0.);
      if(C.vend>.5) rectL(dif,spc,p,n,r,k,vec3(wx-s*.71,1.2,zc+C.vendZ),vec3(-s,0.,0.),vec3(0.,0.,.42),vec3(0.,.45,0.),vec3(.8,.9,1.)*1.0,0.);
      if(C.lant>.5) rectL(dif,spc,p,n,r,k,vec3(wx-s*.62,2.,zc+C.sz),vec3(0.,1.,0.),vec3(0.,0.,.9),vec3(0.,.12,0.),C.lantCol*.7,2.);
    } }
}
vec3 pl(vec3 p,vec3 c,vec3 col,float area,vec3 ln,float two){
  vec3 L=c-p; float d2=dot(L,L); float cl=dot(ln,-L)*inversesqrt(d2); cl=two>1.5?1.:(two>.5?abs(cl):max(cl,0.));
  return col*(area*cl/(d2+.25));
}
vec3 fogLight(vec3 p){
  vec3 acc=vec3(0.); float c0=floor(p.z/CELL); float zl=p.z-(c0+.5)*CELL;
  for(int i=0;i<2;i++){ float ci=c0+(i==0?0.:(zl>0.?1.:-1.)); float zc=(ci+.5)*CELL;
    for(int j=0;j<2;j++){ float s=j==0?-1.:1.; Cell C=getCell(ci,s); float wx=s*(W+C.off);
      if(C.vOn>.5) acc+=pl(p,vec3(wx-s*.44,C.vy,zc+C.vz),vColF(C,ci,s),1.2*C.vh,vec3(0.,0.,1.),1.);
      if(C.hOn>.5) acc+=pl(p,vec3(wx-s*.14,2.78,zc+C.sz),hColF(C,ci,s),1.5,vec3(-s,0.,0.),0.);
      if(C.sT<.65) acc+=pl(p,vec3(wx-s*.01,1.25,zc+C.sz),C.shopCol*.5,C.sT<.4?4.3:2.6,vec3(-s,0.,0.),0.);
      if(C.vend>.5) acc+=pl(p,vec3(wx-s*.71,1.2,zc+C.vendZ),vec3(.8,.9,1.)*1.0,.75,vec3(-s,0.,0.),0.);
      if(C.lant>.5) acc+=pl(p,vec3(wx-s*.62,2.,zc+C.sz),C.lantCol*.7,.4,vec3(0.),2.);
    } }
  return acc;
}

// ---------------- sky / haze ----------------
vec3 hazeCol(vec3 rd){
  float e=pow(abs(rd.z),18.)*exp(-abs(rd.y+.02)*7.)*.45;
  return vec3(.035,.028,.05)+vec3(.55,.2,.34)*e*.55+vec3(.2,.25,.4)*e*.25;
}
vec3 sky(vec3 rd){
  float c=fbm(rd.xz/(abs(rd.y)+.35)*1.6+uTime*.01);
  return vec3(.03,.022,.04)+vec3(.14,.06,.08)*c*c*smoothstep(0.,.6,rd.y);
}

// ---------------- materials ----------------
vec3 shade(vec3 p,vec3 n,vec3 rd,float m,float t){
  float ci=floor(p.z/CELL), zl=p.z-(ci+.5)*CELL, s=p.x<0.?-1.:1., ax=abs(p.x);
  Cell C=getCell(ci,s); float wx=W+C.off, u=wx-ax;
  vec3 alb=vec3(.08), emi=vec3(0.); float k=30., f0=.04, sw=.3;
  float fade=exp(-t*.05);
  float zs=zl-C.sz;
  if(m<1.5){ alb=vec3(.04); k=200.; sw=1.; }
  else if(m<2.5){
    if(u<-.02 && p.y<C.H-.02) n=vec3(0.,0.,-sign(rd.z));
    bool front=abs(n.x)>.5;
    float tn=C.tone; vec3 base;
    float g1=fbm(vec2(p.z*.9,p.y*.9)+ci*3.1);
    if(tn<.35){ vec2 tq=vec2(p.z*6.5+floor(p.y*13.)*.5,p.y*13.); vec2 tf=fract(tq);
      float gr=mix(1.,smoothstep(0.,.05,tf.x)*smoothstep(0.,.1,tf.y),fade);
      vec3 tc=mix(vec3(.21,.17,.13),vec3(.10,.14,.16),step(.5,fract(tn*13.)));
      base=tc*(.75+.4*h21(floor(tq))*fade)*mix(.3,1.,gr); k=140.; sw=.7; }
    else if(tn<.7){ base=vec3(.17,.165,.16)*(.55+.7*g1);
      float se=min(abs(fract(p.y/1.4)-.5)*1.4,abs(fract(zl/1.75)-.5)*1.75);
      base*=mix(.45,1.,smoothstep(0.,.02,se)); k=40.; sw=.4; }
    else { float cor=.5+.5*sin(p.z*55.);
      base=mix(vec3(.05,.07,.08),vec3(.11,.07,.05),step(.5,fract(tn*7.)))*(.6+.5*mix(.5,cor,fade)); k=90.; sw=.7; }
    float streak=fbm(vec2(p.z*5.,p.y*.5)+ci);
    base*=.45+.75*streak; base*=mix(.5,1.,smoothstep(0.,1.6,p.y));
    alb=base;
    if(front && p.y>3.3 && p.y<C.H-.6){
      float fy=(p.y-3.3)/2.7; float fi=floor(fy), ff=fract(fy); float wz=(zl+3.5)/1.75; float wi=floor(wz), wf=fract(wz);
      vec2 wd=abs(vec2(wf,ff)-vec2(.5,.52))-vec2(.3,.26); float inw=max(wd.x,wd.y);
      if(inw<.03){ float hw=h21(vec2(wi+ci*4.+s*37.,fi+3.));
        if(inw<0.){ alb=vec3(.012); k=700.; sw=1.; f0=.07;
          if(hw>.58){ vec3 wc=mix(vec3(1.,.6,.28),vec3(.55,.8,1.),step(.84,hw));
            float cur=smoothstep(.2,.8,vnoise(vec2(wf*3.+wi,ff*2.+fi)*2.+hw*9.));
            float bl=mix(1.,.55+.45*sin(p.y*110.),fade*step(.6,fract(hw*9.)));
            emi=wc*(.2+.55*cur)*bl*(.35+fract(hw*31.)); }
        } else { alb=vec3(.11,.11,.12); k=90.; sw=.6; }
      } }
    if(front && abs(zs)<1.25 && p.y<2.42){
      if(C.sT<.4){
        float edge=min(1.25-abs(zs),2.42-p.y); float mul=abs(abs(zs)-.42);
        if(edge<.06 || mul<.025 || p.y<.3){ alb=p.y<.3?vec3(.08,.07,.06):vec3(.05,.05,.055); k=220.; sw=.8; }
        else { alb=vec3(.008); k=900.; sw=1.; f0=.07;
          float top=smoothstep(.3,2.3,p.y);
          float blob=vnoise(vec2(zs*2.3+ci*7.,p.y*1.7));
          float blob2=vnoise(vec2(zs*7.+ci,p.y*5.));
          float shelf=smoothstep(.03,0.,abs(fract(p.y*2.2)-.5)-.45);
          float pat=.3+.4*top+.45*blob+.2*blob2-.25*shelf;
          vec2 pq=vec2(zs*2.4+.5,p.y*1.9); vec2 pid=floor(pq), pf=fract(pq); float ph=h21(pid+ci*3.+s*11.);
          vec3 tint=vec3(1.);
          if(ph>.55 && pid.y>0.5 && pid.y<3.5){ vec2 pd=abs(pf-.5)-vec2(.36,.38);
            if(max(pd.x,pd.y)<0.) tint=mix(vec3(.9,.82,.65),vec3(.9,.25,.15),step(.82,ph))*(.3+.35*vnoise(pq*16.)+.2*step(.5,fract(pf.y*9.))); }
          float lamp=exp(-(pow(fract(zs*1.6)-.5,2.)*40.+pow(p.y-2.15,2.)*60.))*2.5;
          emi=C.shopCol*(max(pat,0.)*tint+lamp);
        }
      } else if(C.sT<.65){
        alb=vec3(.10,.06,.035)*(.5+.6*mix(.5,step(.3,fract(zs*14.)),fade)); k=60.; sw=.4;
        float zd=zs+.35;
        if(abs(zd)<.55 && p.y<2.1){
          if(p.y>1.35){
            float cell=floor(zd*3.63+.5);
            float slit=smoothstep(0.,.03,abs(fract(zd*3.63+.5)-.5));
            alb=vec3(.02,.03,.10); emi=C.shopCol*(.05+1.1*(1.-slit));
            float kam=length(vec2(zd-cell/3.63,p.y-1.72)); if(kam<.075 && kam>.05){ alb=vec3(.55); emi+=C.shopCol*.12; }
          } else { float inner=.5+.5*vnoise(vec2(zd*4.+ci,p.y*3.));
            emi=C.shopCol*(.45+.7*inner)*smoothstep(-.5,1.2,p.y); alb=vec3(.01); k=400.; }
        } else if(abs(zs-.72)<.38 && p.y>.85 && p.y<1.95){
          vec2 g=abs(fract(vec2(zs,p.y)*8.)-.5); float bar=smoothstep(.40,.44,max(g.x,g.y));
          emi=C.shopCol*vec3(1.,.9,.72)*.6*(1.-bar)*(.75+.25*vnoise(vec2(zs,p.y)*5.));
          alb=mix(vec3(.3),vec3(.05,.03,.02),bar);
        }
      } else {
        float cg=.5+.5*sin(p.y*75.);
        alb=vec3(.20,.21,.22)*(.4+.6*mix(.5,cg,fade))*(.5+.6*streak); k=70.; sw=.7;
        float gf=smoothstep(.6,.64,fbm(vec2(zs*2.+ci*5.,p.y*2.)));
        alb=mix(alb,(.5+.5*cos(6.283*(C.tone+vec3(0.,.33,.67))))*.12,gf*.6);
      }
    }
  }
  else if(m<3.5){
    if(abs(n.z)>.5){
      float uu=(p.x-s*(wx-.44))/.3*.5+.5; if(n.z>0.) uu=1.-uu; float vv=(p.y-C.vy)/C.vh*.5+.5;
      vec2 tuv=vec2((float(C.vi)+mix(.03,.97,clamp(uu,0.,1.)))/16.,.5+.5*mix(.004,.996,clamp(vv,0.,1.)));
      float lod=log2(max(213.*t*uPx/max(abs(dot(n,rd)),.2),1.));
      vec3 tx=pow(textureLod(uAtlas,tuv,lod).rgb,vec3(2.2));
      emi=tx*SIGN_I*flick(ci*2.+s); alb=vec3(.02); k=400.; sw=.6;
    } else { alb=vec3(.03); k=120.; sw=.7; }
  }
  else if(m<4.5){
    if(abs(n.x)>.5){
      float uu=zs/1.25*.5+.5; if(s>0.) uu=1.-uu; float vv=(p.y-2.78)/.3*.5+.5;
      int hi=C.hi; float cc=float(hi-(hi/4)*4), rr=float(hi/4);
      vec2 tuv=vec2((cc+mix(.01,.99,clamp(uu,0.,1.)))/4.,.5-(rr+1.-mix(.03,.97,clamp(vv,0.,1.)))*.125);
      float lod=log2(max(205.*t*uPx/max(abs(dot(n,rd)),.2),1.));
      vec3 tx=pow(textureLod(uAtlas,tuv,lod).rgb,vec3(2.2));
      emi=tx*SIGN_I*flick(ci*2.+s+100.); alb=vec3(.02); k=400.; sw=.6;
    } else { alb=vec3(.03); k=120.; sw=.7; }
  }
  else if(m<5.5){ alb=mix(vec3(.22,.025,.025),vec3(.28,.26,.22),step(.5,fract(zl*2.5)))*.6; k=25.; sw=.25; }
  else if(m<6.5){
    vec3 body=C.tone<.33?vec3(.45,.03,.03):(C.tone<.66?vec3(.03,.10,.4):vec3(.5));
    alb=body; k=260.; sw=.8;
    if(abs(n.x)>.5){ float a=(zl-C.vendZ)/.5; float b=p.y/1.85;
      if(abs(a)<.84 && b>.45 && b<.93){ vec2 q=vec2((a*.5+.5)*10.,(b-.45)/.16); vec2 f=fract(q); vec2 id=floor(q);
        float hh=h21(id+ci*5.); vec2 d=abs(f-vec2(.5,.56))-vec2(.26,.3); float can=step(max(d.x,d.y),0.)*step(.12,hh);
        vec3 pc=.5+.5*cos(6.283*(hh+vec3(0.,.33,.67))); pc=mix(pc*pc*.55,vec3(.8),step(abs(f.y-.6),.07)*.8);
        emi=mix(vec3(.85,.93,1.)*1.2,pc,can); emi=mix(emi,vec3(.06),step(f.y,.13)*.85); alb=vec3(.02); k=800.; sw=1.; }
      else if(abs(a)<.84 && b>.35 && b<.42){ float led=step(.55,fract((a*.5+.5)*7.))*step(abs(b-.385),.012); emi=vec3(1.,.2,.1)*led*2.5; alb=body*.4; }
      else if(abs(a)<.6 && b>.07 && b<.2){ alb=vec3(.008); }
      else if(b>.95 && abs(a)<.9){ emi=vec3(.9,.95,1.)*1.3; }
    }
  }
  else if(m<7.5){
    float ly=(p.y-2.)/.2; float rib=.84+.16*sin(p.y*110.); float cap=step(.82,abs(ly));
    float face=pow(clamp(dot(n,-rd),0.,1.),.6);
    float mk=step(.6,vnoise(vec2(atan(n.z,n.x)*3.,p.y*13.)+ci))*step(abs(ly),.55);
    emi=C.lantCol*(.3+.9*face)*rib*(1.-cap)*(1.-.3*ly)*(1.-.6*mk);
    alb=mix(vec3(.3,.05,.03),vec3(.01),cap); k=30.; sw=.2;
  }
  else if(m<8.5){ alb=vec3(.13,.135,.14)*(.5+.6*fbm(p.zy*3.));
    if(abs(n.x)>.5 && p.y>2.9 && p.y<3.7) alb*=.35+.65*step(.5,fract(p.y*28.));
    k=120.; sw=.8; }
  else if(m<9.5){ alb=vec3(.015); k=50.; sw=.5; }
  else if(m<10.5){ float hc=h11(ci*4.1+s); vec3 cc=hc<.4?vec3(.28,.2,.02):(hc<.7?vec3(.25,.03,.02):vec3(.03,.08,.25));
    vec2 gq=fract(vec2(p.z*14.,p.y*14.)); alb=cc*(.45+.55*step(.25,gq.x)*step(.25,gq.y)); k=90.; sw=.6; }
  else { alb=vec3(.10)*(.6+.6*vnoise(p.xz*8.)); k=160.; sw=.9; }
  vec3 dif,spc; lights(p,n,reflect(rd,n),k,dif,spc);
  float occ=ao(p,n);
  float fr=f0+(1.-f0)*pow(1.-clamp(dot(n,-rd),0.,1.),5.);
  vec3 amb=vec3(.010,.011,.018)*(.6+.4*n.y);
  return emi+alb*(dif*LG+amb)*occ+spc*fr*sw*occ;
}

vec3 traceRefl(vec3 p,vec3 r){
  float m; float t=march(p+vec3(0.,.012,0.),r,45.,56,m);
  if(m<.5) return mix(hazeCol(r),sky(r),smoothstep(.05,.4,r.y));
  vec3 q=p+r*t; vec3 n=calcN(q,t);
  vec3 c=shade(q,n,r,m,t);
  return mix(hazeCol(r),c,exp(-t*.028));
}

vec2 ripples(vec2 x){
  vec2 acc=vec2(0.);
  for(int i=0;i<3;i++){ float fi=float(i); vec2 q=x*(2.1+fi*.9)+fi*13.7; vec2 id=floor(q), f=fract(q)-.5;
    float h=h21(id+fi*7.); float tt=fract(uTime*(.9+.6*h)+h*10.);
    vec2 d=f-(h22(id)-.5)*.5; float r=length(d); float rr=tt*.42;
    float w=sin((r-rr)*70.)*smoothstep(.05,0.,abs(r-rr))*(1.-tt)*(1.-tt);
    acc+=d/max(r,1e-3)*w; }
  return acc;
}

vec3 ground(vec3 p,vec3 rd,float t,vec2 rnd){
  float ci=floor(p.z/CELL), s=p.x<0.?-1.:1.; Cell C=getCell(ci,s); float u=W+C.off-abs(p.x);
  float fade=exp(-t*.07);
  float n1=fbm(p.xz*1.1), n2=vnoise(p.xz*22.);
  vec3 alb=vec3(.032,.032,.035)*(.55+.8*n1)*(.85+.3*n2*fade);
  alb*=mix(1.,.6,smoothstep(.52,.55,vnoise(p.xz*.7+7.)));
  float gut=smoothstep(.26,.28,u)*smoothstep(.62,.60,u);
  float lf=fract(p.z*1.8); float joint=smoothstep(0.,.025,lf)*smoothstep(1.,.975,lf);
  float slot=step(abs(lf-.5),.16)*step(abs(u-.44),.022);
  alb=mix(alb,vec3(.14,.135,.13)*(.65+.5*n2)*mix(.25,1.,joint)*(1.-slot*.9),gut);
  float line=smoothstep(.74,.76,u)*smoothstep(.87,.85,u)*smoothstep(.3,.55,vnoise(p.xz*vec2(7.,1.3))+.25*n2);
  alb=mix(alb,vec3(.42,.42,.4),line*.7);
  vec2 mh=vec2(p.x-(h11(ci*3.3)-.5)*1.2,p.z-(ci+.5)*CELL-1.); float mr=length(mh);
  float isMh=step(.55,h11(ci*9.7))*smoothstep(.36,.35,mr);
  if(isMh>0.){ float pat=.5*step(.5,fract(mr*14.))+.5*step(.5,fract(atan(mh.y,mh.x)*3.82));
    alb=mix(alb,vec3(.10,.085,.07)*(.4+.7*pat),isMh); }
  float hg=fbm(p.xz*.5+3.7)*.8+.2*vnoise(p.xz*2.1);
  float pm=smoothstep(.50,.455,hg)*(1.-gut*.6)*(1.-isMh*.6);
  vec2 q=p.xz*34.; float m0=vnoise(q); vec2 mg=vec2(vnoise(q+vec2(.4,0.))-m0,vnoise(q+vec2(0.,.4))-m0);
  vec2 q2=p.xz*2.3; float l0=vnoise(q2); vec2 lg=vec2(vnoise(q2+vec2(.3,0.))-l0,vnoise(q2+vec2(0.,.3))-l0);
  vec3 n=vec3(0.,1.,0.);
  n.xz+=mg*.13*(1.-pm)*fade+lg*.04*(1.-pm)+ripples(p.xz)*(.25+.75*pm)*.22*fade;
  n.xz+=vec2(0.,(joint-1.)*.3*gut)*fade;
  n=normalize(n);
  float rough=mix(.045,.003,pm)*(1.-.5*isMh)+gut*.05;
  vec3 r=reflect(rd,n);
  vec3 jv=vec3(rnd.x,rnd.y,fract(rnd.x*91.7+rnd.y*13.3))-.5;
  vec3 rj=normalize(r+jv*2.*rough); rj.y=abs(rj.y)+.004; rj=normalize(rj);
  vec3 rc=traceRefl(p,rj);
  float ndv=clamp(dot(n,-rd),0.,1.);
  float F=.07+.93*pow(1.-ndv,4.);
  vec3 dif,spc; lights(p,n,r,mix(16.,300.,pm),dif,spc);
  float occ=ao(p,vec3(0.,1.,0.));
  // rain splashes: brief bright flecks
  vec2 sq=p.xz*7.; vec2 sid=floor(sq); float sh=h21(sid+floor(uTime*9.+h21(sid)*9.)*.37);
  float fleck=step(.93,sh)*smoothstep(.22,0.,length(fract(sq)-.5))*fade;
  vec3 col=alb*(1.-.45*pm)*(dif*LG+vec3(.010,.011,.018))*occ;
  col+=rc*F*mix(.8,1.,pm)*mix(.6,1.,occ);
  col+=spc*F*(1.-pm)*.55*occ;
  col+=(dif*.25+.01)*fleck*occ;
  return col;
}

// ---------------- volumetrics ----------------
float steamD(vec3 p){
  float ci=floor(p.z/CELL); vec4 hs=h14(ci*5.77+9.1); if(hs.x<.42) return 0.;
  float sd=hs.y>.5?1.:-1.; vec3 src=vec3(sd*(W-.5),hs.w>.62?2.45:0.,(ci+.5)*CELL+(hs.z-.5)*3.);
  float h=p.y-src.y; if(h<0.||h>5.5) return 0.;
  vec2 c=src.xz+vec2(-sd*.13*h+.14*sin(h*1.3+uTime*.6+ci),.2*h+.1*sin(h*.9-uTime*.4));
  float w=.12+.17*h; vec2 d=(p.xz-c)/w; float r2=dot(d,d); if(r2>4.) return 0.;
  vec3 np=vec3(p.x*2.4,p.y*1.5-uTime*1.2,p.z*2.4)+ci;
  float n=fbm3(np+.6*vec3(vnoise3(np*.7+3.),0.,vnoise3(np*.7+11.)))*.75+.25*vnoise3(np*5.+uTime*.3);
  return exp(-r2*1.5)*exp(-h*.5)*smoothstep(0.,.2,h)*smoothstep(.33,.66,n)*16.;
}

vec3 rain(vec3 ro,vec3 rd,float tHit){
  vec3 acc=vec3(0.); float lxz=length(rd.xz); if(lxz<.15) return acc;
  float ang=atan(rd.x,rd.z);
  for(int i=0;i<7;i++){ float fi=float(i); float di=1.6*pow(1.5,fi); float tc=di/lxz; if(tc>tHit) break;
    float y=ro.y+rd.y*tc;
    vec2 q=vec2(ang*di*11.+fi*31.7+y*.35,y*3.2+uTime*(26.+fi*1.7)+fi*7.);
    vec2 id=floor(q), f=fract(q); float h=h21(id+fi*57.);
    if(h<.62) continue;
    float cx=.2+.6*fract(h*17.3);
    float w=max(.012,.75*di*uPx*11.);
    float mk=smoothstep(w,0.,abs(f.x-cx))*smoothstep(0.,.08,f.y)*smoothstep(.55,.2,f.y);
    if(mk<=0.) continue;
    vec3 L=fogLight(ro+rd*tc)+vec3(.02,.022,.03);
    acc+=L*mk*min(1.,.02/w)*(.35+.65*fract(h*5.))*.36;
  }
  return acc;
}

void main(){
  uPx=1./(.5*uRes.y*uFocal);
  vec2 fc=gl_FragCoord.xy+uJit; vec2 uv=(fc-.5*uRes)/(.5*uRes.y);
  vec3 ro=uPos, rd=normalize(uCam*vec3(uv,uFocal));
  float r1=fract(52.9829189*fract(dot(gl_FragCoord.xy,vec2(.06711056,.00583715)))+uFrame*.61803399);
  vec2 r2=fract(h22(gl_FragCoord.xy)+uFrame*vec2(.7548777,.5698403));
  float m; float t=march(ro,rd,FAR,120,m);
  vec3 col;
  if(m<.5){ col=mix(hazeCol(rd),sky(rd),smoothstep(.02,.35,rd.y)); t=FAR; }
  else { vec3 p=ro+rd*t;
    if(m<1.5) col=ground(p,rd,t,r2);
    else col=shade(p,calcN(p,t),rd,m,t); }
  // volumetric haze + steam
  float tf=min(t,42.); float T=1.; vec3 sc=vec3(0.); float tp=0.;
  const int NF=10;
  for(int i=0;i<NF;i++){ float a=(float(i)+r1)/float(NF); float ti=tf*pow(a,1.7);
    float tn=tf*pow((float(i)+1.)/float(NF),1.7); float tb=tf*pow(float(i)/float(NF),1.7); float ds=tn-tb;
    vec3 p=ro+rd*ti;
    float dens=.006+.012*exp(-p.y*1.3)+.006*vnoise3(p*.6+vec3(0.,-uTime*.1,uTime*.05));
    float sd_=steamD(p); dens+=sd_;
    vec3 L=(fogLight(p)*.10+vec3(.008,.008,.014))*(1.+3.*sd_/(sd_+.02));
    float st=exp(-dens*ds);
    sc+=T*(1.-st)*L; T*=st;
  }
  col=col*T+sc;
  if(t>42.){ float f=1.-exp(-(t-42.)*.045); col=mix(col,hazeCol(rd),f); }
  oCol=vec4(min(col,vec3(60.)),t);
  oRain=vec4(rain(ro,rd,t),1.);
}`;

const FS_TAA = `#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uCur, uHist; uniform vec2 uRes; uniform vec3 uPos, uPrevPos; uniform mat3 uCam, uPrevCam; uniform float uFocal, uReset;
vec3 tm(vec3 c){ return c/(1.+max(c.r,max(c.g,c.b))); }
vec3 itm(vec3 c){ return c/max(1.-max(c.r,max(c.g,c.b)),1e-3); }
void main(){
  ivec2 ip=ivec2(gl_FragCoord.xy); ivec2 mxp=ivec2(uRes)-1;
  vec4 c=texelFetch(uCur,ip,0); vec3 cc=tm(c.rgb);
  vec3 mn=cc, mx=cc, avg=cc;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ if(x==0&&y==0) continue;
    vec3 s=tm(texelFetch(uCur,clamp(ip+ivec2(x,y),ivec2(0),mxp),0).rgb); mn=min(mn,s); mx=max(mx,s); avg+=s; }
  avg/=9.;
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/(.5*uRes.y);
  vec3 rd=normalize(uCam*vec3(uv,uFocal)); vec3 wp=uPos+rd*c.a;
  vec3 l=(wp-uPrevPos)*uPrevCam;
  vec2 huv=(l.xy/l.z*uFocal*.5*uRes.y+.5*uRes)/uRes;
  float w=(l.z>0.&&huv.x>0.&&huv.y>0.&&huv.x<1.&&huv.y<1.)?.9:0.;
  w*=1.-uReset;
  vec3 h=tm(texture(uHist,huv).rgb);
  vec3 ext=(mx-mn)*.15;
  h=clamp(h,mn-ext,mx+ext);
  o=vec4(itm(mix(cc,h,w)),c.a);
}`;

const FS_DOWN = `#version 300 es
precision highp float;
out vec4 o; uniform sampler2D uT, uT2; uniform vec2 uTexel; uniform vec2 uOut; uniform float uFirst;
vec3 S(vec2 uv){ vec3 c=texture(uT,uv).rgb; if(uFirst>.5){ c+=texture(uT2,uv).rgb; c=min(c,vec3(30.)); } return c; }
void main(){ vec2 uv=gl_FragCoord.xy/uOut;
  vec3 c=S(uv)*4.+S(uv+uTexel*vec2(1.,1.))+S(uv+uTexel*vec2(-1.,1.))+S(uv+uTexel*vec2(1.,-1.))+S(uv+uTexel*vec2(-1.,-1.));
  o=vec4(c/8.,1.); }`;

const FS_UP = `#version 300 es
precision highp float;
out vec4 o; uniform sampler2D uT; uniform vec2 uTexel; uniform vec2 uOut; uniform float uGain;
void main(){ vec2 uv=gl_FragCoord.xy/uOut; vec2 t=uTexel;
  vec3 c=texture(uT,uv+vec2(-2.,0.)*t*.5).rgb+texture(uT,uv+vec2(2.,0.)*t*.5).rgb+texture(uT,uv+vec2(0.,2.)*t*.5).rgb+texture(uT,uv+vec2(0.,-2.)*t*.5).rgb;
  c+=2.*(texture(uT,uv+vec2(1.,1.)*t*.5).rgb+texture(uT,uv+vec2(-1.,1.)*t*.5).rgb+texture(uT,uv+vec2(1.,-1.)*t*.5).rgb+texture(uT,uv+vec2(-1.,-1.)*t*.5).rgb);
  o=vec4(c/12.*uGain,1.); }`;

const FS_COMP = `#version 300 es
precision highp float;
out vec4 o; uniform sampler2D uScene, uRain, uBloom; uniform vec2 uOut; uniform float uTime, uExposure;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 S(vec2 uv){ return texture(uScene,uv).rgb+texture(uRain,uv).rgb; }
void main(){
  vec2 uv=gl_FragCoord.xy/uOut; vec2 d=uv-.5; float r2=dot(d,d);
  vec2 ca=d*r2*.012;
  vec3 col=vec3(S(uv+ca).r,S(uv).g,S(uv-ca).b);
  vec2 px=1./vec2(textureSize(uScene,0));
  vec3 nb=(texture(uScene,uv+vec2(px.x,0.)).rgb+texture(uScene,uv-vec2(px.x,0.)).rgb+texture(uScene,uv+vec2(0.,px.y)).rgb+texture(uScene,uv-vec2(0.,px.y)).rgb)*.25;
  vec3 ctr=texture(uScene,uv).rgb;
  col=max(col+clamp((ctr-nb)*.6,-.25*ctr-.02,.25*ctr+.02),0.);
  vec3 bl=texture(uBloom,uv).rgb;
  // horizontal anamorphic smear taken from the wide bloom
  vec3 st=vec3(0.); for(int i=-4;i<=4;i++){ st+=texture(uBloom,uv+vec2(float(i)*.022,0.)).rgb*(1.-abs(float(i))/5.); }
  col=col+bl*.03+st*vec3(.35,.5,1.)*.0015;
  col*=uExposure;
  col*=1.-r2*1.15;
  col=aces(col);
  // grade: cool shadows, warm highlights, a little contrast
  float l=dot(col,vec3(.2126,.7152,.0722));
  col=mix(col,col*vec3(.92,1.0,1.10),(1.-l)*.5);
  col=mix(col,col*vec3(1.06,1.0,.94),l*.5);
  col=mix(vec3(l),col,1.08);
  col=pow(col,vec3(1./2.2));
  col=smoothstep(-.02,1.02,col);
  float g=h21(gl_FragCoord.xy+fract(uTime)*311.7)-.5;
  col+=g*(.035-.02*l);
  o=vec4(col,1.);
}`;

function drawSign(g,x,y,w,h,spec,vertical){

    g.fillStyle=c1; g.fillRect(x+4,y+4,w-8,h-8);
    // uneven back-lighting from the tubes inside
    const gr=vertical?g.createLinearGradient(x,y,x,y+h):g.createLinearGradient(x,y,x+w,y);
    for(let i=0;i<=8;i++) gr.addColorStop(i/8,`rgba(${i%2?255:0},${i%2?255:0},${i%2?255:0},${i%2?.16:.14})`);
    g.fillStyle=gr; g.fillRect(x+4,y+4,w-8,h-8);
    const eg=g.createRadialGradient(x+w/2,y+h/2,Math.min(w,h)*.3,x+w/2,y+h/2,Math.max(w,h)*.62);
    eg.addColorStop(0,'rgba(0,0,0,0)'); eg.addColorStop(1,'rgba(0,0,0,.35)'); g.fillStyle=eg; g.fillRect(x+4,y+4,w-8,h-8);
  } else {
    g.strokeStyle=c1; g.shadowColor=c1; g.shadowBlur=16; g.lineWidth=4;
    g.strokeRect(x+10,y+10,w-20,h-20); g.strokeRect(x+10,y+10,w-20,h-20);
    g.shadowBlur=3; g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=1.4; g.strokeRect(x+10,y+10,w-20,h-20);
  }
  const n=chars.length;
  const latin=/^[\x20-\x7e]+$/.test(text);
  let size, step;
  if(vertical){ step=(h-pad*2-16)/n; size=Math.min(w*.74,step*.92); }
  else { step=(w-pad*2-20)/n; size=Math.min(h*.66,step*(latin?1.5:.94)); }
  g.textAlign='center'; g.textBaseline='middle';
  g.font=`${style==='box'?900:600} ${size}px ${FONT}`;
  for(let i=0;i<n;i++){
    const cx=vertical?x+w/2:x+pad+10+step*(i+.5), cy=vertical?y+pad+8+step*(i+.5):y+h/2+2;
    g.save(); g.translate(cx,cy);
    if(vertical && chars[i]==='ー') g.rotate(Math.PI/2);
    if(style==='box'){ g.shadowBlur=0; g.fillStyle=c2; g.fillText(chars[i],0,0); }
    else {
      g.lineJoin='round'; g.shadowColor=c1; g.shadowBlur=20; g.strokeStyle=c1; g.lineWidth=Math.max(3,size*.07);
      g.strokeText(chars[i],0,0); g.strokeText(chars[i],0,0);
      g.shadowBlur=4; g.strokeStyle='rgba(255,255,255,.92)'; g.lineWidth=Math.max(1.2,size*.022); g.strokeText(chars[i],0,0);
    }
    g.restore();
  }
  g.restore();
}
function avgLinear(g,x,y,w,h){ const d=g.getImageData(x,y,w,h).data; let r=0,gg=0,b=0; const n=d.length/4;
  for(let i=0;i<d.length;i+=4){ r+=Math.pow(d[i]/255,2.2); gg+=Math.pow(d[i+1]/255,2.2); b+=Math.pow(d[i+2]/255,2.2); }
  return [r/n,gg/n,b/n]; }
const atlasCanvas=document.createElement('canvas'); atlasCanvas.width=2048; atlasCanvas.height=1024;
const vCols=new Float32Array(48), hCols=new Float32Array(48);
(function(){
  const g=atlasCanvas.getContext('2d',{willReadFrequently:true}); g.fillStyle='#000'; g.fillRect(0,0,2048,1024);
  for(let i=0;i<16;i++){ drawSign(g,i*128,0,128,512,V_SIGNS[i],true); vCols.set(avgLinear(g,i*128,0,128,512),i*3); }
  for(let i=0;i<16;i++){ const x=(i%4)*512, y=512+Math.floor(i/4)*128; drawSign(g,x,y,512,128,H_SIGNS[i],false); hCols.set(avgLinear(g,x,y,512,128),i*3); }
})();
const atlasTex=gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D,atlasTex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,atlasCanvas);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

// ---------------- render targets ----------------
function makeTex(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }
function makeTarget(w,h,n=1){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); const tex=[];
  for(let i=0;i<n;i++){ const t=makeTex(w,h); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0); tex.push(t); }
  gl.drawBuffers(tex.map((_,i)=>gl.COLOR_ATTACHMENT0+i));
  return {f,tex,w,h}; }
function freeTarget(t){ if(!t) return; t.tex.forEach(x=>gl.deleteTexture(x)); gl.deleteFramebuffer(t.f); }

const params=new URLSearchParams(location.search);
let scale=parseFloat(params.get('scale'))||0.7;
const fixedScale=params.has('scale');
let maxScale=1.0, RW=0,RH=0, tScene=null, tHist=[null,null], tBloom=[], histIdx=0, resetTaa=1;
const BLOOM_LEVELS=6;
function allocTargets(){
  const w=Math.max(64,Math.round(canvas.width*scale/ dprUsed)), h=Math.max(32,Math.round(canvas.height*scale/dprUsed));
  if(w===RW&&h===RH) return;
  RW=w; RH=h;
  freeTarget(tScene); tHist.forEach(freeTarget); tBloom.forEach(freeTarget);
  tScene=makeTarget(w,h,2); tHist=[makeTarget(w,h),makeTarget(w,h)]; tBloom=[];
  let bw=w,bh=h; for(let i=0;i<BLOOM_LEVELS;i++){ bw=Math.max(2,bw>>1); bh=Math.max(2,bh>>1); tBloom.push(makeTarget(bw,bh)); }
  resetTaa=1;
}
let dprUsed=1;
function resize(){
  dprUsed=Math.min(window.devicePixelRatio||1,2);
  const ww=window.innerWidth, wh=window.innerHeight;
  let cw=ww, ch=Math.round(ww/2.39); if(ch>wh){ ch=wh; cw=Math.min(ww,Math.round(wh*2.39)); }
  canvas.style.width=cw+'px'; canvas.style.height=ch+'px';
  canvas.width=Math.round(cw*dprUsed); canvas.height=Math.round(ch*dprUsed);
  allocTargets();
}
window.addEventListener('resize',resize); resize();

// ---------------- camera ----------------
const SF=1.72;            // steps per second
const FOCAL=2.25;
let lookYaw=0, lookPitch=0, dragging=false, lx=0, ly=0;
canvas.addEventListener('pointerdown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; lookYaw+=(e.clientX-lx)*.003; lookPitch-=(e.clientY-ly)*.003; lx=e.clientX; ly=e.clientY;
  lookYaw=Math.max(-1.3,Math.min(1.3,lookYaw)); lookPitch=Math.max(-.9,Math.min(.9,lookPitch)); });
canvas.addEventListener('pointerup',()=>{ dragging=false; });
function camAt(t){
  const ph=t*SF*Math.PI;
  const z=1.05*t+.4*Math.sin(t*.19);
  const x=.40*Math.sin(t*.11)+.13*Math.sin(t*.29+1)+.02*Math.sin(ph);
  const y=1.62+.022*Math.cos(2*ph)+.004*Math.sin(t*.9);
  let yaw=.24*Math.sin(t*.17)+.15*Math.sin(t*.37+2)+.05*Math.sin(t*.71+.5)+.005*Math.sin(ph+.6)+lookYaw;
  let pitch=.03+.085*Math.sin(t*.23+1)+.055*Math.sin(t*.13)+.0035*Math.sin(2*ph+1)+lookPitch;
  pitch-=.30*Math.pow(Math.max(0,Math.sin(t*.085-1.2)),6);
  const roll=.006*Math.sin(ph)+.008*Math.sin(t*.31);
  const cp=Math.cos(pitch), sp=Math.sin(pitch), cy=Math.cos(yaw), sy=Math.sin(yaw);
  const f=[sy*cp,sp,cy*cp], r0=[cy,0,-sy];
  const u0=[f[1]*r0[2]-f[2]*r0[1], f[2]*r0[0]-f[0]*r0[2], f[0]*r0[1]-f[1]*r0[0]];
  const cr=Math.cos(roll), sr=Math.sin(roll);
  const r=[r0[0]*cr+u0[0]*sr,r0[1]*cr+u0[1]*sr,r0[2]*cr+u0[2]*sr];
  const u=[-r0[0]*sr+u0[0]*cr,-r0[1]*sr+u0[1]*cr,-r0[2]*sr+u0[2]*cr];
  return {pos:[x,y,z],mat:new Float32Array([...r,...u,...f])};
}

// ---------------- audio (procedural rain + footsteps) ----------------
let ac=null, noiseBuf=null, stepGain=null;
function startAudio(){
  if(ac){ ac.state==='suspended'?ac.resume():ac.suspend(); return; }
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const len=ac.sampleRate*3; noiseBuf=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const d=noiseBuf.getChannelData(c); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  const master=ac.createGain(); master.gain.value=0; master.gain.linearRampToValueAtTime(.9,ac.currentTime+2.5); master.connect(ac.destination);
  const band=(type,f,q,g)=>{ const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true; s.playbackRate.value=.9+Math.random()*.2;
    const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const gn=ac.createGain(); gn.gain.value=g;
    s.connect(fl); fl.connect(gn); gn.connect(master); s.start(); return gn; };
  band('highpass',2600,.4,.055); band('bandpass',900,.5,.07); band('lowpass',170,.3,.3);
  const pat=band('bandpass',5200,1.2,.05); const lfo=ac.createOscillator(); lfo.frequency.value=.23; const lg=ac.createGain(); lg.gain.value=.03; lfo.connect(lg); lg.connect(pat.gain); lfo.start();
  stepGain=master;
}
function footstep(){
  if(!ac||ac.state!=='running') return; const t=ac.currentTime;
  const mk=(type,f,q,g,dur)=>{ const s=ac.createBufferSource(); s.buffer=noiseBuf; const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    const gn=ac.createGain(); gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(g,t+.012); gn.gain.exponentialRampToValueAtTime(.0005,t+dur);
    s.connect(fl); fl.connect(gn); gn.connect(stepGain); s.start(t,Math.random()*2,dur+.05); };
  mk('lowpass',260+Math.random()*80,.8,.5,.16); mk('bandpass',3200+Math.random()*900,.9,.06,.22);
}
window.addEventListener('pointerdown',startAudio,{once:false});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ paused=!paused; e.preventDefault(); }
  if(e.key==='f'||e.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
});
setTimeout(()=>{ document.getElementById('hint').style.opacity=0; },6000);

// ---------------- frame loop ----------------
let paused=params.has('still'), simT=parseFloat(params.get('t'))||8, last=performance.now(), frameNo=0;
let prevCam=camAt(simT), dtAcc=0, dtN=0, sinceChange=0, lastStep=Math.floor(simT*SF);
const HAL=[]; for(let i=1;i<=8;i++){ let f=1,r=0,k=i; while(k>0){ f/=2; r+=f*(k%2); k=Math.floor(k/2); } let f3=1,r3=0; k=i; while(k>0){ f3/=3; r3+=f3*(k%3); k=Math.floor(k/3); } HAL.push([r-.5,r3-.5]); }
function bindTex(unit,tex,loc){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(loc,unit); }
function draw(){ gl.drawArrays(gl.TRIANGLES,0,3); }
window.__setTime=t=>{ simT=t; resetTaa=1; };
window.__info=()=>({scale,RW,RH,simT,frameNo,ms:window.__ms});

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; if(dt>.2) dt=.016;
  if(!paused) simT+=dt;
  // adaptive resolution
  if(!fixedScale){ dtAcc+=dt; dtN++; sinceChange++;
    if(dtN>=24){ const avg=dtAcc/dtN*1000; window.__ms=avg; dtAcc=0; dtN=0;
      if(avg>22 && scale>.36 && sinceChange>40){ maxScale=scale*.95; scale=Math.max(.36,scale*.87); allocTargets(); sinceChange=0; }
      else if(avg<17.6 && scale<maxScale && sinceChange>90){ scale=Math.min(maxScale,scale*1.08); allocTargets(); sinceChange=0; } } }
  const st=Math.floor(simT*SF); if(st!==lastStep){ lastStep=st; if(!paused) footstep(); }
  const cam=camAt(simT);
  const jit=HAL[frameNo%8];

  gl.disable(gl.BLEND);
  // 1. scene
  gl.bindFramebuffer(gl.FRAMEBUFFER,tScene.f); gl.viewport(0,0,RW,RH);
  gl.useProgram(pScene.p); let u=pScene.u;
  gl.uniform2f(u.uRes,RW,RH); gl.uniform1f(u.uTime,simT); gl.uniform1f(u.uFrame,frameNo%1024);
  gl.uniform3fv(u.uPos,cam.pos); gl.uniformMatrix3fv(u.uCam,false,cam.mat); gl.uniform1f(u.uFocal,FOCAL);
  gl.uniform2f(u.uJit,jit[0],jit[1]);
  gl.uniform3fv(u.uVCol,vCols); gl.uniform3fv(u.uHCol,hCols);
  bindTex(0,atlasTex,u.uAtlas); draw();
  // 2. temporal accumulation
  const cur=tHist[histIdx], prev=tHist[1-histIdx];
  gl.bindFramebuffer(gl.FRAMEBUFFER,cur.f); gl.useProgram(pTaa.p); u=pTaa.u;
  gl.uniform2f(u.uRes,RW,RH); gl.uniform3fv(u.uPos,cam.pos); gl.uniform3fv(u.uPrevPos,prevCam.pos);
  gl.uniformMatrix3fv(u.uCam,false,cam.mat); gl.uniformMatrix3fv(u.uPrevCam,false,prevCam.mat);
  gl.uniform1f(u.uFocal,FOCAL); gl.uniform1f(u.uReset,resetTaa);
  bindTex(0,tScene.tex[0],u.uCur); bindTex(1,prev.tex[0],u.uHist); draw();
  resetTaa=0;
  // 3. bloom
  gl.useProgram(pDown.p); u=pDown.u;
  for(let i=0;i<BLOOM_LEVELS;i++){ const dst=tBloom[i]; const srcW=i?tBloom[i-1].w:RW, srcH=i?tBloom[i-1].h:RH;
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f); gl.viewport(0,0,dst.w,dst.h);
    gl.uniform2f(u.uTexel,1/srcW,1/srcH); gl.uniform2f(u.uOut,dst.w,dst.h); gl.uniform1f(u.uFirst,i?0:1);
    bindTex(0,i?tBloom[i-1].tex[0]:cur.tex[0],u.uT); bindTex(1,tScene.tex[1],u.uT2); draw(); }
  gl.useProgram(pUp.p); u=pUp.u; gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=BLOOM_LEVELS-2;i>=0;i--){ const dst=tBloom[i], src=tBloom[i+1];
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f); gl.viewport(0,0,dst.w,dst.h);
    gl.uniform2f(u.uTexel,1/src.w,1/src.h); gl.uniform2f(u.uOut,dst.w,dst.h); gl.uniform1f(u.uGain,1.0);
    bindTex(0,src.tex[0],u.uT); draw(); }
  gl.disable(gl.BLEND);
  // 4. composite
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(pComp.p); u=pComp.u;
  gl.uniform2f(u.uOut,canvas.width,canvas.height); gl.uniform1f(u.uTime,simT); gl.uniform1f(u.uExposure,1.0);
  bindTex(0,cur.tex[0],u.uScene); bindTex(1,tScene.tex[1],u.uRain); bindTex(2,tBloom[0].tex[0],u.uBloom); draw();

  prevCam=cam; histIdx=1-histIdx; frameNo++;
}
requestAnimationFrame(frame);
</script>
</body>
