  float rockBias = (vSU.y < -6.0) ? 0.14 : 0.0;
  float vegMask = (1.0 - smoothstep(255.0, 385.0, elev + (medNoise - 0.5) * 95.0)) * (1.0 - smoothstep(0.24 - rockBias, 0.44 - rockBias, slope));
  vec3 albedo = mix(rockCol, lowVeg, vegMask);

  // 3. Translucent Hanging Glacier Cyan Ice in high gullies
  float iceMask = smoothstep(480.0, 860.0, elev) * smoothstep(0.18, 0.44, slope) * smoothstep(0.55, 0.80, medNoise) * (1.0 - smoothstep(0.48, 0.66, slope));
  albedo = mix(albedo, vec3(0.24, 0.50, 0.72), iceMask * 0.55);

  // 4. Jagged Natural Alpine Snow Accumulation (wind-packed couloirs & ridges shedding off sheer dark rock walls!)
  float snowLine = 250.0 + (macroNoise - 0.5) * 165.0 + (medNoise - 0.5) * 95.0;
  float shadeBonus = clamp(-dot(N.xz, SUN_DIR.xz), 0.0, 1.0) * 105.0;
  float elevSnow = smoothstep(snowLine - shadeBonus - 80.0, snowLine - shadeBonus + 185.0, elev);
  float lowSnowPatch = smoothstep(0.66, 0.88, medNoise * 0.72 + fineNoise * 0.28) * (1.0 - smoothstep(0.14, 0.28, slope)) * 0.52;
  // Snow catches naturally inside couloir concavities (1 - h0) and sheds cleanly off steep dark granite arête walls!
  float couloirCatch = (1.0 - h0) * 0.14;
  float slopeCap = 1.0 - smoothstep(0.16, 0.39, slope - couloirCatch);
  float snowMask = clamp(max(elevSnow, lowSnowPatch) * slopeCap, 0.0, 1.0);
  float summitSnow = smoothstep(620.0, 1180.0, elev) * (1.0 - smoothstep(0.24, 0.48, slope - couloirCatch * 1.15));
  snowMask = clamp(max(snowMask, summitSnow), 0.0, 1.0);

  vec3 snowAlbedo = mix(vec3(0.76, 0.82, 0.92), vec3(0.93, 0.95, 0.98), fineNoise);
  albedo = mix(albedo, snowAlbedo, snowMask);

  // 5. Dramatic Photographic Alpine Chiaroscuro Lighting!
  float diffuse = max(dot(N, SUN_DIR), 0.0);
  float geomSelf = smoothstep(-0.04, 0.18, dot(Ngeom, SUN_DIR));
  float cloudShadow = mix(0.78, 1.0, smoothstep(0.30, 0.68, fbm2(vWorldPos.xz * 0.00038 + vec2(uTime * 0.003, 0.0))));
  float sunVis = vMeta.y * geomSelf * cloudShadow;

  vec3 directLight = SUN_COL * diffuse * sunVis;
  float skyHemi = 0.5 + 0.5 * N.y;
  float valleyAO = clamp(0.42 + 0.58 * smoothstep(-10.0, 480.0, elev), 0.0, 1.0);
  vec3 skyBounce = mix(vec3(0.075, 0.135, 0.27), vec3(0.22, 0.38, 0.72), skyHemi) * valleyAO;
  vec3 groundBounce = vec3(0.18, 0.17, 0.16) * max(-N.y * 0.5 + 0.5, 0.0) * 0.22;

  vec3 H = normalize(SUN_DIR + V);
  float spec = pow(max(dot(N, H), 0.0), mix(22.0, 64.0, snowMask)) * mix(0.04, 0.34, snowMask) * sunVis;
  float alpen = smoothstep(680.0, 1300.0, elev) * snowMask * diffuse * sunVis;

  vec3 color = albedo * (directLight + skyBounce + groundBounce) + SUN_COL * spec + vec3(0.30, 0.10, 0.03) * alpen;
  color = applyAlpineFog(color, vWorldPos, uCamPos, uTime);

  vec2 currNDC = vCurrClip.xy / max(vCurrClip.w, 0.0001);
  vec2 prevNDC = vPrevClip.xy / max(vPrevClip.w, 0.0001);
  outColor = vec4(color, 1.0);
  outVel = vec4((currNDC - prevNDC) * 0.5, dist, 1.0);
}
`;

const MOTION_BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uColorTex; uniform sampler2D uVelTex; uniform sampler2D uNeighborTex; uniform float uBlurScale;
out vec4 outColor;

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

void main() {
  vec4 centerCol = texture(uColorTex, vUv);
  vec4 centerVD  = texture(uVelTex, vUv);
  vec4 neigh     = texture(uNeighborTex, vUv);

  // Tapered cinema shutter clamp (max ~4.4% viewport width => silky 55px streak on catenary masts, never a chunky box!)
  vec2 vMax = neigh.xy * uBlurScale;
  float maxLen = length(vMax);
  if (maxLen > 0.044) { vMax *= (0.044 / maxLen); maxLen = 0.044; }
  if (maxLen < 0.0012) { outColor = centerCol; return; }

  vec2 vCenter = centerVD.xy * centerVD.a * uBlurScale;
  float lenCenter = min(length(vCenter), 0.044);
  float dCenter = centerVD.z;
  float jitter = hash12(gl_FragCoord.xy) - 0.5;

  const int SAMPLES = 17;
  vec3 accum = centerCol.rgb * 1.2;
  float wSum = 1.2;

  for (int i = 0; i < SAMPLES; i++) {
    float u = ((float(i) + 0.5 + jitter * 0.65) / float(SAMPLES)) - 0.5; // [-0.5, +0.5]
    vec2 suv = clamp(vUv + vMax * u, vec2(0.001), vec2(0.999));
    vec4 sCol = texture(uColorTex, suv);
    vec4 sVD  = texture(uVelTex, suv);
    float dS = sVD.z;
    float lenS = min(length(sVD.xy * sVD.a * uBlurScale), 0.044);
    float stepDist = abs(u) * maxLen;

    // Smooth Gaussian shutter feathering so moving edges taper organically into background!
    float gauss = exp(-u * u * 7.5);
    float fg = clamp(1.0 - (dS - dCenter) / max(dCenter * 0.25, 1.8), 0.0, 1.0);
    float bg = clamp(1.0 - (dCenter - dS) / max(dS * 0.25, 1.8), 0.0, 1.0);
    float coneS = smoothstep(lenS + 0.002, 0.0, stepDist);
    float coneC = smoothstep(lenCenter + 0.002, 0.0, stepDist);
    float w = (fg * coneS + bg * coneC + 0.10 * coneS * coneC) * gauss;
    accum += sCol.rgb * w;
    wSum += w;
  }
  outColor = vec4(accum / max(wSum, 0.0001), 1.0);
}
`;

const AUTO_EXPOSURE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uLumaTex; uniform sampler2D uPrevExpTex; uniform float uDt; uniform int uReset;
out vec4 outColor;
void main() {
  float avgLog = 0.0;
  for (int y = 0; y < 4; y++)
    for (int x = 0; x < 4; x++)
      avgLog += texture(uLumaTex, (vec2(float(x), float(y)) + 0.5) / 4.0).r;
  float avgLum = exp(avgLog / 16.0);

  // Rich photographic key value: balanced Alps snow & genuine moody dark tunnels that adapt smoothly!
  float keyVal = 0.23;
  float targetExp = clamp(keyVal / max(avgLum, 0.032), 0.18, 2.65);

  if (uReset == 1) { outColor = vec4(targetExp, avgLum, targetExp, 1.0); return; }
  float prevExp = texture(uPrevExpTex, vec2(0.5)).r;
  if (prevExp <= 0.001 || isnan(prevExp)) prevExp = targetExp;

  // Entering tunnel -> slow dark adaptation (0.58/s) so entry feels dramatically dark before cabin & walls emerge!
  // Exiting tunnel -> crisp bright adaptation (0.85/s) so tunnel exit blooms brilliantly in sunlight before settling!
  float rate = (targetExp > prevExp) ? 0.58 : 0.85;
  float adapted = mix(prevExp, targetExp, 1.0 - exp(-uDt * rate));
  outColor = vec4(adapted, avgLum, targetExp, 1.0);

vec3 acesFilm(vec3 x) {
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z);
}
void main() {
  vec2 centered = vUv - 0.5;
  float r2 = dot(centered, centered);
  vec2 caDir = centered * ((0.0011 + 0.0010 * uFovNorm) * r2);
  vec3 hdr = vec3(texture(uSceneTex, clamp(vUv+caDir,0.0,1.0)).r, texture(uSceneTex, vUv).g, texture(uSceneTex, clamp(vUv-caDir,0.0,1.0)).b);
  float exposure = texture(uExpTex, vec2(0.5)).r;
  vec3 col = acesFilm((hdr + texture(uBloomTex, vUv).rgb * 0.30) * exposure);
  col = mix(col, col * col * (3.0 - 2.0 * col), 0.14);
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(luma), col, 1.08) * clamp(1.0 - r2 * 0.42, 0.65, 1.0);

const activePointers = new Map();
let lastPinchDist = 0;
canvas.addEventListener("pointerdown", (e) => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.isInteracting = true; markInteraction();
  canvas.classList.add("dragging");
  if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
  }
});
canvas.addEventListener("pointermove", (e) => {
  if (!activePointers.has(e.pointerId)) return;
  const prev = activePointers.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  markInteraction();
  if (activePointers.size === 1) {
    const sens = (cam.fov / DEFAULT_FOV) * 0.0042;
    cam.targetYaw -= dx * sens;
    cam.targetPitch = clamp(cam.targetPitch + dy * sens, -1.32, 1.32);
  } else if (activePointers.size === 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    if (lastPinchDist > 5 && dist > 5) cam.targetFov = clamp(cam.targetFov * (lastPinchDist / dist), 18.0, 78.0);
    lastPinchDist = dist;
  }
});
function releasePointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) lastPinchDist = 0;
  if (activePointers.size === 0) { cam.isInteracting = false; canvas.classList.remove("dragging"); }
}

function evalTrainSway(s, t, track) {
  const lateral   = Math.sin(t * 1.18) * 0.011 + Math.sin(t * 2.47 + 1.3) * 0.0045;
  const heave     = Math.sin(t * 1.72 + 0.6) * 0.0085 + Math.cos(t * 3.15) * 0.0035;
  const swayRoll  = Math.sin(t * 0.94 + 0.4) * 0.0055 + Math.sin(t * 2.13) * 0.0022;
  const swayPitch = Math.sin(t * 1.45 + 2.1) * 0.0025;
  const railPhase = (s % 22.0) / 22.0;
  const jolt = (Math.exp(-Math.pow((railPhase - 0.08) * 38.0, 2.0)) + Math.exp(-Math.pow((railPhase - 0.14) * 38.0, 2.0)) * 0.72) * 0.0048;
  const microVib = (Math.sin(t * 19.7) * 0.5 + Math.sin(t * 31.3) * 0.5) * 0.0007;
  return { dx: lateral, dy: heave - jolt + microVib, dz: 0.0, roll: swayRoll + track.bank * 0.35 + jolt * 0.45, pitch: swayPitch - jolt * 0.35 };
}

const matProj=Mat4.create(), matLocalView=Mat4.create(), matLocalVP=Mat4.create(),
      matWorldView=Mat4.create(), matWorldVP=Mat4.create(), matPrevVP=Mat4.create(),
      matInvVP=Mat4.create(), matCarWorld=Mat4.create(), matCarInv=Mat4.create(),

const hudLocEl = document.getElementById("hudLoc"), hudMetaEl = document.getElementById("hudMeta");
const hudDotEls = Array.from(document.querySelectorAll("#hudDots .dot"));
let lastHudSection = "";

function updateSimulation(dt) {
  if (!paused) {
    const speed = mix(BASE_SPEED, 22.5, getViaductFactor(trainS));
    trainS = wrapS(trainS + speed * dt);
    simTime += dt;
  }
  if (!cam.isInteracting) {
    cam.idleSeconds += dt;
    if (cam.idleSeconds >= AUTO_RETURN_DELAY) cam.autoReturning = true;
  }
  if (cam.autoReturning) {
    cam.targetYaw = ((cam.targetYaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    const r = 1.0 - Math.exp(-dt * 1.65);
    cam.targetYaw = mix(cam.targetYaw, DEFAULT_YAW, r);
    cam.targetPitch = mix(cam.targetPitch, DEFAULT_PITCH, r);
    cam.targetFov = mix(cam.targetFov, DEFAULT_FOV, r);
    const diff = ((cam.targetYaw - cam.yaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    cam.yaw = cam.targetYaw - diff;
  }
  const damp = 1.0 - Math.exp(-dt * 11.0);
  cam.yaw = mix(cam.yaw, cam.targetYaw, damp);
  cam.pitch = mix(cam.pitch, cam.targetPitch, damp);
  cam.fov = mix(cam.fov, cam.targetFov, damp);
}

function renderFrame(dt) {
  resizePipeline();
  const aspect = fboW / fboH;
  const tr = evalTrack(trainS);
  const sway = evalTrainSway(trainS, simTime, tr);

  const camLocal = [CAM_SEAT_POS[0] + sway.dx, CAM_SEAT_POS[1] + sway.dy, CAM_SEAT_POS[2] + sway.dz];
  const pitchEff = clamp(cam.pitch + sway.pitch, -1.42, 1.42);
  const cp = Math.cos(pitchEff), sp = Math.sin(pitchEff), cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const lookLocal = [cy * cp, sp, sy * cp];
  const upLocal = [-Math.sin(sway.roll) * sy, Math.cos(sway.roll), Math.sin(sway.roll) * cy];
  const centerLocal = [camLocal[0] + lookLocal[0], camLocal[1] + lookLocal[1], camLocal[2] + lookLocal[2]];

  const SHUTTER_DT = 1.0 / 54.0;
  const currSpeed = mix(BASE_SPEED, 22.5, getViaductFactor(trainS));
  const prevS = trainS - currSpeed * SHUTTER_DT;
  const trPrev = evalTrack(prevS);

  Mat4.fromBasis(matCarWorld, rotateVecByRoll(tr.right, tr.bank * 0.35), rotateVecByRoll(tr.up, tr.bank * 0.35), tr.fwd, [tr.x, tr.y, -trainS]);
  Mat4.invertRigid(matCarInv, matCarWorld);

  const matPrevCarWorld = Mat4.fromBasis(Mat4.create(), rotateVecByRoll(trPrev.right, trPrev.bank * 0.35), rotateVecByRoll(trPrev.up, trPrev.bank * 0.35), trPrev.fwd, [trPrev.x, trPrev.y, -prevS]);
  const matPrevCarInv = Mat4.invertRigid(Mat4.create(), matPrevCarWorld);

  Mat4.perspective(matProj, cam.fov * Math.PI / 180.0, aspect, 0.08, 16000.0);
  Mat4.lookAt(matLocalView, camLocal, centerLocal, upLocal);
  Mat4.multiply(matLocalVP, matProj, matLocalView);
  Mat4.multiply(matWorldView, matLocalView, matCarInv);
  Mat4.multiply(matWorldVP, matProj, matWorldView);
  Mat4.invert4(matInvVP, matWorldVP);
  Mat4.multiply(matPrevVP, matProj, Mat4.multiply(Mat4.create(), matLocalView, matPrevCarInv));

  const camWorld = [
    matCarWorld[0]*camLocal[0] + matCarWorld[4]*camLocal[1] + matCarWorld[8]*camLocal[2]  + matCarWorld[12],
    matCarWorld[1]*camLocal[0] + matCarWorld[5]*camLocal[1] + matCarWorld[9]*camLocal[2]  + matCarWorld[13],
    matCarWorld[2]*camLocal[0] + matCarWorld[6]*camLocal[1] + matCarWorld[10]*camLocal[2] + matCarWorld[14]
  ];
  const sunLocal = [
    matCarInv[0]*SUN_WORLD[0] + matCarInv[4]*SUN_WORLD[1] + matCarInv[8]*SUN_WORLD[2],
    matCarInv[1]*SUN_WORLD[0] + matCarInv[5]*SUN_WORLD[1] + matCarInv[9]*SUN_WORLD[2],
    matCarInv[2]*SUN_WORLD[0] + matCarInv[6]*SUN_WORLD[1] + matCarInv[10]*SUN_WORLD[2]
  ];

  const tunFactor = getTunnelFactor(trainS);
  const galFactor = getGalleryFactor(trainS);
  const galPillarStrobe = 0.20 + 0.80 * smoothstep(0.18, 0.42, Math.abs(((trainS - GALLERY_A) % 8.8) / 8.8 - 0.5) * 2.0);
  const inForestZone = smoothBox(trainS, 1485, 2010, 28.0);
  const treeDapple = 0.58 + 0.42 * (0.5 + 0.5 * Math.sin(trainS * 0.48) * Math.cos(trainS * 0.19));
  const daylight = (1.0 - tunFactor) * mix(1.0, 0.50, galFactor);
  const treeStrobe = mix(mix(1.0, treeDapple, inForestZone), galPillarStrobe, galFactor);
  const tunLampPhase = Math.abs(((trainS % 22.0) / 22.0) - 0.5) * 2.0;
  const tunnelLampFlash = tunFactor * Math.exp(-tunLampPhase * tunLampPhase * 22.0);

  // PASS 1: EXTERIOR WORLD
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.exterior.fbo);
  gl.viewport(0, 0, fboW, fboH);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.enable(gl.CULL_FACE); gl.frontFace(gl.CCW);

  // 1A. Alpine Sky & Sunlit Clouds
  gl.depthMask(false); gl.disable(gl.CULL_FACE);
  gl.useProgram(progs.sky.prog);
  gl.uniformMatrix4fv(progs.sky.u.uInvVP, false, matInvVP);
  gl.uniform3fv(progs.sky.u.uCamPos, camWorld);
  gl.uniform1f(progs.sky.u.uTime, simTime);
  drawFSQuad();
  gl.depthMask(true); gl.enable(gl.CULL_FACE);

  const zShifts = [0.0];
  if (trainS < 1250.0) zShifts.push(LOOP_LEN);
  if (trainS > LOOP_LEN - 1250.0) zShifts.push(-LOOP_LEN);

  // 1B. Two-Zone Stitched Isotropic Alpine Terrain Chunks
  gl.useProgram(progs.terrain.prog);
  gl.uniformMatrix4fv(progs.terrain.u.uCurrVP, false, matWorldVP);
  gl.uniformMatrix4fv(progs.terrain.u.uPrevVP, false, matPrevVP);
  gl.uniform3fv(progs.terrain.u.uCamPos, camWorld);
  gl.uniform1f(progs.terrain.u.uTime, simTime);
  gl.uniform1f(progs.terrain.u.uLoopLen, LOOP_LEN);
  for (let i = 0; i < terrainChunks.length; i++) {
    const ch = terrainChunks[i];
    const deltaS = wrapDeltaS(ch.sCenter - trainS);
    gl.uniform1f(progs.terrain.u.uZShift, ch.sCenter - (trainS + deltaS));
    drawMesh(ch.mesh);
  }

  // 1C. Glacial Turquoise Lake & Foaming Gorge Torrent River
  gl.useProgram(progs.water.prog);
  gl.uniformMatrix4fv(progs.water.u.uCurrVP, false, matWorldVP);
  gl.uniformMatrix4fv(progs.water.u.uPrevVP, false, matPrevVP);
  gl.uniform3fv(progs.water.u.uCamPos, camWorld);

  gl.useProgram(progs.pine.prog);
  gl.uniformMatrix4fv(progs.pine.u.uCurrVP, false, matWorldVP);
  gl.uniformMatrix4fv(progs.pine.u.uPrevVP, false, matPrevVP);
  gl.uniform1f(progs.pine.u.uTrainS, trainS);
  gl.uniform1f(progs.pine.u.uLoopLen, LOOP_LEN);
  gl.uniform3fv(progs.pine.u.uCamPos, camWorld);
  gl.uniform1f(progs.pine.u.uTime, simTime);
  gl.bindVertexArray(pineForest.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, pineForest.count, pineForest.idxType, 0, pineForest.instances);
  gl.enable(gl.CULL_FACE);

  // 1E. Viaducts, Track, Catenary Masts, Tunnels, Avalanche Gallery, Alpine Villages & Moving Red Swiss Train across the Gorge Viaduct!
  gl.useProgram(progs.worldPbr.prog);
  gl.uniformMatrix4fv(progs.worldPbr.u.uCurrVP, false, matWorldVP);
  gl.uniformMatrix4fv(progs.worldPbr.u.uPrevVP, false, matPrevVP);
  gl.uniform3fv(progs.worldPbr.u.uCamPos, camWorld);
  gl.uniform1f(progs.worldPbr.u.uTime, simTime);

  const matShift = Mat4.identity(Mat4.create());
  for (const zs of zShifts) {
    matShift[14] = zs;
    gl.uniformMatrix4fv(progs.worldPbr.u.uModel, false, matShift);
    gl.uniformMatrix4fv(progs.worldPbr.u.uPrevModel, false, matShift);
    drawMesh(viaductMesh);
    drawMesh(villageMesh);
    gl.disable(gl.CULL_FACE);
    drawMesh(tunnelMesh);
    gl.enable(gl.CULL_FACE);

    // 4-Car Gleaming Ruby-Red Glacier Express Train gliding gracefully across the Iconic Curved Stone Gorge Viaduct!!
    // Timed naturally with trainS (or continuous loop across the viaduct) so it's curving heroically across the stone arches right as you pass!
    const tLead = clamp(0.32 + ((trainS - 760.0) / 360.0) * 0.45 + Math.sin(simTime * 0.08) * 0.04, 0.14, 0.88);
    const tPrevLead = tLead - (0.0022);
    for (let k = 0; k < 4; k++) {
      const tC = tLead - k * 0.078;
      const tP = tPrevLead - k * 0.078;
      if (tC < 0.03 || tC > 0.96) continue;
      const frC = evalGorgeViaductFrame(tC);
      const frP = evalGorgeViaductFrame(clamp(tP, 0.01, 0.98));
      Mat4.fromBasis(matCoachCurr, frC.right, frC.up, frC.fwd, [frC.pos[0], frC.pos[1] + 0.55, frC.pos[2] + zs]);
      Mat4.fromBasis(matCoachPrev, frP.right, frP.up, frP.fwd, [frP.pos[0], frP.pos[1] + 0.55, frP.pos[2] + zs]);
      gl.uniformMatrix4fv(progs.worldPbr.u.uModel, false, matCoachCurr);
      gl.uniformMatrix4fv(progs.worldPbr.u.uPrevModel, false, matCoachPrev);
      drawMesh(forwardCoach);
    }
  }

  // PASS 2 & 3: VELOCITY TILE-MAX -> NEIGHBOR-MAX -> GAUSSIAN DEPTH-AWARE MOTION BLUR
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.tileMax.fbo); gl.viewport(0, 0, fbos.tileMax.w, fbos.tileMax.h);
  gl.useProgram(progs.tileMax.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.exterior.texs[1]);
  gl.uniform1i(progs.tileMax.u.uVelTex, 0);
  gl.uniform2f(progs.tileMax.u.uTexelSize, 1.0 / fboW, 1.0 / fboH);
  gl.uniform1i(progs.tileMax.u.uTileSize, TILE_SIZE);
  drawFSQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.neighborMax.fbo); gl.viewport(0, 0, fbos.neighborMax.w, fbos.neighborMax.h);
  gl.useProgram(progs.neighborMax.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.tileMax.texs[0]);
  gl.uniform1i(progs.neighborMax.u.uTileTex, 0);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.extBlurred.fbo); gl.viewport(0, 0, fboW, fboH);
  gl.useProgram(progs.motionBlur.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.exterior.texs[0]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbos.exterior.texs[1]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, fbos.neighborMax.texs[0]);
  gl.uniform1i(progs.motionBlur.u.uColorTex, 0);
  gl.uniform1i(progs.motionBlur.u.uVelTex, 1);
  gl.uniform1i(progs.motionBlur.u.uNeighborTex, 2);
  gl.uniform1f(progs.motionBlur.u.uBlurScale, 1.15);
  drawFSQuad();

  // PASS 4: TRUE PLANAR MIRRORED INTERIOR REFLECTIONS
  const setupInteriorUniforms = (vpMat, mirrorClip) => {
    gl.useProgram(progs.interior.prog);
    gl.uniformMatrix4fv(progs.interior.u.uVP, false, vpMat);
    gl.uniform3fv(progs.interior.u.uCamLocal, camLocal);
    gl.uniform3fv(progs.interior.u.uSunLocal, sunLocal);
    gl.uniform1f(progs.interior.u.uDaylight, daylight);
    gl.uniform1f(progs.interior.u.uTreeStrobe, treeStrobe);
    gl.uniform1f(progs.interior.u.uTunnelLampFlash, tunnelLampFlash);
    gl.uniform1f(progs.interior.u.uMirrorClip, mirrorClip);
    gl.uniform1f(progs.interior.u.uTime, simTime);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, textures.walnut);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, textures.fabric);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, textures.sign);
    gl.uniform1i(progs.interior.u.uTexWalnut, 0);
    gl.uniform1i(progs.interior.u.uTexFabric, 1);
    gl.uniform1i(progs.interior.u.uTexSign, 2);
  };

  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.frontFace(gl.CW);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.reflRight.fbo); gl.viewport(0, 0, fbos.reflRight.w, fbos.reflRight.h);
  gl.clearColor(0.010, 0.012, 0.016, 1.0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  Mat4.mirrorX(matMirror, WIN_PLANE_X); Mat4.multiply(matMirrorView, matLocalView, matMirror); Mat4.multiply(matMirrorVP, matProj, matMirrorView);
  setupInteriorUniforms(matMirrorVP, 1.0); drawMesh(carriageData.interior);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.reflLeft.fbo); gl.viewport(0, 0, fbos.reflLeft.w, fbos.reflLeft.h);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  Mat4.mirrorX(matMirror, -WIN_PLANE_X); Mat4.multiply(matMirrorView, matLocalView, matMirror); Mat4.multiply(matMirrorVP, matProj, matMirrorView);
  setupInteriorUniforms(matMirrorVP, -1.0); drawMesh(carriageData.interior);
  gl.frontFace(gl.CCW);

  // PASS 5: CARRIAGE INTERIOR + DOUBLE-GLAZED PANORAMIC GLASS COMPOSITING
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.sceneHDR.fbo); gl.viewport(0, 0, fboW, fboH);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbos.extBlurred.fbo);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbos.sceneHDR.fbo);
  gl.blitFramebuffer(0, 0, fboW, fboH, 0, 0, fboW, fboH, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.sceneHDR.fbo);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
  setupInteriorUniforms(matLocalVP, 0.0); drawMesh(carriageData.interior);

  gl.disable(gl.CULL_FACE);
  gl.useProgram(progs.glass.prog);
  gl.uniformMatrix4fv(progs.glass.u.uVP, false, matLocalVP);
  gl.uniform2f(progs.glass.u.uResolution, fboW, fboH);
  gl.uniform3fv(progs.glass.u.uCamLocal, camLocal);
  gl.uniform3fv(progs.glass.u.uSunLocal, sunLocal);
  gl.uniform1f(progs.glass.u.uDaylight, daylight);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.extBlurred.texs[0]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbos.reflRight.texs[0]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, fbos.reflLeft.texs[0]);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, textures.glass);
  gl.uniform1i(progs.glass.u.uExteriorTex, 0); gl.uniform1i(progs.glass.u.uReflRightTex, 1);
  gl.uniform1i(progs.glass.u.uReflLeftTex, 2); gl.uniform1i(progs.glass.u.uGlassTex, 3);
  drawMesh(carriageData.glass);

  // PASS 6A: GPU TEMPORAL AUTO-EXPOSURE METERING
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
  gl.useProgram(progs.lumaReduce.prog);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.luma64.fbo); gl.viewport(0, 0, 64, 64);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.sceneHDR.texs[0]);
  gl.uniform1i(progs.lumaReduce.u.uTex, 0); gl.uniform2f(progs.lumaReduce.u.uTexel, 1/256, 1/256); gl.uniform1i(progs.lumaReduce.u.uFirstPass, 1);
  drawFSQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.luma16.fbo); gl.viewport(0, 0, 16, 16);
  gl.bindTexture(gl.TEXTURE_2D, fbos.luma64.texs[0]); gl.uniform2f(progs.lumaReduce.u.uTexel, 1/64, 1/64); gl.uniform1i(progs.lumaReduce.u.uFirstPass, 0);
  drawFSQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.luma4.fbo); gl.viewport(0, 0, 4, 4);
  gl.bindTexture(gl.TEXTURE_2D, fbos.luma16.texs[0]); gl.uniform2f(progs.lumaReduce.u.uTexel, 1/16, 1/16);
  drawFSQuad();

  const nextExpIdx = 1 - expIdx;
  gl.bindFramebuffer(gl.FRAMEBUFFER, expFBOs[nextExpIdx].fbo); gl.viewport(0, 0, 1, 1);
  gl.useProgram(progs.autoExp.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.luma4.texs[0]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, expFBOs[expIdx].texs[0]);
  gl.uniform1i(progs.autoExp.u.uLumaTex, 0); gl.uniform1i(progs.autoExp.u.uPrevExpTex, 1);
  gl.uniform1f(progs.autoExp.u.uDt, Math.max(dt, 0.001)); gl.uniform1i(progs.autoExp.u.uReset, exposureNeedsReset ? 1 : 0);
  drawFSQuad();
  expIdx = nextExpIdx; exposureNeedsReset = false;

  // PASS 6B: 5-LEVEL DUAL-KAWASE HDR BLOOM
  gl.useProgram(progs.bloomDown.prog);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, expFBOs[expIdx].texs[0]);
  gl.uniform1i(progs.bloomDown.u.uExpTex, 1);
  let srcTex = fbos.sceneHDR.texs[0], srcW = fboW, srcH = fboH;
  for (let i = 0; i < fbos.bloomDown.length; i++) {
    const dst = fbos.bloomDown[i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo); gl.viewport(0, 0, dst.w, dst.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(progs.bloomDown.u.uTex, 0); gl.uniform2f(progs.bloomDown.u.uTexel, 1/srcW, 1/srcH); gl.uniform1i(progs.bloomDown.u.uFirst, i === 0 ? 1 : 0);
    drawFSQuad();
    srcTex = dst.texs[0]; srcW = dst.w; srcH = dst.h;
  }
  gl.useProgram(progs.bloomUp.prog);
  let smallTex = fbos.bloomDown[4].texs[0], smallW = fbos.bloomDown[4].w, smallH = fbos.bloomDown[4].h;
  for (let i = 0; i < fbos.bloomUp.length; i++) {
    const dst = fbos.bloomUp[i], large = fbos.bloomDown[3 - i];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo); gl.viewport(0, 0, dst.w, dst.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, smallTex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, large.texs[0]);
    gl.uniform1i(progs.bloomUp.u.uSmallTex, 0); gl.uniform1i(progs.bloomUp.u.uLargeTex, 1); gl.uniform2f(progs.bloomUp.u.uTexel, 1/smallW, 1/smallH);
    drawFSQuad();
    smallTex = dst.texs[0]; smallW = dst.w; smallH = dst.h;
  }

  // PASS 7: FINAL ACES FILMIC TONE MAPPING
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, fboW, fboH);
  gl.useProgram(progs.tonemap.prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbos.sceneHDR.texs[0]);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, smallTex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, expFBOs[expIdx].texs[0]);
  gl.uniform1i(progs.tonemap.u.uSceneTex, 0); gl.uniform1i(progs.tonemap.u.uBloomTex, 1); gl.uniform1i(progs.tonemap.u.uExpTex, 2);
  gl.uniform1f(progs.tonemap.u.uTime, simTime);
  gl.uniform1f(progs.tonemap.u.uFovNorm, clamp((DEFAULT_FOV - cam.fov) / 34.0, 0.0, 1.0));
  drawFSQuad();

  const sec = getSectionInfo(trainS);
  const secKey = sec.name + sec.elev;
  if (secKey !== lastHudSection) {
    lastHudSection = secKey;
    hudLocEl.textContent = sec.name;
    hudMetaEl.textContent = sec.elev.toLocaleString("en-US") + " m";
    hudDotEls.forEach((d, idx) => d.classList.toggle("active", idx === sec.idx));
  }
}

// ============================================================================
// 15. ANIMATION LOOP & VERIFICATION HOOKS
// ============================================================================
if (HASH.warmup !== undefined) {
  const sFrom = parseFloat(HASH.warmup), sTo = parseFloat(HASH.s || "1160");
  const steps = parseInt(HASH.steps || "18", 10);
  trainS = wrapS(sFrom); exposureNeedsReset = true;
  renderFrame(0.016);
  const dtStep = Math.abs(wrapDeltaS(sTo - sFrom)) / (BASE_SPEED * Math.max(1, steps));
  for (let i = 1; i <= steps; i++) {
    trainS = wrapS(sFrom + wrapDeltaS(sTo - sFrom) * (i / steps));
    simTime += dtStep;
    renderFrame(dtStep);
  }
  paused = true;
} else if (HASH.selftest === "1") {
  renderFrame(0.016);
  const startYaw = cam.yaw;
  canvas.dispatchEvent(new PointerEvent("pointerdown", { pointerId: 1, clientX: 600, clientY: 360, bubbles: true }));
  for (let i = 1; i <= 10; i++) {
    canvas.dispatchEvent(new PointerEvent("pointermove", { pointerId: 1, clientX: 600 - i * 45, clientY: 360 - i * 8, bubbles: true }));
    updateSimulation(0.03);
  }
  canvas.dispatchEvent(new PointerEvent("pointerup", { pointerId: 1, clientX: 150, clientY: 280, bubbles: true }));
  const afterDragYaw = cam.targetYaw, afterDragPitch = cam.targetPitch;
  canvas.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, bubbles: true, cancelable: true }));
  canvas.dispatchEvent(new WheelEvent("wheel", { deltaY: -100, bubbles: true, cancelable: true }));
  const afterWheelFov = cam.targetFov;
  canvas.dispatchEvent(new PointerEvent("pointerdown", { pointerId: 2, clientX: 400, clientY: 360, bubbles: true }));
  canvas.dispatchEvent(new PointerEvent("pointerdown", { pointerId: 3, clientX: 500, clientY: 360, bubbles: true }));
  canvas.dispatchEvent(new PointerEvent("pointermove", { pointerId: 3, clientX: 460, clientY: 360, bubbles: true }));
  canvas.dispatchEvent(new PointerEvent("pointerup", { pointerId: 2, clientX: 400, clientY: 360, bubbles: true }));
  canvas.dispatchEvent(new PointerEvent("pointerup", { pointerId: 3, clientX: 460, clientY: 360, bubbles: true }));
  const afterPinchFov = cam.targetFov;
  for (let i = 0; i < 160; i++) updateSimulation(0.05);
  const glErr = gl.getError();
  const pass = (Math.abs(afterDragYaw - startYaw) > 1.2 && Math.abs(afterDragPitch) > 0.15 && afterWheelFov < DEFAULT_FOV - 5.0 && afterPinchFov > afterWheelFov + 3.0 && Math.abs(cam.yaw - DEFAULT_YAW) < 0.03 && Math.abs(cam.pitch - DEFAULT_PITCH) < 0.03 && Math.abs(cam.fov - DEFAULT_FOV) < 0.5 && glErr === gl.NO_ERROR);
  document.title = `SELFTEST:${pass ? "PASS" : "FAIL"}|dragYaw=${afterDragYaw.toFixed(2)}|wheelFov=${afterWheelFov.toFixed(1)}|pinchFov=${afterPinchFov.toFixed(1)}|retYaw=${cam.yaw.toFixed(3)}|retFov=${cam.fov.toFixed(1)}|glErr=${glErr}`;
  renderFrame(0.016);
} else {
  renderFrame(0.016);
}

window.__alps = {
  setProgress(s) { trainS = wrapS(s); },
  setCamera(yawDeg, pitchDeg, fovDeg) {
    cam.yaw = cam.targetYaw = yawDeg * Math.PI / 180;
    cam.pitch = cam.targetPitch = pitchDeg * Math.PI / 180;
    cam.fov = cam.targetFov = fovDeg;
    cam.autoReturning = false; cam.idleSeconds = 0;
  },
  setPaused(p) { paused = !!p; },
  step(dt) { updateSimulation(dt); renderFrame(dt); },
  getState() { return { trainS, simTime, yaw: cam.yaw, pitch: cam.pitch, fov: cam.fov, autoReturning: cam.autoReturning, glError: gl.getError() }; }
};

let lastTs = performance.now();
function loop(ts) {
  const dt = clamp((ts - lastTs) * 0.001, 0.001, 0.05);
  lastTs = ts;
  updateSimulation(dt);
  renderFrame(dt);
  requestAnimationFrame(loop);
}
if (!HASH.warmup && HASH.selftest !== "1" && HASH.paused !== "1") {
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
