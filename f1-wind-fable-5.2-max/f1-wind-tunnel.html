    U('uView', CAM.view); U('uProj', CAM.proj); U('uInvView', M4.invert(CAM.view)); U('uVP', [PT.sw, PT.sh]); U('uInvVP', [1 / PT.sw, 1 / PT.sh]);
    U('uTanHalf', [th * (w / h), th]); U('uEmit', SM.emit); U('uH', FLOW.h); U('uLight', [TUNE.smokeAmb, TUNE.smokeKey]);
    U('uVolMin', VOL.min); U('uVolSize', VOL.size); U('uVolDim', VOL.dim); U('uVolTiles', VOL.tiles);
    U('uMirror', 0); U('uLodBias', 0); U('uTint', TUNE.smokeTint);

  use(P.composite);
  UT('uScene', gl.TEXTURE_2D, RT.scene); UT('uDepth', gl.TEXTURE_2D, RT.depth); UT('uSmoke', gl.TEXTURE_2D, PT.smoke); UT('uHDepth', gl.TEXTURE_2D, PT.hdepth);
  U('uNF', nf); U('uSmokeSize', [PT.sw, PT.sh]); U('uSmokeTint', TUNE.smokeTint); U('uFocus', TUNE.focus); drawFS();

  const e = CAM.eye, near = V.len(V.sub(e, [clamp(e[0], -2.85, 2.7), clamp(e[1], 0.1, 0.95), clamp(e[2], -0.95, 0.95)])), mid = V.len(V.sub(e, CAM.tgt));

// ------------------------------------------------------------------ camera: slow cinematic glide + orbit / zoom controls
const CAM = {
  fov: 0.5, az: 2.2, el: 0.2, zoom: 0.93, azT: 2.2, elT: 0.2, zoomT: 0.93, dist: 7, tgt: [0.1, 0.45, 0], vel: 0, velEl: 0,
  auto: 1, lastInput: -1e9, dragging: false, eye: [0, 0, 0], view: null, proj: null, near: 0.12, far: 90, frozen: false,

function camDir(az, el) { return [Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)]; }

const camMaxDist = (d) => Math.min(10.5, ellipsoid(d, 7.5, HALL.h - 1.1, HALL.zw - 0.7));
function touchCamera() { CAM.lastInput = performance.now(); $('hint').classList.remove('on'); }
function updateCamera(dt, time) {
  const idle = (performance.now() - CAM.lastInput) / 1000, wantAuto = !CAM.dragging && idle > 3.2 && !CAM.frozen;
  CAM.auto = clamp(CAM.auto + (wantAuto ? dt / 3.0 : -dt / 0.4), 0, 1);
  const k = CAM.auto * CAM.auto * (3 - 2 * CAM.auto);

function setupInput() {

    if (pts.size === 2) { const a = [...pts.values()]; pinch = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
    canvas.classList.add('drag'); touchCamera(); e.preventDefault();

// ------------------------------------------------------------------ frame
const FS_FINAL_SIMPLE = `in vec2 vUV; uniform sampler2D uSrc; out vec4 o;
void main(){ vec3 c = texture(uSrc, vUV).rgb * 1.0; c = c / (1.0 + c); o = vec4(pow(c, vec3(1.0 / 2.2)), 1.0); }`;

function renderScene() {
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  // mirrored pass for the floor reflections

  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.reflFBO); gl.viewport(0, 0, RT.rw, RT.rh);
  gl.clearColor(FOG_COL[0], FOG_COL[1], FOG_COL[2], 60); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.frontFace(gl.CW);

  gl.frontFace(gl.CCW);

let lastNow = 0, frameNo = 0, ready = false;
const PERF = { ema: 16.7, scale: 1 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * PERF.scale;
  let w = Math.max(2, Math.floor(canvas.clientWidth * dpr)), h = Math.max(2, Math.floor(canvas.clientHeight * dpr));

  PERF.sinceUp = (PERF.sinceUp || 0) + rawDt;

  else if (PERF.ema < 17.5 && PERF.scale < 1 && PERF.hold > 6 && (PERF.upFails || 0) < 2) { PERF.scale = Math.min(1, PERF.scale * 1.1); PERF.hold = 0; PERF.sinceUp = 0; }

  S.belt = (S.belt + U0 * dt) % 9800; S.spin = (S.spin + om * dt) % TAU; S.spinBlur = om / 330;

  else if (!ready) { ready = true; $('veil').classList.add('off'); $('load').classList.add('off'); setTimeout(() => { if (performance.now() - CAM.lastInput > 5000) $('hint').classList.add('on'); }, 2600); setTimeout(() => $('hint').classList.remove('on'), 11000); }

async function boot() {

  S.blackCube = gl.createTexture(); gl.bindTexture(gl.TEXTURE_CUBE_MAP, S.blackCube);
  for (let f = 0; f < 6; f++) gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + f, 0, gl.RGBA8, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
