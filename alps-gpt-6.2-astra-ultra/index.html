absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:ew-resize}.scrubber:focus-within{outline:1px solid var(--gold);outline-offset:1px;border-radius:3px}.routebutton{gap:9px;border:0;background:none;border-radius:5px;white-space:nowrap;padding:8px 0 8px 9px;font-size:12px;letter-spacing:.015em}.routebutton svg{width:16px;height:16px;color:#eac583}.routebutton .chev{width:10px;height:10px;color:#ede6d5;transition:transform .2s}.routebutton[aria-expanded=true] .chev{transform:rotate(180deg)}.sheet{position:absolute;bottom:max(86px,calc(env(safe-area-inset-bottom) + 80px));right:var(--edge);width:min(345px,calc(100% - 2 * var(--edge)));padding:22px 22px 12px;border:1px solid #dfceab41;background:linear-gradient(130deg,#292c27f3,#171c1af5);border-radius:14px;backdrop-filter:blur(18px);box-shadow:0 16px 65px #0a0e0f65;transform-origin:bottom right;animation:appear .18s ease-out}.sheet[hidden]{display:none}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.sheethead{justify-content:space-between;padding-bottom:14px;border-bottom:1px solid #f2e0c02a}.eyebrow{font-size:9px;color:var(--gold);text-transform:uppercase}.sheet h2{font:normal 29px/1.1 var(--serif);letter-spacing:-.035em;margin:6px 0 1px}.close{width:29px;height:29px}.close svg{width:13px;height:13px}.logentry{background:transparent;border:0;border-bottom:1px solid #eadbb716;gap:13px;padding:13px 3px;width:100%;text-align:left;color:#dddacc}.logentry:last-child{border-bottom:0}.logentry:hover,.logentry[aria-current=true]{color:#ffe4ae}.lognum{font-size:9px;color:#c4b18c}.logtitle{flex:1;font-size:13px}.logtime{font-size:10px;letter-spacing:.06em;color:#baafa0;font-variant-numeric:tabular-nums}.playmark{width:11px;height:11px;opacity:0}.logentry[aria-current=true] .playmark{opacity:1}.logfoot{font-size:10px;line-height:1.4;color:#b5b3a8;margin:10px 0 4px}.sr{position:absolute;overflow:hidden;width:1px;height:1px;clip:rect(0,0,0,0);white-space:nowrap}

<script>
'use strict';
function createLandscape(gl, engine) {
  // All distances are metres. A continuous height field ties snow, water and timberline together.
  let seed = 311079;
  const random = () => ((seed = (Math.imul(1664525, seed) + 1013904223) >>> 0) / 4294967296);
  const noiseSize = 256;
  const noiseBytes = new Uint8Array(noiseSize * noiseSize * 4);
  for (let i=0;i<noiseBytes.length;i++) noiseBytes[i] = random() * 256;
  function noise(x,y) {
    let i = Math.floor(x), j = Math.floor(y);
    let a=x-i, b=y-j; a=a*a*(3-2*a); b=b*b*(3-2*b);
    const p=((i&255)+((j&255)<<8))*4, q=(((i+1)&255)+((j&255)<<8))*4;
    const r=((i&255)+(((j+1)&255)<<8))*4, s=(((i+1)&255)+(((j+1)&255)<<8))*4;
    return ((noiseBytes[p]*(1-a)+noiseBytes[q]*a)*(1-b)+(noiseBytes[r]*(1-a)+noiseBytes[s]*a)*b)/255;
  }
  const sat = x => Math.min(1,Math.max(0,x));
  const smooth = (a,b,x) => {const t=sat((x-a)/(b-a)); return t*t*(3-2*t);};
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,256,256,0,gl.RGBA,gl.UNSIGNED_BYTE,noiseBytes);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);

  // Distinct aiguilles and shoulders form the massif. The intervening spurs follow folded rock beds.
  const main = [
    [-3600,3900,1090,1750,1950],[-2780,3740,1205,1080,1540],[-2150,3500,1060,990,1380],
    [-1470,3550,1050,1200,1520],[-1060,3470,1055,1150,1600],[-785,3440,1200,1090,1570],
    [-430,3460,1425,1590,1940],[-195,3410,1270,920,1520],[120,3330,997,750,1160],
    [460,3710,1000,960,1420],[820,3850,1010,1150,1650],[1290,3390,910,1200,1420],
    [1910,3120,950,1260,1740],[2300,3680,1230,1080,1650],[2710,3870,1300,1450,1690],
    [3150,3530,1180,1170,1500],[3850,3450,830,1200,1460],[4420,3100,660,1170,1350]
  ];
  const peaks = [[],[]];
  for(let side=0;side<2;side++){
    let p=peaks[side];
    if (!side) p.push(...main.map(v=>v.slice()));
    for(let x=-15300;x<16400;x+=440+random()*620) {
      if(!side && x>-4050 && x<4750) continue;
      const d=3150+random()*1200;
      p.push([x,d,810+random()*650,850+random()*850,1150+random()*790]);
    }
    for(let x=-15500;x<17000;x+=620+random()*800) {
      const d=5300+random()*1200;
      p.push([x,d,1130+random()*555,1350+random()*900,1250+random()*1150]);
    }
    for (const q of p) q.push(random()*6.28, random()*.6-.3);
  }
  function shore(x,side) {
    return 834 + 115*Math.sin(x*.00129+side) + 78*Math.cos(x*.00274 +.4) + 130*(noise(x*.00085+45,3.2+side)-.5) + 45*(noise(x*.00315,33)-.5);
  }
  function ground(x,d,side) {
    const inland=d-shore(x,side);
    if (inland < -28) return -18;
    const u=x+side*1700;
    const lo=noise(u*.00065+16.8,d*.00078+9.2);
    const med=noise(u*.0025+10,d*.00235+8);
    const ridgeD=1410+190*Math.sin(u*.00119)+90*Math.cos(u*.0028);
    const hill=(23+97*noise(u*.00104,13.8+side))*(.52+.48*smooth(80,1050,Math.abs(u-150)))*Math.exp(-Math.pow((d-ridgeD)/(320+145*lo),2));
    const base=12+lo*42+med*22+hill;
    let h=0;
    if(d>1320){
      const dxw=150*(lo-.5) + 75*(med-.5) + 48*(noise(u*.007,d*.006)-.5);
      const dzw=165*(noise(u*.0008-8,d*.0009)-.5) + 54*(noise(u*.002,d*.002)-.5);
      for(const p of peaks[side]) {
        if (Math.abs(x-p[0])>p[3]*1.55 || Math.abs(d-p[1])>p[4]*1.6) continue;
        const a=(x+dxw-p[0])/p[3], b=(d+dzw-p[1])/p[4], A=a+b*p[6];
        const ang=Math.atan2(b,A);
        const corrugation=.91-.13*Math.cos(3*ang+p[5])-.087*Math.cos(5*ang-1.3*p[5])+.054*Math.sin(8*ang+p[5]);
        const radius=Math.hypot(A,b)*corrugation;
        h=Math.max(h,p[2]*(1-Math.pow(radius,.89)));
      }
    }
    const high=smooth(170,750,h);
    const fault=(Math.abs(noise(u*.0026+d*.0012+11,d*.0018)-.47)-.20)*260
               +(Math.abs(noise(u*.0065-d*.004,d*.0048+33)-.48)-.20)*128
               +(Math.abs(noise(u*.014+d*.006,d*.012)-.50)-.20)*57;
    const drainage=(Math.pow(1.-Math.abs(2*noise(u*.0048+d*.0023+lo*.82,d*.0019)-1.),3.)-.25)*79
      +(Math.pow(1.-Math.abs(2*noise(u*.013-d*.007+med*.7,d*.004)-1.),2.)-.3)*34;
    const grain=(noise(u*.015+42,d*.014)-.5)*22+(noise(u*.031,d*.028)-.5)*10;
    const rise=Math.max(base,h)+ (lo-.5)*(50+high*90)+(med-.5)*(32+high*68)+fault*(.18+1.03*high)+drainage*high+grain*(.42+.78*high);
    return -12 + smooth(-22,142,inland)*(rise+12);
  }
  const terrain=[], forest=[];
  const attr=(loc,size,stride,off)=>{gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,off);};
  function buf(t,data){const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,data,gl.STATIC_DRAW); return b;}
  function axis(start,end,step){const a=[];for(let v=start;v<end;v+=step(v))a.push(v); a.push(end);return a;}
  for(let side=0;side<2;side++){
    const xs=axis(-14800,15800,v=>side?(v< -4800||v>7200?99:48):(v< -4200||v>6600?88:v> -2500&&v<3300?14:23));
    const ds=axis(550,9300,v=>side?(v<5500?44:92):(v<1800?19:v<4700?13:v<5800?25:72));
    const nx=xs.length,nd=ds.length,heights=new Float32Array(nx*nd);
    for(let j=0;j<nd;j++) for(let i=0;i<nx;i++)heights[j*nx+i]=ground(xs[i],ds[j],side);
    // Stream power deepens converging drainage lines. It leaves dry divides and asymmetric spurs intact.
    if(!side) {
      const bins=new Int32Array(2400), order=new Int32Array(heights.length);
      const tiles=new Uint16Array(heights.length), runoff=new Float32Array(heights.length);
      for(let i=0;i<heights.length;i++) {const b=Math.max(0,Math.min(2399,heights[i]+50|0));tiles[i]=b;bins[b]++;}
      let sum=0;for(let b=0;b<bins.length;b++){let n=bins[b];bins[b]=sum;sum+=n;}
      for(let i=0;i<heights.length;i++) order[bins[tiles[i]]++]=i;
      const neighbors=[-nx-1,-nx,-nx+1,-1,1,nx-1,nx,nx+1];
      const lengths=[.707,1,.707,1,1,.707,1,.707];
      runoff.fill(1);
      for(let j=order.length-1;j>=0;j--) {
        const n=order[j], h=heights[n];if(h<80||n<nx+1||n>=heights.length-nx-1) continue;
        let total=0;
        for(let k=0;k<8;k++){const dif=Math.max(0,(h-heights[n+neighbors[k]])*lengths[k]); total+=dif*dif;}
        if(total<=.001)continue;
        const a=runoff[n]/total;
        for(let k=0;k<8;k++){const dif=Math.max(0,(h-heights[n+neighbors[k]])*lengths[k]);runoff[n+neighbors[k]]+=a*dif*dif;}
      }
      const cuts=new Float32Array(heights.length);
      for(let n=nx;n<heights.length-nx;n++){
        const catchment=Math.log2(1.+runoff[n]);
        cuts[n]=Math.min(72.,Math.max(0.,catchment-1.)*7.8)*smooth(95.,410.,heights[n]);
      }
      for(let n=nx+1;n<heights.length-nx-1;n++)heights[n]-=cuts[n]*.66+(cuts[n-1]+cuts[n+1]+cuts[n-nx]+cuts[n+nx])*.085;
    }
    // True terrain shadows distinguish the shaded glaciers from directly illuminated snow.
    const steps=[42,80,145,240,365,520,725,1010,1380,1820,2410];
    const idx=(axis,v) => {let a=0,b=axis.length-1;while(b-a>1){let m=a+b>>1;if(axis[m]<=v)a=m;else b=m;}return a;};
    const xi=steps.map(t=>xs.map(x=>{const v=x-t*.76,i=idx(xs,v);return [i,sat((v-xs[i])/(xs[i+1]-xs[i]))];}));
