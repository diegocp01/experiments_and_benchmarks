<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Drive · Blue Hour</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Futura,"Century Gothic","Trebuchet MS",sans-serif}
  #c{position:absolute;left:0;top:50%;width:100vw;transform:translateY(-50%);display:block;background:#000}
  #title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;pointer-events:none;
         opacity:0;animation:titleFade 9s ease-in-out 0.6s 1 both;text-shadow:0 0 28px rgba(255,90,170,.55),0 0 4px rgba(0,0,0,.6)}
  #title h1{margin:0;font-weight:500;font-size:clamp(22px,4.6vw,76px);letter-spacing:.62em;text-indent:.62em}
  #title p{margin:1.2em 0 0;font-size:clamp(9px,1.05vw,17px);letter-spacing:.7em;text-indent:.7em;opacity:.85;text-transform:uppercase}
  @keyframes titleFade{0%{opacity:0;letter-spacing:.2em}18%{opacity:1}70%{opacity:1}100%{opacity:0}}
  #hint{position:absolute;right:14px;bottom:10px;color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.14em;pointer-events:none;transition:opacity 1.5s}
  #err{position:absolute;left:10px;top:10px;color:#f88;font:12px/1.4 monospace;white-space:pre-wrap;max-width:90vw}
  body.clean #title, body.clean #hint{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>OCEAN DRIVE</h1><p>Miami Beach &nbsp;·&nbsp; Blue Hour</p></div>
<div id="hint">SPACE pause &nbsp;·&nbsp; F fullscreen &nbsp;·&nbsp; H hide text</div>
<div id="err"></div>
<script>
'use strict';
/* =====================================================================================
   OCEAN DRIVE · BLUE HOUR — a fully procedural WebGL2 drone flyover.
   No images, no models, no libraries: geometry, textures, signs and sky are all code.
   Pipeline: HDR forward render (MSAA) + planar reflection for the wet street + bloom,
   anamorphic streaks, filmic tonemap, grain.
   ===================================================================================== */
const Q = new URLSearchParams(location.search);
const errBox = document.getElementById('err');
function fail(msg){ errBox.textContent += msg + '\n'; document.title = 'ERR ' + msg.slice(0,80); console.error(msg); }
if (Q.has('t') || Q.has('clean')) document.body.classList.add('clean');

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, depth:false, powerPreference:'high-performance', preserveDrawingBuffer:true});
if (!gl) fail('WebGL2 is not available in this browser.');
const extF = gl && gl.getExtension('EXT_color_buffer_float');
if (gl && !extF) fail('EXT_color_buffer_float missing — HDR rendering unavailable.');
gl && gl.getExtension('OES_texture_float_linear');

/* ------------------------------------------------------------------ math */
const lerp = (a,b,t)=>a+(b-a)*t;
const sm = t=>{t=Math.min(1,Math.max(0,t));return t*t*(3-2*t);};
const v3 = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
};
const M4 = {
  persp(tanH,tanV,n,f){const o=new Float32Array(16);o[0]=1/tanH;o[5]=1/tanV;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;},
  view(e,r,u,f){return new Float32Array([r[0],u[0],-f[0],0, r[1],u[1],-f[1],0, r[2],u[2],-f[2],0, -v3.dot(r,e),-v3.dot(u,e),v3.dot(f,e),1]);},
  model(tx,ty,tz,a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, tx,ty,tz,1]);}
};
function rng(seed){let a=seed>>>0;return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const srgb = h=>{const n=parseInt(h.slice(1),16);return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255].map(v=>Math.pow(v,2.2));};

/* ------------------------------------------------------------------ GLSL */
const G_COMMON = `
const float TILE=480.0;
const float FOGK=0.0014;
const vec3 SUND=vec3(-0.793,-0.099,-0.601);
const vec3 MOOND=vec3(0.700,0.135,-0.700);
float hash11(float p){p=fract(p*0.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec2(17.1,9.2);a*=0.5;}return s;}
float fbm3(vec2 p){float a=0.5,s=0.0;for(int i=0;i<3;i++){s+=a*vnoise(p);p=p*2.03+vec2(17.1,9.2);a*=0.5;}return s*1.07;}
// analytic twilight sky: afterglow toward the (set) sun, Belt of Venus over the ocean
vec3 skyBase(vec3 rd){
  float y=clamp(rd.y,0.0,1.0);
  vec2 h=normalize(rd.xz+vec2(1e-5));
  float az=dot(h,normalize(SUND.xz));
  float sw=smoothstep(-0.25,1.0,az);
  float anti=smoothstep(0.15,-1.0,az);
  vec3 zen=vec3(0.007,0.020,0.080);
  vec3 mid=vec3(0.024,0.068,0.215);
  vec3 col=mix(mid,zen,pow(y,0.5));
  float hz=exp(-y*7.0);
  vec3 low=mix(vec3(0.085,0.140,0.300),vec3(0.300,0.205,0.170),sw*sw);
  low=mix(low,vec3(0.075,0.100,0.235),anti);
  col=mix(col,low,hz);
  col+=vec3(1.30,0.42,0.065)*exp(-y*16.0)*pow(sw,3.0);
  col+=vec3(0.40,0.17,0.085)*exp(-y*6.0)*pow(sw,2.5)*0.65;
  col+=vec3(0.02,0.045,0.04)*exp(-pow((y-0.20)/0.09,2.0))*sw;
  col+=vec3(0.150,0.050,0.115)*exp(-pow((y-0.125)/0.07,2.0))*anti;
  return col;
}
vec3 haze(vec3 rd){return skyBase(normalize(vec3(rd.x,0.085,rd.z)))*0.60+vec3(0.010,0.008,0.014);}
vec3 ambient(vec3 n){
  vec3 a=mix(vec3(0.017,0.015,0.019),vec3(0.030,0.056,0.128),n.y*0.5+0.5);
  a+=max(n.x,0.0)*vec3(0.020,0.022,0.045);
  a+=max(-n.x,0.0)*vec3(0.040,0.024,0.018);
  return a*0.66;
}
vec3 lampLight(vec3 p,vec3 n){
  float acc=0.0;
  float zw=floor((p.z-15.0)/30.0+0.5)*30.0+15.0;
  float ze=floor(p.z/30.0+0.5)*30.0;
  for(int i=-1;i<=1;i++){
    vec3 L=vec3(-7.3,5.7,zw+float(i)*30.0)-p;float d2=dot(L,L);
    acc+=max(dot(n,L)*inversesqrt(d2),0.0)/(1.0+d2*0.07);
    L=vec3(7.3,5.7,ze+float(i)*30.0)-p;d2=dot(L,L);
    acc+=max(dot(n,L)*inversesqrt(d2),0.0)/(1.0+d2*0.07);
  }
  return acc*vec3(1.0,0.68,0.38)*1.7;
}
float lampSpec(vec3 p,vec3 n,vec3 V,float sh){
  float acc=0.0;
  float zw=floor((p.z-15.0)/30.0+0.5)*30.0+15.0;
  float ze=floor(p.z/30.0+0.5)*30.0;
  for(int i=-1;i<=1;i++){
    vec3 L=normalize(vec3(-7.3,5.7,zw+float(i)*30.0)-p);
    acc+=pow(max(dot(n,normalize(L+V)),0.0),sh);
    L=normalize(vec3(7.3,5.7,ze+float(i)*30.0)-p);
    acc+=pow(max(dot(n,normalize(L+V)),0.0),sh);
  }
  return acc;
}
`;

const VS_MESH = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNrm;layout(location=2) in vec2 aUV;
layout(location=3) in vec4 aCol;layout(location=4) in vec4 aEx;layout(location=5) in float aMat;
uniform mat4 uVP,uModel;uniform float uTime;
const float TILE_=480.0;
out vec3 vWP;out vec3 vN;out vec2 vUV;out vec4 vCol;out vec4 vEx;out float vMat;
void main(){
  vec3 lp=aPos;
  if(aMat>17.5&&aMat<18.5){             // pedestrians: stride, bob, and stroll along the tile (wraps seamlessly)
    float sp=aEx.x;bool path=aEx.z>5.0;float lf=path?aEx.z-10.0:aEx.z;
    float mv=step(0.01,abs(sp));
    float st=uTime*abs(sp)*3.4+aEx.w;
    float base=aEx.y;
    float sw=abs(lf)>1.5?clamp((1.38-lp.y)/0.6,0.0,1.0)*0.16:clamp(1.0-lp.y/0.88,0.0,1.0)*0.30;
    lp.z+=sign(lf)*step(0.5,abs(lf))*sin(st)*sw*mv;
    lp.y+=abs(sin(st))*0.03*mv;
    float zn=mod(base+sp*uTime,TILE_);
    if(path)lp.x+=5.0*(sin(zn*0.05236)-sin(base*0.05236));
    lp.z+=zn-base;
  }
  vec4 wp=uModel*vec4(lp,1.0);
  if(aMat>3.5&&aMat<5.5){               // palms: trunk bend + frond flutter in the sea breeze
    float ph=aEx.z;
    float g=sin(uTime*0.62+ph)*0.6+sin(uTime*1.37+ph*1.7)*0.4;
    float gust=0.55+0.45*sin(uTime*0.21+wp.z*0.017)+0.25*sin(uTime*0.47+wp.z*0.05+wp.x*0.03);
    vec2 wd=normalize(vec2(-0.8,-0.45));
    wp.xz+=wd*aEx.x*(0.7+0.6*g)*gust;
    float fw=aEx.y;
    wp.xz+=wd*fw*(0.55+0.5*g)*gust;
    wp.y+=fw*(sin(uTime*2.3+ph*3.0+aEx.w*9.0)*0.34+g*0.22)*gust;
    wp.xz+=vec2(wd.y,-wd.x)*fw*sin(uTime*3.1+aEx.w*23.0+ph)*0.22*gust;
  }
  vWP=wp.xyz;vN=mat3(uModel)*aNrm;vUV=aUV;vCol=vec4(aCol.rgb,aCol.a*2.0);vEx=aEx;vMat=aMat;
  gl_Position=uVP*wp;
}`;

const FS_MESH = `#version 300 es
precision highp float;
in vec3 vWP;in vec3 vN;in vec2 vUV;in vec4 vCol;in vec4 vEx;in float vMat;
uniform vec3 uCam;uniform float uTime,uMirror,uCarLights,uA2C,uAdd;uniform vec2 uLod;
uniform sampler2D uAtlas,uGlow;
float ign(vec2 p){return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715))));}
out vec4 o;
${G_COMMON}
vec3 envColor(vec3 R,vec3 p){
  vec3 c=skyBase(normalize(vec3(R.x,abs(R.y)+0.02,R.z)));
  if(R.y<0.0)c=mix(c*0.30,vec3(0.012,0.012,0.016),smoothstep(0.0,-0.35,R.y));
  float band=smoothstep(0.05,-0.55,R.x)*exp(-pow((R.y-0.22)/0.26,2.0));
  c+=texture(uGlow,vec2((p.z+R.z/max(-R.x,0.25)*14.0)/TILE,0.25)).rgb*band*1.3;
  return c;
}
vec3 parkLamp(vec3 p){
  float zl=floor((p.z-7.5)/15.0+0.5)*15.0+7.5;float acc=0.0;
  for(int i=-1;i<=1;i++){float z=zl+float(i)*15.0;float x=26.0+5.0*sin(z*0.05236)+2.6;
    vec3 L=vec3(x,1.1,z)-p;acc+=1.0/(1.0+dot(L,L)*0.30);}
  return acc*vec3(1.0,0.72,0.42)*1.5;
}
void main(){
  if(uMirror>0.5&&vWP.y<0.0)discard;
  int m=int(vMat+0.5);
  vec3 n=normalize(vN);
  vec3 Vv=uCam-vWP;float dist=length(Vv);vec3 V=Vv/dist;
  float ao=vCol.a;vec3 col=vec3(0.0);float alpha=1.0;
  if(m==0||m==16||m==17){                                   // painted stucco, flutes, chevron frieze
    vec3 alb=vCol.rgb;
    float nz=vnoise(vUV*2.3)*0.5+vnoise(vUV*11.0)*0.5;
    alb*=0.88+0.16*nz;
    alb*=1.0-0.10*smoothstep(0.35,0.9,vnoise(vec2(vUV.x*1.7,vUV.y*0.18)+vEx.r*9.0));   // rain streaks
    if(m==16){float fl=0.5+0.5*cos(vUV.x*6.2832/0.24);alb*=0.66+0.34*fl;}
    if(m==17){float cz=abs(fract(vUV.x/0.7)-0.5)*2.0;float ch=fract((vUV.y+cz*0.35)/0.34);alb*=0.70+0.30*smoothstep(0.42,0.5,ch)*smoothstep(1.0,0.92,ch);}
    vec3 L=ambient(n)*ao+lampLight(vWP,n)*ao;
    float h=vWP.y;
    float up=vEx.w*exp(-max(h-4.2,0.0)/3.7)*clamp(0.50-n.y*1.0,0.0,1.5);
    float sc=mix(0.22+0.78*pow(0.5+0.5*cos(vUV.x*6.2832/3.3),3.0),0.8,smoothstep(0.5,10.0,h-4.0));
    L+=vEx.rgb*up*sc*ao;
    col=alb*L;
  } else if(m==1){                                           // windows
    vec2 sz=vEx.zw;vec2 pm=vUV*sz;float seed=vEx.x;float lit=vEx.y;
    float bd=min(min(pm.x,sz.x-pm.x),min(pm.y,sz.y-pm.y));
    float fr=1.0-smoothstep(0.038,0.052,bd);
    float h1=hash11(seed*7.31),h2=hash11(seed*3.17+1.3),h3=hash11(seed*5.71+2.9),h4=hash11(seed*9.13+4.1);
    vec3 R=reflect(-V,n);
    float fres=pow(1.0-max(dot(n,V),0.0),4.0);
    vec3 refl=skyBase(normalize(vec3(R.x,abs(R.y)+0.03,R.z)))*(0.16+0.55*fres)*(0.7+0.3*vnoise(vec2(R.z*9.0+pm.x,R.y*7.0+pm.y*0.5)));
    vec3 t1=normalize(cross(vec3(0.0,1.0,0.0),n));
    vec2 par=vec2(dot(V,t1),-V.y)/max(dot(V,n),0.2);
    vec3 g;
    if(lit>2.95){                                            // glass block
      vec2 q=pm/0.21;vec2 gb=fract(q);float e=min(min(gb.x,1.0-gb.x),min(gb.y,1.0-gb.y));
      float cell=hash21(floor(q)+seed);
      g=vec3(0.55,0.95,0.82)*(0.35+0.6*cell)*smoothstep(0.0,0.14,e)*0.75*(0.6+0.4*vnoise(pm*0.7+seed));fr=0.0;
    } else if(lit>1.9){                                      // lobby / storefront: fake interior with parallax
      float mull=1.0-smoothstep(0.025,0.04,abs(fract(pm.x/1.45)-0.5)*1.45);
      vec3 warm=mix(vec3(1.0,0.56,0.24),vec3(1.0,0.76,0.48),h1);
      vec2 q=pm+par*3.2;
      float sx=(fract(q.x/2.3+h2)-0.5)*2.3;
      float sconce=exp(-sx*sx*2.6-pow(q.y-1.85,2.0)*2.0);
      float ceil_=smoothstep(2.7,3.3,q.y);
      float spots=exp(-pow((fract(q.x/0.9)-0.5)*0.9,2.0)*40.0)*smoothstep(2.6,2.9,q.y);
      vec2 qm=pm+par*1.3;
      float sil=smoothstep(0.62,0.42,qm.y*0.42+vnoise(vec2(qm.x*1.9+seed*10.0,0.5))*0.75);
      g=warm*(0.30+1.25*sconce+0.35*(1.0-ceil_)+1.2*spots)*(1.0-0.78*sil)*(lit-1.35)*0.55;
      g=mix(g,vec3(0.015),mull);
    } else {
      float mun=max(1.0-smoothstep(0.010,0.018,abs(pm.x-sz.x*0.5)),1.0-smoothstep(0.008,0.015,abs(fract(vUV.y*3.0+0.5)-0.5)*sz.y/3.0));
      float cw=0.10+0.33*h3;float cx=min(vUV.x,1.0-vUV.x);
      float curtain=1.0-smoothstep(cw-0.02,cw,cx);
      float folds=0.72+0.28*sin(pm.x*38.0+seed);
      if(lit>0.05){
        vec3 tint=mix(vec3(1.0,0.55,0.24),vec3(1.0,0.80,0.55),h1);
        if(h2>0.88)tint=vec3(0.45,0.62,1.0);else if(h2>0.80)tint=vec3(1.0,0.35,0.6);
        vec2 q=vUV+par*vec2(0.5/sz.x,0.5/sz.y);
        float room=mix(1.0,0.30,clamp(q.y,0.0,1.0));
        vec2 lp=(q-vec2(0.3+0.4*h4,0.30))*vec2(sz.x/sz.y,1.0)*3.4;
        room+=1.9*exp(-dot(lp,lp));
        if(h3>0.72)room*=0.5+0.5*step(0.5,fract(pm.y*13.0));
        g=tint*lit*0.8*mix(room*0.95,folds*0.7,curtain);
      } else g=vec3(0.004,0.005,0.008)+vec3(0.022,0.022,0.026)*curtain*folds;
      fr=max(fr,mun);
    }
    col=mix(g+refl,vCol.rgb*(ambient(n)+lampLight(vWP,n))*0.75,fr);
  } else if(m==2){                                           // emissive: neon tubes, lamps, car lights
    float I=vEx.x;
    if(vEx.y>0.5)I*=mix(0.02,1.0,uCarLights);
    if(vEx.z>0.5)I*=0.72+0.28*step(0.22,vnoise(vec2(uTime*13.0,vEx.z*7.0)));
    col=vCol.rgb*I+vec3(I*0.06);
  } else if(m==3){                                           // neon lettering (additive)
    vec4 a=texture(uAtlas,vUV);
    float I=vEx.x;
    if(vEx.y>0.5){float f=vnoise(vec2(uTime*9.0,vEx.y*5.0));I*=0.35+0.65*step(0.3,f);}
    col=vCol.rgb*a.g*1.5*I+mix(vCol.rgb,vec3(1.0),0.6)*a.r*I*3.6;
  } else if(m==4){                                           // palm trunk
    float ring=0.5+0.5*sin(vUV.y*21.0+vnoise(vUV*vec2(9.0,2.0))*3.0);
    vec3 alb=mix(vec3(0.20,0.165,0.13),vec3(0.36,0.31,0.26),ring)*(0.8+0.4*vnoise(vUV*vec2(30.0,4.0)));
    vec3 L=ambient(n)+lampLight(vWP,n)+vCol.rgb*exp(-vUV.y/2.4)*1.25;
    col=alb*L;
    if(ao>1.5){                                              // fairy lights spiralling up the trunk
      float s=fract(vUV.x+vUV.y*1.6);float ds=abs(s-0.5);
      float q=fract(vUV.y*9.0)-0.5;
      float bulb=exp(-ds*ds/0.0009)*exp(-q*q/0.016);
      float far=smoothstep(22.0,70.0,dist);
      col+=vec3(1.0,0.74,0.42)*mix(bulb*16.0,0.15,far);
    }
  } else if(m==5){                                           // palm frond
    float u=vUV.x,v=abs(vUV.y);
    float li=floor(u*58.0-v*2.6);
    float env=smoothstep(0.0,0.07,u)*(1.0-0.80*pow(u,2.2))*(0.80+0.20*hash11(li*1.37+vEx.w*91.0));
    float lf=abs(fract(u*58.0-v*2.6)-0.5)*2.0;
    float wdt=0.80*(1.0-0.88*pow(v/max(env,0.01),1.4));
    float fwd=fwidth(u*58.0)*1.2;
    float a=smoothstep(wdt+fwd,wdt-fwd,lf)*step(v,env);
    a=mix(a,0.60*step(v,env*0.9),smoothstep(0.3,1.0,fwd));
    a=max(a,smoothstep(0.06,0.03,v));
    alpha=a;
    if(alpha<(uA2C>0.5?0.06:0.42))discard;
    vec3 nn=n;if(dot(nn,V)<0.0)nn=-nn;
    vec3 alb=mix(vec3(0.030,0.066,0.024),vec3(0.072,0.118,0.040),hash11(vEx.w*13.0));
    alb*=0.75+0.35*(1.0-v);
    vec3 L=ambient(vec3(0.0,1.0,0.0))*(0.55+0.45*max(nn.y,0.0))+lampLight(vWP,nn)*0.40+lampLight(vWP,-nn)*0.22+vCol.rgb*0.40;
    col=alb*L;

const FS_SKY = `#version 300 es

const HFOV_TAN=Math.tan(37*Math.PI/180);
const TLOOP=TILE*20/5.2;
function camera(t){
  const v=5.2;
  const z=-v*(((t%TLOOP)+TLOOP)%TLOOP);
  const x=0.2+1.5*Math.sin(t*0.045)+0.5*Math.sin(t*0.11+1.3);
  const y=5.9+1.15*Math.sin(t*0.037+0.6)+0.3*Math.sin(t*0.09);
  const yaw=0.30*Math.sin(t*0.052+0.9)+0.09*Math.sin(t*0.13);
  const yawRate=0.30*0.052*Math.cos(t*0.052+0.9)+0.09*0.13*Math.cos(t*0.13);
  const vx=1.5*0.045*Math.cos(t*0.045)+0.5*0.11*Math.cos(t*0.11+1.3);
  const pitch=-0.075+0.04*Math.sin(t*0.041+2.0);
  const roll=yawRate*1.6+vx*0.25;
  let e=[x,y,z],f=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
  if(Q.has('cam')){const a=Q.get('cam').split(',').map(Number);e=[a[0],a[1],a[2]];f=v3.norm([a[3]-a[0],a[4]-a[1],a[5]-a[2]]);}
  const r0=v3.norm(v3.cross(f,[0,1,0])),u0=v3.cross(r0,f);
  const cr=Math.cos(roll),sr=Math.sin(roll);
  const r=v3.add(v3.mul(r0,cr),v3.mul(u0,sr)),u=v3.sub(v3.mul(u0,cr),v3.mul(r0,sr));
  return {e,f,r,u};
}

  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.disable(gl.BLEND);gl.disable(gl.CULL_FACE);
  if(!mirror){
    const g=P.ground;gl.useProgram(g.p);
    gl.uniformMatrix4fv(g.u.uVP,false,VP);gl.uniform3fv(g.u.uCam,eye);gl.uniform1f(g.u.uTime,t);gl.uniform2f(g.u.uRes,w,h);
    gl.uniform4f(g.u.uRect,-320,cam.e[2]-1500,10.45,cam.e[2]+500);
    bindTex(0,RT.refl.tex);gl.uniform1i(g.u.uRefl,0);bindTex(1,texGlow);gl.uniform1i(g.u.uGlow,1);bindTex(2,texPark);gl.uniform1i(g.u.uPark,2);
    gl.uniform4fv(g.u.uCars,carU);
    gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  const m=P.mesh;gl.useProgram(m.p);
  gl.uniformMatrix4fv(m.u.uVP,false,VP);gl.uniform3fv(m.u.uCam,eye);gl.uniform1f(m.u.uTime,t);gl.uniform1f(m.u.uMirror,mirror?1:0);
  gl.uniform1f(m.u.uA2C,(!mirror&&msaaOK)?1:0);gl.uniform1f(m.u.uAdd,0);gl.uniform1f(m.u.uCarLights,0);
  bindTex(0,texAtlas);gl.uniform1i(m.u.uAtlas,0);bindTex(1,texGlow);gl.uniform1i(m.u.uGlow,1);
  if(!mirror&&msaaOK)gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  if(DBG.noTiles)list.length=0;
  gl.bindVertexArray(tile.mesh.vao);
  const LODD=mirror?170:330;let lk=1e9;
  for(let pass=0;pass<3;pass++){
    gl.uniform2f(m.u.uLod,pass,LODD);
    for(const [k,c] of list){
      const r=tile.mesh.op[c][pass];if(!r[1])continue;
      const zmin=c<4?k*TILE+c*120-32:k*TILE,zmax=c<4?k*TILE+(c+1)*120+32:(k+1)*TILE;
      if(!free&&pass===1&&Math.max(0,cz-zmax)>LODD+20)continue;
      if(pass===2&&(free||cz-zmin<LODD-60))continue;
      if(k!==lk){gl.uniformMatrix4fv(m.u.uModel,false,M4.model(0,0,k*TILE,0));lk=k;}
      gl.drawElements(gl.TRIANGLES,r[1],gl.UNSIGNED_INT,r[0]*4);
    }
  }
  gl.uniform2f(m.u.uLod,0,LODD);
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  gl.uniform1f(m.u.uCarLights,1);
  for(const c of cars){if(!free&&(c.z>cz+10||c.z<cz-far))continue;const cm=carMeshes[c.mesh];gl.bindVertexArray(cm.vao);
    gl.uniformMatrix4fv(m.u.uModel,false,M4.model(c.x,0,c.z,c.dir>0?Math.PI:0));gl.drawElements(gl.TRIANGLES,cm.nOpaque,gl.UNSIGNED_INT,0);}
  // sky + ocean behind everything
  const setSky=u=>{gl.uniform3fv(u.uCam,cam.e);gl.uniform3fv(u.uR,cam.r);gl.uniform3fv(u.uU,cam.u);gl.uniform3fv(u.uF,cam.f);
    gl.uniform2f(u.uTan,HFOV_TAN,HFOV_TAN*h/w);gl.uniform1f(u.uMirror,mirror?1:0);gl.uniform1f(u.uTime,t);};
  if(mirror){gl.useProgram(P.sky.p);setSky(P.sky.u);}
  else{const b=P.skyBlit;gl.useProgram(b.p);bindTex(0,RT.sky.tex);gl.uniform1i(b.u.uSky,0);
    gl.uniform3fv(b.u.uR,cam.r);gl.uniform3fv(b.u.uU,cam.u);gl.uniform3fv(b.u.uF,cam.f);gl.uniform2f(b.u.uTan,HFOV_TAN,HFOV_TAN*h/w);gl.uniform1f(b.u.uTime,t);}
  gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.TRIANGLES,0,3);
  // additive: neon lettering and glow cards
  gl.useProgram(m.p);gl.uniform1f(m.u.uAdd,1);gl.uniform1f(m.u.uCarLights,0);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-2,-6);
  gl.bindVertexArray(tile.mesh.vao);
  lk=1e9;for(const [k,c] of list){if(k!==lk){gl.uniformMatrix4fv(m.u.uModel,false,M4.model(0,0,k*TILE,0));lk=k;}const r=tile.mesh.ad[c];if(r[1])gl.drawElements(gl.TRIANGLES,r[1],gl.UNSIGNED_INT,r[0]*4);}
  gl.disable(gl.POLYGON_OFFSET_FILL);gl.disable(gl.BLEND);gl.depthMask(true);
}
function fsPass(prog,dst,setup){
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER,dst?dst.fbo:null);gl.viewport(0,0,dst?dst.w:canvas.width,dst?dst.h:canvas.height);
  gl.useProgram(prog.p);setup(prog.u);gl.bindVertexArray(emptyVAO);gl.drawArrays(gl.TRIANGLES,0,3);
}
function render(t){
  resize();
  const w=RT.w,h=RT.h,cam=camera(t);
  updateCars(t,cam.e[2]);
  const proj=M4.persp(HFOV_TAN,HFOV_TAN*h/w,0.5,6000);
  const V=M4.view(cam.e,cam.r,cam.u,cam.f),VP=M4.mul(proj,V);
  const cp=camera(t-1/48),VPp=M4.mul(proj,M4.view(cp.e,cp.r,cp.u,cp.f));
  const Vm=new Float32Array(V);Vm[4]*=-1;Vm[5]*=-1;Vm[6]*=-1;Vm[7]*=-1;const VPm=M4.mul(proj,Vm);
  gl.disable(gl.SCISSOR_TEST);
  // 1. mirrored world for the wet street
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.refl.fbo);gl.viewport(0,0,RT.refl.w,RT.refl.h);
  gl.clearColor(0,0,0,1);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(!DBG.noMirror)drawScene(cam,VPm,true,t,RT.refl.w,RT.refl.h);
  if(!DBG.noMip){gl.bindTexture(gl.TEXTURE_2D,RT.refl.tex);gl.generateMipmap(gl.TEXTURE_2D);}
  // 2. main view (sky and ocean are shaded at half resolution first — they are smooth)
  fsPass(P.sky,RT.sky,u=>{gl.uniform3fv(u.uCam,cam.e);gl.uniform3fv(u.uR,cam.r);gl.uniform3fv(u.uU,cam.u);gl.uniform3fv(u.uF,cam.f);
    gl.uniform2f(u.uTan,HFOV_TAN,HFOV_TAN*h/w);gl.uniform1f(u.uMirror,0);gl.uniform1f(u.uTime,t);});
  gl.enable(gl.DEPTH_TEST);
  const main=RT.ms||RT.scene;
  gl.bindFramebuffer(gl.FRAMEBUFFER,main.fbo);gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  drawScene(cam,VP,false,t,w,h);
  if(RT.ms){gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.ms.fbo);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.scene.fbo);
    gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT,gl.NEAREST);}
  // 3. bloom pyramid + anamorphic streak
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  fsPass(P.ao,RT.ao,u=>{bindTex(0,RT.scene.dtex);gl.uniform1i(u.uDepth,0);gl.uniform2f(u.uTan,HFOV_TAN,HFOV_TAN*h/w);gl.uniform2f(u.uRes,RT.ao.w,RT.ao.h);});
  fsPass(P.aoApply,RT.scene2,u=>{bindTex(0,RT.scene.tex);gl.uniform1i(u.uScene,0);bindTex(1,RT.ao.tex);gl.uniform1i(u.uAO,1);gl.uniform2f(u.uPx,1/RT.ao.w,1/RT.ao.h);});
  let src=RT.scene2;
  for(let i=0;i<6;i++){const d=RT.bd[i];fsPass(P.down,d,u=>{bindTex(0,src.tex);gl.uniform1i(u.uT,0);gl.uniform2f(u.uPx,1/src.w,1/src.h);gl.uniform1f(u.uPre,i===0?1.0:0.0);});src=d;}
  let up=RT.bd[5];
  for(let i=4;i>=0;i--){const d=RT.bu[i];fsPass(P.up,d,u=>{bindTex(0,RT.bd[i].tex);gl.uniform1i(u.uA,0);bindTex(1,up.tex);gl.uniform1i(u.uB,1);gl.uniform2f(u.uPx,1/up.w,1/up.h);gl.uniform1f(u.uK,1.0);});up=d;}
  fsPass(P.streak,RT.s0,u=>{bindTex(0,RT.bd[1].tex);gl.uniform1i(u.uT,0);gl.uniform2f(u.uPx,1.4/RT.s0.w,0);gl.uniform1f(u.uThr,2.2);});
  fsPass(P.streak,RT.s1,u=>{bindTex(0,RT.s0.tex);gl.uniform1i(u.uT,0);gl.uniform2f(u.uPx,4.2/RT.s0.w,0);gl.uniform1f(u.uThr,0.0);});
  // 4. grade
  fsPass(P.final,null,u=>{bindTex(0,RT.scene2.tex);gl.uniform1i(u.uScene,0);bindTex(1,RT.bu[0].tex);gl.uniform1i(u.uBloom,1);bindTex(2,RT.s1.tex);gl.uniform1i(u.uStreak,2);
    gl.uniform2f(u.uRes,w,h);gl.uniform1f(u.uTime,t);gl.uniform1f(u.uExp,parseFloat(Q.get('exp')||'1.15'));gl.uniform1f(u.uFade,fade);
    bindTex(3,RT.scene.dtex);gl.uniform1i(u.uDepth,3);gl.uniform2f(u.uTan,HFOV_TAN,HFOV_TAN*h/w);gl.uniformMatrix4fv(u.uPrevVP,false,VPp);
    gl.uniform3fv(u.uCam,cam.e);gl.uniform3fv(u.uR,cam.r);gl.uniform3fv(u.uU,cam.u);gl.uniform3fv(u.uF,cam.f);gl.uniform1f(u.uMB,parseFloat(Q.get('mb')||'1'));});
}

/* ------------------------------------------------------------------ loop */
const DBG={};
let fade=1,paused=false,simT=parseFloat(Q.get('start')||'0'),last=0,acc=0,frames=0;
const fixedT=Q.has('t')?parseFloat(Q.get('t')):null;
function loop(now){
  if(Q.has('bench')){const px=new Uint8Array(4),r=[];for(const T of[20,75,140,262]){for(let i=0;i<3;i++)render(T+i/60);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    const t0=performance.now();for(let i=0;i<30;i++){render(T+i/60);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);}r.push(((performance.now()-t0)/30).toFixed(1));}
    document.title='BENCH '+r.join(' ')+' ms @'+canvas.width+'x'+canvas.height;return;}
  if(fixedT!==null){fade=1;render(fixedT);const px=new Uint8Array(4);gl.readPixels(canvas.width>>1,canvas.height>>2,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);document.title='READY '+buildMs.toFixed(0)+'ms px='+Array.from(px)+' '+canvas.width+'x'+canvas.height+' msaa='+msaaOK+' v='+tile.mesh.nv;if(Q.has('dump')){const d=document.createElement('div');d.id='dump';d.style.display='none';d.textContent=canvas.toDataURL('image/jpeg',0.93);document.body.appendChild(d);}return;}
  const dt=Math.min((now-last)/1000||0,0.1);last=now;
  if(!paused)simT+=dt;
  {const tw=((simT%TLOOP)+TLOOP)%TLOOP,k=Math.min(tw,TLOOP-tw);fade=Math.min(1,k/2.5);fade=fade*fade*(3-2*fade);}
  render(simT);
  acc+=dt;frames++;window.__stat={ms:(acc/frames*1000).toFixed(1),scale,w:canvas.width,h:canvas.height};
  if(acc>2.0){const ms=acc/frames*1000;if(ms>19.5&&scale>0.6&&!Q.has('scale')&&document.visibilityState==='visible'){scale=Math.max(0.6,scale*(ms>28?0.8:0.9));}acc=0;frames=0;}
  requestAnimationFrame(loop);
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault();}
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean');
});
setTimeout(()=>{document.getElementById('hint').style.opacity=0;},9000);
window.__render=render;window.DBG=DBG;
try{resize();requestAnimationFrame(loop);}catch(e){fail(String(e&&e.stack||e));}
</script>
